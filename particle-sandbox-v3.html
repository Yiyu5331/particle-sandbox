<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>粒子沙盘 v3</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-strong: rgba(22, 22, 32, 0.82);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --text: #d8d8e4;
    --text-strong: #ffffff;
    --muted: #8a8aa2;
    --accent: #8fa8ff;
    --warn: #ffc14a;
    --danger: #ff5a5a;
    --ok: #5fd08a;
    --radius: 12px;
    --radius-sm: 8px;
    --pill: 999px;
    --gap: 8px;
    --gap-sm: 4px;
    --blur: blur(16px) saturate(140%);
    --side: 172px;
    --ctl-h: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 12.5px/1.35 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(90, 60, 200, 0.22), transparent 70%),
      radial-gradient(800px 380px at 92% -6%, rgba(255, 90, 30, 0.13), transparent 70%),
      var(--bg);
    -webkit-user-select: none; user-select: none;
  }
  #app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .glass { background: var(--panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  button, select, input { font: inherit; color: inherit; }
  button, select {
    height: var(--ctl-h); padding: 0 10px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); border-radius: var(--pill); background: var(--panel);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
  }
  select { padding: 0 6px; -webkit-appearance: none; appearance: none; text-align: center; }
  select option { background: #1a1a24; color: var(--text); }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.11); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { color: var(--text-strong); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px -2px var(--accent); }
  button.sq { width: var(--ctl-h); padding: 0; }
  button.danger { border-color: rgba(255, 90, 90, 0.5); color: #ff9c9c; background: rgba(255, 60, 60, 0.1); }
  button.danger:hover, button.danger.armed { background: rgba(255, 60, 60, 0.3); color: #fff; box-shadow: 0 0 14px -2px var(--danger); }
  button.warn { border-color: var(--warn); color: #ffd98a; box-shadow: 0 0 12px -3px var(--warn); }
  input[type=range] { accent-color: var(--accent); cursor: pointer; height: var(--ctl-h); }
  input[type=text] { height: var(--ctl-h); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(0, 0, 0, 0.3); min-width: 0; }

  /* ---------- 顶部控制条 ---------- */
  #topbar {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap);
    padding: 6px 10px; border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); z-index: 5;
  }
  .grp { display: flex; align-items: center; gap: var(--gap-sm); padding: 3px 5px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(255, 255, 255, 0.03); }
  .grp > .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; padding: 0 3px 0 5px; white-space: nowrap; }
  .grp .val { min-width: 1.8em; text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; padding-right: 4px; }
  #brand { font-weight: 650; color: var(--text-strong); letter-spacing: 0.04em; padding: 0 6px 0 2px; white-space: nowrap; }
  #brand small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  #rngSize { width: 86px; }
  #rngVol { width: 62px; }

  /* ---------- 左侧元素面板 ---------- */
  #palette { grid-row: 2; overflow-y: auto; padding: 8px; border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .cat { margin-bottom: 10px; }
  .cat h3 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 0 2px 5px; }
  .cat .items { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
  .el {
    --c1: #888; --c2: #aaa; --c3: #666;
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 5px; border-radius: var(--radius-sm);
    position: relative; overflow: hidden; text-align: left;
  }
  .el .sw {
    width: 16px; height: 16px; border-radius: 5px; flex: none;
    background: linear-gradient(115deg, var(--c1), var(--c2), var(--c3), var(--c1), var(--c2));
    background-size: 400% 100%; animation: swatch 3.2s linear infinite;
    box-shadow: 0 0 7px -1px var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .el.glow .sw { animation-duration: 1.3s; box-shadow: 0 0 10px 0 var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
  .el .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .el kbd { font: 10px ui-monospace, monospace; color: var(--muted); }
  .el.on { color: var(--text-strong); border-color: var(--c1); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 1px var(--c1), 0 0 14px -2px var(--c1); }
  @keyframes swatch { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .el .sw { animation: none; } }

  /* ---------- 画布区 ---------- */
  #stage { grid-row: 2; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  #viewport { position: relative; line-height: 0; }
  #canvas { display: block; background: var(--bg); cursor: none; touch-action: none; }
  #cursor { position: absolute; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); display: none; }
  #cursor.round { border-radius: 50%; }
  #cursor.spray { border-radius: 50%; border-style: dashed; }
  #lineprev { position: absolute; pointer-events: none; height: 0; border-top: 1px dashed rgba(255, 255, 255, 0.8); transform-origin: 0 0; display: none; }
  .float { position: absolute; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #debug { left: 10px; top: 10px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; display: none; pointer-events: none; color: #c8d4ff; }
  #testbox { right: 10px; top: 10px; width: min(460px, 70%); max-height: calc(100% - 20px); overflow: auto; display: none; font-size: 11.5px; line-height: 1.55; -webkit-user-select: text; user-select: text; }
  #testbox h4 { font-size: 13px; margin-bottom: 4px; color: var(--text-strong); }
  #testbox .ok { color: var(--ok); } #testbox .bad { color: var(--danger); } #testbox .dim { color: var(--muted); }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #recdot { right: 10px; bottom: 10px; display: none; color: #ff9c9c; font-variant-numeric: tabular-nums; }
  #recdot::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- 底部状态栏 ---------- */
  #status {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 4px 12px; font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--muted); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden;
  }
  #status b { color: var(--text-strong); font-weight: 600; }
  #stInspect { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .chip { padding: 1px 8px; border-radius: var(--pill); border: 1px solid var(--line); }
  .chip.warn { border-color: var(--warn); color: #ffd98a; }
  .chip.hide { display: none; }

  /* ---------- 弹层与提示 ---------- */
  .pop { position: fixed; z-index: 20; display: none; min-width: 220px; max-width: 320px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
  .pop.show { display: block; }
  .pop h4 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 2px 2px 8px; }
  .pop .col { display: flex; flex-direction: column; gap: var(--gap-sm); }
  .pop .row { display: flex; gap: var(--gap-sm); align-items: center; }
  .pop .row > * { flex: 1; }
  .pop button { border-radius: var(--radius-sm); text-align: left; }
  .pop button small { color: var(--muted); margin-left: 6px; }
  .pop label { display: flex; align-items: center; gap: 8px; height: 26px; cursor: pointer; }
  .pop label input { accent-color: var(--accent); }
  .pop .note { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; white-space: normal; }
  .slot { display: flex; gap: var(--gap-sm); align-items: center; }
  .slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .slot button { flex: none; text-align: center; }
  #tip { position: fixed; z-index: 30; display: none; width: 250px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); pointer-events: none; line-height: 1.55; }
  #tip h4 { font-size: 13px; color: var(--text-strong); margin-bottom: 2px; }
  #tip .sub { color: var(--muted); margin-bottom: 6px; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
  #tip dt { color: var(--muted); } #tip dd { color: var(--text); font-variant-numeric: tabular-nums; }
  #tip ul { list-style: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #tip li { color: var(--text); } #tip li::before { content: '· '; color: var(--muted); }

  @media (max-width: 760px) {
    :root { --side: 104px; --ctl-h: 26px; }
    .cat .items { grid-template-columns: 1fr; }
    #brand small, .grp > .lbl { display: none; }
    #topbar { gap: 5px; padding: 5px; }
    #rngSize { width: 60px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="glass">
    <span id="brand">粒子沙盘<small>v3</small></span>
    <div class="grp">
      <button id="btnPause" title="暂停 / 继续（空格）">❚❚ 暂停</button>
      <button id="btnStep" class="sq" title="单步（.）" aria-label="单步">▸|</button>
      <select id="selSpeed" title="模拟速度" aria-label="模拟速度">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
        <option value="2">2x</option><option value="4">4x</option>
      </select>
    </div>
    <div class="grp" id="gravGrp">
      <span class="lbl">重力</span>
      <button class="sq" data-g="up" title="重力向上" aria-label="重力向上">↑</button>
      <button class="sq on" data-g="down" title="重力向下" aria-label="重力向下">↓</button>
      <button class="sq" data-g="left" title="重力向左" aria-label="重力向左">←</button>
      <button class="sq" data-g="right" title="重力向右" aria-label="重力向右">→</button>
    </div>
    <div class="grp">
      <span class="lbl">笔刷</span>
      <button class="sq on" data-shape="circle" title="圆形" aria-label="圆形笔刷">●</button>
      <button class="sq" data-shape="square" title="方形" aria-label="方形笔刷">■</button>
      <button class="sq" data-shape="spray" title="喷雾（随机稀疏）" aria-label="喷雾笔刷">∴</button>
      <button id="btnMode" title="切换：只填空位 / 覆盖替换">填空</button>
      <input type="range" id="rngSize" min="1" max="30" value="4" aria-label="笔刷大小" title="笔刷大小（[ 和 ]）">
      <span class="val" id="lblSize">4</span>
    </div>
    <div class="grp">
      <button id="btnView" title="切换视图（V）">视图：正常</button>
      <button id="btnUndo" title="撤销（Ctrl/Cmd+Z）">撤销</button>
      <button id="btnClear" class="danger" title="清空（C，需再按一次确认）">清空</button>
    </div>
    <div class="grp">
      <button id="btnScenes" data-pop="popScenes">场景 ▾</button>
      <button id="btnSave" data-pop="popSave">存档 ▾</button>
      <button id="btnShot" title="保存 PNG 截图">截图</button>
      <select id="selRec" title="录制时长" aria-label="录制时长">
        <option value="5">5秒</option><option value="10" selected>10秒</option><option value="15">15秒</option><option value="30">30秒</option>
      </select>
      <button id="btnRec" title="录制 WebM 视频">录制</button>
    </div>
    <div class="grp">
      <button id="btnMute" title="静音">声音</button>
      <input type="range" id="rngVol" min="0" max="100" value="60" aria-label="总音量" title="总音量">
      <button id="btnSettings" data-pop="popSettings">设置 ▾</button>
    </div>
  </header>

  <aside id="palette" class="glass" aria-label="元素面板"></aside>

  <main id="stage">
    <div id="viewport">
      <div id="cursor"></div>
      <div id="lineprev"></div>
    </div>
    <div id="debug" class="float"></div>
    <div id="testbox" class="float"></div>
    <div id="toast" class="float"></div>
    <div id="recdot" class="float">录制中</div>
  </main>

  <footer id="status" class="glass">
    <span>FPS <b id="stFps">--</b></span>
    <span>模拟 <b id="stSim">--</b> 步/秒</span>
    <span id="stThrottle" class="chip warn hide" title="页面在后台、被遮挡或浏览器省电时，requestAnimationFrame 会被降频。这不是性能问题。">rAF 被降频</span>
    <span id="stInspect">—</span>
    <span id="stMode" class="chip"></span>
    <span>粒子 <b id="stCount">0</b></span>
  </footer>
</div>

<div id="popScenes" class="pop"><h4>预设场景</h4><div class="col" id="sceneList"></div></div>
<div id="popSave" class="pop">
  <h4>存档槽位（浏览器本地）</h4>
  <div class="row"><input type="text" id="slotName" placeholder="存档名称" maxlength="24"><button id="btnSlotSave" style="flex:none;text-align:center">保存</button></div>
  <div class="col" id="slotList" style="margin-top:8px"></div>
  <h4 style="margin-top:12px">文件</h4>
  <div class="row"><button id="btnExport" style="text-align:center">导出 JSON</button><button id="btnImport" style="text-align:center">导入 JSON</button></div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>
<div id="popSettings" class="pop"><h4>画面效果</h4><div class="col" id="settingList"></div><div class="note" id="renderInfo"></div></div>
<div id="tip"></div>

<script>
'use strict';
/* =====================================================================
 * 粒子沙盘 v3
 * 模块顺序：1 核心（常量/随机数/材料表/规则表/网格/分块）
 *           2 模拟（运动/燃烧/钩子/爆炸/电/温度/飞行粒子/主步进）
 *           3 渲染（WebGL2 管线 + Canvas2D 退路）
 *           4 音效（WebAudio 程序合成）
 *           5 UI（面板/笔刷/撤销/存档/预设/录制）
 *           6 自测（?test=1）与主循环
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1.1 常量与随机数
 * ------------------------------------------------------------------- */
const CELL = 3;            // 每格 3x3 CSS 像素
const CHUNK = 32;          // 分块边长
const AMBIENT = 20;        // 环境温度 °C
const WAKE_TTL = 3;        // 被唤醒后至少再模拟几帧
const SIM_HZ = 60;
const QS = new URLSearchParams(location.search);

// xorshift32：热循环里只用它，不用 Math.random
let _rs = ((Date.now() ^ 0x9e3779b9) | 0) || 1;
function rnd() {
  _rs ^= _rs << 13; _rs ^= _rs >>> 17; _rs ^= _rs << 5;
  return (_rs >>> 0) * 2.3283064365386963e-10;
}
function rndi(n) { return (rnd() * n) | 0; }
function seedRng(s) { _rs = (s | 0) || 1; }

/* ---------------------------------------------------------------------
 * 1.2 材料表（声明式；所有通用行为都从这张表读）
 * ------------------------------------------------------------------- */
const S_EMPTY = 0, S_SOLID = 1, S_POWDER = 2, S_LIQUID = 3, S_GAS = 4, S_ENERGY = 5;
const STATE_NAMES = ['空', '固体', '粉末', '液体', '气体', '能量'];

const EMPTY = 0, SAND = 1, WATER = 2, FIRE = 3, WOOD = 4, STONE = 5, LAVA = 6, PLANT = 7,
      ICE = 8, ACID = 9, SMOKE = 10, STEAM = 11, EMBER = 12, TNT = 13, METAL = 14, CLONE = 15,
      VOID = 16, OIL = 17, GUNPOWDER = 18, GLASS = 19, ASH = 20, CHARCOAL = 21, SALT = 22,
      SALTWATER = 23, SPARK = 24, SEED = 25, FLOWER = 26, SOIL = 27;
const NT = 28;
// 工具（不是材料）
const TOOL_ERASE = 100, TOOL_HEAT = 101, TOOL_COOL = 102;

const MAT_DEFAULTS = {
  state: S_SOLID, cat: 'solid', density: 1000, viscosity: 0, dispersion: 0,
  flammability: 0, ignitionTemp: Infinity, burnInto: EMPTY, burnTime: 0, burnTemp: 0,
  flame: 0, residue: 1,
  meltTemp: Infinity, meltInto: EMPTY, latent: 0,
  boilTemp: Infinity, boilInto: EMPTY,
  freezeTemp: -Infinity, freezeInto: EMPTY,
  conductivity: 0.15, heatCapacity: 1.5, relax: 0.001,
  hardness: 0.2, emissive: 0, alpha: 1, palette: ['#ff00ff'],
  spawnTemp: AMBIENT, life: null, decayInto: EMPTY, decayChance: 0,
  blastRadius: 0, blastPower: 0, electric: false, note: '',
};

const MATERIALS = [];
function defMat(id, key, name, props) {
  MATERIALS[id] = Object.assign({ id, key, name }, MAT_DEFAULTS, props);
}

defMat(EMPTY, 'EMPTY', '空气', { state: S_EMPTY, cat: 'none', density: 1.2, conductivity: 0.08, heatCapacity: 1,
  relax: 0.03, hardness: 0, palette: ['#0a0a0f'] });

// ---- 粉末 ----
defMat(SAND, 'SAND', '沙', { state: S_POWDER, cat: 'powder', density: 1600, hardness: 0.10,
  meltTemp: 1450, meltInto: GLASS,
  palette: ['#c8a85a', '#d4b56a', '#bd9c50', '#cfae5e'], note: '高温（约1500°C）会熔成玻璃' });
defMat(SOIL, 'SOIL', '土', { state: S_POWDER, cat: 'powder', density: 1400, conductivity: 0.12, heatCapacity: 1.6,
  hardness: 0.12, palette: ['#5b4030', '#664a36', '#50382a', '#6f5240'], note: '种子落在上面会发芽' });
defMat(SALT, 'SALT', '盐', { state: S_POWDER, cat: 'powder', density: 2100, conductivity: 0.2, hardness: 0.15,
  palette: ['#e8e8ee', '#d8dbe6', '#f4f4f8'], note: '溶于水成盐水，能融冰' });
defMat(GUNPOWDER, 'GUNPOWDER', '火药', { state: S_POWDER, cat: 'powder', density: 1700, hardness: 0.08,
  flammability: 1, ignitionTemp: 170, burnTime: 2, burnInto: SMOKE, blastRadius: 4, blastPower: 0.6,
  palette: ['#3a3a40', '#2e2e34', '#45454c'], note: '遇火瞬间燃爆并连锁' });
defMat(ASH, 'ASH', '灰', { state: S_POWDER, cat: 'powder', density: 500, conductivity: 0.05, hardness: 0.02,
  palette: ['#8a8a8e', '#77777c', '#9a9a9e'], note: '燃烧的最终产物，比水轻' });
defMat(SEED, 'SEED', '种子', { state: S_POWDER, cat: 'powder', density: 1150, hardness: 0.05,
  flammability: 0.5, ignitionTemp: 250, burnTime: 20, burnTemp: 600, flame: 0.1, burnInto: ASH, residue: 0.5,
  palette: ['#b89a4a', '#9c8038', '#c8ab5c'], note: '落到土上，或水边的湿沙上，长成植物' });

// ---- 液体（密度：熔岩 > 酸 > 盐水 > 水 > 油）----
defMat(WATER, 'WATER', '水', { state: S_LIQUID, cat: 'liquid', density: 1000, dispersion: 5,
  conductivity: 0.6, heatCapacity: 4, relax: 0.002, hardness: 0.03, alpha: 0.82, electric: true,
  boilTemp: 100, boilInto: STEAM, freezeTemp: 0, freezeInto: ICE,
  palette: ['#3a7bd5', '#3574cc', '#4082da'] });
defMat(SALTWATER, 'SALTWATER', '盐水', { state: S_LIQUID, cat: 'liquid', density: 1100, dispersion: 5,
  conductivity: 0.6, heatCapacity: 4, relax: 0.002, hardness: 0.03, alpha: 0.85, electric: true,
  boilTemp: 104, boilInto: STEAM, freezeTemp: -18, freezeInto: ICE,

const M_STATE = new Uint8Array(NT), M_DENS = new Float32Array(NT), M_VISC = new Float32Array(NT),
      M_DISP = new Uint8Array(NT), M_FLAM = new Float32Array(NT), M_IGN = new Float32Array(NT),
      M_BURNINTO = new Uint8Array(NT), M_BURNTIME = new Uint16Array(NT), M_BURNTEMP = new Float32Array(NT),
      M_FLAME = new Float32Array(NT), M_RESIDUE = new Float32Array(NT),
      M_MELT = new Float32Array(NT), M_MELTINTO = new Uint8Array(NT), M_LATENT = new Uint16Array(NT),

      M_FREEZE = new Float32Array(NT), M_FREEZEINTO = new Uint8Array(NT),

      M_BLAST = new Uint8Array(NT), M_BPOW = new Float32Array(NT), M_ELEC = new Uint8Array(NT);
const KTAB = new Float32Array(NT * NT);     // 两种材料之间的导热系数

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

(function buildMaterialArrays() {
  for (let t = 0; t < NT; t++) {
    const m = MATERIALS[t];
    M_STATE[t] = m.state; M_DENS[t] = m.density; M_VISC[t] = m.viscosity; M_DISP[t] = m.dispersion;
    M_FLAM[t] = m.flammability; M_IGN[t] = m.ignitionTemp; M_BURNINTO[t] = m.burnInto;
    M_BURNTIME[t] = m.burnTime; M_BURNTEMP[t] = m.burnTemp; M_FLAME[t] = m.flame; M_RESIDUE[t] = m.residue;
    M_MELT[t] = m.meltTemp; M_MELTINTO[t] = m.meltInto; M_LATENT[t] = m.latent;
    M_BOIL[t] = m.boilTemp; M_BOILINTO[t] = m.boilInto;
    M_FREEZE[t] = m.freezeTemp; M_FREEZEINTO[t] = m.freezeInto;
    M_IHC[t] = 1 / m.heatCapacity; M_RELAX[t] = m.relax; M_HARD[t] = m.hardness;
    M_SPAWN[t] = m.spawnTemp;
    if (m.life) { M_LIFE0[t] = m.life[0]; M_LIFE1[t] = m.life[1]; }
    M_DECAY[t] = m.decayInto; M_DECAYP[t] = m.decayChance;
    M_BLAST[t] = m.blastRadius; M_BPOW[t] = m.blastPower; M_ELEC[t] = m.electric ? 1 : 0;
    m.rgb = m.palette.map(hexToRgb);
  }
  for (let a = 0; a < NT; a++) for (let b = 0; b < NT; b++) {
    KTAB[a * NT + b] = 0.2 * Math.min(MATERIALS[a].conductivity, MATERIALS[b].conductivity);
  }
})();

/* ---------------------------------------------------------------------
 * 1.3 反应矩阵（规则的唯一来源）
 *
 * 【接触反应】行 = 主动方，列 = 被接触方；格式「主动方变成 + 对方变成 (每帧每邻格概率)」
 *
 *            │ 熔岩            │ 火/余烬          │ 盐           │ 冰                    │ 可溶物*        │ 石头
 *  ──────────┼─────────────────┼──────────────────┼──────────────┼───────────────────────┼────────────────┼──────────────
 *  水        │ 蒸汽+石头 (1)   │ 蒸汽+空 (.5/1)   │ 盐水+空(.04) │ 冰+冰 (.02，水<4°C时) │ 植物吸水生长** │ —
 *  盐水      │ 蒸汽+石头 (1)   │ 蒸汽+空 (.5/1)   │ —            │ 盐水+水 (.012)        │ —              │ —
 *  盐        │ —               │ —                │ —            │ 空+盐水 (.03)         │ —              │ —
 *  酸液      │ 火+熔岩 (1)     │ —                │ 溶解 (.02)   │ 溶解 (.02)            │ 溶解 (.02)     │ 溶解 (.0015)
 *
 *  * 可溶物 = 沙、土、盐、火药、灰、种子、木头、植物、花、炭、冰、TNT；每次溶解酸液自身有 50% 被消耗。
 *    玻璃、金属、克隆体、黑洞不溶。
 *  ** 植物 × 水：植物以 0.6% 概率吸掉这格水并获得生长能量。
 *
 * 【温度相变】（由温度场触发，不需要接触规则）
 *    冰 ──>0°C 且吸够潜热──> 水 ──>100°C──> 蒸汽 ──<85°C──> 水 ──<0°C──> 冰
 *    盐水 ──>104°C──> 蒸汽          盐水 ──<-18°C──> 冰
 *    沙 ──>1450°C──> 玻璃           石头 ──>1250°C──> 熔岩 ──<850°C──> 石头
 *
 * 【燃烧链】（温度达到燃点后按可燃度概率点燃；燃烧放热；贴着水会被浇灭）
 *    木头(300°C) → 火 + 炭 → 炭(380°C)阴燃 → 灰
 *    植物(230°C)/花(220°C)/种子(250°C) → 火 + 灰
 *    油(220°C) → 大火 + 烟
 *    火药(170°C) → 2帧后小爆炸(半径4)        TNT(240°C) → 60帧引信后爆炸(半径15)
 *
 * 【其他】
 *    电火花/带电导体 × 可燃物：给对方加热 250~300°C（足以点燃火药、油、TNT）
 *    电火花 × 金属/水/盐水：注入电荷，沿导体逐格传导
 *    克隆体 × 任意材料：记住并复制          黑洞 × 任意材料：吸入并吞掉
 * ------------------------------------------------------------------- */
const ACID_SOLUBLE = [SAND, SOIL, SALT, GUNPOWDER, ASH, SEED, WOOD, PLANT, FLOWER, CHARCOAL, ICE, TNT];

// { a, b, p, a2, b2, use(主动方被消耗概率), maxT(主动方温度上限), aT/bT(产物温度), tag }
const RULES = [
  { a: WATER, b: LAVA, p: 1, a2: STEAM, b2: STONE, aT: 160, bT: 500, tag: 'hiss' },
  { a: SALTWATER, b: LAVA, p: 1, a2: STEAM, b2: STONE, aT: 160, bT: 500, tag: 'hiss' },
  { a: WATER, b: FIRE, p: 0.5, a2: STEAM, b2: EMPTY, aT: 150, tag: 'hiss' },
  { a: SALTWATER, b: FIRE, p: 0.5, a2: STEAM, b2: EMPTY, aT: 150, tag: 'hiss' },
  { a: WATER, b: EMBER, p: 1, a2: WATER, b2: EMPTY },
  { a: SALTWATER, b: EMBER, p: 1, a2: SALTWATER, b2: EMPTY },
  { a: WATER, b: SALT, p: 0.04, a2: SALTWATER, b2: EMPTY },
  { a: WATER, b: ICE, p: 0.02, a2: ICE, b2: ICE, maxT: 4, aT: -4 },
  { a: SALT, b: ICE, p: 0.03, a2: EMPTY, b2: SALTWATER, bT: 1 },
  { a: SALTWATER, b: ICE, p: 0.012, a2: SALTWATER, b2: WATER, bT: 1 },
  { a: ACID, b: LAVA, p: 1, a2: FIRE, b2: LAVA, aT: 900 },
  { a: ACID, b: STONE, p: 0.0015, a2: ACID, b2: EMPTY, use: 0.5 },
  { a: PLANT, b: WATER, p: 0.006, a2: PLANT, b2: EMPTY, tag: 'grow' },
];
for (const s of ACID_SOLUBLE) RULES.push({ a: ACID, b: s, p: 0.02, a2: ACID, b2: EMPTY, use: 0.5 });

const RX = new Array(NT * NT).fill(null);
const HASRX = new Uint8Array(NT);
for (const r of RULES) { RX[r.a * NT + r.b] = r; HASRX[r.a] = 1; }

/* ---------------------------------------------------------------------
 * 1.4 网格与分块
 * ------------------------------------------------------------------- */
const F_PAR = 1, F_BURN = 2, F_SCORCH = 4, F_TIP = 8, F_FALL = 0xC0;   // flags 位
const F_SAVE = F_BURN | F_SCORCH | F_TIP;

let W = 0, H = 0, N = 0;
let type, seed, flags, charge, chargeE, life, temp;
let CW = 0, CHN = 0, chunkTTL, chunkCount;
let parity = 0, tick = 0;
let gravity = 'down', gx = 0, gy = 1, lx = 1, ly = 0;
let sceneDirty = true;     // 渲染端需要整张重传

function allocGrid(w, h) {
  W = w; H = h; N = w * h;
  type = new Uint8Array(N); seed = new Uint8Array(N); flags = new Uint8Array(N);
  charge = new Uint8Array(N); chargeE = new Uint8Array(N);
  life = new Uint16Array(N); temp = new Float32Array(N).fill(AMBIENT);
  CW = Math.ceil(w / CHUNK); CHN = Math.ceil(h / CHUNK);
  chunkTTL = new Uint8Array(CW * CHN); chunkCount = new Uint16Array(CW * CHN);
  elecCount = 0; fpClear(); exClear();
  wakeAll();
}

function clearGrid() {
  type.fill(0); seed.fill(0); flags.fill(0); charge.fill(0); chargeE.fill(0); life.fill(0); temp.fill(AMBIENT);
  elecCount = 0; fpClear(); exClear();
  wakeAll();
}

function wakeAll() { chunkTTL.fill(WAKE_TTL); sceneDirty = true; }

function inb(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }

function wake(x, y) {
  const cx = x >> 5, cy = y >> 5, c = cx + cy * CW, ax = x & 31, ay = y & 31;
  chunkTTL[c] = WAKE_TTL;
  if (ax === 0) { if (cx > 0) chunkTTL[c - 1] = WAKE_TTL; }
  else if (ax === 31) { if (cx < CW - 1) chunkTTL[c + 1] = WAKE_TTL; }
  if (ay === 0) { if (cy > 0) chunkTTL[c - CW] = WAKE_TTL; }
  else if (ay === 31) { if (cy < CHN - 1) chunkTTL[c + CW] = WAKE_TTL; }
}

function initLife(t) {
  const a = M_LIFE0[t];
  return a ? a + rndi(M_LIFE1[t] - a + 1) : 0;
}

// 新生成一个粒子（笔刷、克隆、喷发等）
function put(i, t, x, y) {
  type[i] = t; seed[i] = rndi(256); temp[i] = M_SPAWN[t]; life[i] = initLife(t);
  flags[i] = parity | (t === SPARK ? F_TIP : 0); charge[i] = 0;
  wake(x, y);
}

// 清成空气，保留该格温度
function clearCell(i, x, y) {
  type[i] = 0; life[i] = 0; flags[i] = parity; charge[i] = 0;
  wake(x, y);
}

// 原地变成另一种材料，保留 seed 和温度
function morph(i, t, x, y) {
  if (t === EMPTY) { clearCell(i, x, y); return; }
  type[i] = t; life[i] = initLife(t); flags[i] = (flags[i] & F_SCORCH) | parity;
  wake(x, y);
}

function swapCells(i, j, x, y, nx, ny) {
  let a = type[i]; type[i] = type[j]; type[j] = a;
  a = seed[i]; seed[i] = seed[j]; seed[j] = a;
  a = life[i]; life[i] = life[j]; life[j] = a;
  const fi = flags[i], fj = flags[j];
  flags[i] = (fj & ~F_PAR) | parity; flags[j] = (fi & ~F_PAR) | parity;
  const tf = temp[i]; temp[i] = temp[j]; temp[j] = tf;
  wake(x, y); wake(nx, ny);
}

function setGravity(dir) {
  gravity = dir;
  if (dir === 'down') { gx = 0; gy = 1; lx = 1; ly = 0; }
  else if (dir === 'up') { gx = 0; gy = -1; lx = 1; ly = 0; }
  else if (dir === 'left') { gx = -1; gy = 0; lx = 0; ly = 1; }
  else { gx = 1; gy = 0; lx = 0; ly = 1; }
  if (chunkTTL) wakeAll();
}

// 每步统计，供音效和调试面板使用
const st = { powder: 0, liquid: 0, fire: 0, hiss: 0, elec: 0, boom: 0, boil: 0 };
// 模拟 → 表现层的回调（爆炸闪光、震动、音效）
let onBoom = null;

/* =====================================================================
 * 2. 模拟
 * ===================================================================== */
const DX4 = [1, -1, 0, 0], DY4 = [0, 0, 1, -1];
const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];

/* ---------------------------------------------------------------------
 * 2.1 运动：粉末 / 液体 / 气体（方向全部用重力向量 g 和侧向向量 l 表达，
 *     所以四个重力方向共用同一份代码，休止角也自然一致）
 * ------------------------------------------------------------------- */
function movePowder(x, y, i, t) {
  const sp = flags[i] >> 6;                  // 连续下落帧数 → 每步多走几格（重力加速）
  let cx = x, cy = y, ci = i, moved = 0;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (o !== 0) {
      const so = M_STATE[o];
      if (so < S_LIQUID) break;
      if (so === S_LIQUID) {                 // 只沉进比自己轻的液体，且进了液体就不再加速
        if (M_DENS[t] > M_DENS[o] && rnd() < 0.75) { swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny; moved = 2; }
        break;
      }
    }
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny; moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.powder++;
    return;
  }
  if (sp) flags[i] &= ~F_FALL;
  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {
    const dd = s ? -d : d;
    const nx = x + gx + lx * dd, ny = y + gy + ly * dd;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0 || M_STATE[o] >= S_GAS || (M_STATE[o] === S_LIQUID && M_DENS[t] > M_DENS[o] && rnd() < 0.5)) {
      swapCells(i, j, x, y, nx, ny); st.powder++;
      return;
    }
  }
}

// 液体能否沿重力方向挤进 o：空气、气体、更轻的液体、更轻的粉末（让灰浮上来）
function liquidCanSink(t, o) {
  if (o === 0) return true;
  const so = M_STATE[o];
  if (so >= S_GAS) return true;
  if (so === S_LIQUID) return M_DENS[t] > M_DENS[o] && rnd() < 0.6;
  if (so === S_POWDER) return M_DENS[t] > M_DENS[o] && rnd() < 0.3;
  return false;
}

function moveLiquid(x, y, i, t) {
  const sp = flags[i] >> 6;
  let cx = x, cy = y, ci = i, moved = 0;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (!liquidCanSink(t, o)) break;
    const dense = o !== 0 && M_STATE[o] < S_GAS;
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny;
    if (dense) { moved = 2; break; }
    moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.liquid++;
    return;
  }
  if (sp) flags[i] &= ~F_FALL;
  const visc = M_VISC[t];
  if (visc > 0 && rnd() < visc) return;      // 黏：这一帧不侧流

  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {              // 斜下
    const dd = s ? -d : d;
    const nx = x + gx + lx * dd, ny = y + gy + ly * dd;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (liquidCanSink(t, type[j])) { swapCells(i, j, x, y, nx, ny); st.liquid++; return; }
  }
  const disp = M_DISP[t];
  for (let s = 0; s < 2; s++) {              // 侧向扩散：找得到落差才一定流，否则只是偶尔漂一下（水面能静下来）
    const dd = s ? -d : d;
    let best = -1, bx = 0, by = 0, drop = false;
    for (let k = 1; k <= disp; k++) {
      const nx = x + lx * dd * k, ny = y + ly * dd * k;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
      const j = nx + ny * W, o = type[j];
      if (o !== 0 && M_STATE[o] < S_GAS) break;
      best = j; bx = nx; by = ny;
      const ux = nx + gx, uy = ny + gy;
      if (ux >= 0 && ux < W && uy >= 0 && uy < H) {
        const u = type[ux + uy * W];
        if (u === 0 || M_STATE[u] >= S_GAS || (M_STATE[u] === S_LIQUID && M_DENS[u] < M_DENS[t])) { drop = true; break; }
      }
    }
    if (best >= 0 && (drop || rnd() < 0.2)) { swapCells(i, best, x, y, bx, by); st.liquid++; return; }
  }
}

// 气体永远逆着重力走
function moveGas(x, y, i, t) {
  if (t === SMOKE && rnd() < 0.3) return;
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
    const j = nx + ny * W, o = type[j];
    if (o === 0 || (M_STATE[o] === S_LIQUID && rnd() < 0.3) ||
        (M_STATE[o] === S_GAS && M_DENS[o] > M_DENS[t] && rnd() < 0.3)) {
      swapCells(i, j, x, y, nx, ny);
      return;
    }
  }
  const d = rnd() < 0.5 ? 1 : -1;
  nx = x + lx * d; ny = y + ly * d;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === 0) swapCells(i, nx + ny * W, x, y, nx, ny);
}

/* ---------------------------------------------------------------------
 * 2.2 燃烧
 * ------------------------------------------------------------------- */
function ignite(i, t, x, y) {
  flags[i] = (flags[i] | F_BURN) & ~F_TIP;
  const bt = M_BURNTIME[t];
  life[i] = M_BLAST[t] ? bt : Math.max(1, (bt * (0.7 + rnd() * 0.6)) | 0);
  wake(x, y);
}

function emitFlame(x, y, t) {
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (!(inb(nx, ny) && type[nx + ny * W] === 0)) {
    const k = rndi(4);
    nx = x + DX4[k]; ny = y + DY4[k];
    if (!(inb(nx, ny) && type[nx + ny * W] === 0)) return;
  }
  const j = nx + ny * W;
  put(j, FIRE, nx, ny);
  if (M_FLAME[t] > 0.3) life[j] += 18;       // 油：火焰更大
}

// 返回 true 表示这一格已经变成别的东西
function burnStep(x, y, i, t, T) {
  wake(x, y);
  const blast = M_BLAST[t];
  if (!blast) {
    let air = 0, wet = -1, wx = 0, wy = 0;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const j = nx + ny * W, o = type[j];
      if (o === 0 || M_STATE[o] >= S_GAS) air++;
      else if (o === WATER || o === SALTWATER) { wet = j; wx = nx; wy = ny; }
    }
    if (wet >= 0) {                          // 被水浇灭
      flags[i] &= ~F_BURN; life[i] = 0; temp[i] = T < 90 ? T : 90;
      if (rnd() < 0.3) { morph(wet, STEAM, wx, wy); temp[wet] = 150; st.hiss++; }
      return false;
    }
    const bt = M_BURNTEMP[t];
    if (T < bt) temp[i] = T + (bt - T) * 0.25;      // 燃烧放热
    if (air > 0) { if (rnd() < M_FLAME[t]) emitFlame(x, y, t); }
    else if (rnd() < 0.75) return false;            // 没有空气：闷烧，烧得慢
  }
  const L = life[i];
  if (L > 1) { life[i] = L - 1; return false; }
  if (blast) { clearCell(i, x, y); startExplosion(x, y, blast, M_BPOW[t]); return true; }
  if (rnd() < M_RESIDUE[t]) morph(i, M_BURNINTO[t], x, y);
  else put(i, FIRE, x, y);
  return true;
}

/* ---------------------------------------------------------------------
 * 2.3 特殊材料钩子（返回 true 表示这一格已经处理完）
 * ------------------------------------------------------------------- */
function hookFire(x, y, i) { if (temp[i] < 700) temp[i] = 700; st.fire++; return false; }
function hookEmber(x, y, i) { if (temp[i] < 600) temp[i] = 600; return false; }

function hookLava(x, y, i) {
  if (rnd() < 0.002) {                               // 偶尔迸出余烬
    const nx = x - gx, ny = y - gy;
    if (inb(nx, ny) && type[nx + ny * W] === 0) put(nx + ny * W, EMBER, nx, ny);
  }
  return false;
}

function growable(o) { return o === 0 || o === WATER || M_STATE[o] === S_GAS; }

function bloom(x, y, i) {
  flags[i] &= ~F_TIP;
  for (let k = 0; k < 8; k++) {                      // 叶子
    const nx = x + DX8[k], ny = y + DY8[k];
    if (inb(nx, ny) && type[nx + ny * W] === 0 && rnd() < 0.55) put(nx + ny * W, PLANT, nx, ny);
  }
  if (rnd() < 0.18) {                                // 偶尔开花，花色随机
    const fx = x - gx, fy = y - gy;
    if (!inb(fx, fy)) return;
    const c = rndi(5) * 51 + 8;
    const fj = fx + fy * W;
    if (type[fj] === 0 || type[fj] === PLANT) { put(fj, FLOWER, fx, fy); seed[fj] = c + rndi(34); }
    for (let k = 0; k < 4; k++) {
      const nx = fx + DX4[k], ny = fy + DY4[k];
      if (inb(nx, ny) && type[nx + ny * W] === 0 && rnd() < 0.75) { put(nx + ny * W, FLOWER, nx, ny); seed[nx + ny * W] = c + rndi(34); }
    }
  }
}

function growTip(x, y, i) {
  const e = life[i];
  if (e <= 0) { bloom(x, y, i); return; }
  const side = rnd() < 0.3 ? (rnd() < 0.5 ? 1 : -1) : 0;
  const alt = rnd() < 0.5 ? 1 : -1;
  for (let a = 0; a < 3; a++) {
    const sd = a === 0 ? side : a === 1 ? (side === 0 ? alt : 0) : (side === 0 ? -alt : -side);
    const nx = x - gx + lx * sd, ny = y - gy + ly * sd;
    if (!inb(nx, ny)) continue;
    const j = nx + ny * W;
    if (!growable(type[j])) continue;
    put(j, PLANT, nx, ny); flags[j] |= F_TIP; life[j] = e - 1;
    flags[i] &= ~F_TIP; life[i] = 0;
    if (e > 4 && rnd() < 0.16) {                     // 分叉
      const bs = rnd() < 0.5 ? 1 : -1;
      const bx = x + lx * bs - gx, by = y + ly * bs - gy;
      if (inb(bx, by) && type[bx + by * W] === 0) {
        const bj = bx + by * W;
        put(bj, PLANT, bx, by); flags[bj] |= F_TIP; life[bj] = (e >> 1) + 1;
      }
    }
    return;
  }
  life[i] = 0;                                       // 被挡住：直接展叶
}

function hookPlant(x, y, i) {
  if (flags[i] & F_TIP) { wake(x, y); if (rnd() < 0.07) growTip(x, y, i); return false; }
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H && type[bx + by * W] === 0) {
    for (let k = 0; k < 8; k++) {                    // 周围没有任何支撑才会落下
      const nx = x + DX8[k], ny = y + DY8[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && M_STATE[o] < S_LIQUID) return false;
    }
    swapCells(i, bx + by * W, x, y, bx, by);
    return true;
  }
  return false;
}

function sprout(i, x, y) {
  type[i] = PLANT; flags[i] = parity | F_TIP; life[i] = 12 + rndi(22);
  wake(x, y);
}

function hookSeed(x, y, i) {
  const bx = x + gx, by = y + gy;
  if (bx < 0 || bx >= W || by < 0 || by >= H) return false;
  const b = type[bx + by * W];
  if (b === SOIL) {
    wake(x, y);
    if (rnd() < 0.02) { sprout(i, x, y); return true; }
  } else if (b === SAND) {                           // 沙子要够湿：两格内有水
    wake(x, y);
    if (rnd() < 0.02) {
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && type[nx + ny * W] === WATER) { sprout(i, x, y); return true; }
      }
    }
  }
  return false;
}

function hookClone(x, y, i) {
  let src = life[i];
  const k0 = rndi(4);
  if (!src) {                                          // 还没记住任何材料：锁定第一个碰到的
    for (let k = 0; k < 4; k++) {
      const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && o !== CLONE && o !== VOID) { src = o; break; }
    }
    if (!src) return false;
    life[i] = src;
  }
  wake(x, y);
  if (rnd() >= 0.1) return false;
  for (let k = 0; k < 4; k++) {
    const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if (type[nx + ny * W] === 0) { put(nx + ny * W, src, nx, ny); return false; }
  }
  return false;
}

function hookVoid(x, y, i) {
  wake(x, y);
  for (let n = 0; n < 10; n++) {
    const dx = rndi(11) - 5, dy = rndi(11) - 5, d2 = dx * dx + dy * dy;
    if (d2 === 0 || d2 > 25) continue;
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    const j = px + py * W, o = type[j];
    if (o === 0 || o === VOID) continue;
    if (d2 <= 2) { clearCell(j, px, py); continue; }
    if (rnd() < 0.6) {
      let sx = dx > 0 ? -1 : dx < 0 ? 1 : 0, sy = dy > 0 ? -1 : dy < 0 ? 1 : 0;
      const adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
      if (adx > 2 * ady) sy = 0; else if (ady > 2 * adx) sx = 0;
      const qx = px + sx, qy = py + sy, q = qx + qy * W, qt = type[q];
      if (qt === 0) swapCells(j, q, px, py, qx, qy);
      else if (qt === VOID) clearCell(j, px, py);
    }
  }
  return false;
}

function hookSpark(x, y, i) {
  st.elec++;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) continue;
    if (M_ELEC[o]) addCharge(j, 255);
    else if (M_FLAM[o] > 0) { temp[j] += 260; wake(nx, ny); }
  }
  const f = flags[i];
  if (f & F_TIP) {                                   // 只有「头」会继续向前窜并分叉，后面的留下来当亮线
    flags[i] = f & ~F_TIP;
    const L = life[i];
    if (L > 3) {
      const n = rnd() < 0.3 ? 2 : 1;
      for (let b = 0; b < n; b++) {
        const k = rndi(8), nx = x + DX8[k], ny = y + DY8[k];
        if (inb(nx, ny) && type[nx + ny * W] === 0) {
          const j = nx + ny * W;
          put(j, SPARK, nx, ny);
          life[j] = L - 1 - rndi(2);
        }
      }
    }
  }
  return false;
}

const HOOK = new Array(NT).fill(null);
HOOK[FIRE] = hookFire; HOOK[EMBER] = hookEmber; HOOK[LAVA] = hookLava; HOOK[PLANT] = hookPlant;
HOOK[SEED] = hookSeed; HOOK[CLONE] = hookClone; HOOK[VOID] = hookVoid; HOOK[SPARK] = hookSpark;

/* ---------------------------------------------------------------------
 * 2.4 接触规则执行（规则本身在 1.3 的 RULES 表里）
 * ------------------------------------------------------------------- */
function applyRule(r, i, j, x, y, nx, ny) {
  if (r.tag === 'hiss') st.hiss++;
  if (r.tag === 'grow') {
    clearCell(j, nx, ny);
    if (!(flags[i] & (F_TIP | F_BURN))) { flags[i] |= F_TIP; life[i] = 3 + rndi(6); }
    return false;
  }
  if (r.b2 !== r.b) {
    morph(j, r.b2, nx, ny);
    if (r.bT !== undefined) temp[j] = r.bT;
  }
  if (r.use && rnd() < r.use) { clearCell(i, x, y); return true; }
  if (r.a2 !== r.a) {
    morph(i, r.a2, x, y);
    if (r.aT !== undefined) temp[i] = r.aT;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------------------
 * 2.5 单格更新：相变 → 燃烧 → 寿命 → 钩子 → 接触规则 → 运动
 * ------------------------------------------------------------------- */
function updateCell(x, y, i) {
  const t = type[i];
  let f = flags[i];
  if ((f & F_PAR) === parity) return;        // 本帧已经处理过（刚移动进来的）
  f ^= F_PAR; flags[i] = f;
  const T = temp[i];

  // 温度相变
  if (T > M_MELT[t]) {
    const lat = M_LATENT[t];
    if (lat > 0) {                           // 有潜热的（冰）：多出来的热量先攒着，攒够才融化
      const add = ((T - M_MELT[t]) * 4) | 0;
      temp[i] = M_MELT[t];
      if (add > 0) {
        const L = life[i] + add;
        if (L >= lat) { morph(i, M_MELTINTO[t], x, y); return; }
        life[i] = L; wake(x, y);
      }
    } else { morph(i, M_MELTINTO[t], x, y); return; }
  } else if (T > M_BOIL[t]) {
    morph(i, M_BOILINTO[t], x, y); temp[i] = T < 135 ? 160 : T + 25; st.boil++;
    return;
  } else if (T < M_FREEZE[t]) {
    morph(i, M_FREEZEINTO[t], x, y);
    return;
  }

  // 燃烧
  if (M_FLAM[t] > 0) {
    if (f & F_BURN) { if (burnStep(x, y, i, t, T)) return; }
    else if (T >= M_IGN[t]) { if (rnd() < M_FLAM[t]) ignite(i, t, x, y); else wake(x, y); }
  }

  // 有寿命的（火、烟、余烬、电火花）
  if (M_LIFE0[t] > 0) {
    const L = life[i];
    if (L <= 1) {
      if (rnd() < M_DECAYP[t]) { morph(i, M_DECAY[t], x, y); if (temp[i] > 200) temp[i] = 200; }
      else clearCell(i, x, y);
      return;
    }
    life[i] = L - 1;
    wake(x, y);
  }

  const hk = HOOK[t];
  if (hk !== null && hk(x, y, i)) return;

  if (HASRX[t]) {
    const base = t * NT;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const j = nx + ny * W, o = type[j];
      if (o === 0) continue;
      const r = RX[base + o];
      if (r === null) continue;
      wake(x, y);                            // 只要身边有能反应的对象，这一块就保持清醒
      if ((r.maxT === undefined || temp[i] < r.maxT) && rnd() < r.p) {
        if (applyRule(r, i, j, x, y, nx, ny)) return;
      }
    }
  }

  switch (M_STATE[t]) {
    case S_POWDER: movePowder(x, y, i, t); break;
    case S_LIQUID: moveLiquid(x, y, i, t); break;
    case S_GAS: moveGas(x, y, i, t); break;
  }
}

/* ---------------------------------------------------------------------
 * 2.6 爆炸：从爆心放出一圈射线，分 3 帧由内向外推进。
 *     每条射线带能量，随距离衰减；碰到硬度低于能量的材料就炸碎并继续，
 *     碰到更硬的就被挡住 → 石头和金属后面是安全的，弹坑边缘天然不规则。
 * ------------------------------------------------------------------- */
const EX_MAX = 48, EX_RAYS = 200;
const exA = new Uint8Array(EX_MAX), exX = new Float32Array(EX_MAX), exY = new Float32Array(EX_MAX),
      exR = new Float32Array(EX_MAX), exP = new Float32Array(EX_MAX), exCur = new Float32Array(EX_MAX),
      exN = new Uint16Array(EX_MAX), exPhase = new Float32Array(EX_MAX),
      exRays = new Float32Array(EX_MAX * EX_RAYS);
let exActive = 0;

function exClear() { exA.fill(0); exActive = 0; }

function startExplosion(x, y, R, P) {
  let k = -1;
  for (let q = 0; q < EX_MAX; q++) if (!exA[q]) { k = q; break; }
  if (k < 0) {                               // 池满：把进度最靠前的那个立刻算完，腾出位置
    let bv = -1;
    for (let q = 0; q < EX_MAX; q++) { const v = exCur[q] / exR[q]; if (v > bv) { bv = v; k = q; } }
    while (exA[k]) stepExplosion(k);
  }
  exA[k] = 1; exActive++;
  exX[k] = x; exY[k] = y; exR[k] = R; exP[k] = P; exCur[k] = 0;
  const n = Math.min(EX_RAYS, Math.ceil(6.2832 * R * 1.5));
  exN[k] = n; exPhase[k] = rnd() * 6.2832;
  for (let r = 0; r < n; r++) exRays[k * EX_RAYS + r] = P * (0.65 + rnd() * 0.7);
  st.boom++;
  if (onBoom) onBoom(x, y, R, P);
}

function stepExplosion(k) {
  const cx = exX[k], cy = exY[k], R = exR[k], P = exP[k], n = exN[k], base = k * EX_RAYS, ph = exPhase[k];
  const r0 = exCur[k], r1 = Math.min(R, r0 + Math.max(1.5, R / 3));
  const fall = P / R * 0.6;
  for (let r = 0; r < n; r++) {
    let e = exRays[base + r];
    if (e <= 0) continue;
    const a = ph + r / n * 6.2832, dx = Math.cos(a), dy = Math.sin(a);
    let lastJ = -1;
    for (let d = r0 < 0.8 ? 0.8 : r0; d < r1; d += 0.6) {
      const px = Math.round(cx + dx * d), py = Math.round(cy + dy * d);
      if (px < 0 || px >= W || py < 0 || py >= H) { e = 0; break; }
      e -= fall;
      if (e <= 0) break;
      const j = px + py * W;
      if (j === lastJ) continue;
      lastJ = j;
      const o = type[j];
      const Tn = temp[j] + e * 140;                  // 瞬间升温
      temp[j] = Tn > 1000 ? (temp[j] > 1000 ? temp[j] : 1000) : Tn;   // 封顶 1000°C：能点燃东西，但不至于把石墙熔穿
      if (o === 0) {
        const q = rnd();
        if (q < 0.05 * e) put(j, SMOKE, px, py);
        else if (q < 0.05 * e + 0.012) {
          const sp = 1 + e * 4;
          spawnFree(EMBER, px + 0.5, py + 0.5, dx * sp + rnd() - 0.5, dy * sp + rnd() - 0.5, 650, rndi(256));
        } else wake(px, py);
        continue;
      }
      if (M_BLAST[o] > 0) {                          // 连锁：错开引爆时间，不在同一帧全炸
        const fz = 3 + ((d * 0.4) | 0) + rndi(9);
        if (!(flags[j] & F_BURN)) { flags[j] |= F_BURN; life[j] = fz; }
        else if (life[j] > fz + 6) life[j] = fz;
        e -= 0.03; wake(px, py);
        continue;
      }
      const h = M_HARD[o];
      if (e > h) {                                   // 炸碎
        const so = M_STATE[o], q = rnd();
        if (so < S_GAS && q < 0.6) {                 // 变成飞行粒子抛出去
          const sp = (1.2 + e * 4.5) * (0.6 + rnd() * 0.8);
          spawnFree(o, px + 0.5, py + 0.5, dx * sp - gx * 1.2 * e + rnd() - 0.5, dy * sp - gy * 1.2 * e + rnd() - 0.5,
                    temp[j] > 400 ? 400 : temp[j], seed[j]);
          clearCell(j, px, py);
        } else if (so < S_GAS && q < 0.75) {
          put(j, q < 0.68 ? FIRE : SMOKE, px, py);
        } else clearCell(j, px, py);
        e -= h * 0.6 + 0.01;
      } else {                                       // 挡住了：熏黑
        if (h <= 1) flags[j] |= F_SCORCH;
        wake(px, py);
        e = 0;
        break;
      }
    }
    exRays[base + r] = e;
  }
  exCur[k] = r1;
  if (r1 >= R) { exA[k] = 0; exActive--; }
}

function stepExplosions() {
  if (exActive === 0) return;
  for (let k = 0; k < EX_MAX; k++) if (exA[k]) stepExplosion(k);
}

/* ---------------------------------------------------------------------
 * 2.7 飞行粒子：对象池（上限 4000，满了覆盖最旧的），不占网格，落地后写回
 * ------------------------------------------------------------------- */
const FP_MAX = 4000;
const fpAlive = new Uint8Array(FP_MAX), fpType = new Uint8Array(FP_MAX), fpSeed = new Uint8Array(FP_MAX),
      fpAge = new Uint16Array(FP_MAX), fpTemp = new Float32Array(FP_MAX),
      fpX = new Float32Array(FP_MAX), fpY = new Float32Array(FP_MAX),
      fpVX = new Float32Array(FP_MAX), fpVY = new Float32Array(FP_MAX),
      fpPX = new Float32Array(FP_MAX), fpPY = new Float32Array(FP_MAX),     // 上一帧位置（拖尾）
      fpQX = new Float32Array(FP_MAX), fpQY = new Float32Array(FP_MAX);     // 上上帧位置
let fpHead = 0, fpCount = 0;

function fpClear() { fpAlive.fill(0); fpCount = 0; fpHead = 0; }

function spawnFree(t, x, y, vx, vy, T, sd) {
  const k = fpHead;
  fpHead = (k + 1) % FP_MAX;
  if (!fpAlive[k]) fpCount++;
  fpAlive[k] = 1; fpType[k] = t; fpSeed[k] = sd; fpAge[k] = 0; fpTemp[k] = T;
  fpX[k] = fpPX[k] = fpQX[k] = x; fpY[k] = fpPY[k] = fpQY[k] = y;
  fpVX[k] = vx; fpVY[k] = vy;
}

function fpSolidAt(cx, cy) {
  if (cx < 0 || cx >= W || cy < 0 || cy >= H) return true;
  const o = type[cx + cy * W];
  return o !== 0 && M_STATE[o] < S_GAS;
}

function landFree(k, x, y) {
  fpAlive[k] = 0; fpCount--;
  let cx = Math.floor(x), cy = Math.floor(y);
  cx = cx < 0 ? 0 : cx >= W ? W - 1 : cx; cy = cy < 0 ? 0 : cy >= H ? H - 1 : cy;
  if (fpSolidAt(cx, cy)) {
    let found = false;
    for (let q = 0; q < 8; q++) {
      const nx = cx + DX8[q], ny = cy + DY8[q];
      if (!fpSolidAt(nx, ny)) { cx = nx; cy = ny; found = true; break; }
    }
    if (!found) return;                      // 没地方放：丢弃
  }
  const j = cx + cy * W, t = fpType[k];
  type[j] = t; seed[j] = fpSeed[k]; temp[j] = fpTemp[k]; life[j] = initLife(t);
  flags[j] = parity | (t === SAND || t === SOIL || t === STONE || t === WOOD ? F_SCORCH : 0); charge[j] = 0;
  wake(cx, cy);
}

function stepFree() {
  if (fpCount === 0) return;
  for (let k = 0; k < FP_MAX; k++) {
    if (!fpAlive[k]) continue;
    let x = fpX[k], y = fpY[k];
    let vx = (fpVX[k] + gx * 0.22) * 0.992, vy = (fpVY[k] + gy * 0.22) * 0.992;
    fpQX[k] = fpPX[k]; fpQY[k] = fpPY[k]; fpPX[k] = x; fpPY[k] = y;
    const age = ++fpAge[k];
    if (fpType[k] === EMBER && age > 60 + (fpSeed[k] & 63)) { fpAlive[k] = 0; fpCount--; continue; }
    const m = Math.max(vx < 0 ? -vx : vx, vy < 0 ? -vy : vy);
    const n = m < 1 ? 1 : Math.ceil(m), sx = vx / n, sy = vy / n;
    let hit = false;
    for (let s = 0; s < n; s++) {
      const nx = x + sx, ny = y + sy;
      if (fpSolidAt(Math.floor(nx), Math.floor(ny))) { hit = true; break; }
      x = nx; y = ny;
    }
    if (hit) {
      // 脚下有支撑才算落地；撞墙或撞天花板就弹回来接着飞，避免碎块挂在半空
      if (age > 600 || fpSolidAt(Math.floor(x) + gx, Math.floor(y) + gy)) { landFree(k, x, y); continue; }
      vx = -vx * 0.3; vy = -vy * 0.3;
    } else if (age > 900) { landFree(k, x, y); continue; }
    fpX[k] = x; fpY[k] = y; fpVX[k] = vx; fpVY[k] = vy;
  }
}

/* ---------------------------------------------------------------------
 * 2.8 电：带电格子列表逐帧向相邻导体传导（金属几乎无损，水衰减快）
 * ------------------------------------------------------------------- */
let elecCur = null, elecNext = null, elecCount = 0;

function addCharge(j, e) {
  if (charge[j] !== 0) return;
  if (elecCur === null || elecCur.length !== N) { elecCur = new Int32Array(N); elecNext = new Int32Array(N); elecCount = 0; }
  charge[j] = 6; chargeE[j] = e;
  elecCur[elecCount++] = j;
}

function stepElectric() {
  const cnt = elecCount;
  if (cnt === 0) return;
  let nn = 0;
  const cur = elecCur, next = elecNext;
  for (let q = 0; q < cnt; q++) {
    const i = cur[q];
    let c = charge[i];
    if (c === 0) continue;
    const t = type[i];
    if (!M_ELEC[t]) { charge[i] = 0; continue; }
    const x = i % W, y = (i / W) | 0;
    wake(x, y);
    if (c === 6) {                           // 刚带上电：这一帧向四周传
      st.elec++;
      const e = chargeE[i], loss = t === METAL ? 1 : 6;
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const j = nx + ny * W, o = type[j];
        if (o === 0) continue;
        if (M_ELEC[o]) {
          if (e > loss && charge[j] === 0 && (o === METAL || rnd() < 0.8)) {
            charge[j] = 6; chargeE[j] = e - loss; next[nn++] = j;
          }
        } else if (M_FLAM[o] > 0) { temp[j] += 300; wake(nx, ny); }
      }
    }
    c--;
    charge[i] = c;
    if (c > 0) next[nn++] = i;               // 余下几帧是不应期，防止电往回传
  }
  elecCur = next; elecNext = cur; elecCount = nn;
}

/* ---------------------------------------------------------------------
 * 2.9 温度场：只在清醒的块里做成对热交换（守恒、原地、不需要第二张缓冲），
 *     再向环境温度缓慢回落。热流够大时让这一块保持清醒。
 * ------------------------------------------------------------------- */
function stepThermal() {
  const NTn = NT, K = KTAB, IHC = M_IHC, RLX = M_RELAX;
  for (let cy = 0; cy < CHN; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const c = cx + cy * CW;
      if (chunkTTL[c] === 0) continue;
      const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
      let active = false, right = false, down = false;
      for (let y = y0; y < y1; y++) {
        const hasDown = y + 1 < H;
        for (let x = x0, i = y * W + x0; x < x1; x++, i++) {
          const a = type[i];
          let Ti = temp[i];
          if (x + 1 < W) {
            const d = temp[i + 1] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[i + 1], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[i + 1] -= fl * IHC[b];
              if (fl > 0.3 || fl < -0.3) { active = true; if (x + 1 === x1) right = true; }
            }
          }
          if (hasDown) {
            const j = i + W, d = temp[j] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[j], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[j] -= fl * IHC[b];
              if (fl > 0.3 || fl < -0.3) { active = true; if (y + 1 === y1) down = true; }
            }
          }
          const r = RLX[a];
          if (r > 0) {
            const d = (AMBIENT - Ti) * r;
            Ti += d;
            if (d > 0.08 || d < -0.08) active = true;
          }
          temp[i] = Ti;
        }
      }
      if (active) chunkTTL[c] = WAKE_TTL;
      if (right && cx + 1 < CW) chunkTTL[c + 1] = WAKE_TTL;
      if (down && cy + 1 < CHN) chunkTTL[c + CW] = WAKE_TTL;
    }
  }
}

/* ---------------------------------------------------------------------
 * 2.10 主步进：60Hz 固定步长。扫描顺序从「重力下游」开始，逐行（或逐列）
 *      跳过休眠的块，每行随机左右方向。
 * ------------------------------------------------------------------- */
const perf = { cells: 0, thermal: 0, misc: 0, pack: 0, draw: 0, post: 0, gpu: 0, steps: 0, activeChunks: 0 };
let simStepsTotal = 0;

function sweepCells() {
  if (gy !== 0) {
    const start = gy > 0 ? H - 1 : 0, end = gy > 0 ? -1 : H, inc = gy > 0 ? -1 : 1;
    for (let y = start; y !== end; y += inc) {
      const crow = (y >> 5) * CW, row = y * W;
      if (rnd() < 0.5) {
        for (let cx = 0; cx < CW; cx++) {
          if (chunkTTL[crow + cx] === 0) continue;
          const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK);
          for (let x = x0; x < x1; x++) if (type[row + x] !== 0) updateCell(x, y, row + x);
        }
      } else {
        for (let cx = CW - 1; cx >= 0; cx--) {
          if (chunkTTL[crow + cx] === 0) continue;
          const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK);
          for (let x = x1 - 1; x >= x0; x--) if (type[row + x] !== 0) updateCell(x, y, row + x);
        }
      }
    }
  } else {
    const start = gx > 0 ? W - 1 : 0, end = gx > 0 ? -1 : W, inc = gx > 0 ? -1 : 1;
    for (let x = start; x !== end; x += inc) {
      const ccol = x >> 5;
      if (rnd() < 0.5) {
        for (let cy = 0; cy < CHN; cy++) {
          if (chunkTTL[ccol + cy * CW] === 0) continue;
          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
          for (let y = y0; y < y1; y++) if (type[x + y * W] !== 0) updateCell(x, y, x + y * W);
        }
      } else {
        for (let cy = CHN - 1; cy >= 0; cy--) {
          if (chunkTTL[ccol + cy * CW] === 0) continue;
          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
          for (let y = y1 - 1; y >= y0; y--) if (type[x + y * W] !== 0) updateCell(x, y, x + y * W);
        }
      }
    }
  }
}

function simStep() {
  parity ^= 1; tick++; simStepsTotal++;
  const t0 = performance.now();
  let act = 0;
  for (let c = 0, n = chunkTTL.length; c < n; c++) {
    const v = chunkTTL[c];
    if (v > 0) { chunkTTL[c] = v - 1; if (v > 1) act++; }
  }
  perf.activeChunks = act;
  stepExplosions();
  stepElectric();
  const t1 = performance.now();
  sweepCells();
  const t2 = performance.now();
  stepThermal();
  const t3 = performance.now();
  stepFree();
  const t4 = performance.now();
  perf.misc += (t1 - t0) + (t4 - t3); perf.cells += t2 - t1; perf.thermal += t3 - t2; perf.steps++;
}

/* ---------------------------------------------------------------------
 * 2.11 绘制到网格（笔刷、预设、测试共用）
 * ------------------------------------------------------------------- */
function paintCell(x, y, t, replace) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = x + y * W;
  if (t === TOOL_ERASE) { if (type[i] !== 0) clearCell(i, x, y); return; }
  if (t === TOOL_HEAT) { temp[i] = Math.min(2500, temp[i] + 60); wake(x, y); return; }
  if (t === TOOL_COOL) { temp[i] = Math.max(-200, temp[i] - 60); wake(x, y); return; }
  const o = type[i];
  if (o === t) return;
  if (o !== 0 && !replace) return;
  put(i, t, x, y);
}

function fillRect(t, x0, y0, x1, y1) {
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W - 1, x1 | 0); y1 = Math.min(H - 1, y1 | 0);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = x + y * W;
    if (t === EMPTY) clearCell(i, x, y); else put(i, t, x, y);
  }
}

function fillCircle(t, cx, cy, r, chance) {
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
    if (!inb(x, y)) continue;
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy > r2) continue;
    if (chance !== undefined && rnd() > chance) continue;
    if (t === EMPTY) clearCell(x + y * W, x, y); else put(x + y * W, t, x, y);
  }
}

function countType(t, x0, y0, x1, y1) {
  if (x0 === undefined) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }
  let n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (type[x + y * W] === t) n++;
  return n;
}

/* =====================================================================
 * 2.12 场景编解码（撤销快照、存档、导入导出共用；RLE 压缩）
 * ===================================================================== */
function rleEncode(src) {
  const n = src.length, out = new Uint8Array(n * 2 + 2);
  let p = 0, i = 0;
  while (i < n) {
    const v = src[i];
    let run = 1;
    while (run < 255 && i + run < n && src[i + run] === v) run++;
    out[p++] = run; out[p++] = v;
    i += run;
  }
  return out.slice(0, p);
}

function rleDecode(buf, n) {
  const out = new Uint8Array(n);
  let p = 0;
  for (let q = 0; q + 1 < buf.length && p < n; q += 2) {
    const run = buf[q];
    out.fill(buf[q + 1], p, Math.min(n, p + run));
    p += run;
  }
  return out;
}

// 快照：类型整张 RLE；其余属性只存非空格子，按字节平面分别 RLE
function captureScene() {
  let cnt = 0;
  for (let i = 0; i < N; i++) if (type[i] !== 0) cnt++;
  const sd = new Uint8Array(cnt), tl = new Uint8Array(cnt), th = new Uint8Array(cnt),
        ll = new Uint8Array(cnt), lh = new Uint8Array(cnt), fl = new Uint8Array(cnt);
  for (let i = 0, k = 0; i < N; i++) {
    if (type[i] === 0) continue;
    let T = Math.round(temp[i]);
    T = (T < -32768 ? -32768 : T > 32767 ? 32767 : T) & 0xffff;
    sd[k] = seed[i]; tl[k] = T & 255; th[k] = T >> 8;
    ll[k] = life[i] & 255; lh[k] = life[i] >> 8; fl[k] = flags[i] & F_SAVE;
    k++;
  }
  return { w: W, h: H, g: gravity, n: cnt, t: rleEncode(type), s: sd,
           tl: rleEncode(tl), th: rleEncode(th), ll: rleEncode(ll), lh: rleEncode(lh), f: rleEncode(fl) };
}

// 还原到当前网格；尺寸不同的话按「底边居中」对齐，超出部分裁掉
function restoreScene(s) {
  const src = rleDecode(s.t, s.w * s.h), n = s.n;
  const tl = rleDecode(s.tl, n), th = rleDecode(s.th, n), ll = rleDecode(s.ll, n), lh = rleDecode(s.lh, n), fl = rleDecode(s.f, n);
  clearGrid();
  setGravity(s.g || 'down');
  const ox = ((W - s.w) / 2) | 0, oy = H - s.h;
  let k = 0;
  for (let y = 0; y < s.h; y++) {
    for (let x = 0; x < s.w; x++) {
      const t = src[x + y * s.w];
      if (t === 0) continue;
      const kk = k++;
      const X = x + ox, Y = y + oy;
      if (X < 0 || X >= W || Y < 0 || Y >= H || t >= NT) continue;
      const i = X + Y * W;
      let T = tl[kk] | (th[kk] << 8);
      if (T > 32767) T -= 65536;
      type[i] = t; seed[i] = s.s[kk]; temp[i] = T; life[i] = ll[kk] | (lh[kk] << 8); flags[i] = fl[kk] | (parity ^ 1);
    }
  }
  wakeAll();
}

function bytesToB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function b64ToBytes(b) {
  const s = atob(b), u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

const SCENE_STREAMS = ['t', 's', 'tl', 'th', 'll', 'lh', 'f'];

function sceneToJSON(s) {
  const o = { app: 'particle-sandbox', v: 3, w: s.w, h: s.h, g: s.g, n: s.n };
  for (const k of SCENE_STREAMS) o[k] = bytesToB64(s[k]);
  return JSON.stringify(o);
}

function sceneFromJSON(str) {
  const o = JSON.parse(str);
  if (!o || o.app !== 'particle-sandbox' || !(o.w > 0) || !(o.h > 0)) throw new Error('不是粒子沙盘的存档文件');
  const s = { w: o.w | 0, h: o.h | 0, g: o.g, n: o.n | 0 };
  for (const k of SCENE_STREAMS) s[k] = b64ToBytes(o[k]);
  return s;
}

/* =====================================================================
 * 3. 渲染
 *    WebGL2 管线：状态纹理 → 场景着色（双输出：底色 + 自发光）
 *                → 辉光时间累积（拖尾）→ 5 级降采样/升采样（bloom + 大范围光照）
 *                → 光照合成 → 后处理（震动/冲击波/色差/闪白/色调映射/暗角/颗粒）
 *    不支持 WebGL2（或加 ?nogl=1）时退回 Canvas2D：同一套调色板，逐格上色。
 * ===================================================================== */
const settings = { bloom: true, light: true, distort: true, shake: true, aberration: true,
                   vignette: true, grain: true, tonemap: true, gridLines: false, hd: true };
const VIEW_NAMES = ['正常', '温度', '密度', '活跃块'];
let viewMode = 0;
let canvas = null, gl = null, ctx2d = null, renderMode = 'none';
let particleCount = 0;
let pixelRatio = 1;

const fx = { flash: 0, shake: 0, ca: 0, boomX: 0.5, boomY: 0.5,
             shocks: [0, 1, 2, 3].map(() => ({ x: 0, y: 0, age: 0, power: 0 })), next: 0 };

function fxBoom(x, y, R, P) {
  const s = P * R / 15;
  if (s > 0.3) {
    fx.flash = Math.max(fx.flash, Math.min(0.85, 0.25 + 0.55 * s));
    fx.ca = Math.max(fx.ca, 0.008 * s);
    const k = fx.shocks[fx.next]; fx.next = (fx.next + 1) & 3;
    k.x = x / W; k.y = y / H; k.age = 0; k.power = s;
  } else fx.flash = Math.max(fx.flash, 0.04);
  fx.shake = Math.min(14, fx.shake + 9 * s);
  fx.boomX = x / W; fx.boomY = y / H;
}

function encTemp(T) {
  if (T <= 0) { const v = (T + 60) * (16 / 60); return v < 0 ? 0 : v; }
  return 16 + Math.sqrt((T > 2500 ? 2500 : T) / 2500) * 239;
}

/* ---------------------------------------------------------------------
 * 3.1 着色器
 * ------------------------------------------------------------------- */
const VS_QUAD = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

function matDefines() {
  let s = '';
  for (const m of MATERIALS) s += '#define T_' + m.key + ' ' + m.id + '.0\n';
  return s;
}

const FS_SCENE = `#version 300 es
precision highp float; precision highp int;
${matDefines()}
uniform sampler2D uState, uPal, uHeat, uChunk;
uniform vec2 uGrid, uGrav;
uniform float uTime, uDistort, uGridLines;
uniform int uView;
in vec2 vUv;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oEmis;

float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y);
}
vec4 cell(ivec2 c){
  if(c.x<0||c.y<0||c.x>=int(uGrid.x)||c.y>=int(uGrid.y)) return vec4(0.0,0.0,37.0,0.0);
  return floor(texelFetch(uState,c,0)*255.0+0.5);
}
vec4 pal(float t,int k){ return texelFetch(uPal, ivec2(k,int(t)), 0); }
float kindOf(float t){ return floor(pal(t,6).r*255.0+0.5); }
float decT(float v){ return v<16.0 ? v*3.75-60.0 : pow((v-16.0)/239.0,2.0)*2500.0; }
vec3 blackbody(float T){
  float x = clamp((T-450.0)/1350.0,0.0,1.0);
  return vec3(smoothstep(0.0,0.3,x), smoothstep(0.18,0.8,x)*0.8, smoothstep(0.55,1.0,x)*0.65)*(0.35+1.6*x);
}
vec3 heatRamp(float T){
  if(T<20.0) return mix(vec3(0.15,0.5,1.0), vec3(0.03,0.03,0.07), clamp((T+40.0)/60.0,0.0,1.0));
  float x = sqrt(clamp((T-20.0)/1700.0,0.0,1.0));
  vec3 c = mix(vec3(0.03,0.03,0.07), vec3(0.55,0.05,0.35), smoothstep(0.0,0.25,x));
  c = mix(c, vec3(1.0,0.25,0.05), smoothstep(0.2,0.5,x));
  c = mix(c, vec3(1.0,0.85,0.2), smoothstep(0.45,0.8,x));
  return mix(c, vec3(1.0), smoothstep(0.8,1.0,x));
}

vec3 background(vec2 uv){
  vec3 col = mix(vec3(0.052,0.058,0.100), vec3(0.016,0.016,0.030), smoothstep(0.0,1.0,uv.y));
  col += vec3(0.030,0.020,0.055)*(1.0-smoothstep(0.0,0.9,length(uv-vec2(0.5,0.08))));
  float asp = uGrid.x/uGrid.y;
  for(int l=0;l<2;l++){                                  // 缓慢漂浮的微尘
    float fl = float(l);
    vec2 p = vec2(uv.x*asp,uv.y)*mix(13.0,25.0,fl) + vec2(uTime*(0.035+0.02*fl), -uTime*0.02*(fl+1.0)) + fl*17.3;
    vec2 id = floor(p), f = fract(p)-0.5;
    float r = h21(id);
    vec2 o = (vec2(h21(id+3.1),h21(id+7.7))-0.5)*0.7;
    float tw = 0.5+0.5*sin(uTime*(0.5+r)+r*40.0);
    col += vec3(0.55,0.62,0.85)*smoothstep(0.07,0.0,length(f-o))*step(0.6,r)*tw*0.22;
  }
  if(uGridLines>0.5){
    vec2 gg = uv*uGrid/8.0;
    vec2 dl = abs(fract(gg-0.5)-0.5);
    col += vec3(0.5,0.6,1.0)*step(min(dl.x,dl.y),1.0/48.0)*0.05;
  }
  return col;
}

void main(){
  vec2 uv = vec2(vUv.x, 1.0-vUv.y);
  vec2 g = uv*uGrid;
  if(uView==0 && uDistort>0.0){
    // 热扭曲：用上一帧模糊后的自发光当热量估计，往重力方向取样，热浪就出现在热源上方
    vec3 hs = texture(uHeat, vUv + vec2(uGrav.x,-uGrav.y)*5.0/uGrid).rgb;
    float heat = smoothstep(0.03,0.45,dot(hs,vec3(0.45,0.4,0.15)));
    vec2 np = g*0.33 + uGrav*uTime*4.0;
    g += (vec2(vnoise(np),vnoise(np+31.7))-0.5)*heat*2.4*uDistort;
    // 水下折射：隔着液体看过去的东西轻微晃动
    vec4 s0 = cell(ivec2(floor(uv*uGrid)));
    if(kindOf(s0.r)==3.0 && s0.r!=T_LAVA)
      g += vec2(sin(uv.y*uGrid.y*0.9+uTime*1.7), cos(uv.x*uGrid.x*0.8+uTime*1.3))*0.2*uDistort;
  }
  ivec2 c = ivec2(floor(g));
  vec2 f = fract(g);
  vec4 s = cell(c);
  float t = s.r, sd = s.g, T = decT(s.b);
  int aux = int(s.a);
  float kind = kindOf(t);
  vec3 back = background(uv);
  vec3 col = back, em = vec3(0.0);
  float ncol = max(1.0, floor(pal(t,7).r*255.0+0.5));

  if(kind==1.0 || kind==2.0){                             // ---------- 固体 / 粉末 ----------
    float idx = mod(sd, ncol);
    if(t==T_FLOWER) idx = min(floor(sd/51.0), ncol-1.0);
    vec3 base = pal(t,int(idx)).rgb;
    base *= 1.0 + (fract(sd*0.6180339)-0.5)*0.14;
    if(t==T_WOOD) base *= 0.86+0.26*vnoise(vec2(g.x*1.3,g.y*0.22)+dot(uGrav,uGrav)*0.0);
    else if(t==T_STONE) base *= 0.84+0.3*vnoise(g*0.42);
    else if(t==T_METAL){
      base *= 0.9+0.22*vnoise(vec2(g.x*0.15+g.y*0.6,g.y*0.12));
      base += 0.10*smoothstep(0.6,1.0,sin((g.x+g.y)*0.35));
    }
    else if(t==T_TNT){
      base = mix(vec3(0.88,0.19,0.19), vec3(0.95,0.91,0.9), step(0.66,fract(float(c.y)/3.0+0.01)));
      base *= 0.9+0.1*step(0.5,fract(float(c.x)/4.0));
    }
    else if(t==T_ICE){
      base += 0.16*smoothstep(0.7,1.0,vnoise(g*0.5));
      base += step(0.997,h21(vec2(c)+floor(uTime*4.0)))*0.6;
      base = mix(back, base, 0.88);
    }
    else if(t==T_SALT) base += step(0.99,h21(vec2(c)+floor(uTime*3.0)))*0.3;
    else if(t==T_CLONE){
      float p = 0.5+0.5*sin(uTime*4.0+float(c.x+c.y)*0.7);
      base *= 0.8+0.4*p; em = base*0.3*p;
    }
    else if(t==T_VOID){
      bool rim = cell(c+ivec2(1,0)).r!=t || cell(c-ivec2(1,0)).r!=t || cell(c+ivec2(0,1)).r!=t || cell(c-ivec2(0,1)).r!=t;
      float p = 0.6+0.4*sin(uTime*3.0+float(c.x-c.y)*0.9);
      base = rim ? vec3(0.22,0.04,0.42)*p : vec3(0.008,0.0,0.016);
      if(rim) em = vec3(0.4,0.1,0.85)*0.7*p;
    }
    col = base;
    if(t==T_GLASS){                                       // 玻璃：半透明 + 斜向高光 + 边缘亮线
      float streak = smoothstep(0.84,1.0,sin((g.x-g.y)*0.55+sd*0.02));
      col = mix(back*1.15, base, 0.3) + vec3(0.9,0.97,1.0)*streak*0.24;
      float e = 0.0;
      if(cell(c+ivec2(1,0)).r!=t) e = max(e, smoothstep(0.62,1.0,f.x));
      if(cell(c-ivec2(1,0)).r!=t) e = max(e, smoothstep(0.38,0.0,f.x));
      if(cell(c+ivec2(0,1)).r!=t) e = max(e, smoothstep(0.62,1.0,f.y));
      if(cell(c-ivec2(0,1)).r!=t) e = max(e, smoothstep(0.38,0.0,f.y));
      col += vec3(0.75,0.9,1.0)*e*0.3;
    }
    if((aux&2)!=0) col *= 0.38;                           // 焦黑
    if((aux&1)!=0){                                       // 正在燃烧 / 引信已点
      if(t==T_TNT){
        float b = step(0.5,fract(uTime*6.0));
        col = mix(col, vec3(1.0,0.9,0.7), b*0.7); em += vec3(1.0,0.5,0.2)*b*0.7;
      } else {
        float fl = 0.5+0.5*vnoise(g*0.9+uTime*vec2(1.3,-2.1));
        col = mix(col, vec3(0.28,0.07,0.02), 0.5);
        em += vec3(1.0,0.36,0.07)*fl*(t==T_CHARCOAL ? 1.1 : 0.85);
      }
    }
    if(T>450.0) em += blackbody(T)*(t==T_METAL ? 1.3 : 0.8);   // 黑体辐射
  }
  else if(kind==3.0){                                     // ---------- 液体 ----------
    ivec2 up = -ivec2(uGrav);
    float depth = 0.0;
    for(int k=1;k<=6;k++){ if(kindOf(cell(c+up*k).r)==3.0) depth += 1.0; else break; }
    float dk = depth/6.0;
    float edge = dot(f-0.5,-uGrav)+0.5;
    vec3 base = pal(t,int(mod(sd,ncol))).rgb;
    if(t==T_LAVA){
      float nz = vnoise(g*0.35+vec2(uTime*0.25,-uTime*0.15));
      float hot = clamp((T-800.0)/650.0,0.0,1.0);
      vec3 glow = mix(vec3(1.0,0.27,0.0), vec3(1.0,0.78,0.22), nz*nz);
      col = mix(vec3(0.20,0.035,0.01), glow, clamp(hot*0.75+nz*0.55,0.0,1.0));
      em = col*(0.55+0.95*hot);
    } else if(t==T_ACID){
      float p = 0.5+0.5*sin(uTime*2.5+g.x*0.3+g.y*0.3);
      col = mix(vec3(0.63,0.31,1.0), vec3(0.45,0.95,0.3), p*0.7)*(1.0-0.35*dk);
      em = vec3(0.3,0.9,0.25)*(0.07+0.11*p);
      if(depth==0.0) col += vec3(0.6,1.0,0.6)*smoothstep(0.55,1.0,edge)*0.3;
    } else {
      // 深度渐变 + 水面亮边 + 缓慢波纹；alpha<1 让背景透出来一点
      vec3 wc = mix(base*1.3+0.05, base*0.62, dk);
      wc += 0.07*(vnoise(g*0.22+vec2(uTime*0.35,uTime*0.2))-0.5);
      col = mix(back, wc, pal(t,6).b);
      if(depth==0.0){
        float rip = 0.5+0.5*sin(dot(g,abs(uGrav.yx))*0.7+uTime*2.2+sd*0.02);
        col += vec3(0.55,0.72,0.92)*smoothstep(0.5,1.0,edge)*(0.3+0.45*rip)*(t==T_OIL ? 0.35 : 1.0);
      }
      if(t==T_OIL && depth<2.0) col += 0.10*(0.5+0.5*cos(vec3(0.0,2.0,4.0)+g.x*0.25+uTime*0.5));
      if(T>80.0 && t!=T_OIL) col += 0.08*step(0.93,h21(vec2(c)+floor(uTime*8.0)));      // 快烧开了冒泡
    }
    if((aux&1)!=0){ float fl = 0.5+0.5*vnoise(g*0.9+uTime*vec2(1.3,-2.1)); em += vec3(1.0,0.4,0.08)*fl*0.9; }
    if(T>450.0 && t!=T_LAVA) em += blackbody(T)*0.6;
  }
  else if(kind==5.0){                                     // ---------- 电火花 ----------
    float fl = 0.6+0.4*h21(vec2(c)+floor(uTime*40.0));
    col = vec3(0.85,0.95,1.0);
    em = vec3(0.6,0.85,1.0)*2.6*fl;
  }

  if((aux&4)!=0 && kind!=4.0 && kind!=5.0 && kind!=0.0){  // 带电的导体
    float fl = 0.4+0.6*h21(vec2(c)+floor(uTime*30.0));
    col = mix(col, vec3(0.8,0.93,1.0), 0.45*fl);
    em += vec3(0.45,0.75,1.0)*(1.0+1.2*fl);
  }

  if(kind==0.0 || kind==4.0){                             // ---------- 气体：按密度累积的软边 ----------
    float smoke=0.0, steam=0.0, fire=0.0, fireLife=0.0, ember=0.0;
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
      ivec2 cc = c+ivec2(i,j);
      vec4 q = cell(cc);
      if(q.r==0.0) continue;
      float l = length((vec2(cc)+0.5)-g);
      float w = smoothstep(1.4,0.15,l);
      if(q.r==T_SMOKE) smoke += w*min(1.0,q.a/40.0)*(0.7+0.3*fract(q.g*0.37));
      else if(q.r==T_STEAM) steam += w*(0.75+0.25*fract(q.g*0.53));
      else if(q.r==T_FIRE){ fire += w; fireLife += w*q.a; }
      else if(q.r==T_EMBER) ember += smoothstep(0.8,0.1,l);
    }
    col = mix(col, vec3(0.33,0.33,0.36), clamp(smoke*0.5,0.0,0.88));
    col = mix(col, vec3(0.74,0.80,0.88), clamp(steam*0.42,0.0,0.8));
    if(fire>0.0){
      float lf = clamp(fireLife/fire/38.0,0.0,1.0);
      float fl = 0.75+0.5*vnoise(g*0.8-uGrav*uTime*7.0);
      vec3 fc = mix(vec3(1.0,0.2,0.03), vec3(1.0,0.82,0.36), lf);
      float a = clamp(fire*0.72,0.0,1.0);
      col = mix(col, fc, a);
      em += fc*a*fl*1.35;
    }
    if(ember>0.0){
      vec3 ec = vec3(1.0,0.62,0.15);
      col = mix(col, ec, clamp(ember,0.0,1.0));
      em += ec*min(ember,1.0)*1.7;
    }
  }

  if(uView==1){ col = heatRamp(T); em = vec3(0.0); }
  else if(uView==2){
    col = t==0.0 ? vec3(0.015,0.015,0.03) : mix(vec3(0.08,0.2,0.55), vec3(1.0,0.9,0.3), pal(t,6).a);
    if(kind==4.0||kind==5.0) col = vec3(0.3,0.12,0.4);
    em = vec3(0.0);
  }
  else if(uView==3){
    vec2 cuv = uv*uGrid/32.0;
    float act = texelFetch(uChunk, ivec2(floor(cuv)), 0).r;
    vec2 dl = abs(fract(cuv)-0.5);
    col = col*0.6 + (act>0.5 ? vec3(0.08,0.42,0.16) : vec3(0.16,0.03,0.03))*0.6 + step(0.482,max(dl.x,dl.y))*0.12;
    em = vec3(0.0);
  }
  oCol = vec4(col,1.0);
  oEmis = vec4(em,1.0);
}`;

const VS_POINT = `#version 300 es
in vec2 aPos; in vec4 aCol; in float aSize;
uniform vec2 uGrid; out vec4 vCol;
void main(){
  vec2 p = aPos/uGrid;
  gl_Position = vec4(p.x*2.0-1.0, 1.0-p.y*2.0, 0.0, 1.0);
  gl_PointSize = aSize; vCol = aCol;
}`;
const FS_POINT = `#version 300 es
precision highp float;
in vec4 vCol;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oEmis;
void main(){ oCol = vec4(vCol.rgb,1.0); oEmis = vec4(vCol.rgb*vCol.a,1.0); }`;

const FS_GLOW = `#version 300 es
precision highp float;
uniform sampler2D uEmis, uPrev; uniform float uDecay;
in vec2 vUv; out vec4 o;
void main(){ o = max(texture(uEmis,vUv), texture(uPrev,vUv)*uDecay); }`;

const FS_DOWN = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
void main(){
  vec2 h = uTexel;
  vec3 s = texture(uTex,vUv).rgb*4.0;
  s += texture(uTex,vUv-h).rgb + texture(uTex,vUv+h).rgb;
  s += texture(uTex,vUv+vec2(h.x,-h.y)).rgb + texture(uTex,vUv-vec2(h.x,-h.y)).rgb;
  o = vec4(s/8.0,1.0);
}`;

const FS_UP = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uW;
in vec2 vUv; out vec4 o;
void main(){
  vec2 h = uTexel*0.5;
  vec3 s = texture(uTex,vUv+vec2(-h.x*2.0,0.0)).rgb + texture(uTex,vUv+vec2(h.x*2.0,0.0)).rgb
         + texture(uTex,vUv+vec2(0.0,h.y*2.0)).rgb + texture(uTex,vUv+vec2(0.0,-h.y*2.0)).rgb;
  s += (texture(uTex,vUv+vec2(-h.x,h.y)).rgb + texture(uTex,vUv+vec2(h.x,h.y)).rgb
      + texture(uTex,vUv+vec2(h.x,-h.y)).rgb + texture(uTex,vUv+vec2(-h.x,-h.y)).rgb)*2.0;
  o = vec4(s/12.0*uW,1.0);
}`;

const FS_COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D uCol, uEmis, uBloom, uLight;
uniform vec4 uK;                                           // 环境光、光照强度、bloom 强度、是否调试视图
in vec2 vUv; out vec4 o;
void main(){
  vec3 c = texture(uCol,vUv).rgb;
  if(uK.w>0.5){ o = vec4(c,1.0); return; }
  vec3 e = texture(uEmis,vUv).rgb, l = texture(uLight,vUv).rgb, b = texture(uBloom,vUv).rgb;
  // 发光体照亮周围：物体表面按光色加亮（暖光下偏暖），空气里也留一点辉光
  o = vec4(c*(uK.x + l*uK.y) + l*uK.y*0.03 + e + b*uK.z, 1.0);
}`;

const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform float uTime, uFlash, uCA, uAspect;
uniform vec2 uShake, uBoom;
uniform vec4 uShock[4];
uniform vec4 uOpts;                                        // 暗角、颗粒、色调映射、是否调试视图
in vec2 vUv; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
void main(){
  vec2 uv = vUv;
  vec2 asp = vec2(uAspect,1.0);
  uv += uShake*(0.3+0.7*exp(-length((uv-uBoom)*asp)*2.5));          // 震动：离爆心越远越弱
  for(int i=0;i<4;i++){                                             // 冲击波圆环扭曲
    vec4 s = uShock[i];
    if(s.w<=0.0) continue;
    vec2 d = (uv-s.xy)*asp;
    float l = length(d);
    uv += normalize(d+1e-5)/asp*smoothstep(0.07,0.0,abs(l-s.z))*s.w*0.022;
  }
  vec3 c;
  if(uCA>0.0005){                                                   // 短暂色差
    vec2 dir = uv-0.5;
    c = vec3(texture(uTex,uv+dir*uCA).r, texture(uTex,uv).g, texture(uTex,uv-dir*uCA).b);
  } else c = texture(uTex,uv).rgb;
  c += uFlash;                                                      // 闪白
  if(uOpts.w<0.5){
    if(uOpts.z>0.5){ c = pow(max(c,0.0),vec3(2.2)); c = aces(c*1.25); c = pow(c,vec3(1.0/2.2)); }
    if(uOpts.x>0.5){ float v = smoothstep(1.05,0.35,length((vUv-0.5)*vec2(1.1,1.25))); c *= mix(0.6,1.0,v); }
    if(uOpts.y>0.5){
      float n = fract(sin(dot(gl_FragCoord.xy+fract(uTime)*91.7,vec2(12.9898,78.233)))*43758.5453);
      c += (n-0.5)*0.035;
    }
  }
  o = vec4(clamp(c,0.0,1.0),1.0);
}`;

/* ---------------------------------------------------------------------
 * 3.2 WebGL2 初始化
 * ------------------------------------------------------------------- */
const R = { hdr: false, prog: {}, quad: null, stateTex: null, stateBuf: null, palTex: null, chunkTex: null,
            chunkBuf: null, scene: null, post: null, glow: [null, null], glowIdx: 0, levels: [],
            ptVao: null, ptBuf: null, ptData: null, cw: 0, ch: 0 };

function glProgram(vs, fs) {
  const mk = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('着色器编译失败：' + gl.getShaderInfoLog(sh));
    return sh;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.bindAttribLocation(p, 1, 'aCol'); gl.bindAttribLocation(p, 2, 'aSize');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('着色器链接失败：' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

function glTexture(w, h, internal, format, typ, filter, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, typ, data || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function glTarget(w, h, count) {
  w = Math.max(2, w | 0); h = Math.max(2, h | 0);
  const fbo = gl.createFramebuffer(), tex = [];
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const bufs = [];
  for (let i = 0; i < count; i++) {
    const t = R.hdr ? glTexture(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR)
                    : glTexture(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0);
    tex.push(t); bufs.push(gl.COLOR_ATTACHMENT0 + i);
  }
  gl.drawBuffers(bufs);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('帧缓冲不完整');
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { fbo, tex, w, h };
}

function glFreeTarget(t) {
  if (!t) return;
  gl.deleteFramebuffer(t.fbo);
  for (const x of t.tex) gl.deleteTexture(x);
}

function glInit(cv) {
  gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false,
                                 powerPreference: 'high-performance', preserveDrawingBuffer: false });
  if (!gl) return false;
  R.hdr = !!gl.getExtension('EXT_color_buffer_float');
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  R.prog.scene = glProgram(VS_QUAD, FS_SCENE);
  R.prog.point = glProgram(VS_POINT, FS_POINT);
  R.prog.glow = glProgram(VS_QUAD, FS_GLOW);
  R.prog.down = glProgram(VS_QUAD, FS_DOWN);
  R.prog.up = glProgram(VS_QUAD, FS_UP);
  R.prog.comp = glProgram(VS_QUAD, FS_COMPOSITE);
