  R.prog.post = glProgram(VS_QUAD, FS_POST);

  R.quad = gl.createVertexArray();
  gl.bindVertexArray(R.quad);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // 飞行粒子：每个粒子 3 个点（本体 + 两段拖尾），每点 7 个 float
  R.ptData = new Float32Array(FP_MAX * 3 * 7);
  R.ptVao = gl.createVertexArray();
  gl.bindVertexArray(R.ptVao);
  R.ptBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, R.ptBuf);
  gl.bufferData(gl.ARRAY_BUFFER, R.ptData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 28, 24);
  gl.bindVertexArray(null);

  // 调色板纹理：每种材料一行；0-4 列颜色，6 列 (状态, 发光, 透明度, 密度)，7 列 (颜色数)
  const pd = new Uint8Array(8 * NT * 4);
  for (let t = 0; t < NT; t++) {
    const m = MATERIALS[t];
    for (let k = 0; k < 5; k++) {
      const c = m.rgb[Math.min(k, m.rgb.length - 1)], o = (t * 8 + k) * 4;
      pd[o] = c[0]; pd[o + 1] = c[1]; pd[o + 2] = c[2]; pd[o + 3] = 255;
    }
    let o = (t * 8 + 6) * 4;
    pd[o] = m.state; pd[o + 1] = Math.round(m.emissive * 255); pd[o + 2] = Math.round(m.alpha * 255);
    pd[o + 3] = Math.round(Math.min(1, Math.log(Math.max(1, m.density)) / Math.log(8000)) * 255);
    o = (t * 8 + 7) * 4;
    pd[o] = m.rgb.length;
  }
  R.palTex = glTexture(8, NT, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST, pd);
  return true;
}

function glResize() {
  // 网格尺寸变了：重建状态纹理和所有渲染目标
  R.stateBuf = new Uint8Array(N * 4);
  if (R.stateTex) gl.deleteTexture(R.stateTex);
  R.stateTex = glTexture(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
  R.chunkBuf = new Uint8Array(CW * CHN);
  if (R.chunkTex) gl.deleteTexture(R.chunkTex);
  R.chunkTex = glTexture(CW, CHN, gl.R8, gl.RED, gl.UNSIGNED_BYTE, gl.NEAREST);
  const cw = canvas.width, ch = canvas.height;
  R.cw = cw; R.ch = ch;
  glFreeTarget(R.scene); glFreeTarget(R.post); glFreeTarget(R.glow[0]); glFreeTarget(R.glow[1]);
  for (const l of R.levels) glFreeTarget(l);
  R.scene = glTarget(cw, ch, 2);
  R.post = glTarget(cw, ch, 1);
  R.glow = [glTarget(cw >> 1, ch >> 1, 1), glTarget(cw >> 1, ch >> 1, 1)];
  R.levels = [];
  for (let i = 2; i <= 6; i++) R.levels.push(glTarget(cw >> i, ch >> i, 1));
  sceneDirty = true;
}

/* ---------------------------------------------------------------------
 * 3.3 状态打包：只重写清醒的块（休眠的块内容没变），顺便统计粒子数
 * ------------------------------------------------------------------- */
function packState() {
  const buf = R.stateBuf, all = sceneDirty;
  let changed = all;
  for (let cy = 0; cy < CHN; cy++) for (let cx = 0; cx < CW; cx++) {
    const c = cx + cy * CW;
    if (!all && chunkTTL[c] === 0) continue;
    changed = true;
    const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
    let cnt = 0;
    for (let y = y0; y < y1; y++) {
      for (let x = x0, i = y * W + x0, o = i * 4; x < x1; x++, i++, o += 4) {
        const t = type[i];
        buf[o] = t; buf[o + 1] = seed[i]; buf[o + 2] = encTemp(temp[i]);
        if (t === 0) { buf[o + 3] = 0; continue; }
        cnt++;
        if (M_LIFE0[t] > 0) { const L = life[i]; buf[o + 3] = L > 255 ? 255 : L; }
        else { const f = flags[i]; buf[o + 3] = ((f & F_BURN) ? 1 : 0) | ((f & F_SCORCH) ? 2 : 0) | (charge[i] ? 4 : 0) | ((f & F_TIP) ? 8 : 0); }
      }
    }
    chunkCount[c] = cnt;
  }
  if (changed) {
    let total = 0;
    for (let c = 0; c < chunkCount.length; c++) total += chunkCount[c];
    particleCount = total;
  }
  return changed;
}

function packPoints() {
  if (fpCount === 0) return 0;
  const d = R.ptData, size = CELL * pixelRatio;
  let n = 0;
  for (let pass = 0; pass < 3; pass++) {                 // 先画最淡的拖尾，本体最后画在上面
    for (let k = 0; k < FP_MAX; k++) {
      if (!fpAlive[k]) continue;
      const m = MATERIALS[fpType[k]], c = m.rgb[fpSeed[k] % m.rgb.length];
      const isEmber = fpType[k] === EMBER;
      let x, y, a, s;
      if (pass === 0) { x = fpQX[k]; y = fpQY[k]; a = 0.3; s = size * 0.5; }
      else if (pass === 1) { x = fpPX[k]; y = fpPY[k]; a = 0.55; s = size * 0.75; }
      else { x = fpX[k]; y = fpY[k]; a = 1; s = size; }
      const o = n * 7;
      d[o] = x; d[o + 1] = y; d[o + 2] = c[0] / 255 * a; d[o + 3] = c[1] / 255 * a; d[o + 4] = c[2] / 255 * a;
      d[o + 5] = isEmber ? 1.8 : (fpTemp[k] > 300 ? 0.5 : 0); d[o + 6] = s;
      n++;
    }
  }
  return n;
}

/* ---------------------------------------------------------------------
 * 3.4 WebGL2 一帧
 * ------------------------------------------------------------------- */
function glBind(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }
function glPass(target, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : R.cw, target ? target.h : R.ch);
  gl.useProgram(prog.p);
}
function glQuad() { gl.bindVertexArray(R.quad); gl.drawArrays(gl.TRIANGLES, 0, 3); }

function renderGL(timeMs, dt) {
  const t0 = performance.now();
  if (packState()) {
    glBind(0, R.stateTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, R.stateBuf);
  }
  sceneDirty = false;
  if (viewMode === 3) {
    for (let c = 0; c < R.chunkBuf.length; c++) R.chunkBuf[c] = chunkTTL[c] > 0 ? 255 : 0;
    glBind(3, R.chunkTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CHN, gl.RED, gl.UNSIGNED_BYTE, R.chunkBuf);
  }
  const npts = packPoints();
  const t1 = performance.now();
  const time = (timeMs / 1000) % 3600;
  const debugView = viewMode !== 0;
  gl.disable(gl.BLEND);

  // 1) 场景
  let P = R.prog.scene;
  glPass(R.scene, P);
  glBind(0, R.stateTex); glBind(1, R.palTex); glBind(2, R.levels[1].tex[0]); glBind(3, R.chunkTex);
  gl.uniform1i(P.u.uState, 0); gl.uniform1i(P.u.uPal, 1); gl.uniform1i(P.u.uHeat, 2); gl.uniform1i(P.u.uChunk, 3);
  gl.uniform2f(P.u.uGrid, W, H); gl.uniform2f(P.u.uGrav, gx, gy);
  gl.uniform1f(P.u.uTime, time); gl.uniform1f(P.u.uDistort, settings.distort ? 1 : 0);
  gl.uniform1f(P.u.uGridLines, settings.gridLines ? 1 : 0); gl.uniform1i(P.u.uView, viewMode);
  glQuad();
  if (npts > 0 && !debugView) {
    P = R.prog.point;
    gl.useProgram(P.p);
    gl.uniform2f(P.u.uGrid, W, H);
    gl.bindVertexArray(R.ptVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.ptBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, R.ptData, 0, npts * 7);
    gl.drawArrays(gl.POINTS, 0, npts);
  }

  const useGlow = !debugView && (settings.bloom || settings.light || settings.distort);
  if (useGlow) {
    // 2) 辉光时间累积：上一帧的辉光乘衰减后和这一帧取最大值 → 余烬、火星、碎片自带拖尾
    const src = R.glow[R.glowIdx], dst = R.glow[R.glowIdx ^ 1];
    P = R.prog.glow;
    glPass(dst, P);
    glBind(0, R.scene.tex[1]); glBind(1, src.tex[0]);
    gl.uniform1i(P.u.uEmis, 0); gl.uniform1i(P.u.uPrev, 1);
    gl.uniform1f(P.u.uDecay, Math.pow(0.80, dt / 16.7));
    glQuad();
    R.glowIdx ^= 1;
    // 3) 降采样
    P = R.prog.down;
    let prev = dst;
    for (let i = 0; i < R.levels.length; i++) {
      glPass(R.levels[i], P);
      glBind(0, prev.tex[0]);
      gl.uniform1i(P.u.uTex, 0); gl.uniform2f(P.u.uTexel, 1 / prev.w, 1 / prev.h);
      glQuad();
      prev = R.levels[i];
    }
    // 4) 升采样并逐级叠加
    P = R.prog.up;
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = R.levels.length - 1; i > 0; i--) {
      const s = R.levels[i];
      glPass(R.levels[i - 1], P);
      glBind(0, s.tex[0]);
      gl.uniform1i(P.u.uTex, 0); gl.uniform2f(P.u.uTexel, 1 / s.w, 1 / s.h); gl.uniform1f(P.u.uW, 0.85);
      glQuad();
    }
    gl.disable(gl.BLEND);
  }
  const t2 = performance.now();

  // 5) 光照合成
  P = R.prog.comp;
  glPass(R.post, P);
  glBind(0, R.scene.tex[0]); glBind(1, R.scene.tex[1]); glBind(2, R.levels[0].tex[0]); glBind(3, R.levels[2].tex[0]);
  gl.uniform1i(P.u.uCol, 0); gl.uniform1i(P.u.uEmis, 1); gl.uniform1i(P.u.uBloom, 2); gl.uniform1i(P.u.uLight, 3);
  gl.uniform4f(P.u.uK, settings.light ? 0.72 : 1.0, settings.light ? 1.9 : 0, settings.bloom ? 0.55 : 0, debugView ? 1 : 0);
  glQuad();

  // 6) 后处理
  const k = Math.pow(0.5, dt / 16.7);
  fx.flash *= Math.pow(0.45, dt / 16.7); fx.shake *= Math.pow(0.86, dt / 16.7); fx.ca *= Math.pow(0.84, dt / 16.7);
  if (fx.flash < 0.002) fx.flash = 0;
  P = R.prog.post;
  glPass(null, P);
  glBind(0, R.post.tex[0]);
  gl.uniform1i(P.u.uTex, 0);
  gl.uniform1f(P.u.uTime, time); gl.uniform1f(P.u.uAspect, R.cw / R.ch);
  const on = settings.shake && !debugView, amp = on ? fx.shake * pixelRatio : 0, ang = Math.random() * 6.283;
  gl.uniform2f(P.u.uShake, Math.cos(ang) * amp / R.cw, Math.sin(ang) * amp / R.ch);
  gl.uniform2f(P.u.uBoom, fx.boomX, 1 - fx.boomY);
  gl.uniform1f(P.u.uFlash, settings.aberration && !debugView ? fx.flash : 0);
  gl.uniform1f(P.u.uCA, settings.aberration && !debugView ? fx.ca : 0);
  const sh = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    const s = fx.shocks[i];
    if (s.power > 0) {
      s.age += dt;
      const life = 520;
      if (s.age > life) s.power = 0;
      sh[i * 4] = s.x; sh[i * 4 + 1] = 1 - s.y; sh[i * 4 + 2] = s.age * 0.0011;
      sh[i * 4 + 3] = settings.distort && !debugView ? s.power * (1 - s.age / life) : 0;
    }
  }
  gl.uniform4fv(P.u.uShock, sh);
  gl.uniform4f(P.u.uOpts, settings.vignette ? 1 : 0, settings.grain ? 1 : 0, settings.tonemap ? 1 : 0, debugView ? 1 : 0);
  glQuad();
  const t3 = performance.now();
  perf.pack += t1 - t0; perf.draw += t2 - t1; perf.post += t3 - t2;
  void k;
}

/* ---------------------------------------------------------------------
 * 3.5 Canvas2D 退路：逐格上色，每格 1 像素，由 CSS 放大
 * ------------------------------------------------------------------- */
const R2 = { img: null, px: null };
const BG32 = 0xff000000 | (15 << 16) | (10 << 8) | 10;

function rgb32(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return 0xff000000 | (b << 16) | (g << 8) | r;
}

function render2D(timeMs) {
  const t0 = performance.now();
  const px = R2.px, all = sceneDirty, fr = (timeMs / 60) | 0;
  let changed = all;
  for (let cy = 0; cy < CHN; cy++) for (let cx = 0; cx < CW; cx++) {
    const c = cx + cy * CW;
    if (!all && chunkTTL[c] === 0) continue;
    changed = true;
    const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
    let cnt = 0;
    const act = chunkTTL[c] > 0;
    for (let y = y0; y < y1; y++) for (let x = x0, i = y * W + x0; x < x1; x++, i++) {
      const t = type[i], T = temp[i];
      let r, g, b;
      if (viewMode === 1) {                                // 温度
        if (T < 20) { const k = Math.max(0, (T + 40) / 60); r = 38 - 30 * k; g = 128 - 120 * k; b = 255 - 237 * k; }
        else { const k = Math.sqrt(Math.min(1, (T - 20) / 1700)); r = 8 + 247 * Math.min(1, k * 2.2); g = 8 + 230 * Math.max(0, k * 1.6 - 0.5); b = 18 + 200 * Math.max(0, k * 3 - 2.2); }
        if (t !== 0) cnt++;
        px[i] = rgb32(r, g, b);
        continue;
      }
      if (t === 0) {
        if (viewMode === 3) px[i] = act ? rgb32(10, 46, 22) : rgb32(30, 10, 12);
        else px[i] = BG32;
        continue;
      }
      cnt++;
      const m = MATERIALS[t];
      if (viewMode === 2) { const k = Math.min(1, Math.log(Math.max(1, m.density)) / Math.log(8000)); px[i] = rgb32(20 + 235 * k, 50 + 180 * k, 140 - 60 * k); continue; }
      const sd = seed[i], col = t === FLOWER ? m.rgb[Math.min(m.rgb.length - 1, (sd / 51) | 0)] : m.rgb[sd % m.rgb.length];
      const v = 1 + (((sd * 157) & 255) / 255 - 0.5) * 0.14;
      r = col[0] * v; g = col[1] * v; b = col[2] * v;
      const f = flags[i];
      if (m.life) {                                        // 气体 / 能量：按寿命淡出，火焰闪烁
        const a = t === SMOKE ? Math.min(1, life[i] / 40) * 0.8 : 1;
        if (t === FIRE) { const k = ((sd + fr * 37 + x * 13 + y * 7) & 63) / 63; r = 255; g = 70 + 150 * k; b = 20 + 40 * k; }
        r = 10 + (r - 10) * a; g = 10 + (g - 10) * a; b = 15 + (b - 15) * a;
      } else if (t === LAVA) { const k = Math.min(1, Math.max(0, (T - 800) / 650)); r = 90 + 165 * k; g = 20 + 110 * k * (0.6 + 0.4 * (sd / 255)); b = 5; }
      else if (t === TNT) { if (y % 3 === 0) { r = 240; g = 232; b = 230; } if ((f & F_BURN) && (fr & 4)) { r = 255; g = 220; b = 160; } }
      else if (t === GLASS) { r = 10 + (r - 10) * 0.45; g = 10 + (g - 10) * 0.45; b = 15 + (b - 15) * 0.45; if (((x - y) & 7) === 0) { r += 40; g += 45; b += 50; } }
      else if (t === WATER || t === SALTWATER) { const k = ((x * 3 + y * 5 + fr) & 31) === 0 ? 30 : 0; r += k; g += k; b += k; }
      if (f & F_SCORCH) { r *= 0.4; g *= 0.4; b *= 0.4; }
      if ((f & F_BURN) && t !== TNT) { const k = ((sd + fr * 29) & 31) / 31; r = r * 0.4 + 200 + 55 * k; g = g * 0.4 + 60 + 60 * k; b = b * 0.4; }
      if (T > 450 && !m.life && t !== LAVA) { const k = Math.min(1, (T - 450) / 1350); r += 255 * Math.min(1, k * 3); g += 200 * Math.max(0, k * 1.6 - 0.3); b += 160 * Math.max(0, k * 2.5 - 1.4); }
      if (charge[i]) { r = r * 0.5 + 140; g = g * 0.5 + 160; b = b * 0.5 + 180; }
      if (viewMode === 3) { r = r * 0.6 + (act ? 10 : 40); g = g * 0.6 + (act ? 50 : 10); b = b * 0.6 + 10; }
      px[i] = rgb32(r, g, b);
    }
    chunkCount[c] = cnt;
  }
  sceneDirty = false;
  if (changed) {
    let total = 0;
    for (let c = 0; c < chunkCount.length; c++) total += chunkCount[c];
    particleCount = total;
  }
  ctx2d.putImageData(R2.img, 0, 0);
  if (fpCount > 0) {                                       // 飞行粒子直接画在上面
    for (let k = 0; k < FP_MAX; k++) {
      if (!fpAlive[k]) continue;
      const m = MATERIALS[fpType[k]], c = m.rgb[fpSeed[k] % m.rgb.length];
      ctx2d.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.45)';
      ctx2d.fillRect(fpPX[k] | 0, fpPY[k] | 0, 1, 1);
      ctx2d.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      ctx2d.fillRect(fpX[k] | 0, fpY[k] | 0, 1, 1);
    }
  }
  if (fx.flash > 0.01 && settings.aberration) {            // 爆炸闪白
    ctx2d.fillStyle = 'rgba(255,255,255,' + Math.min(0.8, fx.flash).toFixed(3) + ')';
    ctx2d.fillRect(0, 0, W, H);
  }
  fx.flash *= 0.5; fx.shake *= 0.86;
  canvas.style.transform = settings.shake && fx.shake > 0.3 ?
    'translate(' + ((Math.random() - 0.5) * fx.shake).toFixed(1) + 'px,' + ((Math.random() - 0.5) * fx.shake).toFixed(1) + 'px)' : '';
  perf.draw += performance.now() - t0;
}

/* ---------------------------------------------------------------------
 * 3.6 对外接口
 * ------------------------------------------------------------------- */
function createRenderer(host) {
  canvas = document.createElement('canvas');
  let ok = false;
  if (!QS.has('nogl')) {
    try { ok = glInit(canvas); } catch (e) { console.warn('WebGL2 初始化失败，退回 Canvas2D：', e.message); ok = false; gl = null; }
  }
  if (ok) renderMode = 'webgl2';
  else {
    canvas = document.createElement('canvas');
    ctx2d = canvas.getContext('2d', { alpha: false });
    renderMode = 'canvas2d';
    canvas.style.imageRendering = 'pixelated';
  }
  canvas.id = 'canvas';
  host.insertBefore(canvas, host.firstChild);
  if (gl) {
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); toast && toast('WebGL 上下文丢失，请刷新页面'); });
  }
}

function resizeRenderer() {
  canvas.style.width = W * CELL + 'px';
  canvas.style.height = H * CELL + 'px';
  if (gl) {
    let pr = settings.hd ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    if (W * CELL * pr * H * CELL * pr > 5.2e6) pr = 1;
    pixelRatio = pr;
    canvas.width = Math.round(W * CELL * pr); canvas.height = Math.round(H * CELL * pr);
    glResize();
  } else {
    pixelRatio = 1;
    canvas.width = W; canvas.height = H;
    R2.img = ctx2d.createImageData(W, H);
    R2.px = new Uint32Array(R2.img.data.buffer);
    sceneDirty = true;
  }
}

function renderFrame(timeMs, dt) {
  if (gl) renderGL(timeMs, dt); else render2D(timeMs);
}

/* =====================================================================
 * 4. 音效：全部用 WebAudio 程序合成，没有任何音频文件。
 *    持续类（沙、水、火、嘶嘶、电）各用一条常驻的滤波噪声「声床」，
 *    只调增益 → 同类声音天然合并；瞬时类（爆炸、噼啪）限制并发数。
 *    所有增益变化都走 setTargetAtTime / 斜坡，避免爆音。
 * ===================================================================== */
const audio = { ctx: null, master: null, reverb: null, noise: null, beds: {}, volume: 0.6, muted: false,
                booms: 0, crackles: 0, lastBoom: 0, hissEnv: 0, elecEnv: 0 };

function audioStart() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = audio.ctx = new AC();
  const master = audio.master = ctx.createGain();
  master.gain.value = audio.muted ? 0 : audio.volume;
  const comp = ctx.createDynamicsCompressor();          // 总线压限，叠加再多也不削波
  comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
  master.connect(comp); comp.connect(ctx.destination);

  // 2 秒白噪声，循环播放
  const nb = audio.noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // 混响：指数衰减的噪声当脉冲响应
  const len = Math.floor(ctx.sampleRate * 1.8);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  const rg = ctx.createGain();
  rg.gain.value = 0.4;
  conv.connect(rg); rg.connect(master);
  audio.reverb = conv;

  const bed = (name, ftype, freq, q) => {
    const src = ctx.createBufferSource();
    src.buffer = nb; src.loop = true; src.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter();
    f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
    audio.beds[name] = { gain: g, filter: f };
    return audio.beds[name];
  };
  bed('sand', 'bandpass', 5200, 0.7);                   // 沙沙声
  const water = bed('water', 'bandpass', 700, 1.1);     // 流水：带通中心频率被慢速 LFO 晃动
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = 0.9; lg.gain.value = 260;
  lfo.connect(lg); lg.connect(water.filter.frequency); lfo.start();
  bed('fire', 'lowpass', 420, 0.5);                     // 火焰的低频呼呼声
  bed('hiss', 'highpass', 5500, 0.6);                   // 熔岩遇水的嘶嘶声
  const elec = bed('elec', 'bandpass', 3200, 6);        // 电火花：窄带噪声被 55Hz 方波斩波 → 嗞嗞
  const chop = ctx.createOscillator(), cg = ctx.createGain(), am = ctx.createGain();
  chop.type = 'square'; chop.frequency.value = 55; cg.gain.value = 0.5; am.gain.value = 0.5;
  elec.gain.disconnect(); elec.gain.connect(am); am.connect(master);
  chop.connect(cg); cg.connect(am.gain); chop.start();
}

function audioSetVolume() {
  if (!audio.ctx) return;
  audio.master.gain.setTargetAtTime(audio.muted ? 0 : audio.volume, audio.ctx.currentTime, 0.03);
}

function audioCrackle() {
  const ctx = audio.ctx;
  if (audio.crackles >= 6) return;
  audio.crackles++;
  const now = ctx.currentTime, dur = 0.03 + Math.random() * 0.05;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 1200 + Math.random() * 4200; f.Q.value = 1.5;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.06 + Math.random() * 0.14, now + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(f); f.connect(g); g.connect(audio.master);
  src.start(now, Math.random() * 1.5, dur + 0.02);
  src.onended = () => { audio.crackles--; };
}

function audioBoom(scale) {
  const ctx = audio.ctx;
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  if (now - audio.lastBoom < 0.05 || audio.booms >= 4) return;      // 同一瞬间的爆炸合并成一声
  audio.lastBoom = now; audio.booms++;
  const s = Math.min(1, Math.max(0.12, scale)), dur = 0.35 + 1.3 * s;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.8;
  lp.frequency.setValueAtTime(300 + 1400 * s, now);
  lp.frequency.exponentialRampToValueAtTime(45, now + dur * 0.8);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.9 * s, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(lp); lp.connect(g); g.connect(audio.master); g.connect(audio.reverb);
  src.start(now, Math.random(), dur + 0.05);
  src.onended = () => { audio.booms--; };
  const osc = ctx.createOscillator(), og = ctx.createGain();     // 低频轰鸣
  osc.type = 'sine';
  osc.frequency.setValueAtTime(90, now);
  osc.frequency.exponentialRampToValueAtTime(28, now + 0.5 * dur);
  og.gain.setValueAtTime(0.0001, now);
  og.gain.exponentialRampToValueAtTime(0.8 * s, now + 0.01);
  og.gain.exponentialRampToValueAtTime(0.0001, now + 0.7 * dur);
  osc.connect(og); og.connect(audio.master);
  osc.start(now); osc.stop(now + dur);
}

// 每个渲染帧调用一次：把模拟统计量映射成各声床的音量
function audioFrame() {
  const ctx = audio.ctx;
  if (ctx && ctx.state === 'running') {
    const now = ctx.currentTime, b = audio.beds;
    b.sand.gain.gain.setTargetAtTime(Math.min(0.2, st.powder / 500 * 0.2), now, 0.07);
    b.water.gain.gain.setTargetAtTime(Math.min(0.16, st.liquid / 900 * 0.16), now, 0.1);
    b.fire.gain.gain.setTargetAtTime(Math.min(0.22, st.fire / 220 * 0.22), now, 0.12);
    audio.hissEnv = Math.min(1, audio.hissEnv * 0.9 + st.hiss * 0.12);
    b.hiss.gain.gain.setTargetAtTime(audio.hissEnv * 0.2, now, 0.04);
    audio.elecEnv = Math.min(1, audio.elecEnv * 0.8 + st.elec * 0.08);
    b.elec.gain.gain.setTargetAtTime(audio.elecEnv * 0.3, now, 0.02);
    if (st.fire > 0 && Math.random() < Math.min(0.45, st.fire / 180)) audioCrackle();
  }
  st.powder = 0; st.liquid = 0; st.fire = 0; st.hiss = 0; st.elec = 0; st.boil = 0; st.boom = 0;
}

  [TOOL_HEAT]: { name: '加热', palette: ['#ff5a1e', '#ffd23f', '#ff2d00'], note: '每帧给笔刷范围升温 60°C，上限 2500°C' },
  [TOOL_COOL]: { name: '冷却', palette: ['#5ab4ff', '#d6f0ff', '#2a6cff'], note: '每帧给笔刷范围降温 60°C，下限 -200°C' },
};
const CATEGORIES = [
  { name: '粉末', ids: [SAND, SOIL, SALT, GUNPOWDER, ASH, SEED] },
  { name: '液体', ids: [WATER, SALTWATER, OIL, ACID, LAVA] },
  { name: '固体', ids: [STONE, WOOD, METAL, GLASS, ICE, PLANT, FLOWER, CHARCOAL, TNT] },
  { name: '气体', ids: [SMOKE, STEAM] },
  { name: '能量', ids: [FIRE, EMBER, SPARK] },
  { name: '工具', ids: [TOOL_ERASE, TOOL_HEAT, TOOL_COOL, CLONE, VOID] },
];
const HOTKEYS = { '1': SAND, '2': WATER, '3': STONE, '4': WOOD, '5': FIRE, '6': LAVA, '7': OIL, '8': TNT, '9': METAL, '0': TOOL_ERASE };
const toolButtons = new Map();

function toolInfo(id) { return id >= 100 ? TOOLS[id] : MATERIALS[id]; }

function buildPalette() {
  const host = $('palette');
  const keyOf = {};
  for (const k in HOTKEYS) keyOf[HOTKEYS[k]] = k;
  for (const cat of CATEGORIES) {
    const box = document.createElement('div');
    box.className = 'cat';
    const h = document.createElement('h3');
    h.textContent = cat.name;
    const items = document.createElement('div');
    items.className = 'items';
    for (const id of cat.ids) {
      const info = toolInfo(id), p = info.palette;
      const b = document.createElement('button');
      b.className = 'el' + (id < 100 && (MATERIALS[id].emissive > 0 || id === SPARK) ? ' glow' : '');
      b.style.setProperty('--c1', id === VOID ? '#7a35c8' : p[0]);
      b.style.setProperty('--c2', p[1] || p[0]);
      b.style.setProperty('--c3', p[2] || p[0]);
      b.innerHTML = '<span class="sw"></span><span class="nm"></span>' + (keyOf[id] ? '<kbd>' + keyOf[id] + '</kbd>' : '');
      b.querySelector('.nm').textContent = info.name;
      b.addEventListener('click', () => selectTool(id));
      b.addEventListener('mouseenter', () => showTip(id, b));
      b.addEventListener('mouseleave', hideTip);
      b.addEventListener('focus', () => showTip(id, b));
      b.addEventListener('blur', hideTip);
      items.appendChild(b);
      toolButtons.set(id, b);
    }
    box.appendChild(h); box.appendChild(items);
    host.appendChild(box);
  }
}

function selectTool(id) {
  tool = id;
  for (const [k, b] of toolButtons) b.classList.toggle('on', k === id);
}

function fmtT(v) { return Math.round(v) + '°C'; }

function showTip(id, anchor) {
  const tip = $('tip');
  let html;
  if (id >= 100) {
    html = '<h4>' + TOOLS[id].name + '</h4><div class="sub">工具</div><div>' + TOOLS[id].note + '</div>';
  } else {
    const m = MATERIALS[id], rows = [];
    rows.push(['密度', m.density >= 10 ? Math.round(m.density) + ' kg/m³' : m.density + ' kg/m³']);
    rows.push(['导热', m.conductivity.toFixed(2)]);
    rows.push(['比热', m.heatCapacity.toFixed(1)]);
    if (m.state !== S_GAS && m.state !== S_ENERGY) rows.push(['硬度', m.hardness > 1 ? '不可破坏' : m.hardness.toFixed(2)]);
    if (m.spawnTemp !== AMBIENT) rows.push(['初始温度', fmtT(m.spawnTemp)]);
    if (m.flammability > 0) rows.push(['燃点', fmtT(m.ignitionTemp) + '，烧成' + (m.blastRadius ? '爆炸' : MATERIALS[m.burnInto].name)]);
    if (isFinite(m.meltTemp)) rows.push(['熔点', fmtT(m.meltTemp) + ' → ' + MATERIALS[m.meltInto].name]);
    if (isFinite(m.boilTemp)) rows.push(['沸点', fmtT(m.boilTemp) + ' → ' + MATERIALS[m.boilInto].name]);
    if (isFinite(m.freezeTemp)) rows.push([m.state === S_GAS ? '凝结' : '凝固', '低于 ' + fmtT(m.freezeTemp) + ' → ' + MATERIALS[m.freezeInto].name]);
    if (m.blastRadius) rows.push(['爆炸', '半径 ' + m.blastRadius + ' 格，威力 ' + m.blastPower]);
    if (m.life) rows.push(['寿命', m.life[0] + '–' + m.life[1] + ' 帧']);
    if (m.electric) rows.push(['导电', '是']);
    // 反应列表直接从规则表生成
    const rx = [];
    const nm = t => t === EMPTY ? '消失' : MATERIALS[t].name;
    for (const r of RULES) {
      if (r.a !== id && r.b !== id) continue;
      const other = r.a === id ? r.b : r.a, self2 = r.a === id ? r.a2 : r.b2, other2 = r.a === id ? r.b2 : r.a2;
      let s;
      if (r.tag === 'grow') s = id === PLANT ? '吸水后生长' : '被植物吸收';
      else if (r.use) s = r.a === id ? '溶解它' : '被溶解';
      else {
        const parts = [];
        if (self2 !== id) parts.push('自己→' + nm(self2));
        if (other2 !== other) parts.push('对方→' + nm(other2));
        s = parts.join('，') || '无变化';
      }
      rx.push('<li>碰到<b>' + MATERIALS[other].name + '</b>：' + s + '</li>');
    }
    if (id === SPARK) rx.push('<li>碰到<b>金属 / 水</b>：注入电荷并传导</li><li>碰到<b>可燃物</b>：加热到燃点</li>');
    html = '<h4>' + m.name + '</h4><div class="sub">' + STATE_NAMES[m.state] + (m.note ? ' · ' + m.note : '') + '</div><dl>' +
      rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>' +
      (rx.length ? '<ul>' + rx.slice(0, 9).join('') + (rx.length > 9 ? '<li>……共 ' + rx.length + ' 条</li>' : '') + '</ul>' : '');
  }
  tip.innerHTML = html;
  tip.style.display = 'block';
  const r = anchor.getBoundingClientRect(), th = tip.offsetHeight;
  const side = $('palette').getBoundingClientRect().right + 8;
  tip.style.left = Math.min(window.innerWidth - 260, side) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 8, r.top - 6)) + 'px';
}
function hideTip() { $('tip').style.display = 'none'; }

/* ---------------------------------------------------------------------
 * 5.2 笔刷
 * ------------------------------------------------------------------- */
function stamp(cx, cy, erase) {
  const t = erase ? TOOL_ERASE : tool;
  const r = brush.size - 1, r2 = r * r + r * 0.8;
  const round = brush.shape !== 'square', spray = brush.shape === 'spray' && r > 0;
  const replace = brush.replace;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (round && dx * dx + dy * dy > r2) continue;
    if (spray && rnd() > 0.1) continue;
    paintCell(cx + dx, cy + dy, t, replace);
  }
}

function stampLine(x0, y0, x1, y1, erase) {
  const dx = x1 - x0, dy = y1 - y0, dist = Math.max(Math.abs(dx), Math.abs(dy));
  const stepLen = Math.max(1, brush.size >> 1);
  for (let s = 0; s <= dist; s += stepLen) {
    const k = dist === 0 ? 0 : s / dist;
    stamp(Math.round(x0 + dx * k), Math.round(y0 + dy * k), erase);
  }
  stamp(x1, y1, erase);
}

function toCell(e) {
  const r = canvas.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) / r.width * W), y: Math.floor((e.clientY - r.top) / r.height * H) };
}

function updateCursor() {
  if (!pointer.inside || pointer.hx < 0) { cursorEl.style.display = 'none'; linePrev.style.display = 'none'; return; }
  const r = brush.size - 1, d = (2 * r + 1) * CELL;
  cursorEl.style.display = 'block';
  cursorEl.className = brush.shape === 'circle' ? 'round' : brush.shape === 'spray' ? 'spray' : '';
  cursorEl.style.width = cursorEl.style.height = d + 'px';
  cursorEl.style.left = (pointer.hx - r) * CELL + 'px';
  cursorEl.style.top = (pointer.hy - r) * CELL + 'px';
  if (pointer.down && pointer.line) {
    const ax = (pointer.lx0 + 0.5) * CELL, ay = (pointer.ly0 + 0.5) * CELL;
    const bx = (pointer.hx + 0.5) * CELL, by = (pointer.hy + 0.5) * CELL;
    linePrev.style.display = 'block';
    linePrev.style.left = ax + 'px'; linePrev.style.top = ay + 'px';
    linePrev.style.width = Math.hypot(bx - ax, by - ay) + 'px';
    linePrev.style.transform = 'rotate(' + Math.atan2(by - ay, bx - ax) + 'rad)';
  } else linePrev.style.display = 'none';
}

function bindPointer() {
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    audioStart();
    closePops();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有活动指针 */ }
    const p = toCell(e);
    pushUndo();
    pointer.down = true; pointer.erase = e.button === 2; pointer.inside = true;
    pointer.x = pointer.hx = p.x; pointer.y = pointer.hy = p.y;
    pointer.line = e.shiftKey; pointer.lx0 = p.x; pointer.ly0 = p.y;
    if (!pointer.line) stamp(p.x, p.y, pointer.erase);
    updateCursor();
  });
  canvas.addEventListener('pointermove', e => {
    const p = toCell(e);
    pointer.inside = true; pointer.hx = p.x; pointer.hy = p.y;
    if (pointer.down && !pointer.line) {
      stampLine(pointer.x, pointer.y, p.x, p.y, pointer.erase);
      pointer.x = p.x; pointer.y = p.y;
    }
    updateCursor();
  });
  const end = e => {
    if (pointer.down && pointer.line) stampLine(pointer.lx0, pointer.ly0, pointer.hx, pointer.hy, pointer.erase);   // Shift 直线：松手时落笔
    pointer.down = false; pointer.line = false;
    if (e.pointerType === 'touch') { pointer.inside = false; pointer.hx = -1; }
    updateCursor();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', () => { if (!pointer.down) { pointer.inside = false; pointer.hx = -1; updateCursor(); } });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => { pointer.down = false; pointer.line = false; });
}

/* ---------------------------------------------------------------------
 * 5.3 撤销：环形缓冲 20 个 RLE 快照，每次落笔（或清空/载入）前记一次
 * ------------------------------------------------------------------- */
const UNDO_MAX = 20;
const undoRing = new Array(UNDO_MAX).fill(null);
let undoHead = 0, undoLen = 0;

function pushUndo() {
  undoRing[undoHead] = captureScene();
  undoHead = (undoHead + 1) % UNDO_MAX;
  if (undoLen < UNDO_MAX) undoLen++;
}

function undo() {
  if (undoLen === 0) { toast('没有可撤销的操作'); return; }
  undoHead = (undoHead + UNDO_MAX - 1) % UNDO_MAX;
  undoLen--;
  const s = undoRing[undoHead];
  undoRing[undoHead] = null;
  restoreScene(s);
  syncGravityUI();
  toast('已撤销（还可撤销 ' + undoLen + ' 步）');
}

/* ---------------------------------------------------------------------
 * 5.4 存档 / 导入导出 / 截图 / 录制
 * ------------------------------------------------------------------- */
const SLOT_KEY = 'particle-sandbox-v3-slots';

function readSlots() {
  try { return JSON.parse(localStorage.getItem(SLOT_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function renderSlots() {
  const host = $('slotList'), slots = readSlots(), names = Object.keys(slots);
  host.textContent = '';
  if (!names.length) { const d = document.createElement('div'); d.className = 'note'; d.style.marginTop = '0'; d.textContent = '还没有存档'; host.appendChild(d); return; }
  for (const name of names) {
    const row = document.createElement('div');
    row.className = 'slot';
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = name;
    const load = document.createElement('button');
    load.textContent = '读取';
    load.addEventListener('click', () => {
      try { pushUndo(); restoreScene(sceneFromJSON(slots[name])); syncGravityUI(); toast('已读取「' + name + '」'); closePops(); }
      catch (e) { toast('读取失败：' + e.message); }
    });
    const del = document.createElement('button');
    del.textContent = '删除'; del.className = 'danger';
    del.addEventListener('click', () => {
      const s = readSlots();
      delete s[name];
      localStorage.setItem(SLOT_KEY, JSON.stringify(s));
      renderSlots();
    });
    row.appendChild(nm); row.appendChild(load); row.appendChild(del);
    host.appendChild(row);
  }
}

function saveSlot() {
  const name = $('slotName').value.trim() || '存档 ' + new Date().toLocaleTimeString();
  const slots = readSlots();
  slots[name] = sceneToJSON(captureScene());
  try { localStorage.setItem(SLOT_KEY, JSON.stringify(slots)); toast('已保存到「' + name + '」'); }
  catch (e) { toast('保存失败：浏览器本地存储空间不足，请改用导出 JSON'); }
  $('slotName').value = '';
  renderSlots();
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function stampName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'sandbox-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + ext;
}

function exportJSON() { downloadBlob(new Blob([sceneToJSON(captureScene())], { type: 'application/json' }), stampName('json')); }

function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try { const s = sceneFromJSON(String(fr.result)); pushUndo(); restoreScene(s); syncGravityUI(); toast('已导入 ' + file.name); }
    catch (e) { toast('导入失败：' + e.message); }
  };
  fr.readAsText(file);
}

function screenshot() {
  renderFrame(performance.now(), 16.7);                  // WebGL 画布必须在同一个任务里画完再读
  if (gl) canvas.toBlob(b => b && downloadBlob(b, stampName('png')), 'image/png');
  else {
    const out = document.createElement('canvas');
    out.width = W * CELL; out.height = H * CELL;
    const c = out.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(canvas, 0, 0, out.width, out.height);
    out.toBlob(b => b && downloadBlob(b, stampName('png')), 'image/png');
  }
}

const rec = { mr: null, chunks: [], timer: 0, endAt: 0 };

function toggleRecord() {
  if (rec.mr) { rec.mr.stop(); return; }
  if (!canvas.captureStream || !window.MediaRecorder) { toast('这个浏览器不支持录制'); return; }
  const secs = Math.min(30, Math.max(5, +$('selRec').value));
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  let mr;
  try { mr = new MediaRecorder(canvas.captureStream(60), mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined); }
  catch (e) { toast('无法开始录制：' + e.message); return; }
  rec.mr = mr; rec.chunks = []; rec.endAt = performance.now() + secs * 1000;
  mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = () => {
    clearInterval(rec.timer);
    rec.mr = null;
    $('btnRec').textContent = '录制'; $('btnRec').classList.remove('warn'); $('recdot').style.display = 'none';
    if (rec.chunks.length) { downloadBlob(new Blob(rec.chunks, { type: 'video/webm' }), stampName('webm')); toast('录制完成，已下载 WebM'); }
  };
  mr.start(250);
  $('btnRec').textContent = '停止'; $('btnRec').classList.add('warn'); $('recdot').style.display = 'block';
  rec.timer = setInterval(() => {
    const left = Math.max(0, rec.endAt - performance.now());
    $('recdot').textContent = '录制中 ' + (left / 1000).toFixed(1) + ' 秒';
    if (left <= 0 && rec.mr) rec.mr.stop();
  }, 100);
}

/* ---------------------------------------------------------------------
 * 5.5 预设场景
 * ------------------------------------------------------------------- */
function setBurning(x, y) {
  if (!inb(x, y)) return;
  const i = x + y * W, t = type[i];
  if (M_FLAM[t] > 0) { temp[i] = M_IGN[t] + 150; ignite(i, t, x, y); }
}

function sceneVolcano() {
  const cx = W >> 1, base = H - 5, peak = Math.floor(H * 0.56), half = Math.floor(W * 0.3), sea = Math.floor(H * 0.74);
  fillRect(STONE, 0, base, W - 1, H - 1);
  const top = new Int32Array(W);
  for (let x = 0; x < W; x++) {
    const k = Math.max(0, 1 - Math.abs(x - cx) / half);
    const h = Math.floor(Math.pow(k, 1.25) * peak + (k > 0 ? Math.sin(x * 0.31) * 2 + Math.sin(x * 0.11) * 3 : 0));
    top[x] = base - Math.max(0, h);
    for (let y = top[x]; y < base; y++) put(x + y * W, STONE, x, y);
    if (top[x] > sea - 4 && top[x] < base) for (let y = top[x] - 2; y < top[x]; y++) if (inb(x, y)) put(x + y * W, SAND, x, y);   // 海滩
  }
  for (let y = sea; y < base; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === 0) put(x + y * W, WATER, x, y);
  // 火山口：竖井 + 岩浆房，房底埋两个克隆体当岩浆源
  const mouth = top[cx], depth = Math.floor(peak * 0.42);
  fillRect(LAVA, cx - 2, mouth + 4, cx + 2, mouth + depth);
  fillCircle(LAVA, cx, mouth + depth, 7);
  fillRect(EMPTY, cx - 2, mouth - 6, cx + 2, mouth + 3);
  for (const dx of [-3, 3]) for (const dy of [2, 3]) {   // 熔岩源嵌在火山口内壁里，不断往井里吐熔岩
    const x = cx + dx, y = mouth + dy, i = x + y * W;
    put(i, CLONE, x, y); life[i] = LAVA;
  }
  // 山腰点几丛植物
  for (let k = 0; k < 26; k++) {
    const x = cx + (rnd() < 0.5 ? -1 : 1) * Math.floor(half * (0.45 + rnd() * 0.4));
    if (x < 1 || x >= W - 1 || top[x] >= sea) continue;
    for (let h = 1; h <= 2 + rndi(4); h++) if (inb(x, top[x] - h)) put(x + (top[x] - h) * W, PLANT, x, top[x] - h);
  }
}

function drawTree(x, ground, h, r) {
  for (let y = ground - h; y < ground; y++) for (let dx = 0; dx < 2; dx++) if (inb(x + dx, y)) put(x + dx + y * W, WOOD, x + dx, y);
  for (let k = 0; k < 3; k++) {
    const ox = x + rndi(7) - 3, oy = ground - h - rndi(4);
    for (let y = Math.floor(oy - r); y <= oy + r; y++) for (let xx = Math.floor(ox - r); xx <= ox + r; xx++) {
      const dx = xx - ox, dy = (y - oy) * 1.25;
      if (!inb(xx, y) || dx * dx + dy * dy > r * r || type[xx + y * W] !== 0 || rnd() < 0.12) continue;
      put(xx + y * W, PLANT, xx, y);
    }
  }
}

function groundLine(amp, k1, k2, baseY) {
  const g = new Int32Array(W);
  for (let x = 0; x < W; x++) g[x] = Math.floor(baseY + Math.sin(x * k1) * amp + Math.sin(x * k2 + 1.7) * amp * 0.6);
  return g;
}

function sceneForest() {
  const g = groundLine(3, 0.035, 0.09, H - 16);
  for (let x = 0; x < W; x++) {
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
    if (rnd() < 0.55) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);      // 草
  }
  for (let x = 14; x < W - 12; x += 17 + rndi(10)) drawTree(x, g[x], 16 + rndi(Math.max(4, Math.floor(H * 0.16))), 6 + rndi(4));
  for (let k = 0; k < W / 9; k++) {                       // 零星的花
    const x = 2 + rndi(W - 4), y = g[x] - 2 - rndi(2), c = rndi(5) * 51 + 8;
    if (inb(x, y) && type[x + y * W] === PLANT) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); }
  }
  // 左边第一棵树的树根处点火
  for (let x = 12; x < 20; x++) for (let y = g[14] - 6; y < g[14]; y++) setBurning(x, y);
}

function sceneHourglass() {
  const cx = W >> 1, cy = H >> 1, b = Math.floor(H * 0.42), a = Math.floor(Math.min(W * 0.2, b * 0.75));
  const inner = (x, y) => {
    const dy = Math.abs(y - cy);
    return dy <= b - 3 && Math.abs(x - cx) <= 1 + (a - 4) * dy / b;
  };
  for (let y = cy - b; y <= cy + b; y++) for (let x = cx - a - 3; x <= cx + a + 3; x++) {
    if (!inb(x, y)) continue;
    if (inner(x, y)) continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) if (inner(x + dx, y + dy)) { near = true; break; }
    if (near) put(x + y * W, GLASS, x, y);
  }
  for (let y = cy - b + 3 + Math.floor(b * 0.12); y < cy - 2; y++) for (let x = cx - a; x <= cx + a; x++) if (inner(x, y)) put(x + y * W, SAND, x, y);
  fillRect(WOOD, cx - a - 6, cy - b - 3, cx + a + 6, cy - b - 1);
  fillRect(WOOD, cx - a - 6, cy + b + 1, cx + a + 6, cy + b + 3);
  for (const sx of [cx - a - 6, cx + a + 5]) fillRect(WOOD, sx, cy - b - 1, sx + 1, cy + b + 1);
}

function drawBeaker(x0, y1, w, h, liquid, fill) {
  for (let y = y1 - h; y <= y1; y++) for (let x = x0; x <= x0 + w; x++) {
    if (x <= x0 + 1 || x >= x0 + w - 1 || y >= y1 - 1) put(x + y * W, GLASS, x, y);
    else if (liquid && y > y1 - 1 - h * fill) put(x + y * W, Array.isArray(liquid) ? liquid[rndi(liquid.length)] : liquid, x, y);
  }
}

function sceneLab() {
  const floor = H - 4, table = Math.floor(H * 0.74);
  fillRect(STONE, 0, floor, W - 1, H - 1);
  fillRect(WOOD, 6, table, W - 7, table + 2);
  for (const lx0 of [10, W - 13]) fillRect(WOOD, lx0, table + 3, lx0 + 2, floor - 1);
  const n = 5, gap = Math.floor((W - 24) / n), bw = Math.min(gap - 8, Math.floor(W * 0.13)), bh = Math.floor(H * 0.3);
  const liquids = [OIL, WATER, ACID, SALTWATER, [OIL, WATER, SALTWATER]];
  for (let k = 0; k < n; k++) {
    const x0 = 14 + k * gap + ((gap - bw) >> 1);
    drawBeaker(x0, table - 1, bw, k === 4 ? Math.floor(bh * 1.5) : bh, liquids[k], k === 4 ? 0.8 : 0.62);
  }
  // 电路：左侧的电火花源（克隆体记住了电火花）→ 顶部金属导线 → 插进水槽的电极
  const wy = Math.floor(table - bh * 1.5 - 12), waterX = 14 + gap + (gap >> 1), srcX = 8;
  fillRect(METAL, srcX + 2, wy, waterX, wy);
  fillRect(METAL, waterX, wy, waterX, table - 1 - Math.floor(bh * 0.35));
  put(srcX + wy * W, CLONE, srcX, wy); life[srcX + wy * W] = SPARK;
  // 右侧：一小堆火药，导线故意留了 3 格缺口，补上金属就会引爆
  const gpX = W - 26;
  fillRect(METAL, waterX + 4, wy, gpX - 4, wy);
  fillRect(EMPTY, waterX + 1, wy, waterX + 3, wy);
  fillRect(GLASS, gpX - 8, wy + 11, gpX + 8, wy + 12);
  fillCircle(GUNPOWDER, gpX - 1, wy + 8, 3.2);
  fillRect(METAL, gpX - 4, wy, gpX - 4, wy + 10);
}

function sceneDemolition() {
  const floor = H - 6;
  fillRect(STONE, 0, floor, W - 1, H - 1);
  const bw = Math.floor(W * 0.36), x0 = Math.floor(W * 0.46), storeys = Math.max(3, Math.min(6, Math.floor((floor - 12) / 22))), sh = 22;
  for (let s = 0; s < storeys; s++) {
    const yb = floor - s * sh, yt = yb - sh;
    fillRect(WOOD, x0, yt, x0 + bw, yt + 1);                                  // 楼板
    for (let c = 0; c <= 4; c++) {                                            // 金属立柱
      const x = x0 + Math.floor(bw * c / 4);
      fillRect(METAL, x, yt + 2, x + 1, yb - 1);
    }
    for (let c = 0; c < 4; c++) {                                             // 石墙 + 玻璃窗
      const xa = x0 + Math.floor(bw * c / 4) + 2, xb = x0 + Math.floor(bw * (c + 1) / 4) - 1;
      fillRect(STONE, xa, yt + 2, xb, yb - 1);
      fillRect(GLASS, xa + 3, yt + 6, xb - 3, yb - 8);
      if ((c + s) % 2 === 0) fillRect(TNT, xa + 1, yb - 4, xa + 3, yb - 2);   // 炸药包
    }
  }
  // 导爆索：每层墙脚一条火药，再沿左墙内侧一条竖线把各层串起来
  for (let s = 0; s < storeys; s++) fillRect(GUNPOWDER, x0 + 2, floor - s * sh - 1, x0 + bw - 1, floor - s * sh - 1);
  fillRect(GUNPOWDER, x0 + 2, floor - storeys * sh + 2, x0 + 3, floor - 1);
  fillRect(METAL, x0 - 1, floor - storeys * sh - 2, x0 + bw + 2, floor - storeys * sh - 1);
  // 地面上的火药引线，从最左边点着
  fillRect(GUNPOWDER, 6, floor - 1, x0 + 3, floor - 1);
  fillRect(GUNPOWDER, x0 + 1, floor - 3, x0 + 3, floor - 1);
  setBurning(6, floor - 1); setBurning(7, floor - 1);
}

function sceneRain() {
  const g = groundLine(4, 0.03, 0.075, H - 20);
  const pondX = Math.floor(W * 0.68), pondR = Math.floor(W * 0.09);
  for (let x = 0; x < W; x++) {
    const d = Math.abs(x - pondX);
    if (d < pondR) g[x] += Math.floor(Math.cos(d / pondR * 1.5708) * 9);       // 挖一个池塘
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
  }
  const level = Math.min(g[Math.max(0, pondX - pondR)], g[Math.min(W - 1, pondX + pondR)]) + 1;
  for (let x = pondX - pondR; x <= pondX + pondR; x++) for (let y = level; y < g[x]; y++) if (inb(x, y)) put(x + y * W, WATER, x, y);
  const dv = pondX + (g[pondX] - 1) * W;                 // 池底放一个黑洞当排水口，免得越下越满
  put(dv, VOID, pondX, g[pondX] - 1);
  for (let x = 10; x < W - 8; x += 21 + rndi(12)) if (Math.abs(x - pondX) > pondR + 6) drawTree(x, g[x], 12 + rndi(12), 5 + rndi(3));
  for (let x = 2; x < W - 2; x++) {
    if (Math.abs(x - pondX) <= pondR) continue;
    const q = rnd();
    if (q < 0.5) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);
    else if (q < 0.62) put(x + (g[x] - 1) * W, SEED, x, g[x] - 1);
    if (q < 0.07) { const y = g[x] - 3, c = rndi(5) * 51 + 8; if (type[x + y * W] === 0) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); } }
  }
  // 顶部一排蒸汽源：蒸汽贴着顶棚聚成云，冷下来就变成雨
  for (let x = 6; x < W - 6; x += 9 + rndi(6)) { const i = x + W; put(i, CLONE, x, 1); life[i] = STEAM; }
  fillRect(STEAM, 2, 2, W - 3, 7);
}

const SCENES = [
  { name: '火山岛', note: '熔岩流进海里', fn: sceneVolcano },
  { name: '森林大火', note: '左边已经点着了', fn: sceneForest },
  { name: '沙漏', note: '按 G 翻转重力', fn: sceneHourglass },
  { name: '化学实验室', note: '分层、通电、火药', fn: sceneLab },
  { name: '爆破拆除', note: '引线正在燃烧', fn: sceneDemolition },

];

function loadScene(k) {

  toast('场景：' + s.name + ' — ' + s.note);
}

function setPaused(v) {

  $('btnPause').textContent = paused ? '▶ 继续' : '❚❚ 暂停';
  $('btnPause').classList.toggle('warn', paused);
}

function syncGravityUI() {
  document.querySelectorAll('#gravGrp button').forEach(b => b.classList.toggle('on', b.dataset.g === gravity));
}

function setBrushSize(v) {
  brush.size = Math.max(1, Math.min(30, v | 0));
  $('rngSize').value = brush.size; $('lblSize').textContent = brush.size;

function setView(v) {

let clearArmed = 0;
function requestClear() {
  const b = $('btnClear');
  if (clearArmed) {
    clearTimeout(clearArmed); clearArmed = 0;
    b.textContent = '清空'; b.classList.remove('armed');

const SETTING_LABELS = [
  ['bloom', '发光（Bloom）'], ['light', '动态光照'], ['distort', '热扭曲 / 折射 / 冲击波'], ['shake', '屏幕震动'],
  ['aberration', '爆炸闪白与色差'], ['tonemap', '色调映射（ACES）'], ['vignette', '暗角'], ['grain', '胶片颗粒'],
  ['gridLines', '背景网格'], ['hd', '高清渲染（按屏幕像素比）'],
];

function buildControls() {
  $('btnPause').addEventListener('click', () => setPaused(!paused));
  $('btnStep').addEventListener('click', () => { setPaused(true); stepOnce = true; });
  $('selSpeed').addEventListener('change', e => { speed = +e.target.value; });
  document.querySelectorAll('#gravGrp button').forEach(b => b.addEventListener('click', () => { setGravity(b.dataset.g); syncGravityUI(); }));
  document.querySelectorAll('[data-shape]').forEach(b => b.addEventListener('click', () => {
    brush.shape = b.dataset.shape;
    document.querySelectorAll('[data-shape]').forEach(o => o.classList.toggle('on', o === b));
    updateCursor();
  }));
  $('btnMode').addEventListener('click', () => {
    brush.replace = !brush.replace;
    $('btnMode').textContent = brush.replace ? '覆盖' : '填空';
    $('btnMode').classList.toggle('on', brush.replace);
  });
  $('rngSize').addEventListener('input', e => setBrushSize(+e.target.value));
  $('btnView').addEventListener('click', () => setView(viewMode + 1));
  $('btnUndo').addEventListener('click', undo);
  $('btnClear').addEventListener('click', requestClear);
  $('btnShot').addEventListener('click', screenshot);
  $('btnRec').addEventListener('click', toggleRecord);
  $('btnMute').addEventListener('click', () => {
    audioStart();
    audio.muted = !audio.muted;
    $('btnMute').textContent = audio.muted ? '静音' : '声音';
    $('btnMute').classList.toggle('warn', audio.muted);
    audioSetVolume();
  });
  $('rngVol').addEventListener('input', e => { audioStart(); audio.volume = +e.target.value / 100; audioSetVolume(); });
  document.querySelectorAll('[data-pop]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); togglePop(b); }));
  document.querySelectorAll('.pop').forEach(p => p.addEventListener('pointerdown', e => e.stopPropagation()));
  window.addEventListener('pointerdown', e => { if (!e.target.closest('[data-pop]')) closePops(); });
  window.addEventListener('pointerdown', audioStart, { once: true });

  SCENES.forEach((s, k) => {
    const b = document.createElement('button');
    b.innerHTML = '<span></span><small></small>';
    b.firstChild.textContent = (k + 1) + '. ' + s.name; b.lastChild.textContent = s.note;
    b.addEventListener('click', () => { loadScene(k); closePops(); });
    $('sceneList').appendChild(b);
  });

  for (const [key, label] of SETTING_LABELS) {
    const l = document.createElement('label'), c = document.createElement('input');
    c.type = 'checkbox'; c.checked = settings[key];
    c.addEventListener('change', () => {
      settings[key] = c.checked;
      if (key === 'hd') resizeRenderer();
      sceneDirty = true;
    });
    l.appendChild(c); l.appendChild(document.createTextNode(label));
    $('settingList').appendChild(l);
  }
  $('renderInfo').textContent = renderMode === 'webgl2'
    ? '渲染：WebGL2' + (R.hdr ? '（HDR 浮点缓冲）' : '（8 位缓冲）') + '。按 ` 打开调试面板。'
    : '渲染：Canvas2D 退路（没有 WebGL2）。发光、光照、扭曲等后处理不可用。';

  $('btnSlotSave').addEventListener('click', saveSlot);
  $('slotName').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') saveSlot(); });
  $('btnExport').addEventListener('click', exportJSON);
  $('btnImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; });
}

const GRAV_CYCLE = ['down', 'left', 'up', 'right'];
let debugOn = false;

function bindKeys() {
  window.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' && e.target.type === 'text') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); if (e.target.blur && tag === 'BUTTON') e.target.blur(); setPaused(!paused); }
    else if (k === '.') { setPaused(true); stepOnce = true; }
    else if (k === 'g' || k === 'G') { setGravity(GRAV_CYCLE[(GRAV_CYCLE.indexOf(gravity) + 1) % 4]); syncGravityUI(); }
    else if (k === 'v' || k === 'V') setView(viewMode + 1);
    else if (k === 'c' || k === 'C') requestClear();
    else if (k === '[') setBrushSize(brush.size - 1);
    else if (k === ']') setBrushSize(brush.size + 1);
    else if (k === '`' || k === '~') { debugOn = !debugOn; $('debug').style.display = debugOn ? 'block' : 'none'; }
    else if (k === 'Escape') closePops();
    else if (HOTKEYS[k] !== undefined) selectTool(HOTKEYS[k]);
  });
}

/* ---------------------------------------------------------------------
 * 5.7 自适应：窗口变化时重建网格，但保留场景内容（按底边居中对齐）
 * ------------------------------------------------------------------- */
function fitGrid(force) {
  const w = Math.max(48, Math.floor(stage.clientWidth / CELL)), h = Math.max(48, Math.floor(stage.clientHeight / CELL));
  if (!force && w === W && h === H) return;
  const snap = N > 0 ? captureScene() : null;
  allocGrid(w, h);
  if (snap && snap.n > 0) restoreScene(snap);
  resizeRenderer();
  undoLen = 0; undoHead = 0;
}

let resizeTimer = 0;
function bindResize() {
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (!testRunning) fitGrid(false); }, 160);
  }).observe(stage);
}

/* ---------------------------------------------------------------------
 * 5.8 状态栏、检视器、调试面板
 * ------------------------------------------------------------------- */
const hud = { frames: 0, last: 0, fps: 0, simRate: 0, lastSteps: 0, interval: 16.7, work: 0, throttled: false };

function updateHud(now) {
  const dt = now - hud.last;
  if (dt < 250) return;
  hud.fps = hud.frames * 1000 / dt;
  hud.simRate = (simStepsTotal - hud.lastSteps) * 1000 / dt;
  hud.frames = 0; hud.last = now; hud.lastSteps = simStepsTotal;
  $('stFps').textContent = Math.round(hud.fps);
  $('stSim').textContent = paused ? '暂停' : Math.round(hud.simRate);
  $('stCount').textContent = (particleCount + fpCount).toLocaleString();
  $('stMode').textContent = renderMode === 'webgl2' ? 'WebGL2' : 'Canvas2D';
  // rAF 间隔明显大于 16.7ms，而我们自己每帧的活儿（含 GPU）远小于间隔 → 是浏览器在降频，不是性能问题
  hud.throttled = document.hidden || (hud.fps < 50 && hud.work + perf.gpu < 8);
  $('stThrottle').classList.toggle('hide', !hud.throttled);
  $('stThrottle').textContent = 'rAF 被降频（实际 ' + (hud.fps < 10 ? hud.fps.toFixed(1) : Math.round(hud.fps)) + ' 帧/秒，每帧只需 ' + (hud.work + perf.gpu).toFixed(1) + 'ms）';

  // 检视器
  if (inb(pointer.hx, pointer.hy) && pointer.inside) {
    const i = pointer.hx + pointer.hy * W, t = type[i], f = flags[i], m = MATERIALS[t];
    let s = m.name + ' · ' + Math.round(temp[i]) + '°C · ' + STATE_NAMES[m.state];
    if (t === METAL && temp[i] > 450) s = '热' + s;
    if (t === CLONE && life[i]) s += ' · 复制：' + MATERIALS[life[i]].name;
    else if (life[i] && t !== 0) s += ' · ' + (f & F_BURN ? '燃烧剩余 ' : f & F_TIP ? '生长能量 ' : M_LATENT[t] ? '融化进度 ' : '寿命 ') + life[i];
    if (f & F_BURN) s += ' · 燃烧中';
    if (f & F_SCORCH) s += ' · 焦黑';
    if (charge[i]) s += ' · 带电';
    $('stInspect').textContent = s + '  (' + pointer.hx + ', ' + pointer.hy + ')';
  } else $('stInspect').textContent = '—';

  if (debugOn) {
    const n = Math.max(1, perf.frames || 1), sN = Math.max(1, perf.steps);
    $('debug').textContent =
      '网格        ' + W + ' x ' + H + '  (' + CW * CHN + ' 块)\n' +
      '活跃块      ' + perf.activeChunks + ' / ' + CW * CHN + '\n' +
      '飞行粒子    ' + fpCount + ' / ' + FP_MAX + '\n' +
      '爆炸 / 带电 ' + exActive + ' / ' + elecCount + '\n' +
      '模拟步数    ' + (perf.steps / n).toFixed(2) + ' 步/帧  (' + Math.round(hud.simRate) + ' 步/秒)\n' +
      '── 每帧耗时 (ms) ──\n' +
      '模拟·粒子   ' + (perf.cells / n).toFixed(2) + '   (每步 ' + (perf.cells / sN).toFixed(2) + ')\n' +
      '模拟·温度   ' + (perf.thermal / n).toFixed(2) + '\n' +
      '模拟·其他   ' + (perf.misc / n).toFixed(2) + '\n' +
      '渲染·打包   ' + (perf.pack / n).toFixed(2) + '\n' +
      '渲染·场景   ' + (perf.draw / n).toFixed(2) + '\n' +
      '渲染·后处理 ' + (perf.post / n).toFixed(2) + '\n' +
      'GPU 完成    ' + perf.gpu.toFixed(2) + '  (抽样 gl.finish)\n' +
      'rAF 间隔    ' + hud.interval.toFixed(1) + '   CPU 合计 ' + hud.work.toFixed(2) + '\n' +
      '渲染后端    ' + renderMode + (gl ? ' ' + canvas.width + 'x' + canvas.height + (R.hdr ? ' HDR' : '') : '');
  }
  perf.cells = perf.thermal = perf.misc = perf.pack = perf.draw = perf.post = 0; perf.steps = 0; perf.frames = 0;
}

/* =====================================================================
 * 6. 自测（?test=1）。模拟类用例不依赖 DOM，在 Node 里也能跑。
 * ===================================================================== */
const TESTS = [];
function defTest(name, fn) { TESTS.push({ name, fn }); }
function runSteps(n) { for (let k = 0; k < n; k++) simStep(); }

function tArena() {
  clearGrid(); setGravity('down'); seedRng(20240607);
  return { cx: W >> 1, cy: H >> 1 };
}

function tBox(x0, y0, x1, y1, m) {
  for (let x = x0; x <= x1; x++) { put(x + y0 * W, m, x, y0); put(x + y1 * W, m, x, y1); }
  for (let y = y0; y <= y1; y++) { put(x0 + y * W, m, x0, y); put(x1 + y * W, m, x1, y); }
}

function tFloor(y, m) { for (let x = 0; x < W; x++) put(x + y * W, m || GLASS, x, y); }

// 跑到条件成立为止；返回用了多少步，超时返回 -1
function tUntil(maxSteps, every, cond) {
  for (let s = 0; s < maxSteps; s++) {
    simStep();
    if (s % every === 0 && cond()) return s + 1;
  }
  return cond() ? maxSteps : -1;
}

/* ---- 6.1 反应矩阵里的每一条接触规则 ---- */
for (const r of RULES) {
  defTest('规则 ' + MATERIALS[r.a].name + ' × ' + MATERIALS[r.b].name, () => {
    const { cx, cy } = tArena();
    const x0 = cx - 4, x1 = cx + 3, y0 = cy - 3, y1 = cy + 2;
    tBox(x0, y0, x1, y1, GLASS);
    for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
      const i = x + y * W, top = y < y0 + 3;
      put(i, top ? r.a : r.b, x, y);
      if (top && r.maxT !== undefined) temp[i] = r.maxT - 3;
    }
    const a0 = countType(r.a), b0 = countType(r.b);
    const a20 = countType(r.a2), b20 = countType(r.b2);
    const cond = () =>
      (r.a2 !== r.a && r.a2 !== EMPTY && countType(r.a2) > a20) ||
      (r.b2 !== r.b && r.b2 !== EMPTY && countType(r.b2) > b20) ||
      (r.b2 === EMPTY && countType(r.b) < b0) ||
      (r.a2 === EMPTY && countType(r.a) < a0);
    const n = tUntil(Math.min(8000, Math.ceil(60 / r.p)), 2, cond);
    return { ok: n > 0, info: n > 0 ? n + ' 步出现产物' : '超时未出现产物' };
  });
}

defTest('四个重力方向：粉末下沉、气体反向、休止角一致', () => {
  const ratios = [], notes = [];
  let ok = true;
  for (const dir of ['down', 'up', 'left', 'right']) {
    clearGrid(); setGravity(dir); seedRng(99);
    const cx = W >> 1, cy = H >> 1;
    // 在重力下游 20 格处放一块金属板，沙落在板上堆成堆
    const px = cx + gx * 20, py = cy + gy * 20;
    for (let k = -45; k <= 45; k++) { const x = px + lx * k, y = py + ly * k; if (inb(x, y)) put(x + y * W, METAL, x, y); }
    fillRect(SAND, cx - 10, cy - 10, cx + 10, cy + 10);
    const sx = cx - gx * 16, sy = cy - gy * 16;
    fillCircle(SMOKE, sx, sy, 3);
    let moved = 0;
    for (let s = 0; s < 40; s++) simStep();
    // 烟的质心应该逆着重力移动
    let gsx = 0, gsy = 0, gn = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === SMOKE) { gsx += x; gsy += y; gn++; }
    if (gn > 0) moved = -((gsx / gn - sx) * gx + (gsy / gn - sy) * gy);
    runSteps(500);
    // 沙堆：沿重力方向的高度 vs 侧向宽度
    let hMax = 0, lMin = 1e9, lMax = -1e9, n = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (type[x + y * W] !== SAND) continue;
      n++;
      const dh = (px - x) * gx + (py - y) * gy, dl = (x - px) * lx + (y - py) * ly;
      if (dh > hMax) hMax = dh;
      if (dl < lMin) lMin = dl;
      if (dl > lMax) lMax = dl;
    }
    const ratio = (lMax - lMin + 1) / hMax;
    ratios.push(ratio);
    notes.push(dir + ' 宽高比 ' + ratio.toFixed(2) + ' 气体逆行 ' + moved.toFixed(1));
    if (n !== 441 || moved < 4 || hMax < 6) ok = false;
  }
  const mn = Math.min.apply(null, ratios), mx = Math.max.apply(null, ratios);
  if (mx / mn > 1.35 || mn < 1.2 || mx > 4.5) ok = false;
  setGravity('down');
  return { ok, info: notes.join('；') };
});

/* ---- 6.8 架构 ---- */
defTest('颜色种子跟着粒子走（移动时不闪）', () => {
  const { cx } = tArena();
  tFloor(H - 2, STONE);
  const i = cx + 5 * W;
  put(i, SAND, cx, 5); seed[i] = 177;
  runSteps(20);
  let found = -1;
  for (let k = 0; k < N; k++) if (type[k] === SAND) found = seed[k];
  return { ok: found === 177 && type[i] !== SAND, info: '下落后 seed = ' + found };
});

defTest('分块休眠：静止后活跃块归零，扰动后唤醒', () => {
  const { cx, cy } = tArena();
  tFloor(cy + 10, STONE);
  fillRect(SAND, cx - 8, cy - 5, cx + 8, cy + 5);
  runSteps(400);
  const asleep = perf.activeChunks;
  put(cx + (cy - 20) * W, SAND, cx, cy - 20);
  simStep(); simStep();
  const awake = perf.activeChunks;
  return { ok: asleep === 0 && awake > 0, info: '静止时 ' + asleep + ' 块，扰动后 ' + awake + ' 块' };
});

defTest('存档往返：导出 → 清空 → 导入，逐格一致', () => {
  const { cx, cy } = tArena();
  tFloor(cy + 12, STONE);
  const kinds = [SAND, WATER, WOOD, OIL, PLANT, METAL, ICE, SALT, GUNPOWDER, GLASS, LAVA, TNT];
  for (let y = cy - 10; y < cy + 12; y++) for (let x = cx - 30; x < cx + 30; x++) if (rnd() < 0.6) put(x + y * W, kinds[rndi(kinds.length)], x, y);
  runSteps(40);
  setGravity('left');
  const json1 = sceneToJSON(captureScene());
  const t0 = type.slice(), s0 = seed.slice(), l0 = life.slice(), f0 = flags.slice(), T0 = temp.slice();
  clearGrid(); setGravity('down');
  const empty = countType(EMPTY) === N;
  restoreScene(sceneFromJSON(json1));
  let diff = 0;
  for (let i = 0; i < N; i++) {
    if (type[i] !== t0[i]) { diff++; continue; }
    if (type[i] === 0) continue;
    if (seed[i] !== s0[i] || life[i] !== l0[i] || (flags[i] & F_SAVE) !== (f0[i] & F_SAVE) || Math.abs(temp[i] - T0[i]) > 0.51) diff++;
  }
  const json2 = sceneToJSON(captureScene());
  const ok = empty && diff === 0 && json1 === json2 && gravity === 'left';
  setGravity('down');
  return { ok, info: '差异 ' + diff + ' 格，JSON ' + (json1.length / 1024).toFixed(1) + ' KB，二次导出' + (json1 === json2 ? '完全相同' : '不同') };
});

// 同步跑完全部模拟用例（Node 用）
function runSimTestsSync(log) {
  let pass = 0;
  const results = [];
  for (const t of TESTS) {
    let r;
    try { r = t.fn(); } catch (e) { r = { ok: false, info: '异常：' + (e && e.stack || e) }; }
    results.push({ name: t.name, ok: r.ok, info: r.info });
    if (r.ok) pass++;
    if (log) log((r.ok ? '通过  ' : '失败  ') + t.name + ' — ' + r.info);
  }
  return { pass, total: TESTS.length, results };
}

/* ---------------------------------------------------------------------
 * 6.9 浏览器端：逐条跑用例并显示在页面角落，最后做性能测试
 * ------------------------------------------------------------------- */
function buildPerfScene() {
  clearGrid(); setGravity('down'); seedRng(4242);
  fillRect(STONE, 0, H - 3, W - 1, H - 1);
  const target = Math.min(50000, Math.floor(N * 0.6));
  const rows = Math.ceil(target / 2 / W);
  fillRect(SAND, 0, H - 3 - rows, W - 1, H - 4);
  fillRect(WATER, 0, H - 3 - rows * 2, W - 1, H - 4 - rows);
  let n = 0;
  for (let i = 0; i < N; i++) if (type[i] !== 0) n++;
  for (let k = 0; k < 10; k++) {                         // 10 个 TNT 埋在沙层里，依次点燃
    const x = Math.floor(W * (k + 0.5) / 10), y = H - 4 - (rows >> 1), i = x + y * W;
    put(i, TNT, x, y); flags[i] |= F_BURN; life[i] = 30 + k * 5;
  }
  return n;
}

function perfTest() {
  return new Promise(resolve => {
    const count = buildPerfScene();
    const frames = [];
    let booms = 0, lastBoomFrame = -1, firstBoomFrame = -1, last = performance.now();
    const prevBoom = onBoom;
    onBoom = (x, y, R, P) => { booms++; lastBoomFrame = frames.length; if (firstBoomFrame < 0) firstBoomFrame = frames.length; if (prevBoom) prevBoom(x, y, R, P); };
    // 驱动：正常走 rAF；如果 rAF 被降频（面板被遮挡等），30ms 后由 MessageChannel 兜底，
    // 它不受后台定时器节流影响。每帧固定 1 个模拟步 + 1 次渲染，统计的是这一帧的实际工作耗时。
    let rafFrames = 0, fallbackFrames = 0, token = 0;
    const ch = new MessageChannel();
    let armedAt = 0, armedToken = 0, pending = null;
    ch.port1.onmessage = () => {
      if (armedToken !== token || !pending) return;
      if (performance.now() - armedAt < 30) { ch.port2.postMessage(0); return; }
      const cb = pending; pending = null; token++; fallbackFrames++;
      cb(performance.now());
    };
    const nextFrame = cb => {
      const my = ++token;
      pending = cb; armedAt = performance.now(); armedToken = my;
      requestAnimationFrame(() => { if (token === my && pending) { pending = null; token++; rafFrames++; cb(performance.now()); } });
      ch.port2.postMessage(0);
    };
    function fr(now) {
      const dt = Math.min(100, now - last); last = now;
      const t0 = performance.now();
      simStep();
      renderFrame(now, 16.7);
      if (gl) gl.finish();                               // 把 GPU 时间也算进来
      const work = performance.now() - t0;
      frames.push({ dt, work, free: fpCount, chunks: perf.activeChunks });
      audioFrame();
      const n = frames.length;
      const done = (booms >= 10 && n - lastBoomFrame > 300) || n > 1500;
      if (!done) { nextFrame(fr); return; }
      onBoom = prevBoom;
      const during = frames.slice(Math.max(0, firstBoomFrame), lastBoomFrame + 24);
      const after = frames.slice(lastBoomFrame + 120);               // 最后一次爆炸 2 秒（120 步）之后
      const all = frames.slice(5);
      const avg = a => a.reduce((s, f) => s + f.work, 0) / Math.max(1, a.length);
      const maxW = a => a.reduce((m, f) => Math.max(m, f.work), 0);
      const v = all.map(f => f.dt).sort((p, q) => p - q);
      resolve({
        count, grid: W + 'x' + H, booms, frames: n, displayHz: 1000 / (v[v.length >> 1] || 16.7),
        throttled: fallbackFrames > rafFrames, rafFrames, fallbackFrames,
        avgWork: avg(all), duringAvg: avg(during), duringMax: maxW(during), duringFrames: during.length,
        duringMinFps: 1000 / Math.max(0.01, maxW(during)),
        afterAvg: avg(after), afterMax: maxW(after), afterFps: 1000 / Math.max(0.01, maxW(after)),
        peakFree: frames.reduce((m, f) => Math.max(m, f.free), 0), peakChunks: frames.reduce((m, f) => Math.max(m, f.chunks), 0),
      });
    }
    nextFrame(fr);
  });
}

async function runAllTests() {
  testRunning = true;
  const box = $('testbox');
  box.style.display = 'block';
  const rows = [];
  let pass = 0;
  const draw = extra => {
    box.innerHTML = '<h4>自测 ' + pass + ' / ' + rows.length + ' 通过' + (rows.length < TESTS.length ? '（进行中 ' + rows.length + '/' + TESTS.length + '）' : '') + '</h4>' +
      (extra || '') + rows.map(r => '<div class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '通过' : '失败') + '　' + r.name + ' <span class="dim">' + r.info + '</span></div>').join('');
  };
  for (const t of TESTS) {
    await new Promise(r => setTimeout(r, 0));
    let r;
    try { r = t.fn(); } catch (e) { r = { ok: false, info: '异常：' + e.message }; console.error(e); }
    rows.push({ name: t.name, ok: r.ok, info: r.info });
    if (r.ok) pass++;
    console.log((r.ok ? '通过' : '失败') + '  ' + t.name + ' — ' + r.info);
    sceneDirty = true; renderFrame(performance.now(), 16.7);
    draw();
  }
  fpClear(); exClear();
  const p = await perfTest();
  // 判定只看「每帧工作耗时」：爆炸期间最慢一帧 ≤ 22.2ms（≥45 FPS），结束 2 秒后最慢一帧 ≤ 16.7ms（60 FPS）
  const perfOk = p.duringMax <= 22.2 && p.afterMax <= 16.7 && p.booms === 10;
  rows.push({ name: '性能：' + p.count + ' 粒子 + 引爆 10 个 TNT（' + p.grid + '）', ok: perfOk,
    info: '爆炸期间最慢一帧 ' + p.duringMax.toFixed(1) + 'ms（折合最低 ' + p.duringMinFps.toFixed(0) + ' FPS），平均 ' + p.duringAvg.toFixed(1) +
          'ms；结束 2 秒后最慢 ' + p.afterMax.toFixed(1) + 'ms、平均 ' + p.afterAvg.toFixed(1) + 'ms；全程平均 ' + p.avgWork.toFixed(1) +
          'ms；飞行粒子峰值 ' + p.peakFree + '，活跃块峰值 ' + p.peakChunks + (p.throttled ? '；注意：本次 rAF 被浏览器降频，测试改由消息通道驱动' : '；rAF ' + p.displayHz.toFixed(0) + 'Hz') });
  if (perfOk) pass++;
  console.log((perfOk ? '通过' : '失败') + '  ' + rows[rows.length - 1].name + ' — ' + rows[rows.length - 1].info);
  const all = pass === rows.length;
  draw('<div class="' + (all ? 'ok' : 'bad') + '">' + (all ? '全部通过' : '有 ' + (rows.length - pass) + ' 项失败') + ' · 渲染 ' + renderMode + '</div>');
  console.log('自测结果：' + pass + '/' + rows.length + (all ? ' 全部通过' : ' 有失败'));
  window.__testResults = { pass, total: rows.length, rows, perf: p, renderMode };
  testRunning = false;
}

/* =====================================================================
 * 7. 主循环：固定 60Hz 模拟步长，与渲染帧率解耦
 * ===================================================================== */
let lastFrameT = 0, simAcc = 0, frameNo = 0, slowGpu = 0;
perf.frames = 0;

function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - lastFrameT;
  lastFrameT = now;
  if (dt > 0 && dt < 5000) hud.interval += (dt - hud.interval) * 0.15;     // 真实 rAF 间隔（不截断，用来识别降频）
  if (dt > 250 || dt <= 0) dt = 16.7;
  hud.frames++; perf.frames++;
  if (testRunning) { updateHud(now); return; }

  const t0 = performance.now();
  if (pointer.down && !pointer.line) stamp(pointer.x, pointer.y, pointer.erase);     // 按住不动也持续出料
  if (!paused) {
    const stepMs = 1000 / SIM_HZ, maxSteps = Math.max(2, Math.ceil(speed * 2));
    simAcc += Math.min(dt, 100) * speed;
    let n = 0;
    while (simAcc >= stepMs && n < maxSteps) { simStep(); simAcc -= stepMs; n++; }
    if (simAcc > stepMs * 2) simAcc = 0;               // 跟不上就丢步，不追帧
  } else if (stepOnce) simStep();
  stepOnce = false;

  renderFrame(now, Math.min(dt, 100));
  if (gl && frameNo % 30 === 0) {                      // 每 30 帧抽样一次真实 GPU 耗时
    const g0 = performance.now();
    gl.finish();
    perf.gpu += (performance.now() - g0 - perf.gpu) * 0.5;
    if (settings.hd && pixelRatio > 1 && perf.gpu > 13 && !document.hidden) {
      if (++slowGpu >= 6) {                            // GPU 持续吃紧：自动降到 1x 渲染
        settings.hd = false; slowGpu = 0;
        resizeRenderer();
        const boxes = $('settingList').querySelectorAll('input');
        if (boxes[9]) boxes[9].checked = false;
        toast('已自动关闭高清渲染以保持帧率');
      }
    } else slowGpu = 0;
  }
  frameNo++;
  hud.work += (performance.now() - t0 - hud.work) * 0.1;
  audioFrame();
  updateHud(now);
}

function main() {
  buildPalette();
  selectTool(SAND);
  createRenderer(viewport);
  onBoom = (x, y, R, P) => { fxBoom(x, y, R, P); audioBoom(P * R / 15); };
  fitGrid(true);
  buildControls(); bindPointer(); bindKeys(); bindResize();
  document.addEventListener('visibilitychange', () => { lastFrameT = performance.now(); simAcc = 0; });
  if (QS.has('test')) setTimeout(runAllTests, 400);
  else if (QS.has('scene')) loadScene(Math.max(0, Math.min(SCENES.length - 1, (+QS.get('scene') || 1) - 1)));
  else toast('左键绘制 · 右键擦除 · 「场景」里有 6 个预设');
  requestAnimationFrame(loop);
}
main();
