<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>粒子沙盘</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-strong: rgba(22, 22, 32, 0.82);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --text: #d8d8e4;
    --text-strong: #ffffff;
    --muted: #8a8aa2;
    --accent: #8fa8ff;
    --warn: #ffc14a;
    --danger: #ff5a5a;
    --ok: #5fd08a;
    --radius: 12px;
    --radius-sm: 8px;
    --pill: 999px;
    --gap: 8px;
    --gap-sm: 4px;
    --blur: blur(16px) saturate(140%);
    --side: 172px;
    --ctl-h: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 12.5px/1.35 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(90, 60, 200, 0.22), transparent 70%),
      radial-gradient(800px 380px at 92% -6%, rgba(255, 90, 30, 0.13), transparent 70%),
      var(--bg);
    -webkit-user-select: none; user-select: none;
  }
  #app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .glass { background: var(--panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  button, select, input { font: inherit; color: inherit; }
  button, select {
    height: var(--ctl-h); padding: 0 10px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); border-radius: var(--pill); background: var(--panel);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
  }
  select { padding: 0 6px; -webkit-appearance: none; appearance: none; text-align: center; }
  select option { background: #1a1a24; color: var(--text); }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.11); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { color: var(--text-strong); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px -2px var(--accent); }
  button.sq { width: var(--ctl-h); padding: 0; }
  button.danger { border-color: rgba(255, 90, 90, 0.5); color: #ff9c9c; background: rgba(255, 60, 60, 0.1); }
  button.danger:hover, button.danger.armed { background: rgba(255, 60, 60, 0.3); color: #fff; box-shadow: 0 0 14px -2px var(--danger); }
  button.warn { border-color: var(--warn); color: #ffd98a; box-shadow: 0 0 12px -3px var(--warn); }
  input[type=range] { accent-color: var(--accent); cursor: pointer; height: var(--ctl-h); }
  input[type=text] { height: var(--ctl-h); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(0, 0, 0, 0.3); min-width: 0; }

  /* ---------- 顶部控制条 ---------- */
  #topbar {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap);
    padding: 6px 10px; border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); z-index: 5;
  }
  .grp { display: flex; align-items: center; gap: var(--gap-sm); padding: 3px 5px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(255, 255, 255, 0.03); }
  .grp > .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; padding: 0 3px 0 5px; white-space: nowrap; }
  .grp .val { min-width: 1.8em; text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; padding-right: 4px; }
  #brand { font-weight: 650; color: var(--text-strong); letter-spacing: 0.04em; padding: 0 6px 0 2px; white-space: nowrap; }
  #brand small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  #rngSize { width: 86px; }
  #rngVol { width: 62px; }

  /* ---------- 左侧元素面板 ---------- */
  #palette { grid-row: 2; overflow-y: auto; padding: 8px; border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .cat { margin-bottom: 10px; }
  .cat h3 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 0 2px 5px; }
  .cat .items { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
  .el {
    --c1: #888; --c2: #aaa; --c3: #666;
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 5px; border-radius: var(--radius-sm);
    position: relative; overflow: hidden; text-align: left;
  }
  .el .sw {
    width: 16px; height: 16px; border-radius: 5px; flex: none;
    background: linear-gradient(115deg, var(--c1), var(--c2), var(--c3), var(--c1), var(--c2));
    background-size: 400% 100%; animation: swatch 3.2s linear infinite;
    box-shadow: 0 0 7px -1px var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .el.glow .sw { animation-duration: 1.3s; box-shadow: 0 0 10px 0 var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
  .el .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .el kbd { font: 10px ui-monospace, monospace; color: var(--muted); }
  .el.on { color: var(--text-strong); border-color: var(--c1); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 1px var(--c1), 0 0 14px -2px var(--c1); }
  @keyframes swatch { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .el .sw { animation: none; } }

  /* ---------- 画布区 ---------- */
  #stage { grid-row: 2; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  #viewport { position: relative; line-height: 0; }
  #canvas { display: block; background: var(--bg); cursor: none; touch-action: none; }
  #cursor { position: absolute; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); display: none; }
  #cursor.round { border-radius: 50%; }
  #cursor.spray { border-radius: 50%; border-style: dashed; }
  #lineprev { position: absolute; pointer-events: none; height: 0; border-top: 1px dashed rgba(255, 255, 255, 0.8); transform-origin: 0 0; display: none; }
  .float { position: absolute; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #debug { left: 10px; top: 10px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; display: none; pointer-events: none; color: #c8d4ff; }
  #testbox { right: 10px; top: 10px; width: min(460px, 70%); max-height: calc(100% - 20px); overflow: auto; display: none; font-size: 11.5px; line-height: 1.55; -webkit-user-select: text; user-select: text; }
  #testbox h4 { font-size: 13px; margin-bottom: 4px; color: var(--text-strong); }
  #testbox .ok { color: var(--ok); } #testbox .bad { color: var(--danger); } #testbox .dim { color: var(--muted); }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #recdot { right: 10px; bottom: 10px; display: none; color: #ff9c9c; font-variant-numeric: tabular-nums; }
  #recdot::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- 底部状态栏 ---------- */
  #status {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 4px 12px; font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--muted); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden;
  }
  #status b { color: var(--text-strong); font-weight: 600; }
  #stInspect { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .chip { padding: 1px 8px; border-radius: var(--pill); border: 1px solid var(--line); }
  .chip.warn { border-color: var(--warn); color: #ffd98a; }
  .chip.hide { display: none; }

  /* ---------- 弹层与提示 ---------- */
  .pop { position: fixed; z-index: 20; display: none; min-width: 220px; max-width: 320px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
  .pop.show { display: block; }
  .pop h4 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 2px 2px 8px; }
  .pop .col { display: flex; flex-direction: column; gap: var(--gap-sm); }
  .pop .row { display: flex; gap: var(--gap-sm); align-items: center; }
  .pop .row > * { flex: 1; }
  .pop button { border-radius: var(--radius-sm); text-align: left; }
  .pop button small { color: var(--muted); margin-left: 6px; }
  .pop label { display: flex; align-items: center; gap: 8px; height: 26px; cursor: pointer; }
  .pop label input { accent-color: var(--accent); }
  .pop .note { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; white-space: normal; }
  .slot { display: flex; gap: var(--gap-sm); align-items: center; }
  .slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .slot button { flex: none; text-align: center; }
  #tip { position: fixed; z-index: 30; display: none; width: 250px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); pointer-events: none; line-height: 1.55; }
  #tip h4 { font-size: 13px; color: var(--text-strong); margin-bottom: 2px; }
  #tip .sub { color: var(--muted); margin-bottom: 6px; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
  #tip dt { color: var(--muted); } #tip dd { color: var(--text); font-variant-numeric: tabular-nums; }
  #tip ul { list-style: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #tip li { color: var(--text); } #tip li::before { content: '· '; color: var(--muted); }

  /* 主菜单 / 模式（C0） */
  #menu { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(5, 5, 10, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #menu.show { display: flex; }
  #menu .box { width: min(440px, calc(100% - 32px)); padding: 16px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
  #menu h2 { font-size: 16px; color: var(--text-strong); margin-bottom: 10px; }
  #menuList { display: flex; flex-direction: column; gap: var(--gap); }
  #menuList button { height: auto; padding: 8px 12px; border-radius: var(--radius-sm); text-align: left; white-space: normal; display: flex; flex-direction: column; gap: 2px; }
  #menuList small { color: var(--muted); }
  #menu .foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  #modeOverlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; pointer-events: auto; }
  #modeOverlay h2 { font-size: 22px; color: var(--text-strong); }
  #modeOverlay .tag { padding: 2px 10px; border-radius: var(--pill); border: 1px solid var(--warn); color: #ffd98a; }
  #modeOverlay p { max-width: 420px; color: var(--muted); }
  body:not([data-mode="sandbox"]) #stModeHud { flex: 1; text-align: center; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  body:not([data-mode="sandbox"]) .sbx { display: none !important; }
  body:not([data-mode="sandbox"]) #palette > * { visibility: hidden; }

  @media (max-width: 760px) {
    :root { --side: 104px; --ctl-h: 26px; }
    .cat .items { grid-template-columns: 1fr; }
    #brand small, .grp > .lbl { display: none; }
    #topbar { gap: 5px; padding: 5px; }
    #rngSize { width: 60px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="glass">
    <span id="brand">粒子沙盘<small>v4.1 · C0</small></span>
    <button id="btnMenu" title="主菜单：切换模式（M）">菜单</button>
    <div class="grp sbx">
      <button id="btnPause" title="暂停 / 继续（空格）">❚❚ 暂停</button>
      <button id="btnStep" class="sq" title="单步（.）" aria-label="单步">▸|</button>
      <select id="selSpeed" title="模拟速度" aria-label="模拟速度">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
        <option value="2">2x</option><option value="4">4x</option>
      </select>
    </div>
    <div class="grp sbx" id="gravGrp">
      <span class="lbl">重力</span>
      <button class="sq" data-g="up" title="重力向上" aria-label="重力向上">↑</button>
      <button class="sq on" data-g="down" title="重力向下" aria-label="重力向下">↓</button>
      <button class="sq" data-g="left" title="重力向左" aria-label="重力向左">←</button>
      <button class="sq" data-g="right" title="重力向右" aria-label="重力向右">→</button>
    </div>
    <div class="grp sbx">
      <span class="lbl">笔刷</span>
      <button class="sq on" data-shape="circle" title="圆形" aria-label="圆形笔刷">●</button>
      <button class="sq" data-shape="square" title="方形" aria-label="方形笔刷">■</button>
      <button class="sq" data-shape="spray" title="喷雾（随机稀疏）" aria-label="喷雾笔刷">∴</button>
      <button id="btnMode" title="切换：只填空位 / 覆盖替换">填空</button>
      <input type="range" id="rngSize" min="1" max="30" value="4" aria-label="笔刷大小" title="笔刷大小（[ 和 ]）">
      <span class="val" id="lblSize">4</span>
    </div>
    <div class="grp sbx">
      <button id="btnView" title="切换视图（V）">视图：正常</button>
      <button id="btnUndo" title="撤销（Ctrl/Cmd+Z）">撤销</button>
      <button id="btnClear" class="danger" title="清空（C，需再按一次确认）">清空</button>
    </div>
    <div class="grp sbx">
      <button id="btnScenes" data-pop="popScenes">场景 ▾</button>
      <button id="btnSave" data-pop="popSave">存档 ▾</button>
      <button id="btnShot" title="保存 PNG 截图">截图</button>
      <select id="selRec" title="录制时长" aria-label="录制时长">
        <option value="5">5秒</option><option value="10" selected>10秒</option><option value="15">15秒</option><option value="30">30秒</option>
      </select>
      <button id="btnRec" title="录制 WebM 视频">录制</button>
    </div>
    <div class="grp">
      <button id="btnMute" title="静音">声音</button>
      <input type="range" id="rngVol" min="0" max="100" value="60" aria-label="总音量" title="总音量">
      <button id="btnEnv" class="sbx" data-pop="popEnv">环境 ▾</button>
      <button id="btnSettings" data-pop="popSettings">设置 ▾</button>
    </div>
  </header>

  <aside id="palette" class="glass" aria-label="元素面板"></aside>

  <main id="stage">
    <div id="viewport">
      <div id="cursor"></div>
      <div id="lineprev"></div>
    </div>
    <div id="debug" class="float"></div>
    <div id="testbox" class="float"></div>
    <div id="toast" class="float"></div>
    <div id="recdot" class="float">录制中</div>
    <div id="modeOverlay"><span class="tag">开发中</span><h2></h2><p></p><button id="btnModeExit">返回主菜单</button></div>
  </main>

  <footer id="status" class="glass">
    <span class="sbx">FPS <b id="stFps">--</b></span>
    <span class="sbx">模拟 <b id="stSim">--</b> 步/秒</span>
    <span id="stThrottle" class="chip warn hide" title="页面在后台、被遮挡或浏览器省电时，requestAnimationFrame 会被降频。这不是性能问题。">rAF 被降频</span>
    <span id="stInspect" class="sbx">—</span>
    <span id="stMode" class="chip"></span>
    <span class="sbx">粒子 <b id="stCount">0</b></span>
    <span id="stModeHud"></span>
  </footer>
</div>

<div id="popScenes" class="pop"><h4>预设场景</h4><div class="col" id="sceneList"></div></div>
<div id="popSave" class="pop">
  <h4>存档槽位（浏览器本地）</h4>
  <div class="row"><input type="text" id="slotName" placeholder="存档名称" maxlength="24"><button id="btnSlotSave" style="flex:none;text-align:center">保存</button></div>
  <div class="col" id="slotList" style="margin-top:8px"></div>
  <h4 style="margin-top:12px">文件</h4>
  <div class="row"><button id="btnExport" style="text-align:center">导出 JSON</button><button id="btnImport" style="text-align:center">导入 JSON</button></div>
  <h4 style="margin-top:12px">录制</h4>
  <div class="row"><button id="btnRecExport" style="text-align:center">导出录制</button><button id="btnPlayStop" style="text-align:center;display:none">停止回放</button></div>
  <div class="note">「导入 JSON」也能读录制文件：读进来就从头回放。</div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>
<div id="popSettings" class="pop">
  <h4>画质</h4>
  <div class="row">
    <select id="selQuality" aria-label="画质档位"><option value="low">低</option><option value="mid">中</option><option value="high" selected>高</option><option value="ultra">极致</option></select>
    <select id="selScale" aria-label="网格精度"><option value="2">每格 2 像素</option><option value="3" selected>每格 3 像素</option><option value="4">每格 4 像素</option></select>
  </div>
  <h4 style="margin-top:10px">画面效果</h4><div class="col" id="settingList"></div><div class="note" id="renderInfo"></div>
</div>
<div id="popEnv" class="pop">
  <h4>天气</h4>
  <div class="row" id="envWeather"></div>
  <h4 style="margin-top:10px">风</h4>
  <label>风向 <input type="range" id="envWind" min="-100" max="100" value="20" style="flex:1" aria-label="风向"></label>
  <label>风力 <input type="range" id="envPower" min="0" max="100" value="30" style="flex:1" aria-label="风力"></label>
  <h4 style="margin-top:10px">空气</h4>
  <label>湿度 <input type="range" id="envHumid" min="0" max="100" value="0" style="flex:1" aria-label="外来水汽"></label>
  <label>气温 <input type="range" id="envTemp" min="-20" max="45" value="20" style="flex:1" aria-label="气温"><span id="envTempVal" style="min-width:3.2em;text-align:right">20°C</span></label>
  <h4 style="margin-top:10px">时间</h4>
  <label>时刻 <input type="range" id="envTime" min="0" max="100" value="80" style="flex:1" aria-label="一天中的时刻"></label>
  <div class="row"><select id="envSpeed" aria-label="时间流速"><option value="0">时间暂停</option><option value="1" selected>1x（一天 10 分钟）</option><option value="10">10x</option><option value="60">60x</option></select></div>
  <label><input type="checkbox" id="envDayNight" checked>昼夜循环</label>
  <label><input type="checkbox" id="envStruct" checked>结构力学（悬空的固体会塌）</label>
  <div class="row" style="margin-top:6px"><button id="envBolt" style="text-align:center">召唤闪电</button></div>
</div>
<div id="tip"></div>
<div id="menu" role="dialog" aria-label="主菜单"><div class="box"><h2>选择模式</h2><div id="menuList"></div><div class="foot"><button id="btnMenuBack">继续当前模式（Esc）</button></div></div></div>

}

/* ---------------------------------------------------------------------
 * 2.9 电：带电格子列表逐帧向相邻导体传导（金属几乎无损，水每格衰减 6/255 ≈ 传 40 格）
 * ------------------------------------------------------------------- */
let elecCur = null, elecNext = null, elecCount = 0;

function addCharge(j, e) {
  if (charge[j] !== 0) return;
  if (elecCur === null || elecCur.length !== N) { elecCur = new Int32Array(N); elecNext = new Int32Array(N); elecCount = 0; }
  charge[j] = 6; chargeE[j] = e;
  elecCur[elecCount++] = j;
}

function stepElectric() {
  const cnt = elecCount;
  if (cnt === 0) return;
  let nn = 0;
  const cur = elecCur, next = elecNext;
  for (let q = 0; q < cnt; q++) {
    const i = cur[q];
    let c = charge[i];
    if (c === 0) continue;
    const t = type[i];
    if (!M_ELEC[t]) { charge[i] = 0; continue; }
    const x = i % W, y = (i / W) | 0;
    wake(x, y);
    if (c === 6) {                           // 刚带上电：这一帧向四周传
      st.elec++;
      const e = chargeE[i], loss = t === METAL || t === STEEL ? 1 : 6;
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const j = nx + ny * W, o = type[j];
        if (o === 0) continue;
        if (M_ELEC[o]) {
          if (e > loss && charge[j] === 0) {                 // 导体里必定导通；水里每格损耗大，传四十格左右就没了
            charge[j] = 6; chargeE[j] = e - loss; next[nn++] = j;
          }
        } else if (M_FLAM[o] > 0) { temp[j] += 300; wake(nx, ny); }
      }
    }
    c--;
    charge[i] = c;
    if (c > 0) next[nn++] = i;               // 余下几帧是不应期，防止电往回传
  }
  elecCur = next; elecNext = cur; elecCount = nn;
}

/* ---------------------------------------------------------------------
 * 1.1b 确定性数学：模拟里禁止用 Math.sin / cos / exp / pow / log / hypot
 *      （不同 JS 引擎的结果在最后几位可能不同）。这里只用 + - * / 和 Math.floor / sqrt / abs，
 *      这些在 IEEE 754 下每个引擎结果都一样。精度约 1e-7，模拟够用。渲染层不受这条限制。
 * ------------------------------------------------------------------- */
const TAU = 6.283185307179586, HALF_PI = 1.5707963267948966;
function dsin(x) {
  x -= Math.floor(x / TAU + 0.5) * TAU;              // 归到 [-π, π]
  if (x > HALF_PI) x = 3.141592653589793 - x;         // 再折到 [-π/2, π/2]
  else if (x < -HALF_PI) x = -3.141592653589793 - x;
  const x2 = x * x;
  return x * (1 + x2 * (-1 / 6 + x2 * (1 / 120 + x2 * (-1 / 5040 + x2 * (1 / 362880 + x2 * (-1 / 39916800))))));
}
function dcos(x) { return dsin(x + HALF_PI); }

// xorshift32：模拟里只用它，不用 Math.random。初始种子固定，由宿主（页面 / 测试）显式设置
let _rs = 0x2545f491;
function rngState() { return _rs; }
function setRngState(s) { _rs = (s | 0) || 1; }
function rnd() {
  _rs ^= _rs << 13; _rs ^= _rs >>> 17; _rs ^= _rs << 5;
  return (_rs >>> 0) * 2.3283064365386963e-10;
}
function rndi(n) { return (rnd() * n) | 0; }
function seedRng(s) { _rs = (s | 0) || 1; }

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */

/* =====================================================================

  const c = dcos(b.ang), s = dsin(b.ang), R = b.r, lw = b.lw, lh = b.lh, tag = b.id + 1;
  const x0 = Math.max(0, Math.floor(b.x - R)), x1 = Math.min(W - 1, Math.ceil(b.x + R));
  const y0 = Math.max(0, Math.floor(b.y - R)), y1 = Math.min(H - 1, Math.ceil(b.y + R));
  let n = 0, sub = 0, subD = 0;
  const stamp = b.stamp, cap = stamp.length;
  for (let wy = y0; wy <= y1; wy++) {
    // 这一行两侧（刚体外面）有没有液体：有的话这一行的格子算浸没。用来算浮力
    let rowDens = 0;
    for (let k = 0; k < 2 && rowDens === 0; k++) {
      const sx = k === 0 ? x0 - 1 : x1 + 1;
      if (sx < 0 || sx >= W) continue;
      const o = type[sx + wy * W];
      if (M_STATE[o] === S_LIQUID) rowDens = M_DENS[o];
    }
    for (let wx = x0; wx <= x1; wx++) {
      const dx = wx + 0.5 - b.x, dy = wy + 0.5 - b.y;
      const li = Math.floor(c * dx + s * dy + b.cx), lj = Math.floor(-s * dx + c * dy + b.cy);   // 逆映射回刚体自己的坐标
      if (li < 0 || li >= lw || lj < 0 || lj >= lh) continue;
      const l = li + lj * lw, t = b.lt[l];
      if (t === 0) continue;
      const j = wx + wy * W, o = type[j];
      if (o !== 0) {
        const so = M_STATE[o];
        if ((flags[j] & F_BODY) || so === S_SOLID) continue;
        if (so === S_LIQUID || so === S_POWDER) {      // 把占着位置的液体 / 粉末挤出去（水花、扬尘）
          if (fpCount < FP_MAX - 50) spawnFree(o, wx + 0.5, wy + 0.5, b.vx * 0.6 + (rnd() - 0.5) * 1.6 + dx * 0.04, b.vy * 0.3 - gy * (0.5 + rnd()) - gx * (0.5 + rnd()), temp[j], seed[j]);
          if (so === S_LIQUID && rnd() < 0.1) addRipple(wx, wy);
        }
      }
      type[j] = t; seed[j] = b.ls[l]; temp[j] = b.lT[l]; flags[j] = parity | F_BODY | b.lf[l];
      life[j] = tag; aux[j] = 200; wet[j] = 0; fuel[j] = 0; charge[j] = 0;
      if (rowDens > 0) { sub++; subD += rowDens; }
      if (n < cap) { stamp[n] = j; b.stampL[n] = l; n++; }
      if (b.lf[l] & F_BURN) flags[j] |= F_BURN;          // 引信已点着的炸药：照样闪
      wake(wx, wy);
    }
  }
  b.stampN = n; b.sub = sub / b.n; b.subDens = sub ? subD / sub : 0;
}

function unstampBody(b) {
  const stamp = b.stamp, tag = b.id + 1;
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if ((flags[j] & F_BODY) && life[j] === tag) { type[j] = 0; flags[j] = parity; life[j] = 0; aux[j] = 0; }
  }
  b.stampN = 0;
}

// 某个姿态下有多少格撞进了固体 / 粉末 / 画布之外；顺便算出接触点的重心。
// colStatic = 其中撞在静止物上的格数，colBody = 撞到的另一个刚体（没有则为 -1）
let colStatic = 0, colBody = -1;
function collide(b, X, Y, A) {
  const c = dcos(A), s = dsin(A), pts = b.pts;
  let n = 0, sx = 0, sy = 0, ns = 0, other = -1;
  for (let k = 0, m = b.n * 2; k < m; k += 2) {
    const px = pts[k], py = pts[k + 1];
    const wx = X + c * px - s * py, wy = Y + s * px + c * py;
    const ix = Math.floor(wx), iy = Math.floor(wy);
    let hit = false;
    if (ix < 0 || ix >= W || iy < 0 || iy >= H) { hit = true; ns++; }
    else {
      const j = ix + iy * W, o = type[j];
      if (o !== 0 && M_STATE[o] < S_LIQUID) { hit = true; if (flags[j] & F_BODY) other = life[j] - 1; else ns++; }
    }
    if (hit) { n++; sx += wx; sy += wy; }
  }
  if (n) { colX = sx / n; colY = sy / n; }
  colStatic = ns; colBody = other;
  return n;
}

// 卡死的碎块（被别的东西楔住、动不了，但按连接关系又算不上有支撑）冻结时打上「楔住」标记，当作锚。
// 下一次爆炸或用户动笔时统一清掉，重新评估。
let pinTick = -100;
function clearPins() {
  if (tick - pinTick < 30) return;
  pinTick = tick;
  for (let i = 0; i < N; i++) if (flags[i] & F_PIN) { flags[i] &= ~F_PIN; markStruct(i); }
}

function freezeBody(b, pin) {
  // 差不多摆正了的就对齐到 90° 的整数倍再盖章：这样是逐格精确的，不会因为旋转采样丢格子
  const q = Math.round(b.ang / 1.5708) * 1.5708;
  if (Math.abs(b.ang - q) < 0.3) {
    unstampBody(b);
    b.ang = q;
    for (let k = 0; k < 8 && collide(b, b.x, b.y, b.ang) > 0; k++) { b.x -= gx * 0.5; b.y -= gy * 0.5; }
    // 再顺着重力落回去，直到刚好贴住下面的东西（否则会悬着，被判成失去支撑，反复冻结 / 解冻）
    for (let k = 0; k < 16 && collide(b, b.x + gx * 0.5, b.y + gy * 0.5, b.ang) === 0; k++) { b.x += gx * 0.5; b.y += gy * 0.5; }
    stampBody(b);
  }
  const stamp = b.stamp, tag = b.id + 1;
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if ((flags[j] & F_BODY) && life[j] === tag) {
      flags[j] = (flags[j] & ~F_BODY) | (pin ? F_PIN : 0); life[j] = 0; aux[j] = 120; fuel[j] = initFuel(type[j]); markStructAround(j);
      if (b.lf[b.stampL[k]] & F_BURN) life[j] = fuseLeft(b, b.stampL[k]);   // 还在烧的引信：落地后接着烧
    }
  }
  bodies[b.id] = null; bodyCount--;
  structStats.frozen++;
}

function fractureBody(b, impact) {
  structStats.fractured++;
  // 撞击的震动把落点附近静止的刚性固体也震松
  const R = 9, ix = Math.round(colX), iy = Math.round(colY), dmgK = Math.min(2, impact) * 45;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const x = ix + dx, y = iy + dy;
    if (x < 0 || x >= W || y < 0 || y >= H || dx * dx + dy * dy > R * R) continue;
    const j = x + y * W, o = type[j];
    if (!M_RIGID[o] || M_HARD[o] > 1 || (flags[j] & F_BODY)) continue;
    const d = dmgK * (1 - Math.sqrt(dx * dx + dy * dy) / R) / M_BOND[o], a = aux[j], na = a > d ? a - d : 0;
    aux[j] = na;
    if ((a >= 70 && na < 70) || (a >= 91 && na < 91)) markStructAround(j);
  }
  fracVX = b.vx * 0.5; fracVY = b.vy * 0.5; fracTick = tick;
  const c = dcos(b.ang), s = dsin(b.ang);
  if (b.mat === GLASS || b.n < 24) {                   // 玻璃和小块：直接碎成渣
    for (let lj = 0; lj < b.lh; lj++) for (let li = 0; li < b.lw; li++) {
      const l = li + lj * b.lw, t = b.lt[l];
      if (!t || fpCount >= FP_MAX - 20) continue;
      const px = li + 0.5 - b.cx, py = lj + 0.5 - b.cy;
      if (M_BLAST[t] && (b.lf[l] & F_BURN)) {         // 引信在烧的炸药被摔碎：当场引爆
        const ex = Math.floor(b.x + c * px - s * py), ey = Math.floor(b.y + s * px + c * py);
        if (ex >= 0 && ex < W && ey >= 0 && ey < H) startExplosion(ex, ey, M_BLAST[t], M_BPOW[t]);
        continue;
      }
      spawnFree(t, b.x + c * px - s * py, b.y + s * px + c * py, b.vx * 0.5 + (rnd() - 0.5) * 2.6, b.vy * 0.3 + (rnd() - 0.5) * 2.6, b.lT[l], b.ls[l]);
    }
    bodies[b.id] = null; bodyCount--;
    return;
  }
  // 大块：盖回网格，沿穿过撞击点的一两条随机直线抠出裂缝，剩下的部分由支撑检测重新分成几个刚体
  stampBody(b);
  const stamp = b.stamp, tag = b.id + 1, cuts = 1 + (rnd() < 0.5 ? 1 : 0) + (b.n > 400 ? 1 : 0);
  const ca = [], sa = [];
  for (let k = 0; k < cuts; k++) { const a = rnd() * 3.1416; ca.push(dcos(a)); sa.push(dsin(a)); }
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if (!((flags[j] & F_BODY) && life[j] === tag)) continue;
    const x = j % W, y = (j / W) | 0;
    flags[j] &= ~F_BODY; life[j] = 0; aux[j] = 255; markStruct(j);
    let onCut = false;
    for (let q = 0; q < cuts; q++) if (Math.abs((x + 0.5 - colX) * sa[q] - (y + 0.5 - colY) * ca[q]) < 0.8) { onCut = true; break; }
    if (!onCut) continue;
    if (rnd() < 0.5) debrisCell(j, fracVX, fracVY);
    else {                                             // 扬起尘土
      type[j] = 0; flags[j] = parity; aux[j] = 0;
      put(j, SMOKE, x, y); seed[j] = 100 + rndi(50); life[j] = 30 + rndi(50);
    }
  }
  bodies[b.id] = null; bodyCount--;
  structCooldown = 0;
}

function bodyImpulse(id, ix, iy, px, py) {
  const b = bodies[id];
  if (!b) return;
  const k = 40 * M_DENS[b.mat] / 2600;
  ix *= k / 100; iy *= k / 100;
  b.vx += ix * 100 / b.mass; b.vy += iy * 100 / b.mass;
  b.om += ((px - b.x) * iy - (py - b.y) * ix) * 100 / b.I;
  b.rest = 0;
}

function stepBody(b) {
  b.age++;
  let g = 0.22;
  if (b.sub > 0) {                                     // 浮力：排开的液体密度 × 浸没比例，对比自身平均密度
    const ratio = b.subDens * b.sub / (b.mass / b.n);
    g *= 1 - (ratio > 1.8 ? 1.8 : ratio);
    b.vx *= 0.94; b.vy *= 0.94; b.om *= 0.92;
  }
  b.vx += gx * g; b.vy += gy * g;
  if (b.vx > 6) b.vx = 6; else if (b.vx < -6) b.vx = -6;
  if (b.vy > 6) b.vy = 6; else if (b.vy < -6) b.vy = -6;
  if (b.om > 0.18) b.om = 0.18; else if (b.om < -0.18) b.om = -0.18;
  const m = Math.max(Math.abs(b.vx), Math.abs(b.vy), Math.abs(b.om) * b.r);
  const n = m < 1 ? 1 : m > 8 ? 8 : Math.ceil(m);
  let resting = false, movedAny = false;
  for (let s = 0; s < n; s++) {
    const X = b.x + b.vx / n, Y = b.y + b.vy / n, A = b.ang + b.om / n;
    if (collide(b, X, Y, A) === 0) { b.x = X; b.y = Y; b.ang = A; movedAny = true; continue; }
    const other = colStatic === 0 && colBody >= 0 ? bodies[colBody] : null;
    if (other) {
      // 撞上的是另一个还在动的刚体：按质量把两者的速度拉平（一起往下掉），只有相对速度够大才算撞击
      const mt = b.mass + other.mass, rvx = b.vx - other.vx, rvy = b.vy - other.vy, rel = Math.sqrt(rvx * rvx + rvy * rvy);
      const vx = (b.vx * b.mass + other.vx * other.mass) / mt, vy = (b.vy * b.mass + other.vy * other.mass) / mt;
      b.vx = other.vx = vx; b.vy = other.vy = vy; b.om *= 0.8;
      if (rel > 0.9) { st.crash += rel * Math.min(400, b.n); if (onCrash) onCrash(colX, colY, rel, b.n); }
      if (rel > M_FRAC[b.mat] * 1.3 && b.n > 10) { fractureBody(b, rel); return; }
      break;
    }
    // 撞上静止物：对接触点施加冲量（会带来转动），再加一点摩擦
    let rx = colX - b.x, ry = colY - b.y;
    const rl = Math.sqrt(rx * rx + ry * ry);
    let nx, ny;
    if (rl < 0.6) { nx = -gx; ny = -gy; rx = 0; ry = 0; } else { nx = -rx / rl; ny = -ry / rl; }
    const vcx = b.vx - b.om * ry, vcy = b.vy + b.om * rx, vn = vcx * nx + vcy * ny;
    if (vn < 0) {
      const rn = rx * ny - ry * nx, j = -1.12 * vn / (1 / b.mass + rn * rn / b.I);
      b.vx += j * nx / b.mass; b.vy += j * ny / b.mass; b.om += rn * j / b.I;
    }
    b.vx *= 0.85; b.vy *= 0.85; b.om *= 0.6;
    const impact = -vn;
    // 接触点在侧面时上面的冲量抵不掉下落速度；只要正下方确实被静止物挡着，就把沿重力方向的速度清掉
    if (collide(b, b.x + gx * 0.5, b.y + gy * 0.5, b.ang) > 0 && colStatic > 0) {
      const along = b.vx * gx + b.vy * gy;
      if (along > 0) { b.vx -= gx * along; b.vy -= gy * along; }
      resting = true;
    }
    if (impact > 0.9) { st.crash += impact * Math.min(400, b.n); if (onCrash) onCrash(colX, colY, impact, b.n); }
    if (impact > M_FRAC[b.mat] && b.n > 10) { fractureBody(b, impact); return; }
    break;
  }
  stampBody(b);
  if (b.blast > 0 && stepFuses(b)) return;
  if (resting && Math.abs(b.vx) + Math.abs(b.vy) < 0.45 && Math.abs(b.om) < 0.05) b.rest++;
  else b.rest = 0;
  b.stuck = movedAny ? 0 : (b.stuck || 0) + 1;         // 卡在别的碎块里一动不动：一段时间后就地冻结
  let wedged = b.stuck > 24;
  if (b.age % 90 === 0) {                              // 每 1.5 秒看一次：几乎没挪窝也算卡住（浸在液体里漂着的不算）
    if (b.age > 90 && b.sub === 0 && (b.x - b.sx) * (b.x - b.sx) + (b.y - b.sy) * (b.y - b.sy) < 2.25) wedged = true;
    b.sx = b.x; b.sy = b.y;
  }
  if (b.rest > 10) freezeBody(b, false);
  else if (wedged || b.age > 2400) freezeBody(b, b.sub === 0);
}

/* ---- 刚体里的炸药：下落途中被火、熔岩、余烬或爆炸波及，照样点着、照样炸 ---- */
function fuseLeft(b, l) {
  for (const f of b.fuses) if (f[0] === l) return f[1] > 1 ? f[1] : 1;
  return 1;
}

// 点着刚体里第 l 格（局部坐标）的炸药，引信 t 步
function lightBodyCell(b, l, t) {
  if (b.lf[l] & F_BURN) { for (const f of b.fuses) if (f[0] === l && f[1] > t) f[1] = t; return; }
  b.lf[l] |= F_BURN;
  b.fuses.push([l, t]);
}

// 世界里第 j 格是刚体 id 盖的章：点着它对应的那格炸药
function lightBodyAt(j, t) {
  const b = bodies[life[j] - 1];
  if (!b) return;
  for (let k = 0; k < b.stampN; k++) if (b.stamp[k] === j) { const l = b.stampL[k]; if (M_BLAST[b.lt[l]]) lightBodyCell(b, l, t); return; }
}

// 每步：检查刚体里的炸药有没有挨着火，推进引信，到点就炸。返回 true 表示这个刚体已经没了
function stepFuses(b) {
  const stamp = b.stamp, sl = b.stampL;
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k], l = sl[k], t = b.lt[l];
    if (!M_BLAST[t] || (b.lf[l] & F_BURN)) continue;
    const x = j % W, y = (j / W) | 0;
    for (let d = 0; d < 4; d++) {
      const nx = x + DX4[d], ny = y + DY4[d];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const n = nx + ny * W, o = type[n];
      if ((flags[n] & F_BODY) && life[n] === b.id + 1) continue;
      if (o === FIRE || o === LAVA || o === EMBER || (o !== 0 && (flags[n] & F_BURN) && !(flags[n] & F_BODY))) { lightBodyCell(b, l, M_BURNTIME[t]); break; }
    }
  }
  if (b.fuses.length === 0) return false;
  const c = dcos(b.ang), s = dsin(b.ang);
  let boom = false;
  for (let q = b.fuses.length - 1; q >= 0; q--) {
    const f = b.fuses[q];
    if (--f[1] > 0) continue;
    const l = f[0], t = b.lt[l];
    b.fuses.splice(q, 1);
    if (!M_BLAST[t]) continue;
    const li = l % b.lw, lj = (l / b.lw) | 0, px = li + 0.5 - b.cx, py = lj + 0.5 - b.cy;
    const wx = Math.floor(b.x + c * px - s * py), wy = Math.floor(b.y + s * px + c * py);
    b.lt[l] = 0; b.lf[l] &= ~F_BURN; b.blast--;
    if (wx >= 0 && wx < W && wy >= 0 && wy < H) {
      const j = wx + wy * W;
      if ((flags[j] & F_BODY) && life[j] === b.id + 1) { type[j] = 0; flags[j] = parity; life[j] = 0; aux[j] = 0; }
      startExplosion(wx, wy, M_BLAST[t], M_BPOW[t]);
      boom = true;
    }
  }
  return boom && !bodies[b.id];
}

let bodyOrder = [];
function stepStructure() {
  if (bodyCount > 0) {
    // 先算靠重力下游的（下面的先落，上面的才有地方落）
    bodyOrder.length = 0;
    for (let k = 0; k < BODY_MAX; k++) if (bodies[k]) bodyOrder.push(bodies[k]);
    bodyOrder.sort((p, q) => (q.x * gx + q.y * gy) - (p.x * gx + p.y * gy));
    // 先把所有刚体的章都擦掉，再按顺序逐个移动、盖章：后动的只会撞上已经就位的，互相咬合的碎块不会死锁
    for (let k = 0; k < bodyOrder.length; k++) unstampBody(bodyOrder[k]);
    for (let k = 0; k < bodyOrder.length; k++) { const b = bodyOrder[k]; if (bodies[b.id] === b) stepBody(b); }
  }
  if (!env.structure) {
    if (bodyCount > 0) for (let k = 0; k < BODY_MAX; k++) { const b = bodies[k]; if (b) freezeBody(b, false); }
    return;
  }
  if ((tick % 300) === 0) clearPins();                    // 「楔住」的标记每 300 步失效一次，重新评估（真卡住的会再被标上）
  // 大规模坍塌时碎块互相撞来撞去，局部标记可能漏掉被连带削弱的地方：坍塌进行中每 120 步、
  // 以及所有碎块都静止下来的那一刻，各做一次全图兜底检测。平时只做局部检测
  if (bodyCount > 0) { structSettle = true; if ((tick % 120) === 0) markStructAll(); }
  else if (structSettle) { structSettle = false; markStructAll(); }
  if (structDirty && !structHold && --structCooldown <= 0) {
    structDirty = false; structCooldown = bodyCount > 8 ? 6 : 3;      // 正在大规模坍塌时少查几次
    if (structFull || sdCount > (N >> 4)) checkStructure();         // 换了重力方向、或者一次变动太多：全图检测
    else checkLocal();
  }
}

// 新开一局：上一局留下的结构力学状态全部清掉
function resetStructState() {
  pinTick = -100; fracTick = -100; structCooldown = 0; structHold = false;
  structSettle = false; fracVX = 0; fracVY = 0; clearStructDirty(); markStructAll();
}

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */
function structureSave() { return { stMark, stQueue, structDirty, structCooldown, structHold, bodies, bodyCount, colX, colY, fracVX, fracVY, fracTick, structStats, sdList, sdSeen, sdCount, structFull, structSettle, stBuf, stGrp, colStatic, colBody, pinTick, bodyOrder }; }
function structureLoad(s) { ({ stMark, stQueue, structDirty, structCooldown, structHold, bodies, bodyCount, colX, colY, fracVX, fracVY, fracTick, structStats, sdList, sdSeen, sdCount, structFull, structSettle, stBuf, stGrp, colStatic, colBody, pinTick, bodyOrder } = s); }
function structureSet(name, v) {
  switch (name) {
    case 'stMark': stMark = v; break;
    case 'stQueue': stQueue = v; break;
    case 'structDirty': structDirty = v; break;
    case 'structCooldown': structCooldown = v; break;
    case 'structHold': structHold = v; break;
    case 'bodies': bodies = v; break;
    case 'bodyCount': bodyCount = v; break;
    case 'colX': colX = v; break;
    case 'colY': colY = v; break;
    case 'fracVX': fracVX = v; break;
    case 'fracVY': fracVY = v; break;
    case 'fracTick': fracTick = v; break;
    case 'structStats': structStats = v; break;
    case 'sdList': sdList = v; break;
    case 'sdSeen': sdSeen = v; break;
    case 'sdCount': sdCount = v; break;
    case 'structFull': structFull = v; break;
    case 'structSettle': structSettle = v; break;
    case 'stBuf': stBuf = v; break;
    case 'stGrp': stGrp = v; break;
    case 'colStatic': colStatic = v; break;
    case 'colBody': colBody = v; break;
    case 'pinTick': pinTick = v; break;
    case 'bodyOrder': bodyOrder = v; break;
    default: throw new Error('structure.js 没有可写的状态 ' + name);
  }
}

/* ==== src/engine/explosion.js ==== */

/* ---------------------------------------------------------------------
 * 2.7 爆炸：从爆心放出一圈射线，分 3 帧由内向外推进。
 *     每条射线带能量，随距离衰减；碰到硬度低于能量的材料就炸碎并继续，
 *     碰到更硬的就被挡住 → 石头和金属后面是安全的，弹坑边缘天然不规则。
 *     冲击波还会震松范围内刚性固体的连接（完整度下降），给刚体一个冲量。
 * ------------------------------------------------------------------- */
const EX_MAX = 48, EX_RAYS = 200;
let exA = new Uint8Array(EX_MAX), exX = new Float32Array(EX_MAX), exY = new Float32Array(EX_MAX),
      exR = new Float32Array(EX_MAX), exP = new Float32Array(EX_MAX), exCur = new Float32Array(EX_MAX),
      exN = new Uint16Array(EX_MAX), exPhase = new Float32Array(EX_MAX),
      exRays = new Float32Array(EX_MAX * EX_RAYS);
let exActive = 0;

// 整个池子归零（死槽位里的旧数据虽然不影响模拟，但会进哈希，必须清干净）
function exClear() { exA.fill(0); exX.fill(0); exY.fill(0); exR.fill(0); exP.fill(0); exCur.fill(0); exN.fill(0); exPhase.fill(0); exRays.fill(0); exActive = 0; }

function startExplosion(x, y, R, P) {
  noteBoom(x, y, R, P);
  let k = -1;
  for (let q = 0; q < EX_MAX; q++) if (!exA[q]) { k = q; break; }
  if (k < 0) {                               // 池满：把进度最靠前的那个立刻算完，腾出位置
    let bv = -1;
    for (let q = 0; q < EX_MAX; q++) { const v = exCur[q] / exR[q]; if (v > bv) { bv = v; k = q; } }
    while (exA[k]) stepExplosion(k);
  }
  exA[k] = 1; exActive++;
  exX[k] = x; exY[k] = y; exR[k] = R; exP[k] = P; exCur[k] = 0;
  const n = Math.min(EX_RAYS, Math.ceil(6.2832 * R * 1.5));
  exN[k] = n; exPhase[k] = rnd() * 6.2832;
  for (let r = 0; r < n; r++) exRays[k * EX_RAYS + r] = P * (0.65 + rnd() * 0.7);
  // 震松连接：范围内的刚性固体完整度下降，越近、连接系数越小降得越多
  const RR = Math.ceil(R * 1.15);
  for (let dy = -RR; dy <= RR; dy++) for (let dx = -RR; dx <= RR; dx++) {
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    const j = px + py * W, o = type[j];
    if (o === 0) continue;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > RR) continue;
    if (M_BLAST[o] > 0) {                              // 殉爆：范围内的炸药不管有没有被挡住都会被引爆，时间按距离错开
      if (flags[j] & F_BODY) lightBodyAt(j, 3 + ((d * 0.5) | 0) + rndi(9));
      else if (!(flags[j] & F_BURN)) { flags[j] |= F_BURN; life[j] = 3 + ((d * 0.5) | 0) + rndi(9); wake(px, py); noteIgnite(px, py); }
      continue;
    }
    if (!M_RIGID[o] || M_HARD[o] > 1) continue;
    const dmg = (1 - d / RR) * 110 * P / M_BOND[o];
    const a = aux[j], na = a > dmg ? a - dmg : 0;
    aux[j] = na;
    if ((a >= 70 && na < 70) || (a >= 91 && na < 91)) markStructAround(j);     // 只有跨过连接阈值的格子才会改变支撑关系
  }
  clearPins();
  st.boom++;
  if (onBoom) onBoom(x, y, R, P);
}

function stepExplosion(k) {
  const cx = exX[k], cy = exY[k], R = exR[k], P = exP[k], n = exN[k], base = k * EX_RAYS, ph = exPhase[k];
  const r0 = exCur[k], r1 = Math.min(R, r0 + Math.max(1.5, R / 3));
  const fall = P / R * 0.6;
  for (let r = 0; r < n; r++) {
    let e = exRays[base + r];
    if (e <= 0) continue;
    const a = ph + r / n * 6.2832, dx = dcos(a), dy = dsin(a);
    let lastJ = -1;
    for (let d = r0 < 0.8 ? 0.8 : r0; d < r1; d += 0.6) {
      const px = Math.round(cx + dx * d), py = Math.round(cy + dy * d);
      if (px < 0 || px >= W || py < 0 || py >= H) { e = 0; break; }
      e -= fall;
      if (e <= 0) break;
      const j = px + py * W;
      if (j === lastJ) continue;
      lastJ = j;
      const o = type[j];
      const Tn = temp[j] + e * 140;                  // 瞬间升温，封顶 850°C：能点燃东西，但不至于熔穿石墙、烧软钢梁
      temp[j] = Tn > 850 ? (temp[j] > 850 ? temp[j] : 850) : Tn;
      if (o === 0) {
        const q = rnd();
        if (q < 0.05 * e) { put(j, SMOKE, px, py); seed[j] = 90 + rndi(60); }
        else if (q < 0.05 * e + 0.012) {
          const sp = 1 + e * 4;
          spawnFree(EMBER, px + 0.5, py + 0.5, dx * sp + rnd() - 0.5, dy * sp + rnd() - 0.5, 650, rndi(256));
        } else wake(px, py);
        continue;
      }
      if (flags[j] & F_BODY) {                       // 打在刚体上：推它一把；里面的炸药被引爆
        if (M_BLAST[o]) lightBodyAt(j, 3 + ((d * 0.4) | 0) + rndi(9));
        bodyImpulse(life[j] - 1, dx * e * 2600, dy * e * 2600, px, py);
        e -= 0.3;
        continue;
      }
      if (M_BLAST[o] > 0) {                          // 连锁：错开引爆时间，不在同一帧全炸
        const fz = 3 + ((d * 0.4) | 0) + rndi(9);
        if (!(flags[j] & F_BURN)) { flags[j] |= F_BURN; life[j] = fz; noteIgnite(px, py); }
        else if (life[j] > fz + 6) life[j] = fz;
        e -= 0.03; wake(px, py);
        continue;
      }
      const h = M_HARD[o];
      if (e > h) {                                   // 炸碎
        const so = M_STATE[o], q = rnd();
        if (so < S_GAS && q < 0.6) {                 // 变成飞行粒子抛出去
          const sp = (1.2 + e * 4.5) * (0.6 + rnd() * 0.8);
          spawnFree(o, px + 0.5, py + 0.5, dx * sp - gx * 1.2 * e + rnd() - 0.5, dy * sp - gy * 1.2 * e + rnd() - 0.5,
                    temp[j] > 400 ? 400 : temp[j], seed[j]);
          clearCell(j, px, py);
        } else if (so < S_GAS && q < 0.75) {
          put(j, q < 0.68 ? FIRE : SMOKE, px, py);
        } else clearCell(j, px, py);
        e -= h * 0.6 + 0.01;
      } else {                                       // 挡住了：熏黑
        if (h <= 1) flags[j] |= F_SCORCH;
        wake(px, py);
        e = 0;
        break;
      }
    }
    exRays[base + r] = e;
  }
  exCur[k] = r1;
  if (r1 >= R) { exA[k] = 0; exActive--; }
}

function stepExplosions() {
  if (exActive === 0) return;
  for (let k = 0; k < EX_MAX; k++) if (exA[k]) stepExplosion(k);
}

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */
function explosionSave() { return { exA, exX, exY, exR, exP, exCur, exN, exPhase, exRays, exActive }; }
function explosionLoad(s) { ({ exA, exX, exY, exR, exP, exCur, exN, exPhase, exRays, exActive } = s); }
function explosionSet(name, v) {
  switch (name) {
    case 'exA': exA = v; break;
    case 'exX': exX = v; break;
    case 'exY': exY = v; break;
    case 'exR': exR = v; break;
    case 'exP': exP = v; break;
    case 'exCur': exCur = v; break;
    case 'exN': exN = v; break;
    case 'exPhase': exPhase = v; break;
    case 'exRays': exRays = v; break;
    case 'exActive': exActive = v; break;
    default: throw new Error('explosion.js 没有可写的状态 ' + name);
  }
}

/* ==== src/engine/weather.js ==== */

/* =====================================================================
 * 2w. 天气与环境（都算在 1/8 分辨率的粗网格上，每格 8x8 个粒子格）
 *   风场    = 全局风（越高越大，带阵风）+ 热对流（空气被吸向更热的一侧 → 大火自己招风）
 *   湿度场  = 水面蒸发、晾干、蒸腾、蒸汽冷却放出的水汽；会上升、被风吹、扩散
 *   云      = 水汽超过饱和量（越高、越冷饱和量越小）的部分；够厚就降水，每一滴都从云里扣掉
 *   闪电    = 雷暴时厚云积累电荷，到阈值后沿分形折线劈向「最高 + 最导电」的地方
 *   昼夜    = 太阳高度决定光照、气温（±4°C）、蒸发速度和植物能不能长
 * ===================================================================== */
const RAIN_THR = 2.0;
let GW = 1, GH = 1;
let windX = new Float32Array(1), heatC = new Float32Array(1);
let vapor = new Float32Array(1), vaporB = new Float32Array(1), cloud = new Float32Array(1), cloudB = new Float32Array(1);
let solidC = new Float32Array(1);   // 每个粗格里被固体 / 粉末 / 液体占住的比例：挡水汽、挡风
let windShade = new Float32Array(1); // 上风方向有障碍物挡着的程度（0 = 开阔，1 = 完全挡住）
let solidRow = 0;
let lastBolt = null;       // 最近一次闪电（渲染用来整屏闪一下）

function allocWeather() {
  GW = Math.ceil(W / 8); GH = Math.ceil(H / 8);
  const n = GW * GH;
  windX = new Float32Array(n); heatC = new Float32Array(n);
  vapor = new Float32Array(n); vaporB = new Float32Array(n); cloud = new Float32Array(n); cloudB = new Float32Array(n);
  solidC = new Float32Array(n); windShade = new Float32Array(n); solidRow = 0;
}

function clearWeather() { windX.fill(0); heatC.fill(0); vapor.fill(0); cloud.fill(0); solidC.fill(0); windShade.fill(0); solidRow = 0; env.atmos = 0; }

// 每次只重算四分之一的粗格行（每 16 步全部刷新一遍）
function refreshSolid() {
  for (let cy = solidRow; cy < GH; cy += 4) {
    const y0 = cy << 3, y1 = Math.min(H, y0 + 8);
    for (let cx = 0; cx < GW; cx++) {
      const x0 = cx << 3, x1 = Math.min(W, x0 + 8);
      let n = 0;
      for (let y = y0; y < y1; y++) for (let x = x0, i = y * W + x0; x < x1; x++, i++) { const o = type[i]; if (o !== 0 && M_STATE[o] < S_GAS) n++; }
      solidC[cx + cy * GW] = n / ((x1 - x0) * (y1 - y0));
    }
  }
  solidRow = (solidRow + 1) & 3;
}

function vaporAdd(x, y, amount) { vapor[(x >> 3) + (y >> 3) * GW] += amount; }

function weatherWater() {
  let s = 0;
  for (let c = 0, n = GW * GH; c < n; c++) s += vapor[c] + cloud[c];
  return s;
}

function updateSun() {
  if (!env.dayNight) { env.el = 1; env.sun = 1; env.ambient = env.temp; return; }
  const el = dsin((env.time - 0.25) * 6.2832);
  env.el = el;
  env.sun = el > 0 ? Math.min(1, el * 1.6) : 0;
  env.ambient = env.temp + el * 4 - 1;
}

function altitudeOf(cy) { return gy > 0 ? 1 - (cy + 0.5) / GH : gy < 0 ? (cy + 0.5) / GH : 0.5; }

function spawnPrecip(cx, cy, alt) {
  const x = Math.min(W - 1, (cx << 3) + rndi(8)), y = Math.min(H - 1, gy < 0 ? (cy << 3) : (cy << 3) + 7);
  const i = x + y * W;
  if (type[i] !== 0) return false;
  if (env.ambient - alt * 6 <= 0.5) { put(i, SNOW, x, y); env.snowCount++; }
  else { put(i, WATER, x, y); temp[i] = Math.max(1, Math.min(env.ambient, 15)); env.rainCount++; }
  st.rain++; WL.precip++;
  return true;
}

function stepVapor() {
  const n = GW * GH, amb = env.ambient;
  let tf = 1 + (amb - 20) / 40;
  tf = tf < 0.3 ? 0.3 : tf > 2 ? 2 : tf;
  refreshSolid();
  vaporB.fill(0); cloudB.fill(0);
  const upOff = gy > 0 ? -GW : gy < 0 ? GW : 0;
  // 天气是「有预算的源」：每分钟最多注入 moistPerMin 格水（按 400 格宽的画面折算），
  // 大气里已有的水汽 + 云越接近容量 atmosCap（每个粗格列），注入越少；到容量就停
  let topCells = 0;
  for (let cy = 0; cy < GH; cy++) if (altitudeOf(cy) > 0.8) topCells += GW;
  let inject = 0;
  if (env.moistPerMin > 0 && topCells > 0) {
    const room = 1 - env.atmos / (env.atmosCap * GW);
    if (room > 0) inject = env.moistPerMin / 900 * (W / 400) * room / topCells;
  }
  let atmos = 0;
  for (let cy = 0; cy < GH; cy++) {
    const alt = altitudeOf(cy), lo = 1 - alt, sat = (0.35 + 5.6 * lo * Math.sqrt(lo)) * tf;
    for (let cx = 0; cx < GW; cx++) {
      const c = cx + cy * GW;
      let v = vapor[c], cl = cloud[c];
      if (v > sat) { const d = (v - sat) * 0.25; v -= d; cl += d; WL.condense += d; }                      // 过饱和 → 凝成云
      else if (cl > 0 && v < sat * 0.6) { const d = Math.min(cl, (sat * 0.6 - v) * 0.03); cl -= d; v += d; WL.cloudEvap += d; }   // 太干 → 云散
      if (alt > 0.8) {                                                                 // 高空：天气预设的外部输入 / 输出
        if (inject > 0) { v += inject; env.waterIn += inject; WL.weatherIn += inject; }
        if (env.cloudFade > 0) { const d = cl * env.cloudFade + v * env.cloudFade; cl -= cl * env.cloudFade; v -= v * env.cloudFade; env.waterOut += d; WL.cloudFade += d; }
      }
      // 云够厚就降水：超过一半阈值开始零星落雨，超过阈值越厚下得越急；每一滴都从云里扣掉
      if (cl > RAIN_THR * 0.5 && rnd() < Math.min(0.6, (cl - RAIN_THR * 0.5) * 0.06 + (cl > RAIN_THR ? (cl - RAIN_THR) * 0.2 : 0))) { if (spawnPrecip(cx, cy, alt)) cl -= 1; }
      if (env.storm > 0 && cl > RAIN_THR * 0.8) env.charge += env.storm * 0.0006 * cl;
      if (v < 1e-6) v = 0;
      if (cl < 1e-6) cl = 0;
      atmos += v + cl;
      // 输运：水汽上升 + 随风 + 扩散；云只随风和少量扩散。往哪个粗格走，都要按那个粗格的空隙比例打折（水汽不穿墙）
      const w = windX[c], aw = w < 0 ? -w : w, fw = aw * 0.15 > 0.3 ? 0.3 : aw * 0.15;
      const side = w > 0 ? (cx < GW - 1 ? c + 1 : -1) : (cx > 0 ? c - 1 : -1);
      const up = upOff !== 0 && c + upOff >= 0 && c + upOff < n ? c + upOff : -1;
      const openHere = 1 - solidC[c];
      let keep = v;
      if (up >= 0) { const d = v * 0.08 * (1 - solidC[up]) * openHere; vaporB[up] += d; keep -= d; }
      if (side >= 0) { const d = v * fw * (1 - solidC[side]) * openHere; vaporB[side] += d; keep -= d; }
      const dv = v * 0.02 * openHere;
      if (cx > 0) { const d = dv * (1 - solidC[c - 1]); vaporB[c - 1] += d; keep -= d; }
      if (cx < GW - 1) { const d = dv * (1 - solidC[c + 1]); vaporB[c + 1] += d; keep -= d; }
      if (cy > 0) { const d = dv * (1 - solidC[c - GW]); vaporB[c - GW] += d; keep -= d; }
      if (cy < GH - 1) { const d = dv * (1 - solidC[c + GW]); vaporB[c + GW] += d; keep -= d; }
      vaporB[c] += keep;
      let keepC = cl;
      if (side >= 0) { const d = cl * fw * 0.7 * (1 - solidC[side]); cloudB[side] += d; keepC -= d; }
      const dc = cl * 0.008;
      if (cx > 0) { const d = dc * (1 - solidC[c - 1]); cloudB[c - 1] += d; keepC -= d; }
      if (cx < GW - 1) { const d = dc * (1 - solidC[c + 1]); cloudB[c + 1] += d; keepC -= d; }
      cloudB[c] += keepC;
    }
  }
  env.atmos = atmos;
  let t = vapor; vapor = vaporB; vaporB = t;
  t = cloud; cloud = cloudB; cloudB = t;
  if (env.charge > 1) { env.charge = 0; lightning(); }
}

function stepWeather() {
  if (env.dayNight && env.timeScale > 0) { env.time += env.timeScale / DAY_STEPS; if (env.time >= 1) env.time -= 1; }
  updateSun();
  const ph = tick & 3, n = GW * GH;
  // 每步抽样 1/4 的粗格，估计它比环境热多少
  for (let c = ph; c < n; c += 4) {
    const x = ((c % GW) << 3) + rndi(8), y = (((c / GW) | 0) << 3) + rndi(8);
    if (x >= W || y >= H) continue;
    let ex = temp[x + y * W] - env.ambient;
    ex = ex < 0 ? 0 : ex > 900 ? 900 : ex;
    heatC[c] += (ex - heatC[c]) * 0.2;
  }
  if (ph === 0) {
    const gust = dsin(tick * 0.004), pw = env.windPower;
    for (let cy = 0; cy < GH; cy++) {
      const alt = altitudeOf(cy);
      const base = env.wind * pw * 1.4 * (0.5 + 0.7 * alt) + dsin(tick * 0.011 + cy * 0.7) * 0.1 * pw + gust * 0.08 * pw;
      // 风影：从上风一侧扫过去，碰到固体就被挡住，挡住的程度往下风方向每个粗格衰减一成半。墙后面形成一片风影区，
      // 墙顶上面那几行照样有风（风从建筑上面绕过去）
      const dir = base >= 0 ? 1 : -1;
      let sh = 0;
      for (let k = 0; k < GW; k++) {
        const cx = dir > 0 ? k : GW - 1 - k, c = cx + cy * GW;
        const blk = solidC[c] * 2 > 1 ? 1 : solidC[c] * 2;      // 半个粗格被墙占住就基本挡死了
        sh = blk > sh * 0.85 ? blk : sh * 0.85;
        windShade[c] = sh;
        let d = ((cx < GW - 1 ? heatC[c + 1] : 0) - (cx > 0 ? heatC[c - 1] : 0)) * 0.003;   // 往热的一侧吸
        d = d > 0.6 ? 0.6 : d < -0.6 ? -0.6 : d;
        windX[c] += (base * (1 - sh) + d - windX[c]) * 0.15;
      }
    }
  } else if (ph === 2) stepVapor();
}

/* ---- 闪电 ---- */
function boltPath(x0, y0, x1, y1, disp, out) {
  if (disp < 1.5) { out.push(x1, y1); return; }
  const mx = (x0 + x1) / 2 + (rnd() - 0.5) * disp, my = (y0 + y1) / 2 + (rnd() - 0.5) * disp * 0.35;
  boltPath(x0, y0, mx, my, disp / 2, out);
  boltPath(mx, my, x1, y1, disp / 2, out);
}

function drawBolt(pts) {
  for (let k = 0; k + 3 < pts.length; k += 2) {
    const x0 = pts[k], y0 = pts[k + 1], x1 = pts[k + 2], y1 = pts[k + 3];
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for (let s = 0; s <= n; s++) {
      const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
      if (!inb(x, y)) continue;
      const j = x + y * W;
      if (type[j] !== 0 && M_STATE[type[j]] !== S_GAS) continue;
      put(j, SPARK, x, y);
      flags[j] &= ~F_TIP; life[j] = 5 + rndi(5);
    }
  }
}

// tx 给了就是「召唤闪电」：劈向这一列附近；不给就由云自己找目标
function lightning(tx) {
  const manual = tx !== undefined;
  let best = -1, bv = 0;
  for (let c = 0, n = GW * GH; c < n; c++) {
    if (cloud[c] < 0.3) continue;
    const v = cloud[c] + rnd() * 0.3 - (manual ? Math.abs(((c % GW) << 3) - tx) * 0.02 : 0);
    if (v > bv) { bv = v; best = c; }
  }
  let sx, sy;
  if (best >= 0) {                                    // 从这片云的云底起劈：顺着这一列往下找到云的最下沿
    let c = best;
    while (c + GW < GW * GH && cloud[c + GW] >= 0.3) c += GW;
    sx = ((c % GW) << 3) + 4; sy = Math.min(H - 2, (((c / GW) | 0) << 3) + 7);
  }
  else { sx = manual ? tx + rndi(21) - 10 : rndi(W); sy = 1; }
  if (!manual) tx = sx + rndi(41) - 20;
  const span = manual ? 5 : 40;
  // 选落点：越高越好，导体加分（金属 > 水），离云太远扣分
  let bx = -1, by = H - 1, bs = -1e9;
  for (let x = Math.max(0, tx - span); x <= Math.min(W - 1, tx + span); x++) {
    let y = Math.min(H - 1, sy + 1), o = 0;
    for (; y < H; y++) { o = type[x + y * W]; if (o !== 0 && M_STATE[o] < S_GAS) break; }
    if (y >= H) { y = H - 1; o = 0; }
    const score = (H - y) + (M_ELEC[o] ? (o === WATER || o === SALTWATER ? 12 : 45) : 0) - Math.abs(x - sx) * 0.4 + rnd() * 6;
    if (score > bs) { bs = score; bx = x; by = y; }
  }
  if (bx < 0) return;
  const pts = [sx, sy];
  boltPath(sx, sy, bx, by - 1, Math.min(28, Math.abs(by - sy) * 0.35 + 4), pts);
  drawBolt(pts);
  for (let b = 0; b < 3; b++) {                        // 分叉
    const k = (2 + rndi(Math.max(1, (pts.length >> 1) - 4))) << 1;
    if (k + 1 >= pts.length) continue;
    const ex = pts[k] + (rnd() - 0.5) * 40, ey = pts[k + 1] + 8 + rnd() * 22, br = [pts[k], pts[k + 1]];
    boltPath(pts[k], pts[k + 1], ex, ey, 10, br);
    drawBolt(br);
  }
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {   // 落点：高温 + 给导体注入电荷
    const x = bx + dx, y = by + dy;
    if (!inb(x, y) || dx * dx + dy * dy > 5) continue;
    const j = x + y * W;
    temp[j] = Math.min(1100, temp[j] + 1500);          // 封顶 1100°C：点得着树，但熔不了石头
    if (M_ELEC[type[j]]) addCharge(j, 255);
    wake(x, y);
  }
  env.strikes++;
  lastBolt = { x: bx, y: by, sx, sy, tick };
  noteBolt(bx, by, sx, sy);
  if (onThunder) onThunder(bx, by);
}

// 雷声延迟：按落点到「听者」（画面底边中点）的距离算，越远越晚
function thunderDelay(x, y) { const dx = x - W / 2, dy = y - (H - 1); return 0.15 + Math.sqrt(dx * dx + dy * dy) / W * 2.2; }

// moistPerMin：每分钟最多注入多少格水（按 400 格宽的画面折算）；atmosCap：每个粗格列的大气含水容量，到了就停止注入
const WEATHER_PRESETS = {

function setWeather(key) {
  const p = WEATHER_PRESETS[key];
  if (!p) return;
  env.weather = key; env.moistPerMin = p.moistPerMin; env.atmosCap = p.atmosCap; env.cloudFade = p.cloudFade; env.storm = p.storm; env.windPower = p.windPower;

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */

/* ==== src/engine/grid.js ==== */

const CHUNK = 32;          // 分块边长
const WAKE_TTL = 3;        // 被唤醒后至少再模拟几帧
const SIM_HZ = 60;

/* ---------------------------------------------------------------------
 * 1.5 网格与分块
 * ------------------------------------------------------------------- */
const F_PAR = 1, F_BURN = 2, F_SCORCH = 4, F_TIP = 8, F_BODY = 16, F_PIN = 32, F_FALL = 0xC0;   // flags 位
const F_SAVE = F_BURN | F_SCORCH | F_TIP;
const STALE_MAX = 200;     // 空气浑浊度到这个值就不够支持燃烧了

let W = 0, H = 0, N = 0;
let type, seed, flags, charge, chargeE, life, temp;
let wet;                   // 含水量（非空格）
let aux;                   // 空气格：浑浊度（缺氧程度）；刚性固体：结构完整度；土：养分
let fuel;                  // 可燃格剩余燃料（帧）
let CW = 0, CHN = 0, chunkTTL, chunkCount;
let parity = 0, tick = 0;
let gravity = 'down', gx = 0, gy = 1, lx = 1, ly = 0;
let gridEpoch = 0;         // 网格被整体重建 / 清空 / 唤醒的次数：渲染层看到它变了就整张重传

function allocGrid(w, h) {
  W = w; H = h; N = w * h;
  type = new Uint8Array(N); seed = new Uint8Array(N); flags = new Uint8Array(N);
  charge = new Uint8Array(N); chargeE = new Uint8Array(N);
  wet = new Uint8Array(N); aux = new Uint8Array(N); fuel = new Uint16Array(N);
  life = new Uint16Array(N); temp = new Float32Array(N).fill(env.temp);
  CW = Math.ceil(w / CHUNK); CHN = Math.ceil(h / CHUNK);
  chunkTTL = new Uint8Array(CW * CHN); chunkCount = new Uint16Array(CW * CHN);
  electricSet('elecCount', 0); fpClear(); exClear(); bodiesClear(); allocStruct(); allocWeather();
  wakeAll();
}

function clearGrid() {
  type.fill(0); seed.fill(0); flags.fill(0); charge.fill(0); chargeE.fill(0); life.fill(0); temp.fill(env.temp);
  wet.fill(0); aux.fill(0); fuel.fill(0);
  electricSet('elecCount', 0); fpClear(); exClear(); bodiesClear(); clearWeather();
  env.waterIn = env.waterOut = env.waterSink = 0; env.rainCount = env.snowCount = env.strikes = 0; env.charge = 0;
  ledgerReset();
  ripples.fill(0); rippleHead = 0; weatherSet('lastBolt', null);      // 渲染用的涟漪和闪电记录也清掉
  markStructAll();
  wakeAll();
}

function wakeAll() { chunkTTL.fill(WAKE_TTL); gridEpoch++; }

function inb(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }

function wake(x, y) {
  const cx = x >> 5, cy = y >> 5, c = cx + cy * CW, ax = x & 31, ay = y & 31;
  chunkTTL[c] = WAKE_TTL;
  if (ax === 0) { if (cx > 0) chunkTTL[c - 1] = WAKE_TTL; }
  else if (ax === 31) { if (cx < CW - 1) chunkTTL[c + 1] = WAKE_TTL; }
  if (ay === 0) { if (cy > 0) chunkTTL[c - CW] = WAKE_TTL; }
  else if (ay === 31) { if (cy < CHN - 1) chunkTTL[c + CW] = WAKE_TTL; }
}

function initLife(t) {
  const a = M_LIFE0[t];
  return a ? a + rndi(M_LIFE1[t] - a + 1) : 0;
}

// 燃料量：爆炸物的 burnTime 是引信（放在 life 里），其余可燃物是能烧多少帧
function initFuel(t) {
  const bt = M_BURNTIME[t];
  return bt && !M_BLAST[t] ? Math.max(1, (bt * (0.7 + rnd() * 0.6)) | 0) : 0;
}

// 新生成一个粒子（笔刷、克隆、喷发等）
function put(i, t, x, y) {
  const old = type[i];
  noteMat(t);
  type[i] = t; seed[i] = rndi(256); temp[i] = M_SPAWN[t];
  life[i] = t === PLANT ? rndi(150) : initLife(t);      // 植物的 life 是年龄：起始年龄随机，免得整片同时老死
  flags[i] = parity | (t === SPARK ? F_TIP : 0); charge[i] = 0;
  wet[i] = t === PLANT ? 60 : 0; fuel[i] = initFuel(t);
  aux[i] = M_RIGID[t] ? 255 : t === SOIL ? 200 : (AIRLIKE[t] && AIRLIKE[old]) ? aux[i] : 0;   // 火焰和烟继承所在空气格的浑浊度
  if (M_RIGID[t] | M_RIGID[old]) markStructAround(i);
  wake(x, y);
}

// 清成空气，保留该格温度
function clearCell(i, x, y) {
  const old = type[i];
  type[i] = 0; life[i] = 0; flags[i] = parity; charge[i] = 0; wet[i] = 0; fuel[i] = 0;
  if (!AIRLIKE[old]) aux[i] = 0;                     // 火焰 / 烟消失后，这格空气的浑浊度留着
  if (M_RIGID[old]) markStructAround(i);
  wake(x, y);
}

// 原地变成另一种材料，保留 seed、温度和含水量
function morph(i, t, x, y) {
  if (t === EMPTY) { clearCell(i, x, y); return; }
  const o = type[i];
  noteMat(t);
  type[i] = t; life[i] = initLife(t); flags[i] = (flags[i] & F_SCORCH) | parity;
  fuel[i] = initFuel(t);
  aux[i] = M_RIGID[t] ? (M_RIGID[o] ? aux[i] >> 1 : 255) : t === SOIL ? 255 : (AIRLIKE[t] && AIRLIKE[o]) ? aux[i] : 0;
  if (wet[i] > M_ABSORB[t]) wet[i] = M_ABSORB[t];
  if (M_RIGID[t] | M_RIGID[o]) markStructAround(i);
  wake(x, y);
}

function swapCells(i, j, x, y, nx, ny) {
  let a = type[i]; type[i] = type[j]; type[j] = a;
  a = seed[i]; seed[i] = seed[j]; seed[j] = a;
  a = life[i]; life[i] = life[j]; life[j] = a;
  a = wet[i]; wet[i] = wet[j]; wet[j] = a;
  a = aux[i]; aux[i] = aux[j]; aux[j] = a;
  a = fuel[i]; fuel[i] = fuel[j]; fuel[j] = a;
  const fi = flags[i], fj = flags[j];
  flags[i] = (fj & ~F_PAR) | parity; flags[j] = (fi & ~F_PAR) | parity;
  const tf = temp[i]; temp[i] = temp[j]; temp[j] = tf;
  wake(x, y); wake(nx, ny);
}

function setGravity(dir) {
  gravity = dir;
  if (dir === 'down') { gx = 0; gy = 1; lx = 1; ly = 0; }
  else if (dir === 'up') { gx = 0; gy = -1; lx = 1; ly = 0; }
  else if (dir === 'left') { gx = -1; gy = 0; lx = 0; ly = 1; }
  else { gx = 1; gy = 0; lx = 0; ly = 1; }
  if (sdList.length === N && N > 0) markStructAll();
  if (chunkTTL) wakeAll();
}

// 涟漪事件（只给渲染用）：最近 8 次有东西砸进液面的位置
let ripples = new Float32Array(8 * 3);
let rippleHead = 0;
function addRipple(x, y) {
  const o = rippleHead * 3;
  ripples[o] = x; ripples[o + 1] = y; ripples[o + 2] = tick;
  rippleHead = (rippleHead + 1) & 7;
}

/* =====================================================================
 * 2. 模拟
 * ===================================================================== */
const DX4 = [1, -1, 0, 0], DY4 = [0, 0, 1, -1];
const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];

// 每个模拟步开头调用：翻转「本步已处理」的奇偶位，步数加一
function advanceTick() { parity ^= 1; tick++; }

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */
function gridSave() { return { W, H, N, type, seed, flags, charge, chargeE, life, temp, wet, aux, fuel, CW, CHN, chunkTTL, chunkCount, parity, tick, gravity, gx, gy, lx, ly, gridEpoch, ripples, rippleHead }; }
function gridLoad(s) { ({ W, H, N, type, seed, flags, charge, chargeE, life, temp, wet, aux, fuel, CW, CHN, chunkTTL, chunkCount, parity, tick, gravity, gx, gy, lx, ly, gridEpoch, ripples, rippleHead } = s); }
function gridSet(name, v) {
  switch (name) {
    case 'W': W = v; break;
    case 'H': H = v; break;
    case 'N': N = v; break;
    case 'type': type = v; break;
    case 'seed': seed = v; break;
    case 'flags': flags = v; break;
    case 'charge': charge = v; break;
    case 'chargeE': chargeE = v; break;
    case 'life': life = v; break;
    case 'temp': temp = v; break;
    case 'wet': wet = v; break;
    case 'aux': aux = v; break;
    case 'fuel': fuel = v; break;
    case 'CW': CW = v; break;
    case 'CHN': CHN = v; break;
    case 'chunkTTL': chunkTTL = v; break;
    case 'chunkCount': chunkCount = v; break;
    case 'parity': parity = v; break;
    case 'tick': tick = v; break;
    case 'gravity': gravity = v; break;
    case 'gx': gx = v; break;
    case 'gy': gy = v; break;
    case 'lx': lx = v; break;
    case 'ly': ly = v; break;
    case 'gridEpoch': gridEpoch = v; break;
    case 'ripples': ripples = v; break;
    case 'rippleHead': rippleHead = v; break;
    default: throw new Error('grid.js 没有可写的状态 ' + name);
  }

/* ==== src/engine/rules.js ==== */

/* ---------------------------------------------------------------------
 * 1.3 反应矩阵（规则的唯一来源）
 *
 * 【接触反应】行 = 主动方，列 = 被接触方；格式「主动方变成 + 对方变成 (每帧每邻格概率)」
 *
 *            │ 熔岩                         │ 火 / 余烬            │ 盐           │ 冰                    │ 石头/砖/混凝土
 *  ──────────┼──────────────────────────────┼──────────────────────┼──────────────┼───────────────────────┼───────────────
 *  水        │ 蒸汽 + 熔岩降温260°C (.3)    │ 水升温 + 火熄灭 (1)  │ 盐水+空(.04) │ 冰+冰(.002，过冷水<-1°C) │ —
 *  盐水      │ 蒸汽 + 熔岩降温260°C (.3)    │ 盐水升温 + 火熄灭(1) │ —            │ 盐水+水 (.012)        │ —
 *  盐        │ —                            │ —                    │ —            │ 空+盐水 (.03)         │ —
 *  酸液      │ 火+熔岩 (1)                  │ —                    │ 溶解 (.02)   │ 溶解 (.02)            │ 溶解 (.0015~.004)
 *
 *  · 酸液 × 可溶物（沙、土、盐、火药、灰、种子、木头、植物、花、炭、冰、TNT、绳子、枯枝）：溶解 (.02)；
 *    每次溶解酸液自身有 50% 被消耗，所以一份酸能溶掉的东西是有限的。玻璃、金属、钢、锚点、克隆体、黑洞不溶。
 *  · 水 × 熔岩不再把整格熔岩瞬间变成石头：熔岩只是被吸走热量，降到 850°C 以下才凝固 → 先结表面硬壳。
 *  · 水 × 火：火焰不再 1:1 吃掉水，水只是升温（烧开了才变蒸汽）。
 *
 * 【含水量】（每格一个 wet 值，100 = 一格水）
 *    水碰到吸水材料（沙、土、木头、植物、灰、火药、种子、炭、绳子、枯枝）：对方变湿，水按量减少（守恒）。
 *    湿的东西超过 100°C 先烘干（吸热、放出水汽），烘干之前点不着 → 泼过水的地方是防火带。
 *    湿的东西暴露在空气里慢慢晾干，水分进入空气湿度场。
 *
 * 【燃烧】燃料 + 热量 + 氧气，缺一个就灭
 *    燃料：每个可燃格有 fuel，烧一帧减一，熄灭时不回补，烧完变成炭 / 灰。
 *    热量：贴着水的燃烧格每帧被吸走 150°C，降到燃点以下即熄灭，留下焦黑、潮湿的残骸并冒白烟。
 *    氧气：燃烧要消耗相邻空气格的氧（空气格的 aux = 浑浊度），浑浊度在空气里扩散；
 *          四周没有空气、或空气已经耗尽的火会闷熄。密闭空间里的火会自己把氧气烧光。
 *    木头(300°C) → 火 + 炭 → 炭(380°C)阴燃 → 灰        植物(230°C)/花/种子/枯枝(170°C)/绳子 → 火 + 灰
 *    油(220°C) → 大火 + 烟；油火遇水：水瞬间汽化，把燃烧的油崩成飞溅的火滴
 *    火药(170°C，受潮不燃) → 2 帧后小爆炸      TNT(240°C) → 60 帧引信后爆炸
 *
 * 【温度相变】
 *    冰 <──<0°C 且放够潜热──── 水（结冰时温度钉在 0°C，冰层下面的水要很久才冻上）
 *    冰 ──>0°C 且吸够潜热──> 水 ──>100°C──> 蒸汽 ──<85°C──> 水汽（湿度场）──高空饱和──> 云 ──> 雨 / 雪
 *    雪 ──>0.5°C 且吸够潜热──> 水      蒸汽碰到 <50°C 的固体表面 → 直接凝成水珠
 *    盐水 ──>104°C──> 蒸汽     盐水 ──<-18°C──> 冰
 *    沙 ──>1450°C──> 玻璃      石头 ──>1250°C──> 熔岩 ──<850°C──> 石头
 *
 * 【植物】种子(湿土+光+空间) → 幼苗 → 成株(受株高基因限制) → 开花 → 落种 → 老化 → 枯枝 → 腐烂成土
 *    生长每格消耗 0.14 格水（从茎里的水分或根部的湿土 / 水里取），没水、没光、太挤都不长。
 *
 * 【其他】
 *    电火花 / 带电导体 × 可燃物：给对方加热 250~300°C      电火花 × 金属 / 钢 / 水 / 盐水：注入电荷
 *    克隆体、黑洞：非物理元素，是场景的外部输入 / 输出
 * ------------------------------------------------------------------- */
const ACID_SOLUBLE = [SAND, SOIL, SALT, GUNPOWDER, ASH, SEED, WOOD, PLANT, FLOWER, CHARCOAL, ICE, TNT, ROPE, DEADPLANT];

// { a, b, p, a2, b2, use(主动方被消耗概率), maxT(主动方温度上限), aT/bT(产物温度), aDT/bDT(温度变化), tag }

  { a: SALT, b: ICE, p: 0.03, a2: EMPTY, b2: SALTWATER, bT: 1 },
  { a: SALTWATER, b: ICE, p: 0.012, a2: SALTWATER, b2: WATER, bT: 1 },
