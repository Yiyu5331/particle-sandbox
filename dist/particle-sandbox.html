/* =====================================================================
 * 沙盘模式：v4 的完整玩法。界面在 ui.js；这里把它接到模式接口上。
 * 世界在离开模式时不销毁，回来接着玩。
 * ===================================================================== */

let built = false, kept = null;

const sandboxModeDef = {
  id: 'sandbox', name: '沙盘', desc: '自由放材料、10 个预设场景、天气、结构力学、存档、录制与回放',
  create() { return createSandbox(); },
};

function createSandbox() {
  let ctx = null, unsubPause = null, frameT0 = 0, frameNo = 0, slowGpu = 0;
  return {
    id: 'sandbox', name: '沙盘',
    init(c, params) {
      ctx = c;
      let w = kept;
      if (!w || params.fresh) {
        if (w) w.dispose();
        const stage = $('stage');
        const gw = Math.max(48, Math.floor(stage.clientWidth / CELL)), gh = Math.max(48, Math.floor(stage.clientHeight / CELL));
        // 这一局的种子：地址栏 ?seed= 指定，否则随机。种子 + 录制下来的命令 = 能逐格复现的一局
        const seed = params.seed !== undefined ? params.seed : QS.has('seed') ? (+QS.get('seed') | 0) : ((Math.random() * 2147483647) | 0) || 1;
        w = c.createWorld({ width: gw, height: gh, seed });
        w.setFxHooks({
          onBoom: (x, y, R, P) => { fxBoom(x, y, R, P); audioBoom(P * R / 15); },
          onThunder: (x, y) => { fxThunder(); audioThunder(thunderDelay(x, y)); },      // 先闪后响，离得越远响得越晚
        });
        w.setProfiler(() => performance.now());           // 只给调试面板计时用，模拟本身不读时钟
        kept = w;
      }
      setUIWorld(w);
      c.setWorld(w);
      if (!built) { buildPalette(); selectTool(SAND); buildControls(); buildEnvPanel(); bindPointer(); bindKeys(); bindResize(); built = true; }
      setUIActive(true);
      syncGravityUI(); syncEnvUI(); syncPauseUI();
      unsubPause = c.bus.on('pause', syncPauseUI);
      if (params.scene !== undefined) loadScene(params.scene);
    },
    frameTiming(dt) {
      if (dt > 0 && dt < 5000) hud.interval += (dt - hud.interval) * 0.15;
      hud.frames++; V.perf.frames++;
    },
    preFrame() {
      frameT0 = performance.now();
      if (pointer.down && !pointer.line) stamp(pointer.x, pointer.y, pointer.erase);     // 按住不动也持续出料
    },
    beforeStep() { playbackTick(); },                    // 回放录制：把这一步该执行的命令喂进去
    update() {},
    onEvent() {},
    postRender() {
      const perf = V.perf;
      if (gl && frameNo % 30 === 0) {                    // 每 30 帧抽样一次真实 GPU 耗时
        const g0 = performance.now();
        gl.finish();
        perf.gpu += (performance.now() - g0 - perf.gpu) * 0.5;
        if (settings.hd && pixelRatio > 1 && perf.gpu > 13 && !document.hidden) {
          if (++slowGpu >= 6) {                          // GPU 持续吃紧：自动降到 1x 渲染
            settings.hd = false; slowGpu = 0;
            resizeRenderer();
            if (settingBoxes.hd) settingBoxes.hd.checked = false;
            toast('已自动关闭高清渲染以保持帧率');
          }
        } else slowGpu = 0;
      }
      frameNo++;
      hud.work += (performance.now() - frameT0 - hud.work) * 0.1;
    },
    postFrame(now) { updateHud(now); },
    getHUD() { return null; },
    checkOutcome() { return OUTCOME_PLAYING; },
    serialize() { return { world: world.serialize() }; },
    deserialize(o) { if (o && o.world) world.deserialize(o.world); syncGravityUI(); syncEnvUI(); },
    dispose() {
      if (unsubPause) unsubPause();
      stopPlayback(false);
      closePops();
      pointer.down = false; pointer.inside = false; pointer.hx = -1;
      setUIActive(false);
    },
  };
}

// 黄金快照比对：Node（tools/test.mjs、tools/golden.mjs）和浏览器（?golden=1）共用
function goldenCompare(maxStep, data) {
  const G = data || loadGoldenNode();
  const keepW = W, keepH = H;
  const rows = [];
  let ok = 0, bad = 0;
  for (const r of G.replays) {
    const h = replay(G.recs[r.file]);
    if (h === r.hash) ok++; else bad++;
    rows.push((h === r.hash ? '✓ ' : '✗ ') + r.name + ' ' + h + (h === r.hash ? '' : ' ≠ ' + r.hash));
  }
  for (const sc of G.scenes) {
    allocGrid(GOLDEN_W, GOLDEN_H);
    resetWorld(sc.seed);
    const keepRec = cmdRecording; commandsSet('cmdRecording', false);
    buildScene(sc.index);
    commandsSet('cmdRecording', keepRec);
    let s = 0;
    for (const target of GOLDEN_STEPS) {
      if (target > maxStep) break;
      while (s < target) { simStep(); s++; }
      const h = worldHash();
      if (h === sc.hashes[target]) ok++; else { bad++; rows.push('✗ ' + sc.name + ' 第 ' + target + ' 步：' + h + ' ≠ ' + sc.hashes[target]); }
    }
  }
  if (keepW > 0) allocGrid(keepW, keepH);
  return { ok, bad, rows };
}

// Node 下从 tests/golden.json 和 tests/replays/ 读；浏览器里由构建脚本把同样的数据嵌进页面（GOLDEN_DATA）
function loadGoldenNode() {
  if (typeof GOLDEN_DATA !== 'undefined') return GOLDEN_DATA;
  const fs = globalThis.process.getBuiltinModule('node:fs'), path = globalThis.process.getBuiltinModule('node:path');
  const dir = path.join(path.dirname(globalThis.__SRC_DIR), '..', 'tests');
  const g = JSON.parse(fs.readFileSync(path.join(dir, 'golden.json'), 'utf8'));
  g.recs = {};
  for (const r of g.replays) g.recs[r.file] = JSON.parse(fs.readFileSync(path.join(dir, r.file), 'utf8'));
  return g;
}

const TESTS = [];

function tArena() {

  if (tArenaHook !== null) tArenaHook();                   // 浏览器里：前面用例的爆炸留下的闪白、震动、冲击波也清掉

function tBox(x0, y0, x1, y1, m) {
  for (let x = x0; x <= x1; x++) { put(x + y0 * W, m, x, y0); put(x + y1 * W, m, x, y1); }
  for (let y = y0; y <= y1; y++) { put(x0 + y * W, m, x0, y); put(x1 + y * W, m, x1, y); }
}

function tFloor(y, m) { for (let x = 0; x < W; x++) put(x + y * W, m || GLASS, x, y); }

// 跑到条件成立为止；返回用了多少步，超时返回 -1
function tUntil(maxSteps, every, cond) {
  for (let s = 0; s < maxSteps; s++) {
    simStep();
    if (s % every === 0 && cond()) return s + 1;
  }
  return cond() ? maxSteps : -1;
}

// 同步跑完全部模拟用例（Node 用）
function runSimTestsSync(log) {
  let pass = 0;
  const results = [];
  for (const t of TESTS) {
    if (t.browser) continue;
    let r;
    try { r = t.fn(); } catch (e) { r = { ok: false, info: '异常：' + (e && e.stack || e) }; }
    results.push({ name: t.name, ok: r.ok, info: r.info });
    if (r.ok) pass++;
    if (log) log((r.ok ? '通过  ' : '失败  ') + t.name + ' — ' + r.info);
  }
  return { pass, total: results.length, results };
}

 * 6b. v4 新增用例
 * ===================================================================== */
function countBurning() { let n = 0; for (let i = 0; i < N; i++) if (type[i] !== 0 && (flags[i] & F_BURN)) n++; return n; }
function sumCloud() { let s = 0; for (let c = 0; c < GW * GH; c++) s += cloud[c]; return s; }
function centroid(t) {
  let sx = 0, sy = 0, n = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === t) { sx += x; sy += y; n++; }
  return n ? { x: sx / n, y: sy / n, n } : null;
}

/* =====================================================================
 * 6c. 长时间稳定性测试（soak）：每个预设跑 10 分钟模拟时间（36000 步），每 10 秒记一次
 * ===================================================================== */
const SOAK_TRANSIENT = [FIRE, SMOKE, STEAM, EMBER, SPARK, FOAM];
const SOAK_MATS = [WATER, PLANT, DEADPLANT, WOOD, CHARCOAL, ASH, SOIL, LAVA, STONE, SEED, FLOWER, SNOW, ICE, SMOKE, STEAM];

function soakSample() {
  const cnt = new Uint32Array(NT);
  let tsum = 0, n = 0, burning = 0;
  for (let i = 0; i < N; i++) {
    const t = type[i];
    if (t === 0) continue;
    cnt[t]++; n++; tsum += temp[i];
    if (flags[i] & F_BURN) burning++;
  }
  return { cnt, total: n, avgT: n ? tsum / n : 0, burning, fire: cnt[FIRE], chunks: perf.activeChunks, bodies: bodyCount, free: fpCount,
           cloud: sumCloud(), heap: (typeof process !== 'undefined' && process.memoryUsage) ? process.memoryUsage().heapUsed / 1048576
                 : (performance.memory ? performance.memory.usedJSHeapSize / 1048576 : 0) };
}

// 同步跑一个场景；onSample(k, sample) 每 10 秒模拟时间回调一次。返回结论。
function soakScene(k, steps, onSample) {
  resetWorld(1000 + k);                                  // 每个场景都从干净的世界、第 0 步开始，单独跑和连着跑结果一样
  buildScene(k);
  const samples = [soakSample()];
  for (let s = 1; s <= steps; s++) {
    simStep();
    if (s % 600 === 0) { const sm = soakSample(); samples.push(sm); if (onSample) onSample(s / 600, sm); }
  }
  return soakVerdict(k, samples);
}

function soakVerdict(k, samples) {
  const first = samples[0], last = samples[samples.length - 1], n = samples.length;
  const late = samples.slice(Math.floor(n * 0.75)), mid = samples.slice(Math.floor(n * 0.5), Math.floor(n * 0.75));
  const avg = (arr, f) => arr.reduce((s, x) => s + f(x), 0) / arr.length;
  // 「无限增长」判定：最后四分之一的平均值比前一个四分之一还高出 15% 以上，且绝对增量不小
  const growing = [];
  for (const t of SOAK_MATS) {
    const a = avg(mid, s => s.cnt[t]), b = avg(late, s => s.cnt[t]);
    if (b > a * 1.15 && b - a > 150) growing.push(MATERIALS[t].name + ' ' + Math.round(a) + '→' + Math.round(b));
  }
  const totalA = avg(mid, s => s.total), totalB = avg(late, s => s.total);
  if (totalB > totalA * 1.1 && totalB - totalA > 400) growing.push('总量 ' + Math.round(totalA) + '→' + Math.round(totalB));
  const peakChunks = samples.reduce((m, s) => Math.max(m, s.chunks), 0);
  const peakBurn = samples.reduce((m, s) => Math.max(m, s.burning + s.fire), 0);
  const heapGrowth = avg(late, s => s.heap) - avg(samples.slice(1, Math.max(2, Math.floor(n * 0.25))), s => s.heap);
  // v4.1 判定：最后 2 分钟（最后 13 个采样点，相隔 10 秒）里，每种材料数量的趋势变化 < 2%。
  // 数量很少的材料允许 ±5 格的抖动（几十格的东西 2% 还不到一格，单个粒子进出就会超标）；火、烟、蒸汽、余烬、电火花、泡沫这类转瞬即逝的东西只记录不判定。
  const win = samples.slice(Math.max(0, n - 13));
  const unstable = [], drift = {};
  for (let t = 1; t < NT; t++) {
    if (SOAK_TRANSIENT.indexOf(t) >= 0) continue;
    const a = win[0].cnt[t], b = win[win.length - 1].cnt[t];
    const mean = win.reduce((s, x) => s + x.cnt[t], 0) / win.length;
    if (mean === 0) continue;
    // 用最小二乘拟合这 13 个点的直线，按斜率算 2 分钟里的趋势变化（下落中的雨滴这类逐点噪声不算）
    const m = win.length, xm = (m - 1) / 2;
    let sxy = 0, sxx = 0;
    for (let q = 0; q < m; q++) { sxy += (q - xm) * (win[q].cnt[t] - mean); sxx += (q - xm) * (q - xm); }
    const d = Math.abs(sxy / sxx * (m - 1)), pct = d / mean;
    drift[MATERIALS[t].name] = +(pct * 100).toFixed(2);
    if (pct >= 0.02 && d > 5) unstable.push(MATERIALS[t].name + ' ' + a + '→' + b + '（趋势 ' + (pct * 100).toFixed(1) + '%）');
  }
  return { name: SCENES[k].name, first, last, samples, growing, peakChunks, peakBurn, heapGrowth, unstable, drift,
           lateChunks: avg(late, s => s.chunks), lateBurn: avg(late, s => s.burning + s.fire) };
}

/* =====================================================================
 * 6e. v4.1 新增用例：平衡、确定性、存档完整性、风影、刚体炸药、增量支撑
 * ===================================================================== */
function groupCentroidX(t, xFrom, xTo) {
  let s = 0, n = 0;
  for (let y = 0; y < H; y++) for (let x = Math.max(0, xFrom); x <= Math.min(W - 1, xTo); x++) if (type[x + y * W] === t) { s += x; n++; }
  return n ? s / n : NaN;
}

/* ==== tests/browser/golden.js ==== */
/* 黄金快照：浏览器里算出的哈希必须和 Node 录下来的逐位一致（跨引擎确定性）。
 * ?test=1 里跑每个场景的第 0 / 1000 / 5000 步和 5 段回放；?golden=1 跑完整的 36000 步 */

function goldenCheck(maxStep) { return goldenCompare(maxStep, GOLDEN_DATA); }

TESTS.push({ name: '跨引擎确定性：浏览器算出的哈希和 Node 录的黄金快照逐位一致', browser: true, last: true, fn: () => {
  const r = goldenCheck(5000);
  return { ok: r.bad === 0 && r.ok === GOLDEN_DATA.replays.length + GOLDEN_DATA.scenes.length * 3,
           info: r.ok + ' 个一致，' + r.bad + ' 个不一致（10 个场景 × 第 0 / 1000 / 5000 步 + 5 段回放；完整 36000 步用 ?golden=1）' + (r.bad ? '：' + r.rows.filter(x => x[0] === '✗').join('；') : '') };
} });

/* ==== tests/browser/devtools.js ==== */
/* =====================================================================
 * 浏览器端测试入口：?test=1（全部用例 + 性能）、?coldboom=1、?soak=1、?bench=1、?golden=1。
 * 这些都在“宿主默认世界”上跑（直接用引擎内部函数，和 Node 的 tests/suites 一样），
 * 跑的时候主循环不碰沙盘的世界（game.busy），渲染器改画默认世界；跑完切回沙盘。
 * ===================================================================== */
// 进入 / 离开测试：默认世界上台，尺寸和沙盘一样，渲染器和声音改看默认世界
let savedSize = null;
function enterTests() {
  if (game.busy) return;
  const w = game.world;
  savedSize = w ? { w: w.width, h: w.height } : { w: 240, h: 150 };
  game.busy = true;
  activateHostWorld();
  if (N === 0 || W !== savedSize.w || H !== savedSize.h) allocGrid(savedSize.w, savedSize.h);
  envSet('onBoom', (x, y, R, P) => { fxBoom(x, y, R, P); audioBoom(P * R / 15); });
  envSet('onThunder', (x, y) => { fxThunder(); audioThunder(thunderDelay(x, y)); });
  setTArenaHook(() => { fx.flash = 0; fx.shake = 0; fx.ca = 0; for (const s of fx.shocks) s.power = 0; });
  setRenderWorld(HOST_WORLD); setAudioWorld(HOST_WORLD);
  resizeRenderer();
}
function leaveTests() {
  game.busy = false;
  setRenderWorld(game.world); setAudioWorld(game.world);
  if (game.world) resizeRenderer();
}
// 每个用例开始前：界面用例画沙盘的世界，其它的在默认世界上
function useTestWorld(sandbox) {
  if (sandbox) { setRenderWorld(game.world); resizeRenderer(); }
  else { setRenderWorld(HOST_WORLD); activateHostWorld(); resizeRenderer(); }
}
// 性能场景：全部新系统一起上 —— 约 5 万粒子（沙 + 水）+ 埋在里面的 10 个 TNT + 上面一栋会被炸塌的楼 + 雷暴天气
function buildPerfScene() {
  env.dayNight = true; env.time = 0.9; env.timeScale = 1; env.structure = true; env.temp = AMBIENT; scenesSet('sceneState', null);
  setWeather('storm'); env.wind = 0.6;
  clearGrid(); setGravity('down'); seedRng(4242); updateSun();
  const rows = Math.max(20, Math.min(Math.floor(H * 0.45), Math.ceil(50000 / W)));
  const floor = H - rows - 6;
  buildDemolition(true, floor);
  fillRect(SAND, 0, floor + 6 + (rows >> 1), W - 1, H - 1);
  fillRect(WATER, 0, floor + 6, W - 1, floor + 5 + (rows >> 1));
  for (let k = 0; k < 10; k++) {                         // 10 个 TNT 埋在沙层里，依次点燃
    const x = Math.floor(W * (k + 0.5) / 10), y = H - 2 - (rows >> 2), i = x + y * W;
    put(i, TNT, x, y); flags[i] |= F_BURN; life[i] = 40 + k * 8;
  }
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.7) cloud[c] = 2.4;      // 开场就是厚云：马上下雨、打雷
  env.charge = 0.9;
  let n = 0;
  for (let i = 0; i < N; i++) if (type[i] !== 0) n++;
  return n;
}

function perfTest() {
  return new Promise(resolve => {
    // 先把同一个场景完整跑一遍热身（不计时），让 JIT 把爆炸、刚体、闪电这些路径都编译好，再重建场景正式测。
    // 也就是说这里测的是稳定状态；真实使用中第一次大爆炸可能有一帧卡顿。
    buildPerfScene();
    for (let s = 0; s < 420; s++) { simStep(); if ((s & 3) === 0) renderFrame(performance.now(), 16.7); }
    audioFrame();
    const count = buildPerfScene();
    const frames = [];
    let booms = 0, lastBoomFrame = -1, firstBoomFrame = -1, last = performance.now(), peakBodies = 0;
    const strikes0 = env.strikes, made0 = structStats.made;
    let worst = { work: 0 };
    // 对照组：每帧顺带跑一段固定的小计算（正常约 0.1ms）。它要是也出现十几毫秒的峰值，说明是机器在抖，不是模拟慢
    const ctl = new Float64Array(60000);
    let ctlMax = 0, ctlSum = 0;
    const prevBoom = onBoom;
    envSet('onBoom', (x, y, R, P) => { booms++; lastBoomFrame = frames.length; if (firstBoomFrame < 0) firstBoomFrame = frames.length; if (prevBoom) prevBoom(x, y, R, P); });
    // 驱动：正常走 rAF；如果 rAF 被降频（面板被遮挡等），30ms 后由 MessageChannel 兜底，
    // 它不受后台定时器节流影响。每帧固定 1 个模拟步 + 1 次渲染，统计的是这一帧的实际工作耗时。
    let rafFrames = 0, fallbackFrames = 0, token = 0;
    const ch = new MessageChannel();
    let armedAt = 0, armedToken = 0, pending = null;
    ch.port1.onmessage = () => {
      if (armedToken !== token || !pending) return;
      if (performance.now() - armedAt < 30) { ch.port2.postMessage(0); return; }
      const cb = pending; pending = null; token++; fallbackFrames++;
      cb(performance.now());
    };
    const nextFrame = cb => {
      const my = ++token;
      pending = cb; armedAt = performance.now(); armedToken = my;
      requestAnimationFrame(() => { if (token === my && pending) { pending = null; token++; rafFrames++; cb(performance.now()); } });
      ch.port2.postMessage(0);
    };
    function fr(now) {
      const dt = Math.min(100, now - last); last = now;
      const t0 = performance.now();
      const p0 = [perf.cells, perf.thermal, perf.struct, perf.weather, perf.slow, perf.misc];
      simStep();
      const t1 = performance.now();
      renderFrame(now, 16.7);
      if (gl) gl.finish();                               // 把 GPU 时间也算进来
      const work = performance.now() - t0;
      if (work > worst.work) worst = { work, frame: frames.length, sim: t1 - t0, render: performance.now() - t1, cells: perf.cells - p0[0], thermal: perf.thermal - p0[1],
                                       struct: perf.struct - p0[2], weather: perf.weather - p0[3], slow: perf.slow - p0[4], misc: perf.misc - p0[5], bodies: bodyCount, free: fpCount };
      const c0 = performance.now();
      for (let i = 0; i < 60000; i++) ctl[i] = ctl[i] * 0.5 + i;
      const cd = performance.now() - c0;
      ctlSum += cd; if (cd > ctlMax) ctlMax = cd;
      frames.push({ dt, work, free: fpCount, chunks: perf.activeChunks });
      if (bodyCount > peakBodies) peakBodies = bodyCount;
      audioFrame();
      const n = frames.length;
      const done = (booms >= 10 && n - lastBoomFrame > 300 && bodyCount === 0) || n > 2400;
      if (!done) { nextFrame(fr); return; }
      envSet('onBoom', prevBoom);
      const during = frames.slice(Math.max(0, firstBoomFrame), lastBoomFrame + 24);
      const after = frames.slice(lastBoomFrame + 120);               // 最后一次爆炸 2 秒（120 步）之后
      const all = frames.slice(5);
      const avg = a => a.reduce((s, f) => s + f.work, 0) / Math.max(1, a.length);
      const maxW = a => a.reduce((m, f) => Math.max(m, f.work), 0);
      const v = all.map(f => f.dt).sort((p, q) => p - q);
      resolve({
        count, grid: W + 'x' + H, booms, frames: n, displayHz: 1000 / (v[v.length >> 1] || 16.7),
        throttled: fallbackFrames > rafFrames, rafFrames, fallbackFrames,
        avgWork: avg(all), duringAvg: avg(during), duringMax: maxW(during), duringFrames: during.length,
        duringMinFps: 1000 / Math.max(0.01, maxW(during)),
        afterAvg: avg(after), afterMax: maxW(after), afterFps: 1000 / Math.max(0.01, maxW(after)),
        peakFree: frames.reduce((m, f) => Math.max(m, f.free), 0), peakChunks: frames.reduce((m, f) => Math.max(m, f.chunks), 0),
        peakBodies, bodiesMade: structStats.made - made0, strikes: env.strikes - strikes0, rain: env.rainCount,
        allMax: maxW(all), over16: all.filter(f => f.work > 16).length, worst,
        p99: all.map(f => f.work).sort((a, b) => a - b)[Math.floor(all.length * 0.99)], p50: all.map(f => f.work).sort((a, b) => a - b)[all.length >> 1],
        ctlMax, ctlAvg: ctlSum / n,
      });
    }
    nextFrame(fr);
  });
}

async function runAllTests() {
  enterTests();
  const box = $('testbox');
  box.style.display = 'block';
  const rows = [];
  let pass = 0;
  const draw = extra => {
    box.innerHTML = '<h4>自测 ' + pass + ' / ' + rows.length + ' 通过' + (rows.length <= TESTS.length ? '（共 ' + (TESTS.length + 1) + ' 项）' : '') + '</h4>' +
      (extra || '') + rows.map(r => '<div class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '通过' : '失败') + '　' + r.name + ' <span class="dim">' + r.info + '</span></div>').join('');
  };
  const yieldCh = new MessageChannel();
  const tick0 = () => new Promise(r => { yieldCh.port1.onmessage = () => r(); yieldCh.port2.postMessage(0); });
  const only = QS.get('only');
  // 顺序和 v4 一样：模拟用例 → 浏览器用例 → 黄金快照（它会换网格、载入场景，放最后）
  const list = [...TESTS.filter(t => !t.browser), ...TESTS.filter(t => t.browser && !t.last), ...TESTS.filter(t => t.last)];
  for (const t of list) {
    if (only && !t.name.includes(only)) continue;
    await tick0();
    useTestWorld(!!t.sandbox);
    let r;
    try { r = await t.fn(); } catch (e) { r = { ok: false, info: '异常：' + e.message }; console.error(e); }
    rows.push({ name: t.name, ok: r.ok, info: r.info });
    if (r.ok) pass++;
    console.log((r.ok ? '通过' : '失败') + '  ' + t.name + ' — ' + r.info);
    invalidate(); renderFrame(performance.now(), 16.7);
    draw();
  }
  useTestWorld(false);
  fpClear(); exClear();
  const p = await perfTest();
  // 判定只看「每帧工作耗时」（模拟一步 + 渲染一帧 + gl.finish）：全程最慢一帧 ≤ 16ms
  const perfOk = p.allMax <= 16 && p.booms >= 10 && p.bodiesMade >= 3 && p.rain > 0;
  const w = p.worst;
  rows.push({ name: '性能：' + p.count + ' 粒子 + TNT 连爆 + 建筑倒塌 + 雷暴，全部新系统开启（' + p.grid + '）', ok: perfOk,
    info: '全程最慢一帧 ' + p.allMax.toFixed(1) + 'ms（其中模拟 ' + w.sim.toFixed(1) + '：粒子 ' + w.cells.toFixed(1) + ' / 温度 ' + w.thermal.toFixed(1) + ' / 结构 ' + w.struct.toFixed(1) +
          ' / 天气 ' + w.weather.toFixed(1) + '；渲染 ' + w.render.toFixed(1) + '），超过 16ms 的有 ' + p.over16 + ' / ' + p.frames + ' 帧；中位数 ' + p.p50.toFixed(1) + 'ms，99% 的帧 ≤ ' + p.p99.toFixed(1) +
          'ms，平均 ' + p.avgWork.toFixed(1) + 'ms；固定负载对照：平均 ' + p.ctlAvg.toFixed(2) + 'ms、最慢 ' + p.ctlMax.toFixed(1) + 'ms' + (p.ctlMax > 6 ? '（对照组自己都抖到这么高，说明机器当时有别的负载，峰值不可信）' : '') +
          '；' + p.booms + ' 次爆炸，刚体 ' + p.bodiesMade + ' 个（同时最多 ' + p.peakBodies + '），闪电 ' + p.strikes + ' 道，雨 ' + p.rain + ' 滴，飞行粒子峰值 ' + p.peakFree +
          (p.throttled ? '；rAF 被浏览器降频，测试由消息通道驱动' : '；rAF ' + p.displayHz.toFixed(0) + 'Hz') });
  if (perfOk) pass++;
  console.log((perfOk ? '通过' : '失败') + '  ' + rows[rows.length - 1].name + ' — ' + rows[rows.length - 1].info);
  const all = pass === rows.length;
  draw('<div class="' + (all ? 'ok' : 'bad') + '">' + (all ? '全部通过' : '有 ' + (rows.length - pass) + ' 项失败') + ' · 渲染 ' + renderMode + '</div>');
  console.log('自测结果：' + pass + '/' + rows.length + (all ? ' 全部通过' : ' 有失败'));
  window.__testResults = { pass, total: rows.length, rows, perf: p, renderMode };
  leaveTests();
}

/* ---- ?coldboom=1：刷新后第一次大爆炸的耗时（加 &nowarm=1 对比不热身） ---- */
function coldBoom() {
  const box = $('testbox');
  box.style.display = 'block';
  enterTests();
  const count = buildPerfScene();
  const frames = [];
  let firstBoom = -1, booms = 0;
  const prev = onBoom;
  envSet('onBoom', (x, y, R, P) => { booms++; if (firstBoom < 0) firstBoom = frames.length; if (prev) prev(x, y, R, P); });
  const ch = new MessageChannel(), ctl = new Float64Array(60000);
  let ctlMax = 0, ctlSum = 0;
  ch.port1.onmessage = () => {
    const t0 = performance.now();
    simStep(); renderFrame(performance.now(), 16.7); if (gl) gl.finish();
    frames.push(performance.now() - t0);
    const c0 = performance.now();                        // 固定负载对照组：它也变慢，说明是机器忙
    for (let i = 0; i < 60000; i++) ctl[i] = ctl[i] * 0.5 + i;
    const cd = performance.now() - c0; ctlSum += cd; if (cd > ctlMax) ctlMax = cd;
    if (frames.length < 260) { ch.port2.postMessage(0); return; }
    envSet('onBoom', prev);
    const win = frames.slice(Math.max(0, firstBoom), firstBoom + 60);
    const r = { warm: !QS.has('nowarm'), warmMs: +warmMs.toFixed(0), count, booms, firstBoomFrame: firstBoom,
                firstBoomMax: +Math.max.apply(null, win).toFixed(1), allMax: +Math.max.apply(null, frames).toFixed(1),
                avg: +(frames.reduce((a, b) => a + b, 0) / frames.length).toFixed(2), ctlAvg: +(ctlSum / frames.length).toFixed(3), ctlMax: +ctlMax.toFixed(1) };
    window.__coldBoom = r;
    box.innerHTML = '<h4>冷启动第一次大爆炸</h4><div class="' + (r.firstBoomMax <= 16 ? 'ok' : 'bad') + '">' + (r.warm ? '已热身（' + r.warmMs + 'ms）' : '未热身') +
      '：第一次爆炸后 60 帧里最慢 ' + r.firstBoomMax + 'ms，全程最慢 ' + r.allMax + 'ms，平均 ' + r.avg + 'ms；固定负载对照平均 ' + r.ctlAvg + 'ms、最慢 ' + r.ctlMax + 'ms</div>';
    console.log('冷启动', JSON.stringify(r));
    leaveTests();
  };
  ch.port2.postMessage(0);
}

/* ---- ?soak=1：10 个场景各跑 10 分钟模拟时间，页面里显示结果表 ---- */
async function soakInPage() {
  enterTests();
  const box = $('testbox');
  box.style.display = 'block';
  const yieldCh = new MessageChannel();
  const tick0 = () => new Promise(r => { yieldCh.port1.onmessage = () => r(); yieldCh.port2.postMessage(0); });
  const steps = +(QS.get('steps') || 36000), rows = [];
  const draw = cur => {
    box.innerHTML = '<h4>soak：每个场景 ' + steps + ' 步' + (cur ? '（进行中：' + cur + '）' : '') + '</h4>' + rows.map(r =>
      '<div class="' + (r.unstable.length ? 'bad' : 'ok') + '">' + r.name + ' <span class="dim">总量 ' + r.first.total + '→' + r.last.total +
      '，末段活跃块 ' + r.lateChunks.toFixed(1) + '，末段燃烧 ' + r.lateBurn.toFixed(0) + (r.unstable.length ? '；不稳定：' + r.unstable.join('，') : '；最后 2 分钟各材料变化都 < 2%') + '</span></div>').join('');
  };
  for (let k = 0; k < SCENES.length; k++) {
    activateHostWorld(); resetWorld(1000 + k); buildScene(k);
    const samples = [soakSample()];
    for (let s = 1; s <= steps; s++) {
      simStep();
      if (s % 600 === 0) { samples.push(soakSample()); draw(SCENES[k].name + ' ' + Math.round(s / steps * 100) + '%'); invalidate(); renderFrame(performance.now(), 16.7); await tick0(); }
    }
    rows.push(soakVerdict(k, samples));
    draw();
  }
  window.__soakResults = rows.map(r => ({ name: r.name, unstable: r.unstable, drift: r.drift }));
  console.log('soak', JSON.stringify(window.__soakResults));
  leaveTests();
}

/* ---- 6.1 反应矩阵里的每一条接触规则 ---- */
for (const r of RULES) {
  defTest('规则 ' + MATERIALS[r.a].name + ' × ' + MATERIALS[r.b].name, () => {
    const { cx, cy } = tArena();
    const x0 = cx - 4, x1 = cx + 3, y0 = cy - 3, y1 = cy + 2;
    tBox(x0, y0, x1, y1, GLASS);
    for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
      const i = x + y * W, top = y < y0 + 3;
      put(i, top ? r.a : r.b, x, y);
      if (top && r.maxT !== undefined) temp[i] = r.maxT - 3;
    }
    const a0 = countType(r.a), b0 = countType(r.b);
    const a20 = countType(r.a2), b20 = countType(r.b2);
    const cond = () =>
      (r.a2 !== r.a && r.a2 !== EMPTY && countType(r.a2) > a20) ||
      (r.b2 !== r.b && r.b2 !== EMPTY && countType(r.b2) > b20) ||
      (r.b2 === EMPTY && countType(r.b) < b0) ||
      (r.a2 === EMPTY && countType(r.a) < a0);
    // 带温度条件的规则：全程把主动方维持在条件温度以下（比如过冷水），否则潜热会把它钉回冰点
    const hold = r.maxT === undefined ? null : () => { for (let y = y0 + 1; y < y0 + 3; y++) for (let x = x0 + 1; x < x1; x++) { const i = x + y * W; if (type[i] === r.a) temp[i] = r.maxT - 3; } };
    const n = tUntil(Math.min(8000, Math.ceil(60 / r.p)), 2, () => { if (hold) hold(); return cond(); });
    return { ok: n > 0, info: n > 0 ? n + ' 步出现产物' : '超时未出现产物' };
  });
}

defTest('四个重力方向：粉末下沉、气体反向、休止角一致', () => {
  const ratios = [], notes = [];
  let ok = true;
  for (const dir of ['down', 'up', 'left', 'right']) {
    tArena(); setGravity(dir); seedRng(99);
    const cx = W >> 1, cy = H >> 1;
    // 在重力下游 20 格处放一块金属板，沙落在板上堆成堆
    const px = cx + gx * 20, py = cy + gy * 20;
    for (let k = -45; k <= 45; k++) { const x = px + lx * k, y = py + ly * k; if (inb(x, y)) put(x + y * W, METAL, x, y); }
    fillRect(SAND, cx - 10, cy - 10, cx + 10, cy + 10);
    const sx = cx - gx * 16, sy = cy - gy * 16;
    fillCircle(SMOKE, sx, sy, 3);
    let moved = 0;
    for (let s = 0; s < 40; s++) simStep();
    // 烟的质心应该逆着重力移动
    let gsx = 0, gsy = 0, gn = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === SMOKE) { gsx += x; gsy += y; gn++; }
    if (gn > 0) moved = -((gsx / gn - sx) * gx + (gsy / gn - sy) * gy);
    runSteps(500);
    // 沙堆：沿重力方向的高度 vs 侧向宽度
    let hMax = 0, lMin = 1e9, lMax = -1e9, n = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (type[x + y * W] !== SAND) continue;
      n++;
      const dh = (px - x) * gx + (py - y) * gy, dl = (x - px) * lx + (y - py) * ly;
      if (dh > hMax) hMax = dh;
      if (dl < lMin) lMin = dl;
      if (dl > lMax) lMax = dl;
    }
    const ratio = (lMax - lMin + 1) / hMax;
    ratios.push(ratio);
    notes.push(dir + ' 宽高比 ' + ratio.toFixed(2) + ' 气体逆行 ' + moved.toFixed(1));
    if (n < 430 || n > 441 || moved < 4 || hMax < 6) ok = false;
  }
  const mn = Math.min.apply(null, ratios), mx = Math.max.apply(null, ratios);

defTest('休止角各不相同：土比沙堆得陡，湿沙能立住', () => {
  // 每种材料在三个位置各堆一次取平均：单堆的宽度由最边上那一粒决定，随网格尺寸（随机序列）波动很大
  const pile = (t, wetness) => {
    let h = 0, w = 0;
    for (const off of [-40, 0, 40]) { const p = pile1(t, wetness, off); h += p.h / 3; w += p.w / 3; }
    return { h: Math.round(h), w };
  };
  const pile1 = (t, wetness, off) => {
    let { cx, cy } = tArena();
    cx += off;
    const fy = Math.min(H - 3, cy + 40);
    tFloor(fy, STONE);
    for (let y = fy - 60; y < fy - 10; y++) for (let x = cx - 3; x <= cx + 3; x++) { const i = x + y * W; put(i, t, x, y); wet[i] = wetness; }
    runSteps(900);
    // 宽度按体积折算（堆成三角形时 面积 = 宽 × 高 / 2）：滚远的个别颗粒不影响结果
    let top = fy, n = 0;
    for (let y = 0; y < fy; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === t) { if (y < top) top = y; n++; }
    const h = fy - top;
    return { h, w: h > 0 ? 2 * n / h : W };
  };
  const sand = pile(SAND, 0), soil = pile(SOIL, 0), wetSand = pile(SAND, 110);
  const rs = sand.w / sand.h, ro = soil.w / soil.h, rw = wetSand.w / wetSand.h;
  return { ok: ro < rs * 0.8 && rw < rs * 0.45 && wetSand.h > sand.h * 1.6,

/* ---- 四个重力方向 × 每一种材料 ---- */
(function gravityMatrix() {
  const DIRS = ['down', 'up', 'left', 'right'];
  const expectOf = t => {
    const m = MATERIALS[t];
    if (m.hardness > 1) return 'fixed';
    if (t === SPARK || t === FLOWER) return 'stay';
    if (t === FOAM) return 'fall';
    if (m.state === S_GAS) return 'rise';
    return 'fall';                       // 粉末、液体、失去支撑的刚性固体、孤立的植物
  };
  for (let t = 1; t < NT; t++) {
    defTest('重力四向：' + MATERIALS[t].name, () => {
      const exp = expectOf(t), notes = [];
      let ok = true;
      for (const dir of DIRS) {
        tArena();
        env.structure = true;
        setGravity(dir);
        const cx = W >> 1, cy = H >> 1;
        const single = t === PLANT || M_STATE[t] === S_GAS || t === SPARK;
        const r = single ? 0 : 1;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          const x = cx + dx, y = cy + dy, i = x + y * W;
          put(i, t, x, y);
          if (M_LIFE0[t]) life[i] = 200;
          if (t === ICE || t === SNOW) temp[i] = -30;
        }
        if (t === ICE || t === SNOW) { env.temp = -10; updateSun(); temp.fill(-10); }
        let along = 0, found = false;
        const steps = exp === 'rise' ? 14 : t === LAVA ? 40 : 70;      // 熔岩小液滴在空气里飞久了会冷凝成石头，所以量得早一点
        for (let s = 0; s < steps; s++) simStep();
        let sx = 0, sy = 0, n = 0;
        for (let i = 0; i < N; i++) if (type[i] === t) { sx += i % W; sy += (i / W) | 0; n++; }
        for (let k = 0; k < FP_MAX; k++) if (fpAlive[k] && fpType[k] === t) { sx += fpX[k]; sy += fpY[k]; n++; }
        if (n > 0) { found = true; along = (sx / n - cx) * gx + (sy / n - cy) * gy; }
        let pass;
        if (exp === 'fixed') pass = found && Math.abs(along) < 0.01;
        else if (exp === 'stay') pass = !found || Math.abs(along) < 4;
        else if (exp === 'rise') pass = !found || along < -2;
        else pass = found && along > 3;
        if (!pass) ok = false;
        notes.push(dir + ' ' + (found ? along.toFixed(1) : '消失'));
      }
      setGravity('down');
      const label = { fixed: '应当不动', stay: '不受重力', rise: '应当逆着重力', fall: '应当顺着重力' }[exp];
      return { ok, info: label + '；沿重力方向位移：' + notes.join('，') };
    });
  }
})();

        }
      }

    }

    return { booms, inBody, lit, tnt: countType(TNT) };
  };

  return { ok: a.lit && a.booms >= 2 && b.lit && b.booms >= 1 && a.tnt === 0,
           info: '被爆炸波及：引信点着 ' + a.lit + '，共 ' + a.booms + ' 次爆炸（刚体还在时 ' + a.inBody + ' 次），剩余炸药 ' + a.tnt +

});

/* =====================================================================
 * 6d. 只能在浏览器里跑的用例：读像素验证渲染效果、离线渲染验证音效、Blob 往返验证导入导出
 * ===================================================================== */
function defBrowserTest(name, fn, opts) { TESTS.push(Object.assign({ name, fn, browser: true }, opts || {})); }

// 读画布上一块区域的像素（格子坐标），必须紧跟在 renderFrame 之后、同一个任务里读
function readCells(x0, y0, w, h) {
  const k = canvas.width / W;
  const px = Math.round(x0 * k), py = Math.round(canvas.height - (y0 + h) * k), pw = Math.round(w * k), ph = Math.round(h * k);
  const buf = new Uint8Array(pw * ph * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(px, py, pw, ph, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  return buf;
}

function meanDiff(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i += 4) s += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
  return s / (a.length / 4 * 3);
}

    fillRect(STONE, cx + 20, cy, cx + 29, cy + 9);
    for (let y = cy; y <= cy + 9; y++) for (let x = cx - 30; x <= cx - 21; x++) temp[x + y * W] = 1200;
    for (let y = cy; y <= cy + 9; y++) for (let x = cx - 5; x <= cx + 4; x++) { const i = x + y * W; flags[i] |= F_BURN; temp[i] = 400; }
    invalidate(); renderFrame(1000, 16.7);
    const emis = (gx0, gy0) => {
      const k = canvas.width / W, px = Math.round((gx0 + 5) * k), py = Math.round(canvas.height - (gy0 + 5) * k);
      gl.bindFramebuffer(gl.FRAMEBUFFER, R.scene.fbo);
      gl.readBuffer(gl.COLOR_ATTACHMENT1);
      let v;
      if (R.hdr) { const b = new Float32Array(4); gl.readPixels(px, py, 1, 1, gl.RGBA, gl.FLOAT, b); v = Math.max(b[0], b[1], b[2]); }
      else { const b = new Uint8Array(4); gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b); v = Math.max(b[0], b[1], b[2]) / 255; }
      gl.readBuffer(gl.COLOR_ATTACHMENT0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return v;
    };
    const m = emis(cx - 30, cy), c = emis(cx - 5, cy), s = emis(cx + 20, cy);
    // 再看最终画面：发光体周围的空气应该被 bloom 照亮
    for (let k = 0; k < 10; k++) renderFrame(1000 + k * 16, 16.7);
    const halo = readCells(cx - 19, cy + 3, 3, 3), dark = readCells(cx + 31, cy + 3, 3, 3);
    let hs = 0, ds = 0;
    for (let i = 0; i < halo.length; i += 4) { hs += halo[i]; ds += dark[i]; }
    return { ok: m > 0.2 && c > 0.2 && s < 0.02 && hs > ds * 1.3,
             info: '发光强度：热金属 ' + m.toFixed(2) + '，阴燃的炭 ' + c.toFixed(2) + '，石头 ' + s.toFixed(3) + '；热金属旁的空气红色通道 ' +
                   (hs / (halo.length / 4)).toFixed(0) + '，石头旁 ' + (ds / (dark.length / 4)).toFixed(0) };
  });

  defBrowserTest('音效：离线渲染每一种声音，都不削波（峰值 < 0dBFS），也都不是静音', async () => {
    if (!(window.OfflineAudioContext || window.webkitOfflineAudioContext)) return { ok: false, info: '浏览器没有 OfflineAudioContext' };
    const parts = [];
    let ok = true;
    for (const name of SFX_TESTS) {
      const r = await renderSfx(name);
      const db = 20 * Math.log10(Math.max(1e-9, r.peak));
      if (!(r.peak < 0.999 && r.rms > 1e-4)) ok = false;
      parts.push(name + ' ' + db.toFixed(1) + 'dB');
    }
    return { ok, info: '峰值：' + parts.join('，') + '（all = 所有声床开到最大 + 4 声爆炸 + 雷）' };
  });

  defBrowserTest('导入导出：导出的 Blob 当作文件选进来，走完整往返，逐格一致', async () => {
    const w = game.world;                                    // 沙盘模式的世界：走界面真正的导出 / 导入代码
    w.exec('clear', {});
    const cx = w.width >> 1, cy = w.height >> 1;
    w.exec('fillRect', { mat: STONE, x0: 0, y0: cy + 12, x1: w.width - 1, y1: w.height - 1 });
    const kinds = [SAND, WATER, WOOD, OIL, PLANT, METAL, ICE, SALT, BRICK, GLASS, LAVA, TNT, SOIL, ROPE];
    let k = 0;
    for (let y = cy - 10; y < cy + 12; y += 2) for (let x = cx - 30; x < cx + 30; x += 3) w.exec('fillRect', { mat: kinds[(k++ * 7) % kinds.length], x0: x, y0: y, x1: x + 1, y1: y });
    w.step(30);
    const t0 = w.getField('type', { copy: true }), s0 = w.getField('seed', { copy: true }), w0 = w.getField('wet', { copy: true }),
          a0 = w.getField('aux', { copy: true }), u0 = w.getField('fuel', { copy: true }), h0 = w.hash();
    let blob = null, fname = '';
    setDownloadHook((b, n) => { blob = b; fname = n; });      // 截住下载：拿到导出按钮真正产出的 Blob
    exportJSON();
    setDownloadHook(null);
    if (!blob) return { ok: false, info: '导出没有产出 Blob' };
    w.exec('clear', {});
    const emptied = w.queryRegion({ x: 0, y: 0, w: w.width, h: w.height }).counts[EMPTY] === w.width * w.height;
    const okImport = await importJSON(new File([blob], fname, { type: 'application/json' }));   // 和文件选择框选中文件走同一条路
    const T = w.getField('type'), S = w.getField('seed'), Wt = w.getField('wet'), A = w.getField('aux'), U = w.getField('fuel');
    let diff = 0;
    for (let i = 0; i < T.length; i++) if (T[i] !== t0[i] || (T[i] !== 0 && (S[i] !== s0[i] || Wt[i] !== w0[i] || A[i] !== a0[i] || U[i] !== u0[i]))) diff++;
    const h1 = w.hash();
    resetUndo();
    return { ok: emptied && okImport && diff === 0 && h1 === h0 && /\.json$/.test(fname), info: '文件 ' + fname + '，' + (blob.size / 1024).toFixed(1) + ' KB；清空后导入，差异 ' + diff + ' 格，哈希' + (h1 === h0 ? '一致' : '不一致') };
  }, { sandbox: true });
}

/* ==== src/main.js ==== */
/* =====================================================================
 * 启动：建渲染器 → 冷启动热身 → 注册模式 → 进入沙盘（或 ?mode=）→ 主循环。
 * 浏览器测试入口：?test=1 / ?soak=1 / ?bench=1 / ?golden=1 / ?coldboom=1（加 &nowarm=1 不热身）。
 * ===================================================================== */

function main() {
  createRenderer($('viewport'));
  if (!QS.has('nowarm')) warmUp();
  for (const def of [sandboxModeDef, defenseModeDef, puzzleModeDef, civModeDef, ecoModeDef]) registerMode(def);
  buildMenu();
  const params = {};
  const devtool = ['test', 'coldboom', 'soak', 'bench', 'golden'].some(k => QS.has(k));
  if (!devtool && QS.has('scene')) params.scene = Math.max(0, Math.min(SCENES.length - 1, (+QS.get('scene') || 1) - 1));
  startMode(QS.get('mode') || 'sandbox', params);
  if (!QS.has('nowarm')) warmRender();
  if (QS.has('test')) setTimeout(runAllTests, 400);
  else if (QS.has('coldboom')) setTimeout(coldBoom, 50);
  else if (QS.has('soak')) setTimeout(soakInPage, 400);
  else if (QS.has('bench')) setTimeout(benchInPage, 400);
  else if (QS.has('golden')) setTimeout(goldenInPage, 400);
  else if (!QS.has('scene')) toast('左键绘制 · 右键擦除 · 「场景」里有 10 个预设 · M 打开主菜单');
  startLoop();
}
main();

</script>
