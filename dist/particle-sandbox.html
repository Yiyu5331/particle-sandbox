  { a: ACID, b: CONCRETE, p: 0.003, a2: ACID, b2: EMPTY, use: 0.5 },
];
for (const s of ACID_SOLUBLE) RULES.push({ a: ACID, b: s, p: 0.02, a2: ACID, b2: EMPTY, use: 0.5 });

const RX = new Array(NT * NT).fill(null);
const HASRX = new Uint8Array(NT);
for (let k = 0; k < RULES.length; k++) { const r = RULES[k]; r.idx = k; RX[r.a * NT + r.b] = r; HASRX[r.a] = 1; }

/* ==== src/engine/events.js ==== */
/* =====================================================================
 * 事件计数：模拟过程中只做计数和记位置（不影响模拟、不进哈希），
 * 每步结束时由 world.js 汇总成事件数组，按固定顺序发给订阅者。
 * 顺序：reaction → materialFirstCreated → ignite → extinguish → explosion → collapse → lightning（→ regionChanged，由 world.js 追加）
 * ===================================================================== */

let evRule = new Uint32Array(RULES.length);      // 本步每条接触规则触发了几次
let evRuleX = new Int32Array(RULES.length), evRuleY = new Int32Array(RULES.length);
let evSeen = new Uint8Array(NT);                 // 这个世界里出现过的材料
let evNewMats = [];                              // 本步第一次出现的材料
let evIgnite = 0, evIgniteX = 0, evIgniteY = 0;
let evExt = 0, evExtX = 0, evExtY = 0;
let evBooms = [];                                // [{x, y, radius, power}]
let evCollapses = [];                            // [{cells, x, y, material}]
let evBolts = [];                                // [{x, y, fromX, fromY}]

function noteRule(k, x, y) { if (evRule[k]++ === 0) { evRuleX[k] = x; evRuleY[k] = y; } }
function noteMat(t) { if (evSeen[t] === 0) { evSeen[t] = 1; evNewMats.push(t); } }
function noteIgnite(x, y) { if (evIgnite++ === 0) { evIgniteX = x; evIgniteY = y; } }
function noteExtinguish(x, y) { if (evExt++ === 0) { evExtX = x; evExtY = y; } }
const EV_CAP = 4096;   // 宿主不收事件时（直接调 simStep）列表也不会无限长
function noteBoom(x, y, radius, power) { if (evBooms.length < EV_CAP) evBooms.push({ x, y, radius, power }); }
function noteCollapse(cells, x, y, material) { if (evCollapses.length < EV_CAP) evCollapses.push({ cells, x, y, material }); }
function noteBolt(x, y, fromX, fromY) { if (evBolts.length < EV_CAP) evBolts.push({ x, y, fromX, fromY }); }

// 清空计数（eventsCollect 读完后自动调用；两步之间 exec 产生的事件算进下一步那一批）
function eventsBegin() {
  evRule.fill(0); evNewMats = [];
  evIgnite = 0; evExt = 0; evBooms = []; evCollapses = []; evBolts = [];
}

// 每步结束：把计数汇总成事件（按固定顺序）
function eventsCollect(step) {
  const out = [];
  for (let k = 0; k < RULES.length; k++) {
    if (evRule[k] === 0) continue;
    const r = RULES[k];
    out.push({ type: 'reaction', step, rule: k, reactant: r.a, other: r.b, products: [r.a2, r.b2], count: evRule[k], x: evRuleX[k], y: evRuleY[k] });
  }
  for (const t of evNewMats) out.push({ type: 'materialFirstCreated', step, material: t });
  if (evIgnite) out.push({ type: 'ignite', step, count: evIgnite, x: evIgniteX, y: evIgniteY });
  if (evExt) out.push({ type: 'extinguish', step, count: evExt, x: evExtX, y: evExtY });
  // 爆炸按 32×32 的块聚合（连锁引爆一步能有上百个起爆点）：同一块里的合成一条，给出个数、中心、最大半径、最大威力
  if (evBooms.length > 0) {
    const groups = new Map();
    for (const b of evBooms) {
      const key = ((b.x >> 5) << 16) | (b.y >> 5);
      let g = groups.get(key);
      if (!g) { g = { type: 'explosion', step, count: 0, x: 0, y: 0, radius: 0, power: 0, sx: 0, sy: 0 }; groups.set(key, g); out.push(g); }
      g.count++; g.sx += b.x; g.sy += b.y;
      if (b.radius > g.radius) g.radius = b.radius; if (b.power > g.power) g.power = b.power;
    }
    for (const g of groups.values()) { g.x = Math.round(g.sx / g.count); g.y = Math.round(g.sy / g.count); delete g.sx; delete g.sy; }
  }
  for (const c of evCollapses) out.push({ type: 'collapse', step, cells: c.cells, x: c.x, y: c.y, material: c.material });
  for (const b of evBolts) out.push({ type: 'lightning', step, x: b.x, y: b.y, fromX: b.fromX, fromY: b.fromY });
  eventsBegin();
  return out;
}

// 已出现材料的扫描：put / morph 会立刻登记；其它直接改类型的路径（相变、腐烂……）由这里每步扫 1/16 的格子补上（最多晚 16 步）
let scanRow = 0;
function scanNewMaterials(type, W, H) {
  for (let y = scanRow; y < H; y += 16) {
    for (let i = y * W, e = i + W; i < e; i++) { const t = type[i]; if (evSeen[t] === 0) { evSeen[t] = 1; evNewMats.push(t); } }
  }
  scanRow = (scanRow + 1) & 15;
}

function eventsSave() { return { evRule, evRuleX, evRuleY, evSeen, evNewMats, evIgnite, evIgniteX, evIgniteY, evExt, evExtX, evExtY, evBooms, evCollapses, evBolts, scanRow }; }
function eventsLoad(s) { ({ evRule, evRuleX, evRuleY, evSeen, evNewMats, evIgnite, evIgniteX, evIgniteY, evExt, evExtX, evExtY, evBooms, evCollapses, evBolts, scanRow } = s); }

// 新世界 / resetWorld：清空“出现过的材料”，让 materialFirstCreated 从头算
function eventsReset() { evSeen.fill(0); scanRow = 0; eventsBegin(); }

/* ==== src/engine/combustion.js ==== */

/* ---------------------------------------------------------------------
 * 2.2 燃烧：燃料 + 热量 + 氧气
 * ------------------------------------------------------------------- */
// 逆着重力往上走 48 格，路上只有空气 / 气体就算「通着天」
function openSky(x, y) {
  for (let k = 1; k <= 48; k++) {
    const nx = x - gx * k, ny = y - gy * k;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) return true;
    const o = type[nx + ny * W];
    if (o !== 0 && M_STATE[o] < S_GAS) return false;
  }
  return true;
}

// 旁边有没有还能支持燃烧的空气
function hasOxygen(x, y) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (AIRLIKE[type[j]] && aux[j] < STALE_MAX) return true;
  }
  return false;
}

function ignite(i, t, x, y) {
  noteIgnite(x, y);
  flags[i] = (flags[i] | F_BURN) & ~F_TIP;
  if (M_BLAST[t]) life[i] = M_BURNTIME[t];           // 引信
  else if (fuel[i] === 0) fuel[i] = initFuel(t);     // 只有从没装过燃料的才装；熄灭后剩多少就是多少
  wake(x, y);
}

function emitFlame(x, y, t) {
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (!(inb(nx, ny) && type[nx + ny * W] === 0)) {
    const k = rndi(4);
    nx = x + DX4[k]; ny = y + DY4[k];
    if (!(inb(nx, ny) && type[nx + ny * W] === 0)) return;
  }
  const j = nx + ny * W;
  put(j, FIRE, nx, ny);
  if (M_FLAME[t] > 0.3) life[j] += 18;       // 油：火焰更大
}

// kind：0 白烟（湿的东西 / 刚被浇灭），1 灰烟，2 黑烟（缺氧）
function emitSmoke(x, y, kind) {
  let nx = x - gx, ny = y - gy;
  if (!(inb(nx, ny) && type[nx + ny * W] === 0)) {
    const k = rndi(4);
    nx = x + DX4[k]; ny = y + DY4[k];
    if (!(inb(nx, ny) && type[nx + ny * W] === 0)) return;
  }
  const j = nx + ny * W;
  put(j, SMOKE, nx, ny);
  seed[j] = kind === 0 ? rndi(50) : kind === 1 ? 90 + rndi(60) : 200 + rndi(56);
}

// 返回 true 表示这一格已经变成别的东西
function burnStep(x, y, i, t, T) {
  wake(x, y);
  if (M_BLAST[t]) {                          // 爆炸物：F_BURN 表示引信在烧
    const L = life[i];
    if (L > 1) { life[i] = L - 1; return false; }
    clearCell(i, x, y); startExplosion(x, y, M_BLAST[t], M_BPOW[t]);
    return true;
  }
  let airJ = -1, airStale = 255, wetJ = -1, wx = 0, wy = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (AIRLIKE[o]) { const s = aux[j]; if (s < airStale) { airStale = s; airJ = j; } }      // 空气，或者被火苗 / 烟占着的空气
    else if (o === WATER || o === SALTWATER) { wetJ = j; wx = nx; wy = ny; }
  }
  if (wetJ >= 0) {
    st.hiss++;
    if (t === OIL) {                         // 油火遇水：水瞬间汽化，把燃烧的油崩成飞溅的火滴
      if (rnd() < 0.25) {
        morph(wetJ, STEAM, wx, wy); temp[wetJ] = 160;
        if (fpCount < FP_MAX - 100) {
          spawnFree(OIL, x + 0.5, y + 0.5, lx * (rnd() - 0.5) * 3.2 - gx * (1.5 + rnd() * 2), ly * (rnd() - 0.5) * 3.2 - gy * (1.5 + rnd() * 2), 700, seed[i]);
          clearCell(i, x, y);
          return true;
        }
      }
    } else {                                 // 水吸热、汽化；降到燃点以下就熄灭
      T -= 150; temp[i] = T;
      if (rnd() < 0.5) { morph(wetJ, STEAM, wx, wy); temp[wetJ] = 160; }
      else temp[wetJ] += 25;
      if (T < M_IGN[t]) {
        flags[i] = (flags[i] & ~F_BURN) | F_SCORCH; noteExtinguish(x, y);
        emitSmoke(x, y, 0);
        return false;
      }
    }
  }
  if (airJ < 0 || airStale >= STALE_MAX) {          // 缺氧：不放热、不耗燃料，很快闷熄
    if (rnd() < 0.12) { flags[i] = (flags[i] & ~F_BURN) | F_SCORCH; noteExtinguish(x, y); if (rnd() < 0.5) emitSmoke(x, y, 2); }
    return false;
  }
  aux[airJ] = airStale + 3 > 255 ? 255 : airStale + 3;                    // 消耗氧气
  for (let k = 0; k < 4; k++) {                                           // 火焰直接烘烤贴着的可燃物
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (M_FLAM[type[j]] > 0 && !(flags[j] & F_BURN)) { temp[j] += 6; wake(nx, ny); }
  }
  const bt = M_BURNTEMP[t];
  if (T < bt) temp[i] = T + (bt - T) * 0.25;           // 燃烧放热
  if (rnd() < M_FLAME[t]) emitFlame(x, y, t);
  if (rnd() < 0.012) {                                 // 偶尔迸出一粒余烬，随风飘去点燃别处
    const ex = x - gx, ey = y - gy;
    if (ex >= 0 && ex < W && ey >= 0 && ey < H && type[ex + ey * W] === 0) put(ex + ey * W, EMBER, ex, ey);
  }
  if (rnd() < (airStale > 90 ? 0.06 : 0.012)) emitSmoke(x, y, airStale > 90 ? 2 : 1);   // 越缺氧烟越黑越浓
  const a = aux[i];
  if (M_RIGID[t] && a > 0) {                           // 烧焦的木头越来越不结实
    aux[i] = a > 2 ? a - 2 : 0;
    if ((a >= 70 && a - 2 < 70) || (a >= 91 && a - 2 < 91)) markStructAround(i);
  }
  const F = fuel[i];
  if (F > 1) { fuel[i] = F - 1; return false; }
  // 燃料烧完
  if (rnd() < M_RESIDUE[t]) morph(i, M_BURNINTO[t], x, y);
  else put(i, FIRE, x, y);
  return true;
}

/* ==== src/engine/paint.js ==== */

/* ---------------------------------------------------------------------
 * 2.13 绘制到网格（笔刷、预设、测试共用）与统计
 * ------------------------------------------------------------------- */
// 返回 1 = 放下了一格，-1 = 擦掉了一格，0 = 没变（预算系统按这个扣材料）
function paintCell(x, y, t, replace) {
  if (x < 0 || x >= W || y < 0 || y >= H) return 0;
  const i = x + y * W;
  if (flags[i] & F_BODY) return 0;
  if (t === TOOL_ERASE) { if (type[i] !== 0) { clearCell(i, x, y); return -1; } return 0; }
  if (t === TOOL_HEAT) { temp[i] = Math.min(2500, temp[i] + 60); wake(x, y); return 0; }
  if (t === TOOL_COOL) { temp[i] = Math.max(-200, temp[i] - 60); wake(x, y); return 0; }
  if (t >= 100) return 0;
  const o = type[i];
  if (o === t) return 0;
  if (o !== 0 && !replace) return 0;
  put(i, t, x, y);
  return 1;
}

function fillRect(t, x0, y0, x1, y1) {
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W - 1, x1 | 0); y1 = Math.min(H - 1, y1 | 0);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = x + y * W;
    if (t === EMPTY) clearCell(i, x, y); else put(i, t, x, y);
  }
}

function fillCircle(t, cx, cy, r, chance) {
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
    if (!inb(x, y)) continue;
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy > r2) continue;
    if (chance !== undefined && rnd() > chance) continue;
    if (t === EMPTY) clearCell(x + y * W, x, y); else put(x + y * W, t, x, y);
  }
}

function countType(t, x0, y0, x1, y1) {
  if (x0 === undefined) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }
  let n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (type[x + y * W] === t) n++;
  return n;
}

// 水量账本：所有形态的水加起来（单位：格水）。没有外部输入输出时应当守恒。
function totalWater() {
  let n = 0, w = 0;
  for (let i = 0; i < N; i++) {
    const t = type[i];
    if (t === 0) continue;
    if (t === WATER || t === SALTWATER || t === STEAM || t === ICE || t === SNOW) n++;
    w += wet[i];
  }
  for (let k = 0; k < FP_MAX; k++) {
    if (!fpAlive[k]) continue;
    const t = fpType[k];
    if (t === WATER || t === SALTWATER || t === STEAM || t === ICE || t === SNOW) n++;
  }
  return n + w / 100 + weatherWater() + env.waterSink + env.waterOut - env.waterIn;
}

/* ==== src/engine/fluids.js ==== */

/* ---------------------------------------------------------------------
 * 2.1 运动：粉末 / 液体 / 气体。方向全部用重力向量 g 和侧向向量 l 表达，
 *     四个重力方向共用同一份代码。
 *     惯性的做法：连续下落会加速（每步最多 4 格）；高速砸到东西时，
 *     粒子（或被它挤开的液体）转成带浮点位置和速度的飞行粒子弹出去 → 飞溅、反弹。
 * ------------------------------------------------------------------- */
function windPush(x, y, i, t, k) {
  const wv = windX[(x >> 3) + (y >> 3) * GW];
  if (wv !== 0 && rnd() < (wv < 0 ? -wv : wv) * k) {
    const nx = x + (wv > 0 ? 1 : -1);
    if (nx >= 0 && nx < W && type[nx + y * W] === 0) { swapCells(i, nx + y * W, x, y, nx, y); return true; }
  }
  return false;
}

function foamAt(x, y) {
  for (let k = -1; k <= 1; k++) {
    const nx = x - gx + lx * k, ny = y - gy + ly * k;
    if (inb(nx, ny) && type[nx + ny * W] === 0) { put(nx + ny * W, FOAM, nx, ny); return; }
  }
}

// 高速砸进液面：被挤上来的那格液体变成水花飞出去，液面起涟漪和泡沫
function splash(x, y, i, liquid) {
  addRipple(x, y);
  if (fpCount < FP_MAX - 200 && rnd() < 0.6) {
    spawnFree(liquid, x + 0.5, y + 0.5,
              lx * (rnd() - 0.5) * 2.6 - gx * (1 + rnd() * 1.6), ly * (rnd() - 0.5) * 2.6 - gy * (1 + rnd() * 1.6),
              temp[i], seed[i]);
    clearCell(i, x, y);
  }
  if (liquid !== LAVA && liquid !== OIL && rnd() < 0.3) foamAt(x, y);
}

function movePowder(x, y, i, t) {
  let sp = flags[i] >> 6;                    // 连续下落帧数 → 每步多走几格
  if (t === SNOW) { sp = 0; if (rnd() < 0.45) { wake(x, y); return; } }   // 雪飘得慢
  let cx = x, cy = y, ci = i, moved = 0;
  const base = t * NT;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (o !== 0) {
      const so = M_STATE[o];
      if (so < S_LIQUID) break;
      if (so === S_LIQUID) {                 // 沉降速度看密度差和粘度；比液体轻就浮着
        const p = SINKP[base + o];
        if (p > 0) {
          if (rnd() < p) {
            swapCells(ci, j, cx, cy, nx, ny);
            if (sp >= 2) splash(cx, cy, ci, o);
            ci = j; cx = nx; cy = ny; moved = 2;
          } else wake(cx, cy);
        }
        break;
      }
    }
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny; moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.powder++;
    const ux = x - gx, uy = y - gy;          // 原来压在它上面的如果是刚性固体，支撑关系可能变了
    if (ux >= 0 && ux < W && uy >= 0 && uy < H && M_RIGID[type[ux + uy * W]]) markStruct(ux + uy * W);
    if (moved === 1 && M_WIND[t] > 0) windPush(cx, cy, ci, t, M_WIND[t]);
    return;
  }
  if (sp) {
    flags[i] &= ~F_FALL;
    const ux = x - gx, uy = y - gy;
    if (sp === 3 && wet[i] <= 60 && fpCount < FP_MAX - 400 && rnd() < 0.12 &&
        ux >= 0 && ux < W && uy >= 0 && uy < H && type[ux + uy * W] === 0) {       // 高速落地、头顶是空的：弹起来
      const d = rnd() < 0.5 ? 1 : -1, v = 0.5 + rnd();
      spawnFree(t, x + 0.5, y + 0.5, lx * d * v - gx * (0.6 + rnd() * 0.8), ly * d * v - gy * (0.6 + rnd() * 0.8), temp[i], seed[i]);
      clearCell(i, x, y);
      return;
    }
  }
  // 滑落：侧下方要有 need 格深的落差才滑。松散粉末 1 格（约 45°），土 2 格（更陡），湿沙 4 格（近乎直立）
  const need = wet[i] > 60 ? 4 : M_SLIDE[t];
  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {
    const dd = s ? -d : d;
    let ok = true, j1 = -1, x1 = 0, y1 = 0;
    for (let k = 1; k <= need; k++) {
      const nx = x + gx * k + lx * dd, ny = y + gy * k + ly * dd;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) { ok = false; break; }
      const j = nx + ny * W, o = type[j];
      if (k === 1) {
        if (!(o === 0 || M_STATE[o] >= S_GAS || rnd() < SINKP[base + o] * 0.7)) { ok = false; break; }
        j1 = j; x1 = nx; y1 = ny;
      } else if (!(o === 0 || M_STATE[o] >= S_LIQUID)) { ok = false; break; }
    }
    if (ok) { swapCells(i, j1, x, y, x1, y1); st.powder++; return; }
  }
}

// 液体能否沿重力方向挤进 o：空气、气体、更轻的液体、更轻的粉末（让灰浮上来）
function liquidCanSink(t, o) {
  if (o === 0) return true;
  const so = M_STATE[o];
  if (so >= S_GAS) return true;
  if (so === S_LIQUID) return M_DENS[t] > M_DENS[o] && rnd() < 0.6;
  if (so === S_POWDER) return M_DENS[t] > M_DENS[o] && rnd() < 0.3;
  return false;
}

function moveLiquid(x, y, i, t) {
  const sp = flags[i] >> 6, visc = M_VISC[t];
  if (visc > 0.5 && rnd() < visc * 0.3) { wake(x, y); return; }       // 很粘：这一帧整个不动
  let cx = x, cy = y, ci = i, moved = 0;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (!liquidCanSink(t, o)) break;
    const dense = o !== 0 && M_STATE[o] < S_GAS;
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny;
    if (dense) { moved = 2; break; }
    moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.liquid++;
    if (moved === 1 && sp > 0 && visc < 0.3) windPush(cx, cy, ci, t, 0.5);   // 雨被风吹斜
    return;
  }
  if (sp) {
    flags[i] &= ~F_FALL;
    if (sp === 3 && visc < 0.5) {            // 高速落地
      const bx = x + gx, by = y + gy;
      const b = bx >= 0 && bx < W && by >= 0 && by < H ? type[bx + by * W] : STONE;
      if (M_STATE[b] === S_LIQUID) { addRipple(x, y); if (rnd() < 0.35) foamAt(x, y); }
      else if (fpCount < FP_MAX - 400 && rnd() < 0.25) {             // 砸在硬东西上：溅开
        const d = rnd() < 0.5 ? 1 : -1, v = 0.6 + rnd() * 1.2;
        spawnFree(t, x + 0.5, y + 0.5, lx * d * v - gx * (0.4 + rnd() * 0.9), ly * d * v - gy * (0.4 + rnd() * 0.9), temp[i], seed[i]);
        clearCell(i, x, y);
        return;
      }
    }
  }
  if (visc > 0 && rnd() < visc) return;      // 粘：这一帧不侧流

  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {              // 斜下
    const dd = s ? -d : d;
    const nx = x + gx + lx * dd, ny = y + gy + ly * dd;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (liquidCanSink(t, type[j])) { swapCells(i, j, x, y, nx, ny); st.liquid++; return; }
  }
  const disp = M_DISP[t];
  for (let s = 0; s < 2; s++) {              // 侧向扩散：找得到落差才一定流，否则只是偶尔漂一下（水面能静下来）
    const dd = s ? -d : d;
    let best = -1, bx = 0, by = 0, drop = false;
    for (let k = 1; k <= disp; k++) {
      const nx = x + lx * dd * k, ny = y + ly * dd * k;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
      const j = nx + ny * W, o = type[j];
      if (o !== 0 && M_STATE[o] < S_GAS) break;
      best = j; bx = nx; by = ny;
      const ux = nx + gx, uy = ny + gy;
      if (ux >= 0 && ux < W && uy >= 0 && uy < H) {
        const u = type[ux + uy * W];
        if (u === 0 || M_STATE[u] >= S_GAS || (M_STATE[u] === S_LIQUID && M_DENS[u] < M_DENS[t])) { drop = true; break; }
      }
    }
    if (best >= 0 && (drop || rnd() < 0.2)) { swapCells(i, best, x, y, bx, by); st.liquid++; return; }
  }
}

// 气体永远逆着重力走；会被风吹斜；能从液体里冒泡上去
function moveGas(x, y, i, t) {
  if (t === SMOKE && rnd() < 0.3) return;
  if (windPush(x, y, i, t, M_WIND[t] * 0.9)) return;
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
    const j = nx + ny * W, o = type[j];
    if (o === 0 || (M_STATE[o] === S_LIQUID && rnd() < 0.3) ||
        (M_STATE[o] === S_GAS && M_DENS[o] > M_DENS[t] && rnd() < 0.3)) {
      swapCells(i, j, x, y, nx, ny);
      return;
    }
  }
  const d = rnd() < 0.5 ? 1 : -1;
  nx = x + lx * d; ny = y + ly * d;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === 0) swapCells(i, nx + ny * W, x, y, nx, ny);
}

/* ==== src/engine/cells.js ==== */
// 植物能不能长：要有光，气温也要在 2°C 以上
function canGrow() { return env.sun >= 0.12 && env.ambient > 2; }

/* ---------------------------------------------------------------------
 * 2.4 特殊材料钩子（返回 true 表示这一格已经处理完）
 * ------------------------------------------------------------------- */
// 火焰和余烬舔到可燃物会把它烤热：火苗被风吹到哪边，火就往哪边蔓延
function scorchNeighbors(x, y, heat) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (M_FLAM[type[j]] > 0 && !(flags[j] & (F_BURN | F_BODY))) { temp[j] += heat; wake(nx, ny); }
  }
}
function hookFire(x, y, i) { if (temp[i] < 700) temp[i] = 700; st.fire++; scorchNeighbors(x, y, 16); return false; }
function hookEmber(x, y, i) { if (temp[i] < 600) temp[i] = 600; scorchNeighbors(x, y, 22); return false; }

function hookLava(x, y, i) {
  if (rnd() < 0.002) {                               // 偶尔迸出余烬
    const nx = x - gx, ny = y - gy;
    if (inb(nx, ny) && type[nx + ny * W] === 0) put(nx + ny * W, EMBER, nx, ny);
  }
  return false;
}

// 水把贴着的吸水材料打湿，自己按量减少（100 单位含水量 = 一格水）
function hookWater(x, y, i) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) continue;
    if (temp[j] > 120 && M_STATE[o] < S_LIQUID) { temp[j] -= 30; temp[i] += 8; wake(x, y); wake(nx, ny); }   // 水贴着高温的东西：把热量带走（自己会被烧开）
    const cap = M_ABSORB[o];
    if (cap === 0) continue;
    const w = wet[j];
    if (w >= cap || (flags[j] & F_BODY)) continue;
    wake(x, y);
    if (rnd() < 0.2) {
      const add = cap - w < 34 ? cap - w : 34;
      wet[j] = w + add;
      if (w <= 60 && w + add > 60) wake(nx, ny);
      if (rnd() * 100 < add) { clearCell(i, x, y); return true; }
    }
  }
  return false;
}

// 蒸汽碰到冷的表面直接凝成水珠
function hookSteam(x, y, i) {
  if (rnd() > 0.25) return false;
  const k = rndi(4), nx = x + DX4[k], ny = y + DY4[k];
  if (nx < 0 || nx >= W || ny < 0 || ny >= H) return false;
  const j = nx + ny * W, o = type[j];
  if (o !== 0 && M_STATE[o] < S_LIQUID && temp[j] < 50 && rnd() < 0.3) {
    type[i] = WATER; life[i] = 0; flags[i] = parity; temp[i] = 60; WL.wallCondense++;
    wake(x, y);
    return true;
  }
  return false;
}

// 泡沫：浮在液面上不动，脚下空了才往下掉
function hookFoam(x, y, i) {
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H && type[bx + by * W] === 0) swapCells(i, bx + by * W, x, y, bx, by);
  return true;
}

function hookPlant(x, y, i) {
  if (flags[i] & F_TIP) { wake(x, y); if (rnd() < 0.06) growTip(x, y, i); return false; }
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H && type[bx + by * W] === 0) {
    for (let k = 0; k < 8; k++) {                    // 周围没有任何支撑才会落下
      const nx = x + DX8[k], ny = y + DY8[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && M_STATE[o] < S_LIQUID) return false;
    }
    swapCells(i, bx + by * W, x, y, bx, by);
    return true;
  }
  return false;
}

function hookClone(x, y, i) {
  let src = life[i];
  const k0 = rndi(4);
  if (!src) {                                          // 还没记住任何材料：锁定第一个碰到的
    for (let k = 0; k < 4; k++) {
      const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && o !== CLONE && o !== VOID && o !== ANCHOR && !(flags[nx + ny * W] & F_BODY)) { src = o; break; }
    }
    if (!src) return false;
    life[i] = src;
  }
  wake(x, y);
  if (rnd() >= 0.1) return false;
  for (let k = 0; k < 4; k++) {
    const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if (type[nx + ny * W] === 0) { put(nx + ny * W, src, nx, ny); if (src === WATER || src === SALTWATER || src === STEAM || src === SNOW || src === ICE) WL.cloneIn++; return false; }
  }
  return false;
}

function hookVoid(x, y, i) {
  wake(x, y);
  for (let n = 0; n < 10; n++) {
    const dx = rndi(11) - 5, dy = rndi(11) - 5, d2 = dx * dx + dy * dy;
    if (d2 === 0 || d2 > 25) continue;
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    const j = px + py * W, o = type[j];
    if (o === 0 || o === VOID || o === ANCHOR || (flags[j] & F_BODY)) continue;
    if (d2 <= 2) { if (o === WATER || o === SALTWATER || o === SNOW || o === ICE || o === STEAM) WL.voidOut++; clearCell(j, px, py); continue; }
    if (rnd() < 0.6) {
      let sx = dx > 0 ? -1 : dx < 0 ? 1 : 0, sy = dy > 0 ? -1 : dy < 0 ? 1 : 0;
      const adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
      if (adx > 2 * ady) sy = 0; else if (ady > 2 * adx) sx = 0;
      const qx = px + sx, qy = py + sy, q = qx + qy * W, qt = type[q];
      if (qt === 0) { swapCells(j, q, px, py, qx, qy); if (M_RIGID[o]) { markStructAround(j); markStructAround(q); } }
      else if (qt === VOID) { if (o === WATER || o === SALTWATER || o === SNOW || o === ICE || o === STEAM) WL.voidOut++; clearCell(j, px, py); }
    }
  }
  return false;
}

function hookSpark(x, y, i) {
  st.elec++;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) continue;
    if (M_ELEC[o]) addCharge(j, 255);
    else if (M_FLAM[o] > 0) { temp[j] += 260; wake(nx, ny); }
  }
  const f = flags[i];
  if (f & F_TIP) {                                   // 只有「头」会继续向前窜并分叉，后面的留下来当亮线
    flags[i] = f & ~F_TIP;
    const L = life[i];
    if (L > 3) {
      const n = rnd() < 0.3 ? 2 : 1;
      for (let b = 0; b < n; b++) {
        const k = rndi(8), nx = x + DX8[k], ny = y + DY8[k];
        if (inb(nx, ny) && type[nx + ny * W] === 0) {
          const j = nx + ny * W;
          put(j, SPARK, nx, ny);
          life[j] = L - 1 - rndi(2);
        }
      }
    }
  }
  return false;
}

const HOOK = new Array(NT).fill(null);
HOOK[FIRE] = hookFire; HOOK[EMBER] = hookEmber; HOOK[LAVA] = hookLava; HOOK[PLANT] = hookPlant;
HOOK[CLONE] = hookClone; HOOK[VOID] = hookVoid; HOOK[SPARK] = hookSpark;
HOOK[WATER] = hookWater; HOOK[SALTWATER] = hookWater; HOOK[STEAM] = hookSteam; HOOK[FOAM] = hookFoam;

/* ---------------------------------------------------------------------
 * 2.5 接触规则执行（规则本身在 1.3 的 RULES 表里）
 * ------------------------------------------------------------------- */
function applyRule(r, i, j, x, y, nx, ny) {
  noteRule(r.idx, x, y);
  if (r.tag === 'hiss') st.hiss++;
  if (r.b2 !== r.b) {
    morph(j, r.b2, nx, ny);
    if (r.bT !== undefined) temp[j] = r.bT;
  }
  if (r.bDT !== undefined) { temp[j] += r.bDT; wake(nx, ny); }
  if (r.use && rnd() < r.use) { clearCell(i, x, y); return true; }
  if (r.aDT !== undefined) temp[i] += r.aDT;
  if (r.a2 !== r.a) {
    morph(i, r.a2, x, y);
    if (r.aT !== undefined) temp[i] = r.aT;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------------------
 * 2.6 单格更新：烘干 → 相变 → 燃烧 → 寿命 → 钩子 → 接触规则 → 运动
 * ------------------------------------------------------------------- */
function updateCell(x, y, i) {
  const t = type[i];
  let f = flags[i];
  if ((f & F_PAR) === parity) return;        // 本帧已经处理过（刚移动进来的）
  f ^= F_PAR; flags[i] = f;
  if (f & F_BODY) return;                    // 刚体盖的章，由刚体系统管
  let T = temp[i];

  // 湿的东西过了 100°C 先烘干：吸热、放出水汽，烘干之前点不着
  const w = wet[i];
  if (w > M_SAP[t] && T > 100) {
    wet[i] = w - 1; T -= 120; temp[i] = T;   // 汽化潜热很大：每烘掉 1 单位水分要吃掉 120°C，一个燃烧的邻格烤不干一块湿透的木头
    const d = 1;
    vaporAdd(x, y, d / 100); WL.evapWet += d / 100;
    wake(x, y);
    if (rnd() < 0.04) emitSmoke(x, y, 0);
  }

  // 温度相变
  if (T > M_MELT[t]) {
    const lat = M_LATENT[t];
    if (lat > 0) {                           // 有潜热的（冰、雪）：多出来的热量先攒着，攒够才融化
      const add = ((T - M_MELT[t]) * M_LATK[t]) | 0;
      temp[i] = M_MELT[t];
      if (add > 0) {
        const L = life[i] + add;
        if (L >= lat) { morph(i, M_MELTINTO[t], x, y); return; }
        life[i] = L; wake(x, y);
      }
    } else { morph(i, M_MELTINTO[t], x, y); return; }
  } else if (T > M_BOIL[t]) {
    morph(i, M_BOILINTO[t], x, y); temp[i] = T < 135 ? 160 : T + 25; st.boil++;
    return;
  } else if (T < M_FREEZE[t]) {
    if (t === STEAM) {
      if (openSky(x, y)) { clearCell(i, x, y); vaporAdd(x, y, 1); WL.steamToVapor++; }   // 头顶通着天：变成看不见的水汽升上去
      else { type[i] = WATER; life[i] = 0; flags[i] = parity; temp[i] = 60; WL.wallCondense++; wake(x, y); }   // 关在容器里：就地凝成水珠
      return;
    }
    const lat = M_FLATENT[t];
    if (lat > 0) {                           // 结冰要放出潜热：温度钉在冰点，放够了才变成冰
      const add = ((M_FREEZE[t] - T) * 4) | 0;
      temp[i] = M_FREEZE[t];
      if (add > 0) {
        const L = life[i] + add;
        if (L >= lat) { morph(i, M_FREEZEINTO[t], x, y); temp[i] = M_FREEZE[t] - 0.5; return; }
        life[i] = L; wake(x, y);
      }
    } else { morph(i, M_FREEZEINTO[t], x, y); return; }
  } else if (M_FLATENT[t] > 0 && life[i] > 0) life[i] = 0;    // 回暖了：结冰进度清零

  // 燃烧
  if (M_FLAM[t] > 0) {
    if (f & F_BURN) { if (burnStep(x, y, i, t, T)) return; }
    else if (T >= M_IGN[t] && wet[i] <= M_SAP[t] && (M_BLAST[t] || hasOxygen(x, y))) { if (rnd() < M_FLAM[t]) ignite(i, t, x, y); else wake(x, y); }
  }

  // 有寿命的（火、烟、余烬、电火花、泡沫）
  if (M_LIFE0[t] > 0) {
    const L = life[i];
    if (L <= 1) {
      if (rnd() < M_DECAYP[t]) { morph(i, M_DECAY[t], x, y); seed[i] = 90 + rndi(60); if (temp[i] > 200) temp[i] = 200; }
      else clearCell(i, x, y);
      return;
    }
    life[i] = L - 1;
    wake(x, y);
  }

  const hk = HOOK[t];
  if (hk !== null && hk(x, y, i)) return;

  if (HASRX[t]) {
    const base = t * NT;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const j = nx + ny * W, o = type[j];
      if (o === 0) continue;
      const r = RX[base + o];
      if (r === null || (flags[j] & F_BODY)) continue;
      wake(x, y);                            // 只要身边有能反应的对象，这一块就保持清醒
      if ((r.maxT === undefined || T < r.maxT) && rnd() < r.p) {     // 温度条件按这一步开始时的温度判断
        if (applyRule(r, i, j, x, y, nx, ny)) return;
      }
    }
  }

  switch (M_STATE[t]) {
    case S_POWDER: movePowder(x, y, i, t); break;
    case S_LIQUID: moveLiquid(x, y, i, t); break;
    case S_GAS: moveGas(x, y, i, t); break;
  }
}

/* ==== src/engine/plants.js ==== */

/* ---------------------------------------------------------------------
 * 2.3 植物：基因来自 seed 字节，整株共用
 *     低 4 位：株高上限 8~32 格；4-5 位：分叉概率；6-7 位：叶片密度
 * ------------------------------------------------------------------- */
function plantLifespan(g) { return 2400 + (g & 15) * 160; }  // 寿命（慢速过程的轮次，约等于秒）：40~80 分钟
function geneHeight(g) { return 8 + (((g & 15) * 1.6) | 0); }
function geneBranch(g) { return 0.05 + ((g >> 4) & 3) * 0.05; }
function geneLeaf(g) { return 0.3 + ((g >> 6) & 3) * 0.13; }

// 头顶 14 格内有没有被固体挡住，或者被别的枝叶遮得太厉害
function skyOpen(x, y) {
  let leaves = 0;
  for (let k = 1; k <= 14; k++) {
    const nx = x - gx * k, ny = y - gy * k;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) return true;
    const o = type[nx + ny * W];
    if (o === PLANT || o === FLOWER) { if (++leaves > 7) return false; }
    else if (o !== 0 && M_STATE[o] < S_LIQUID) return false;
  }
  return true;
}

function biomass(x, y, r) {
  let n = 0;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === PLANT) n++;
  }
  return n;
}

// 离地多高：顺着重力往下数，穿过空气和枝叶，直到碰到别的东西
function stemHeight(x, y) {
  let n = 0;
  for (let k = 1; k <= 48; k++) {
    const nx = x + gx * k, ny = y + gy * k;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const o = type[nx + ny * W];
    if (o !== 0 && o !== PLANT && o !== FLOWER) break;
    n++;
  }
  return n;
}

// 生长要用水：先从茎里的水分取，取不到就顺着茎往下找到根，从脚下的湿土或旁边的水里取。取不到就不长。
function drawSap(x, y, need) {
  let cx = x, cy = y;
  for (let n = 0; n < 50; n++) {
    const c = cx + cy * W;
    if (wet[c] >= need) { wet[c] -= need; env.waterSink += need / 100; WL.plantUse += need / 100; return true; }
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) return false;
    if (type[nx + ny * W] === PLANT) { cx = nx; cy = ny; continue; }
    let found = false;
    for (let d = -1; d <= 1; d += 2) {
      const ax = nx + lx * d, ay = ny + ly * d;
      if (ax >= 0 && ax < W && ay >= 0 && ay < H && type[ax + ay * W] === PLANT) { cx = ax; cy = ay; found = true; break; }
    }
    if (found) continue;
    const b = nx + ny * W, o = type[b];
    if ((o === SOIL || o === SAND) && wet[b] >= need) { wet[b] -= need; env.waterSink += need / 100; WL.plantUse += need / 100; return true; }
    for (let k = 0; k < 4; k++) {
      const wx = cx + DX4[k], wy = cy + DY4[k];
      if (wx < 0 || wx >= W || wy < 0 || wy >= H || type[wx + wy * W] !== WATER) continue;
      if (rnd() * 100 < need) clearCell(wx + wy * W, wx, wy);
      env.waterSink += need / 100; WL.plantUse += need / 100;
      return true;
    }
    return false;
  }
  return false;
}

function bloom(x, y, i) {
  flags[i] &= ~F_TIP;
  const g = seed[i], dens = geneLeaf(g);
  for (let k = 0; k < 8; k++) {                      // 展叶：每片叶子也要水
    const nx = x + DX8[k], ny = y + DY8[k];
    if (!inb(nx, ny) || type[nx + ny * W] !== 0 || rnd() > dens) continue;
    if (!drawSap(x, y, 6)) break;
    const j = nx + ny * W;
    put(j, PLANT, nx, ny); seed[j] = g; wet[j] = 10;
  }
}

function growTip(x, y, i) {
  const e = life[i];
  if (e <= 0) { bloom(x, y, i); return; }
  if (!canGrow() || !skyOpen(x, y)) return;           // 没光、太冷都不长
  const g = seed[i];
  if (stemHeight(x, y) >= geneHeight(g)) { life[i] = 0; return; }   // 到株高上限了：停止长高，展叶
  const side = rnd() < 0.3 ? (rnd() < 0.5 ? 1 : -1) : 0;
  const alt = rnd() < 0.5 ? 1 : -1;
  for (let a = 0; a < 3; a++) {
    const sd = a === 0 ? side : a === 1 ? (side === 0 ? alt : 0) : (side === 0 ? -alt : -side);
    const nx = x - gx + lx * sd, ny = y - gy + ly * sd;
    if (!inb(nx, ny)) continue;
    const j = nx + ny * W, o = type[j];
    if (!(o === 0 || M_STATE[o] === S_GAS)) continue;
    if (biomass(nx, ny, 3) > 26) { life[i] = 0; return; }   // 太挤：不再长高
    if (!drawSap(x, y, 14)) return;                         // 没水：等着
    put(j, PLANT, nx, ny); flags[j] |= F_TIP; life[j] = e - 1; seed[j] = g; wet[j] = 10;
    flags[i] &= ~F_TIP; life[i] = 0;
    if (e > 4 && rnd() < geneBranch(g)) {                   // 分叉
      const bs = rnd() < 0.5 ? 1 : -1;
      const bx = x + lx * bs - gx, by = y + ly * bs - gy;
      if (inb(bx, by) && type[bx + by * W] === 0 && drawSap(x, y, 14)) {
        const bj = bx + by * W;
        put(bj, PLANT, bx, by); flags[bj] |= F_TIP; life[bj] = (e >> 1) + 1; seed[bj] = g; wet[bj] = 10;
      }
    }
    return;
  }
  life[i] = 0;                                              // 被挡住：直接展叶
}

function sprout(i, x, y) {
  const wasRigid = M_RIGID[type[i]];
  type[i] = PLANT; flags[i] = parity | F_TIP; life[i] = geneHeight(seed[i]); wet[i] = 30; fuel[i] = initFuel(PLANT); aux[i] = 0;
  if (wasRigid) markStructAround(i);
  wake(x, y);
}

/* ==== src/engine/scenes.js ==== */

/* =====================================================================
 * 2.15 预设场景（不依赖 DOM，自测和 soak 测试也用它）
 * ===================================================================== */
// 场景状态：场景自带的持续过程（比如火山喷发），每个模拟步由 stepScene 推进。
// 它是纯数据，可以存档、可以算进哈希；不要在这里放函数或闭包。
let sceneState = null;

function stepScene() {
  const s = sceneState;
  if (s === null) return;
  if (s.kind === 'eruption') {
    if (s.armed) { if (env.el < -0.05) s.armed = false; else return; }
    if (s.budget <= 0) return;
    const cx = s.cx, mouth = s.mouth;
    for (let x = cx - 2; x <= cx + 2; x++) {          // 火山口底下涌出新的熔岩，凝住的口子会被重新顶开
      const y = mouth + 5, i = x + y * W, t = type[i];
      if (t === LAVA) { if (temp[i] < 1400) temp[i] = 1500; wake(x, y); }
      else if (t === 0 || t === STONE) { put(i, LAVA, x, y); s.budget--; }
    }
    for (let n = 0; n < 2; n++) {                     // 把岩浆柱往上顶
      const tx = cx - 2 + rndi(5), ty = mouth + 4;
      for (let y = ty; y > 2; y--) {
        const j = tx + y * W;
        if (type[j] === 0) { put(j, LAVA, tx, y); s.budget--; break; }
        if (type[j] === STONE) { put(j, LAVA, tx, y); break; }
        if (type[j] !== LAVA) break;
      }
    }
  }
}

function setBurning(x, y) {
  if (!inb(x, y)) return;
  const i = x + y * W, t = type[i];
  if (M_FLAM[t] > 0) { temp[i] = M_IGN[t] + 150; wet[i] = 0; ignite(i, t, x, y); }
}

function soakSoil(amount) {
  for (let i = 0; i < N; i++) if (type[i] === SOIL || type[i] === SAND) wet[i] = Math.min(M_ABSORB[type[i]], amount);
}

function cloneSource(x, y, mat) {
  if (!inb(x, y)) return;
  const i = x + y * W;
  put(i, CLONE, x, y); life[i] = mat;
}

function drawTree(x, ground, h, r) {
  for (let y = ground - h; y < ground; y++) for (let dx = 0; dx < 2; dx++) if (inb(x + dx, y)) put(x + dx + y * W, WOOD, x + dx, y);
  const gene = rndi(256);
  for (let k = 0; k < 3; k++) {
    const ox = x + rndi(7) - 3, oy = ground - h - rndi(4);
    for (let y = Math.floor(oy - r); y <= oy + r; y++) for (let xx = Math.floor(ox - r); xx <= ox + r; xx++) {
      const dx = xx - ox, dy = (y - oy) * 1.25;
      if (!inb(xx, y) || dx * dx + dy * dy > r * r || type[xx + y * W] !== 0 || rnd() < 0.12) continue;
      put(xx + y * W, PLANT, xx, y); seed[xx + y * W] = gene;
    }
  }
}

function groundLine(amp, k1, k2, baseY) {
  const g = new Int32Array(W);
  for (let x = 0; x < W; x++) g[x] = Math.floor(baseY + dsin(x * k1) * amp + dsin(x * k2 + 1.7) * amp * 0.6);
  return g;
}

function buildVolcano(withSource) {
  const cx = W >> 1, base = H - 5, peak = Math.floor(H * 0.56), half = Math.floor(W * 0.3), sea = Math.floor(H * 0.74);
  fillRect(STONE, 0, base, W - 1, H - 1);
  const top = new Int32Array(W);
  for (let x = 0; x < W; x++) {
    const k = Math.max(0, 1 - Math.abs(x - cx) / half);
    const h = Math.floor((k * Math.sqrt(Math.sqrt(k))) * peak + (k > 0 ? dsin(x * 0.31) * 2 + dsin(x * 0.11) * 3 : 0));
    top[x] = base - Math.max(0, h);
    for (let y = top[x]; y < base; y++) put(x + y * W, STONE, x, y);
    if (top[x] > sea - 4 && top[x] < base) for (let y = top[x] - 2; y < top[x]; y++) if (inb(x, y)) put(x + y * W, SAND, x, y);   // 海滩
  }
  for (let y = sea; y < base; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === 0) put(x + y * W, WATER, x, y);
  const mouth = top[cx], depth = Math.floor(peak * 0.42);
  fillRect(LAVA, cx - 2, mouth + 4, cx + 2, mouth + depth);
  fillCircle(LAVA, cx, mouth + depth, 7);
  fillRect(EMPTY, cx - 2, mouth - 6, cx + 2, mouth + 3);
  // 岩浆供给交给场景状态（可存档）：budget 格岩浆喷完就停；armed = 等太阳落山才开始
  sceneState = { kind: 'eruption', cx, mouth, budget: withSource || 6000, armed: !withSource };
  for (let k = 0; k < 26; k++) {                        // 山腰点几丛植物
    const x = cx + (rnd() < 0.5 ? -1 : 1) * Math.floor(half * (0.45 + rnd() * 0.4));
    if (x < 1 || x >= W - 1 || top[x] >= sea) continue;
    for (let h = 1; h <= 2 + rndi(4); h++) if (inb(x, top[x] - h)) put(x + (top[x] - h) * W, PLANT, x, top[x] - h);
  }
}

function sceneVolcano() {
  env.time = 0.85; env.timeScale = 1; setWeather('clear'); env.wind = 0.3;
  buildVolcano(2500);       // 一次喷发的岩浆总量有限（约 5 分钟喷完），喷完火山就安静下来
}

function sceneVolcanoDayNight() {
  // 从下午开始，时间流速 10x（一昼夜 1 分钟）；太阳落山的那一刻火山口才打开
  env.time = 0.6; env.timeScale = 10; setWeather('clear'); env.wind = -0.3;
  buildVolcano(0);                                    // 太阳落山的那一刻才开始喷
}

function buildForest(density) {
  const g = groundLine(3, 0.035, 0.09, H - 16);
  for (let x = 0; x < W; x++) {
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
    if (rnd() < 0.8) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);       // 草
  }
  for (let x = 14; x < W - 12; x += Math.floor((17 + rndi(10)) / density)) drawTree(x, g[x], 16 + rndi(Math.max(4, Math.floor(H * 0.16))), 6 + rndi(4));
  for (let k = 0; k < W / 9; k++) {                       // 零星的花
    const x = 2 + rndi(W - 4), y = g[x] - 2 - rndi(2), c = rndi(5) * 51 + 8;
    if (inb(x, y) && type[x + y * W] === PLANT) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); }
  }
  soakSoil(70);
  return g;
}

function sceneForest() {
  env.time = 0.92; env.timeScale = 0; setWeather('clear'); env.wind = 0.5; env.windPower = 0.4;     // 夜里的森林大火，时间定格
  const g = buildForest(1);
  for (let x = 12; x < 20; x++) for (let y = g[14] - 6; y < g[14]; y++) setBurning(x, y);   // 左边第一棵树的树根处点火
}

function sceneStormForest() {
  // 雷暴：闪电自己劈下来点着树，雨再把火浇灭；两侧各有一个排水口，积水不会无限涨
  env.time = 0.36; env.timeScale = 0; setWeather('storm'); env.wind = 0.6;     // 白天的雷暴：烧过的地方见得到光，才长得回来
  const g = buildForest(1.3);
  for (const x of [0, W - 1]) for (let y = g[x] - 4; y < g[x] + 2; y++) if (inb(x, y)) { const i = x + y * W; put(i, VOID, x, y); }
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.6;      // 开场就有云
  env.waterIn += weatherWater();
}

function sceneHourglass() {
  env.time = 0.45; env.timeScale = 0; setWeather('clear'); env.wind = 0;
  const cx = W >> 1, cy = H >> 1, b = Math.floor(H * 0.42), a = Math.floor(Math.min(W * 0.2, b * 0.75));
  const inner = (x, y) => {
    const dy = Math.abs(y - cy);
    return dy <= b - 3 && Math.abs(x - cx) <= 1 + (a - 4) * dy / b;
  };
  for (let y = cy - b; y <= cy + b; y++) for (let x = cx - a - 3; x <= cx + a + 3; x++) {
    if (!inb(x, y)) continue;
    if (inner(x, y)) continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) if (inner(x + dx, y + dy)) { near = true; break; }
    if (near) put(x + y * W, GLASS, x, y);
  }
  for (let y = cy - b + 3 + Math.floor(b * 0.12); y < cy - 2; y++) for (let x = cx - a; x <= cx + a; x++) if (inner(x, y)) put(x + y * W, SAND, x, y);
  fillRect(WOOD, cx - a - 6, cy - b - 3, cx + a + 6, cy - b - 1);
  fillRect(WOOD, cx - a - 6, cy + b + 1, cx + a + 6, cy + b + 3);
  for (const sx of [cx - a - 6, cx + a + 5]) fillRect(WOOD, sx, cy - b - 1, sx + 1, cy + b + 1);
  // 四个角钉上锚点：整个架子悬在画面中间，翻转重力也不会掉
  for (const ax of [cx - a - 6, cx + a + 5]) for (const ay of [cy - b - 3, cy + b + 2]) fillRect(ANCHOR, ax, ay, ax + 1, ay + 1);
}

function drawBeaker(x0, y1, w, h, liquid, fill) {
  for (let y = y1 - h; y <= y1; y++) for (let x = x0; x <= x0 + w; x++) {
    if (x <= x0 + 1 || x >= x0 + w - 1 || y >= y1 - 1) put(x + y * W, GLASS, x, y);
    else if (liquid && y > y1 - 1 - h * fill) put(x + y * W, Array.isArray(liquid) ? liquid[rndi(liquid.length)] : liquid, x, y);
  }
}

function sceneLab() {
  env.time = 0.92; env.timeScale = 0; setWeather('clear'); env.wind = 0; env.windPower = 0;
  const floor = H - 4, table = Math.floor(H * 0.74);
  fillRect(STONE, 0, floor, W - 1, H - 1);
  fillRect(WOOD, 6, table, W - 7, table + 2);
  for (const lx0 of [10, W - 13]) fillRect(WOOD, lx0, table + 3, lx0 + 2, floor - 1);
  const n = 5, gap = Math.floor((W - 24) / n), bw = Math.min(gap - 8, Math.floor(W * 0.13)), bh = Math.floor(H * 0.3);
  const liquids = [OIL, WATER, ACID, SALTWATER, [OIL, WATER, SALTWATER]];
  for (let k = 0; k < n; k++) {
    const x0 = 14 + k * gap + ((gap - bw) >> 1);
    drawBeaker(x0, table - 1, bw, k === 4 ? Math.floor(bh * 1.5) : bh, liquids[k], k === 4 ? 0.8 : 0.62);
  }
  // 电路：左侧的电火花源（克隆体记住了电火花）→ 顶部金属导线 → 插进水槽的电极。导线两头用锚点固定
  const wy = Math.floor(table - bh * 1.5 - 12), waterX = 14 + gap + (gap >> 1), srcX = 8;
  fillRect(METAL, srcX + 2, wy, waterX, wy);
  fillRect(METAL, waterX, wy, waterX, table - 1 - Math.floor(bh * 0.35));
  cloneSource(srcX, wy, SPARK);
  fillRect(ANCHOR, srcX + 2, wy - 1, srcX + 3, wy - 1);
  fillRect(ANCHOR, waterX - 1, wy - 1, waterX + 1, wy - 1);
  // 右侧：一小堆火药，导线故意留了 3 格缺口，补上金属就会引爆
  const gpX = W - 26;
  fillRect(METAL, waterX + 4, wy, gpX - 4, wy);
  fillRect(EMPTY, waterX + 1, wy, waterX + 3, wy);
  fillRect(ANCHOR, waterX + 4, wy - 1, waterX + 5, wy - 1);
  fillRect(ANCHOR, gpX - 5, wy - 1, gpX - 3, wy - 1);
  fillRect(GLASS, gpX - 8, wy + 11, gpX + 8, wy + 12);
  fillRect(ANCHOR, gpX - 9, wy + 11, gpX - 9, wy + 12);
  fillRect(ANCHOR, gpX + 9, wy + 11, gpX + 9, wy + 12);
  fillCircle(GUNPOWDER, gpX - 1, wy + 8, 3.2);
  fillRect(METAL, gpX - 4, wy, gpX - 4, wy + 10);
}

// 爆破拆除：底层架空的混凝土柱 + 每层一道钢梁 + 砖墙玻璃窗。柱脚整段换成 TNT，用火药导爆索串起来。
// 返回建筑的范围，自测用它来判断塌没塌。
function buildDemolition(lit, floorY) {
  const floor = floorY === undefined ? H - 6 : floorY;
  fillRect(STONE, 0, floor, W - 1, Math.min(H - 1, floor + 5));
  const bw = Math.floor(W * 0.36), x0 = Math.floor(W * 0.46), sh = 20;
  const storeys = Math.max(3, Math.min(5, Math.floor((floor - 14) / sh)));
  const cols = 4, colW = 3;
  const colAt = k => x0 + Math.round((bw - colW) * k / cols);
  for (let s = 0; s < storeys; s++) {
    const yb = floor - 1 - s * sh, yt = yb - sh + 1;
    for (let k = 0; k <= cols; k++) fillRect(CONCRETE, colAt(k), yt + 2, colAt(k) + colW - 1, yb);     // 柱
    fillRect(STEEL, x0, yt, x0 + bw - 1, yt + 1);                                                    // 钢梁
    if (s === 0) continue;                                                                           // 底层架空
    for (let k = 0; k < cols; k++) {                                                                 // 砖墙 + 窗
      const xa = colAt(k) + colW, xb = colAt(k + 1) - 1;
      fillRect(BRICK, xa, yt + 2, xb, yb);
      fillRect(GLASS, xa + 3, yt + 6, xb - 3, yb - 6);
    }
  }
  const roof = floor - storeys * sh;
  fillRect(CONCRETE, x0 - 1, roof - 2, x0 + bw, roof - 1);
  // 炸药：除顶层以外每一层的每根柱子各三包，上下间隔不超过 8 格，一包炸了会殉爆相邻的 → 自下而上连锁。地面一条火药导爆索
  for (let st2 = 0; st2 < storeys - 1; st2++) {
    const f = floor - 1 - st2 * sh;
    for (let k = 0; k <= cols; k++) for (const dy of [3, 9, 15]) fillRect(TNT, colAt(k), f - dy - 1, colAt(k) + colW - 1, f - dy + 1);
    if (st2 > 0) for (let k = 0; k < cols; k++) {        // 承重墙也要预先削弱：墙脚每隔约 12 格埋一包（楼越宽，包越多）
      const xa = colAt(k) + colW, xb = colAt(k + 1) - 1, n = Math.max(1, Math.round((xb - xa) / 12));
      for (let q = 0; q < n; q++) { const x = Math.round(xa + (q + 0.5) * (xb - xa) / n); fillRect(TNT, x - 1, f - 3, x + 1, f - 1); }
    }
  }
  fillRect(GUNPOWDER, 6, floor - 1, x0 + bw - 1, floor - 1);
  if (lit) { setBurning(6, floor - 1); setBurning(7, floor - 1); }
  return { x0, x1: x0 + bw - 1, floor, roof, sh, storeys };
}

function sceneDemolition() {
  env.time = 0.42; env.timeScale = 0; setWeather('clear'); env.wind = 0.3; env.windPower = 0.3;
  buildDemolition(true);
}

function buildGarden() {
  const g = groundLine(4, 0.03, 0.075, H - 20);
  const pondX = Math.floor(W * 0.68), pondR = Math.floor(W * 0.09);
  for (let x = 0; x < W; x++) {
    const d = Math.abs(x - pondX);
    if (d < pondR) g[x] += Math.floor(dcos(d / pondR * 1.5708) * 9);       // 挖一个池塘
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
  }
  const level = Math.min(g[Math.max(0, pondX - pondR)], g[Math.min(W - 1, pondX + pondR)]) + 1;
  for (let x = pondX - pondR; x <= pondX + pondR; x++) for (let y = level; y < g[x]; y++) if (inb(x, y)) put(x + y * W, WATER, x, y);
  // 池塘不放溢流口：黑洞的吸力半径有 5 格，会把水面以下的水也慢慢吸走。满了的水自然漫到两侧的排水口
  for (let x = 10; x < W - 8; x += 21 + rndi(12)) if (Math.abs(x - pondX) > pondR + 6) drawTree(x, g[x], 12 + rndi(12), 5 + rndi(3));
  for (let x = 2; x < W - 2; x++) {
    if (Math.abs(x - pondX) <= pondR) continue;
    const q = rnd();
    if (q < 0.5) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);
    else if (q < 0.62) put(x + (g[x] - 1) * W, SEED, x, g[x] - 1);
    if (q < 0.07) { const y = g[x] - 3, c = rndi(5) * 51 + 8; if (type[x + y * W] === 0) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); } }
  }
  for (const x of [0, W - 1]) for (let y = g[x] - 3; y < g[x] + 1; y++) if (inb(x, y)) put(x + y * W, VOID, x, y);   // 两侧排水口
  soakSoil(140);                                         // 下了一夜雨，土早就湿透了（池塘不会被底下的土吸干）
}

function sceneRain() {
  env.time = 0.95; env.timeScale = 0; setWeather('rain'); env.wind = -0.4;     // 雨夜，时间定格在夜里
  buildGarden();
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.8;
  env.waterIn += weatherWater();
}

function sceneWaterfall() {
  env.time = 0.4; env.timeScale = 0; setWeather('clear'); env.wind = 0.15;     // 瀑布：晴天上午，时间定格
  const base = H - 5;
  fillRect(STONE, 0, base, W - 1, H - 1);
  // 左高右低的三级石阶
  const steps = [[0, 0.30, 0.34], [0.30, 0.52, 0.56], [0.52, 0.70, 0.76]];
  for (const [a, b, top] of steps) {
    const xa = Math.floor(W * a), xb = Math.floor(W * b), yt = Math.floor(H * top);
    for (let x = xa; x < xb; x++) for (let y = yt + Math.floor(dsin(x * 0.4) * 1.5); y < base; y++) if (inb(x, y)) put(x + y * W, STONE, x, y);
  }
  // 每级台阶上凿一个浅水槽，让水先蓄再溢
  for (const [a, b, top] of steps) {
    const xa = Math.floor(W * a) + 6, xb = Math.floor(W * b) - 3, yt = Math.floor(H * top);
    fillRect(EMPTY, xa, yt - 2, xb, yt + 3);
    fillRect(WATER, xa, yt + 1, xb, yt + 3);
    fillRect(EMPTY, xb + 1, yt - 3, Math.floor(W * b) - 1, yt + 1);          // 右侧的槽沿削低：水一满就从这里跌下去
  }
  // 最高处的水源（克隆体）和最右下角的排水口（黑洞）：流进来多少流出去多少
  const sy = Math.floor(H * 0.34) - 3;
  for (let k = 0; k < 8; k++) cloneSource(2 + k * 2, sy - (k & 1) * 2, WATER);
  // 谷底：水潭 + 右岸的土和植物
  const poolTop = Math.floor(H * 0.86), bankX = Math.floor(W * 0.84);
  fillRect(WATER, Math.floor(W * 0.70), poolTop, bankX - 1, base - 1);
  for (let x = bankX; x < W; x++) for (let y = poolTop - 3 - Math.floor((x - bankX) * 0.12); y < base; y++) if (inb(x, y)) put(x + y * W, SOIL, x, y);
  for (let y = poolTop - 1; y <= poolTop; y++) put(bankX - 1 + y * W, VOID, bankX - 1, y);      // 水面处的溢流口
  for (let x = bankX + 3; x < W - 3; x += 9 + rndi(6)) { let y = 0; while (y < H && type[x + y * W] === 0) y++; drawTree(x, y, 8 + rndi(8), 4 + rndi(3)); }
  for (let x = bankX + 1; x < W - 1; x++) { let y = 0; while (y < H && type[x + y * W] === 0) y++; if (type[x + y * W] === SOIL && rnd() < 0.6) put(x + (y - 1) * W, PLANT, x, y - 1); }
  soakSoil(90);
}

function sceneWinterLake() {
  // 冬日午后，时间停住：日照升华恒定。大气含水到了容量天气就停止注入，降雪 = 升华，积雪量自己稳住
  env.time = 0.42; env.timeScale = 0; setWeather('snow'); env.wind = 0.4;
  temp.fill(env.temp);
  const g = groundLine(3, 0.028, 0.07, H - 30);
  const lakeX = W >> 1, lakeR = Math.floor(W * 0.3);
  for (let x = 0; x < W; x++) {
    const d = Math.abs(x - lakeX);
    if (d < lakeR) g[x] += Math.floor(dcos(d / lakeR * 1.5708) * 18);
    for (let y = g[x]; y < H; y++) { const i = x + y * W; put(i, y > H - 4 ? STONE : SOIL, x, y); temp[i] = -2; }
  }
  const level = Math.min(g[lakeX - lakeR], g[lakeX + lakeR]) + 2;
  for (let x = lakeX - lakeR; x <= lakeX + lakeR; x++) for (let y = level; y < g[x]; y++) {
    if (!inb(x, y)) continue;
    const i = x + y * W;
    if (y < level + 3) { put(i, ICE, x, y); temp[i] = -8; } else { put(i, WATER, x, y); temp[i] = 6; }     // 冰盖下面是 6°C 的水
  }
  for (let x = 0; x < W; x++) {                           // 岸上积雪 + 几棵落光叶子的树
    if (Math.abs(x - lakeX) < lakeR) continue;
    for (let h = 1; h <= 2 + rndi(2); h++) if (inb(x, g[x] - h)) put(x + (g[x] - h) * W, SNOW, x, g[x] - h);
  }
  for (let x = 12; x < W - 10; x += 26 + rndi(14)) {
    if (Math.abs(x - lakeX) < lakeR + 4) continue;
    const h = 14 + rndi(10);
    for (let y = g[x] - h; y < g[x]; y++) for (let dx = 0; dx < 2; dx++) put(x + dx + y * W, WOOD, x + dx, y);
    for (let k = 1; k <= 4; k++) for (const d of [-1, 1]) { const bx = x + d * k + (d > 0 ? 1 : 0), by = g[x] - h + 2 + k; if (inb(bx, by)) put(bx + by * W, WOOD, bx, by); }
  }
  soakSoil(145);                                         // 湖底和地面早就湿透了，不会把湖水吸干
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.5;
  env.waterIn += weatherWater();
}

const SCENES = [
  { name: '火山岛', note: '熔岩流进海里，先结壳再凝固', fn: sceneVolcano },
  { name: '森林大火', note: '左边已经点着了，风往右吹', fn: sceneForest },
  { name: '沙漏', note: '按 G 翻转重力', fn: sceneHourglass },
  { name: '化学实验室', note: '分层、通电、火药', fn: sceneLab },
  { name: '爆破拆除', note: '导爆索在烧，柱脚一断整栋楼塌下来', fn: sceneDemolition },
  { name: '雨夜', note: '云里下雨，浇灌花园', fn: sceneRain },
  { name: '雷暴森林', note: '闪电点火，大雨灭火，烧过的地方慢慢长回来', fn: sceneStormForest },
  { name: '瀑布峡谷', note: '三级跌水，水花、泡沫和涟漪', fn: sceneWaterfall },
  { name: '冬季湖泊', note: '冰盖上下着雪，用加热笔刷融个冰洞', fn: sceneWinterLake },
  { name: '火山爆发 + 昼夜', note: '时间 10 倍速，太阳一落山就喷发', fn: sceneVolcanoDayNight },
];

// 清空并搭建第 k 个预设；每个场景自己设定时间、天气和风
function buildScene(k) {
  env.temp = AMBIENT; env.dayNight = true; env.structure = true; env.plantAging = 1; env.wind = 0.2; env.windPower = 0.3;
  sceneState = null;
  setWeather('clear');
  clearGrid();
  setGravity('down');
  updateSun();
  SCENES[k].fn();
  // 场景里一开始就有的植物年龄随机铺满整个寿命：之后陆续老死、陆续长新的，不会同一时间整片枯掉
  for (let i = 0; i < N; i++) if (type[i] === PLANT && !(flags[i] & F_TIP)) life[i] = rndi((plantLifespan(seed[i]) * 0.2) | 0);
  updateSun();
  temp.forEach((v, i) => { if (type[i] === 0) temp[i] = env.ambient; });
  markStructAll();
  wakeAll();
}

/* ---- 本模块的全部可变状态（多世界切换、读档用；由迁移脚本生成，新增 let 状态时记得加进来） ---- */
function scenesSave() { return { sceneState }; }
function scenesLoad(s) { ({ sceneState } = s); }
function scenesSet(name, v) {
  switch (name) {
    case 'sceneState': sceneState = v; break;
    default: throw new Error('scenes.js 没有可写的状态 ' + name);
  }
}

/* ==== src/engine/slow.js ==== */

/* ---------------------------------------------------------------------
 * 2.11 慢速环境过程：每步只处理 1/61 的格子（每格约每秒轮到一次），与分块休眠无关。
 *      蒸发、晾干、渗水、植物的吸水 / 老化 / 开花 / 落种 / 枯萎、腐烂、融雪、演替都在这里。
 * ------------------------------------------------------------------- */
const SLOW_STRIDE = 61;
let slowPhase = 0;

function slowWet(x, y, i, t, w) {
  let exposed = false;
  // 渗水：先往下（顺着重力）渗，下面吃不下了再随机往旁边匀
  const bx = x + gx, by = y + gy;
  let bottom = bx < 0 || bx >= W || by < 0 || by >= H;
  if (!bottom) {
    const j = bx + by * W, o = type[j], cap = M_ABSORB[o];
    if (cap > 0 && o !== PLANT && !(flags[j] & F_BODY)) {
      const wj = wet[j];
      if (w > wj && wj < cap) {
        const q = Math.min(w - wj > 4 ? (w - wj) >> 1 : w - wj, cap - wj);
        if ((wj <= 60 && wj + q > 60) || (w > 60 && w - q <= 60)) { wake(x, y); wake(bx, by); }
        wet[j] = wj + q; w -= q;
      }
    } else if (o !== 0 && M_STATE[o] !== S_LIQUID) bottom = true;      // 下面是不吸水的石头 / 金属：这是最底层
  }
  const k0 = rndi(4);
  for (let k = 0; k < 4; k++) {
    const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) { exposed = true; continue; }
    if (k !== 0 || o === PLANT || (nx === bx && ny === by)) continue;
    const cap = M_ABSORB[o], wj = wet[j];
    if (cap > 0 && w - wj > 24 && wj < cap) {
      const q = Math.min((w - wj) >> 1, cap - wj);
      if ((wj <= 60 && wj + q > 60) || (w > 60 && w - q <= 60)) { wake(x, y); wake(nx, ny); }
      wet[j] = wj + q; w -= q;
    }
  }
  if (exposed && rnd() < (temp[i] < 0 ? 0.01 : 0.12)) {      // 晾干：按日照、温度、风速，水分进入空气（冻住的地面几乎不蒸发）
    const wv = windX[(x >> 3) + (y >> 3) * GW];
    const rate = 1 + ((env.sun * 3) | 0) + (temp[i] > 40 ? 3 : 0) + ((wv < 0 ? -wv : wv) > 0.4 ? 1 : 0);
    const d = w < rate ? w : rate;
    if (w > 60 && w - d <= 60) wake(x, y);
    w -= d;
    vaporAdd(x, y, d / 100); WL.evapWet += d / 100;
  }
  wet[i] = w;
}

function slowWater(x, y, i) {
  // 下渗：积水下面是土 / 沙，没吸饱就渗进去；吸饱了也会慢慢渗进地下水
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H) {
    const j = bx + by * W, o = type[j];
    if ((o === SOIL || o === SAND) && !(flags[j] & F_BODY)) {
      const cap = M_ABSORB[o];
      if (cap - wet[j] >= 50) { wet[j] = Math.min(cap, wet[j] + 100); clearCell(i, x, y); wake(bx, by); return; }
      // 薄薄一层的积水（上面没有别的水压着）在吸饱的地面上也会慢慢渗走；深水（湖、池塘）不会
      const ux = x - gx, uy = y - gy;
      const isW = (px, py) => px >= 0 && px < W && py >= 0 && py < H && (type[px + py * W] === WATER || type[px + py * W] === SALTWATER);
      const thin = !isW(ux, uy) && !isW(x + lx, y + ly) && !isW(x - lx, y - ly);      // 孤立的一小摊水，不是湖边
      if (thin && rnd() < 0.01) { env.waterOut += 1; WL.seep += 1; clearCell(i, x, y); return; }
    } else if ((o === PLANT || o === FLOWER || o === DEADPLANT || o === WOOD) && !(flags[j] & F_BODY)) {
      // 截留：落在枝叶、树干上的水，没吸饱就被吸进去；吸饱了就挂在叶子上较快地蒸发掉，不会在树冠上越积越多
      const cap = M_ABSORB[o];
      if (cap - wet[j] >= 25) { wet[j] = Math.min(cap, wet[j] + 100); clearCell(i, x, y); return; }
      if (rnd() < 0.03) { clearCell(i, x, y); vaporAdd(x, y, 1); WL.evapSurface++; return; }
    }
  }
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  // 水面蒸发：白天快、夜里慢，水越热越快（接近冰点的水几乎不蒸发），有风更快
  const Tw = temp[i];
  let k = Tw <= 0 ? 0.03 : Tw < 10 ? 0.03 + 0.04 * Tw : 1 + (Tw - 20) / 25;
  k = k > 3 ? 3 : k < 0.03 ? 0.03 : k;
  const wv = windX[(x >> 3) + (y >> 3) * GW];
  if (rnd() < 0.003 * (0.4 + 1.6 * env.sun) * k * (1 + (wv < 0 ? -wv : wv))) { clearCell(i, x, y); vaporAdd(x, y, 1); WL.evapSurface++; }
}

function slowPlant(x, y, i) {
  const f = flags[i], g = seed[i];
  let w = wet[i];
  for (let k = 0; k < 4; k++) {                        // 根：从湿土或水里吸水
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if ((o === SOIL || o === SAND) && wet[j] > 20 && w < 60) {            // 根吸水只补到「汁液」的量，不会把自己泡湿
      const q = Math.min(wet[j] - 10, 60 - w, 50);
      wet[j] -= q; w += q;
    } else if (o === WATER && w < 60 && rnd() < 0.5) {
      const q = 60 - w;
      w += q;
      if (rnd() * 100 < q) clearCell(j, nx, ny);
    } else if (o === PLANT && w - wet[j] > 12) {       // 水分在植株里往别处匀
      const q = (w - wet[j]) >> 1;
      wet[j] += q; w -= q;
    }
  }
  if (w > 20 && rnd() < 0.12 * (0.3 + env.sun)) { w--; vaporAdd(x, y, 0.01); WL.transpire += 0.01; }  // 蒸腾
  wet[i] = w;
  if (f & (F_TIP | F_BURN | F_BODY)) return;
  let age = life[i] + (w === 0 ? 2 : 1) * env.plantAging;   // 缺水老得快；plantAging 是整体的衰老速度倍数
  if (age > 60000) age = 60000;
  life[i] = age;
  if (age > plantLifespan(g) && rnd() < 0.15) {        // 寿终：枯萎成枯枝
    type[i] = DEADPLANT; life[i] = 0; flags[i] = (f & F_SCORCH) | parity; fuel[i] = initFuel(DEADPLANT);
    wake(x, y);
    return;
  }
  if (!canGrow()) return;
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  if (age < 160 * env.plantAging && w >= 50 && rnd() < 0.02 && skyOpen(x, y) && stemHeight(x, y) < geneHeight(g) && biomass(x, y, 3) < 24) {
    flags[i] |= F_TIP; life[i] = Math.min(2 + rndi(4), geneHeight(g) - stemHeight(x, y));   // 水分充足的幼株顶端再抽一小段，不超过株高上限
    wake(x, y);
  } else if (age > 30 * env.plantAging && w >= 30 && rnd() < 0.006 && skyOpen(x, y) && !flowerNear(x, y)) {
    const j = ux + uy * W;                             // 成株开花
    put(j, FLOWER, ux, uy); seed[j] = rndi(5) * 51 + 8 + rndi(34);
    wet[i] = w - 20; env.waterSink += 0.2; WL.plantUse += 0.2;
  }
}

// 附近 7×7 范围里已经有花了：不再开（花的数量很快饱和，不会越开越多）
function flowerNear(x, y) {
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === FLOWER) return true;
  }
  return false;
}

function slowFlower(x, y, i) {
  const age = life[i] + env.plantAging;
  life[i] = age;
  if (age > 600 && rnd() < 0.002) {                    // 开十分钟以后才陆续谢（平均再开八分钟），不会同时谢光                       // 谢了：六成落下一粒种子，基因来自母株并略有变异
    if (rnd() < 0.6) {
      let g = rndi(256);
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (inb(nx, ny) && type[nx + ny * W] === PLANT) { g = seed[nx + ny * W]; break; }
      }
      if (rnd() < 0.3) g ^= 1 << rndi(8);
      type[i] = SEED; seed[i] = g; life[i] = 0; flags[i] = parity; fuel[i] = initFuel(SEED); wet[i] = 0;
      wake(x, y);
    } else clearCell(i, x, y);
  }
}

function slowSeed(x, y, i) {
  const age = life[i] + env.plantAging;
  life[i] = age;
  if (age > 180 && rnd() < 0.01) { clearCell(i, x, y); return; }      // 三分钟内没发芽（太挤、太干、没光）：大多烂掉
  const bx = x + gx, by = y + gy;
  if (bx < 0 || bx >= W || by < 0 || by >= H) return;
  const bj = bx + by * W, b = type[bj];
  if (b === SOIL) { if (wet[bj] < 30 || aux[bj] < 20) return; }
  else if (b === SAND) { if (wet[bj] < 60) return; }
  else return;
  if (!canGrow() || !skyOpen(x, y) || biomass(x, y, 4) > 10 || rnd() > 0.25) return;
  wet[bj] -= 30; env.waterSink += 0.3; WL.plantUse += 0.3;
  if (b === SOIL) aux[bj] -= 20;                        // 消耗养分
  sprout(i, x, y);
}

function slowSoil(x, y, i) {
  // 植被演替：湿润、有养分、见得到光、周围还空着的土面，偶尔自己冒出新芽（土里的种子库）
  if (wet[i] < 80 || aux[i] < 40 || !canGrow() || rnd() > 0.0006) return;
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  if (!skyOpen(x, y) || biomass(x, y, 4) > 0) return;
  const j = ux + uy * W;
  put(j, PLANT, ux, uy);
  flags[j] |= F_TIP; life[j] = geneHeight(seed[j]); wet[j] = 30;
  wet[i] -= 30; aux[i] -= 20; env.waterSink += 0.3; WL.plantUse += 0.3;
}

function slowAsh(x, y, i) {
  if (wet[i] > 40 && rnd() < 0.03) { morph(i, SOIL, x, y); aux[i] = 255; }     // 灰受潮后变成肥土
}

function slowDead(x, y, i) {
  // 枯枝分解：越湿越快（干的约 4 分钟，湿透的约 25 秒）；一小部分变成肥土，其余分解掉
  const w = wet[i];
  if (rnd() < 0.004 + 0.036 * (w > 60 ? 1 : w / 60)) {
    if (rnd() < 0.15) { morph(i, SOIL, x, y); aux[i] = 255; } else { env.waterOut += w / 100; WL.decayOut += w / 100; clearCell(i, x, y); }
  }
}

function slowIce(x, y, i) {
  const amb = env.ambient, snow = type[i] === SNOW;
  let open = false;                                    // 任何一面挨着空气就算露天（被风吹成的雪墙，侧面也会升华）
  for (let k = 0; k < 4 && !open; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    open = nx < 0 || nx >= W || ny < 0 || ny >= H || type[nx + ny * W] === 0;
  }
  if (amb <= 1) {
    // 冰点以下：露天的积雪靠阳光升华（白天快、夜里很慢），所以夜里积得起来，白天又会变薄
    if (snow && open && rnd() < 0.0006 + env.sun * 0.014) { clearCell(i, x, y); vaporAdd(x, y, 1); WL.sublimate++; }
    return;
  }
  // 气温高于冰点：露在空气里的冰雪慢慢融化（日照加速），每融一格都从周围吸热
  if (rnd() > amb * (snow ? 0.006 : 0.0012) * (1 + env.sun)) return;
  let exposed = false;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (type[j] === 0) exposed = true;
    else temp[j] -= 3;
  }
  if (!exposed) return;
  type[i] = WATER; life[i] = 0; flags[i] = parity; temp[i] = 1; aux[i] = 0;
  markStructAround(i);
  wake(x, y);
}

const SLOW = new Array(NT).fill(null);
SLOW[WATER] = slowWater; SLOW[SALTWATER] = slowWater; SLOW[PLANT] = slowPlant; SLOW[FLOWER] = slowFlower;
SLOW[SEED] = slowSeed; SLOW[SOIL] = slowSoil; SLOW[ASH] = slowAsh; SLOW[DEADPLANT] = slowDead;
SLOW[ICE] = slowIce; SLOW[SNOW] = slowIce;

function slowTick() {
  slowPhase = (slowPhase + 1) % SLOW_STRIDE;
  for (let i = slowPhase; i < N; i += SLOW_STRIDE) {
    const t = type[i];
    if (t === 0) { const a = aux[i]; if (a !== 0) aux[i] = a - 1; continue; }   // 空气慢慢换新
    const fn = SLOW[t], w = wet[i];
    if (fn === null && w === 0) continue;
    if (flags[i] & F_BODY) continue;
    const x = i % W, y = (i / W) | 0;
    if (w !== 0 && t !== PLANT) slowWet(x, y, i, t, w);

/* =====================================================================
 * 2.14 场景编解码（撤销快照、存档、导入导出共用；RLE 压缩）

function rleEncode(src) {
  const n = src.length, out = new Uint8Array(n * 2 + 2);

    let run = 1;
    while (run < 255 && i + run < n && src[i + run] === v) run++;

    i += run;

}

function rleDecode(buf, n) {

  for (let q = 0; q + 1 < buf.length && p < n; q += 2) {
    const run = buf[q];
    out.fill(buf[q + 1], p, Math.min(n, p + run));
    p += run;
  }
  return out;
}

        w = new Uint8Array(cnt), x = new Uint8Array(cnt), ul = new Uint8Array(cnt), uh = new Uint8Array(cnt);

           wt: rleEncode(w), ax: rleEncode(x), ul: rleEncode(ul), uh: rleEncode(uh),

// 还原到当前网格；尺寸不同的话按「底边居中」对齐，超出部分裁掉。v3 的存档没有含水量等字段，按默认值补。

  if (s.env) {

    setWeather(s.env.weather || 'clear');
    env.temp = s.env.temp; env.windPower = s.env.windPower;

/* =====================================================================

/* ==== src/engine/temperature.js ==== */

/* ---------------------------------------------------------------------
 * 2.10 温度场 + 空气含氧：只在清醒的块里做成对交换（守恒、原地），
 *      再向环境气温缓慢回落。空气格之间还交换「浑浊度」，网格边缘是开阔大气（恒为新鲜）。
 * ------------------------------------------------------------------- */
function stepThermal() {
  const NTn = NT, K = KTAB, IHC = M_IHC, RLX = M_RELAX, amb = env.ambient;
  for (let cy = 0; cy < CHN; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const c = cx + cy * CW;
      if (chunkTTL[c] === 0) continue;
      const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
      let active = false, right = false, down = false;
      for (let y = y0; y < y1; y++) {
        const hasDown = y + 1 < H, edgeY = y === 0 || y === H - 1;
        for (let x = x0, i = y * W + x0; x < x1; x++, i++) {
          const a = type[i];
          let Ti = temp[i];
          if (AIRLIKE[a]) {                  // 空气（含火焰 / 烟占着的）：浑浊度扩散
            if (edgeY || x === 0 || x === W - 1) aux[i] = 0;
            else {
              if (AIRLIKE[type[i + 1]]) { const d = aux[i + 1] - aux[i]; if (d > 3 || d < -3) { const q = d >> 2; aux[i] += q; aux[i + 1] -= q; } }
              if (AIRLIKE[type[i + W]]) { const d = aux[i + W] - aux[i]; if (d > 3 || d < -3) { const q = d >> 2; aux[i] += q; aux[i + W] -= q; } }
            }
          } else if (Ti > 900 && (a === METAL || a === STEEL) && (tick & 31) === 0) markStructAround(i);   // 烧软的金属：重新评估
          if (x + 1 < W) {
            const d = temp[i + 1] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[i + 1], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[i + 1] -= fl * IHC[b];

            }

          if (hasDown) {
            const j = i + W, d = temp[j] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[j], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[j] -= fl * IHC[b];
              if (fl > 0.3 || fl < -0.3) { active = true; if (y + 1 === y1) down = true; }
            }
          }
          const r = RLX[a];
          if (r > 0) {
            const d = (amb - Ti) * r;
            Ti += d;
            if (d > 0.08 || d < -0.08) active = true;
          }
          temp[i] = Ti;
        }
      }
      if (active) chunkTTL[c] = WAKE_TTL;
      if (right && cx + 1 < CW) chunkTTL[c + 1] = WAKE_TTL;
      if (down && cy + 1 < CHN) chunkTTL[c + CW] = WAKE_TTL;
    }
  }
}

/* ==== src/engine/step.js ==== */

/* ---------------------------------------------------------------------
 * 2.12 主步进：60Hz 固定步长。扫描顺序从「重力下游」开始，逐行（或逐列）
 *      跳过休眠的块，每行随机左右方向。

function sweepCells() {
  if (gy !== 0) {
    const start = gy > 0 ? H - 1 : 0, end = gy > 0 ? -1 : H, inc = gy > 0 ? -1 : 1;
    for (let y = start; y !== end; y += inc) {
      const crow = (y >> 5) * CW, row = y * W;
      if (rnd() < 0.5) {
        for (let cx = 0; cx < CW; cx++) {
          if (chunkTTL[crow + cx] === 0) continue;

        }

        for (let cx = CW - 1; cx >= 0; cx--) {
          if (chunkTTL[crow + cx] === 0) continue;
          const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK);
          for (let x = x1 - 1; x >= x0; x--) if (type[row + x] !== 0) updateCell(x, y, row + x);

    for (let x = start; x !== end; x += inc) {
      const ccol = x >> 5;

        for (let cy = 0; cy < CHN; cy++) {
          if (chunkTTL[ccol + cy * CW] === 0) continue;
          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);

          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
          for (let y = y1 - 1; y >= y0; y--) if (type[x + y * W] !== 0) updateCell(x, y, x + y * W);
        }
      }
    }
  }
}

  stepExplosions();
  stepElectric();
  const t2 = clk ? clk() : 0;
  stepStructure();
  const t3 = clk ? clk() : 0;
  sweepCells();
  const t4 = clk ? clk() : 0;
