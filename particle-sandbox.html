          for (let y = y0; y < y1; y++) if (type[x + y * W] !== 0) updateCell(x, y, x + y * W);
        }
      } else {
        for (let cy = CHN - 1; cy >= 0; cy--) {
          if (chunkTTL[ccol + cy * CW] === 0) continue;
          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
          for (let y = y1 - 1; y >= y0; y--) if (type[x + y * W] !== 0) updateCell(x, y, x + y * W);
        }
      }
    }
  }
}

function simStep() {
  parity ^= 1; tick++; simStepsTotal++;
  const t0 = performance.now();
  let act = 0;
  for (let c = 0, n = chunkTTL.length; c < n; c++) {
    const v = chunkTTL[c];
    if (v > 0) { chunkTTL[c] = v - 1; if (v > 1) act++; }
  }
  perf.activeChunks = act;
  if (sceneScript) sceneScript();
  stepWeather();
  const t1 = performance.now();
  stepExplosions();
  stepElectric();
  const t2 = performance.now();
  stepStructure();
  const t3 = performance.now();
  sweepCells();
  const t4 = performance.now();
  stepThermal();
  const t5 = performance.now();
  stepFree();
  const t6 = performance.now();
  slowTick();
  const t7 = performance.now();
  perf.weather += t1 - t0; perf.misc += (t2 - t1) + (t6 - t5); perf.struct += t3 - t2;
  perf.cells += t4 - t3; perf.thermal += t5 - t4; perf.slow += t7 - t6; perf.steps++;
}

/* ---------------------------------------------------------------------
 * 2.13 绘制到网格（笔刷、预设、测试共用）与统计
 * ------------------------------------------------------------------- */
function paintCell(x, y, t, replace) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = x + y * W;
  if (flags[i] & F_BODY) return;
  if (t === TOOL_ERASE) { if (type[i] !== 0) clearCell(i, x, y); return; }
  if (t === TOOL_HEAT) { temp[i] = Math.min(2500, temp[i] + 60); wake(x, y); return; }
  if (t === TOOL_COOL) { temp[i] = Math.max(-200, temp[i] - 60); wake(x, y); return; }
  if (t >= 100) return;
  const o = type[i];
  if (o === t) return;
  if (o !== 0 && !replace) return;
  put(i, t, x, y);
}

function fillRect(t, x0, y0, x1, y1) {
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W - 1, x1 | 0); y1 = Math.min(H - 1, y1 | 0);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = x + y * W;
    if (t === EMPTY) clearCell(i, x, y); else put(i, t, x, y);
  }
}

function fillCircle(t, cx, cy, r, chance) {
  const r2 = r * r;
  for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
    if (!inb(x, y)) continue;
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy > r2) continue;
    if (chance !== undefined && rnd() > chance) continue;
    if (t === EMPTY) clearCell(x + y * W, x, y); else put(x + y * W, t, x, y);
  }
}

function countType(t, x0, y0, x1, y1) {
  if (x0 === undefined) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }
  let n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (type[x + y * W] === t) n++;
  return n;
}

// 水量账本：所有形态的水加起来（单位：格水）。没有外部输入输出时应当守恒。
function totalWater() {
  let n = 0, w = 0;
  for (let i = 0; i < N; i++) {
    const t = type[i];
    if (t === 0) continue;
    if (t === WATER || t === SALTWATER || t === STEAM || t === ICE || t === SNOW) n++;
    w += wet[i];
  }
  for (let k = 0; k < FP_MAX; k++) {
    if (!fpAlive[k]) continue;
    const t = fpType[k];
    if (t === WATER || t === SALTWATER || t === STEAM || t === ICE || t === SNOW) n++;
  }
  return n + w / 100 + weatherWater() + env.waterSink + env.waterOut - env.waterIn;
}

/* =====================================================================
 * 2s. 结构力学
 *   支撑检测：从「锚」出发在刚性固体里做洪泛搜索。锚 = 重力方向的画布边缘、锚点材料、
 *             克隆体 / 黑洞、以及直接压在土 / 沙 / 植物上的刚性固体。
 *             连接要求两格完整度都够（爆炸、燃烧、腐蚀会降低完整度；异种材料之间要求更高；
 *             金属 / 钢超过 900°C 软化）。正上方的格子靠压力支撑，不看完整度。
 *             绳子只受拉：支撑不能经过绳子向上传。
 *             只有在刚性固体被增删、削弱，或它脚下的粉末挪动时才重算，不是每帧都算。
 *   刚体：    搜不到的连通块变成刚体（质心、质量、转动惯量、速度、角速度），
 *             每帧先擦掉上一帧盖在网格里的章 → 积分 → 与网格碰撞 → 按新姿态（旋转后逆映射，
 *             最近邻采样）重新盖章。撞得够狠就碎裂，静止后冻结回静态网格。
 * ===================================================================== */
const BOND_MIN = 70, BODY_MAX = 64;
let stMark = null, stQueue = null;
let structCooldown = 0, structHold = false;
const bodies = new Array(BODY_MAX).fill(null);
let bodyCount = 0, colX = 0, colY = 0;
let fracVX = 0, fracVY = 0, fracTick = -100;
const structStats = { checks: 0, made: 0, frozen: 0, fractured: 0 };

function allocStruct() { stMark = new Uint8Array(N); stQueue = new Int32Array(N); }
function bodiesClear() { bodies.fill(null); bodyCount = 0; }

function checkStructure() {
  structStats.checks++;
  const mark = stMark, q = stQueue, gOff = gx + gy * W;
  mark.fill(0);
  let qh = 0, qt = 0;
  // 1) 找锚
  for (let i = 0; i < N; i++) {
    const t = type[i];
    if (!M_RIGID[t] || (flags[i] & F_BODY)) continue;
    let anchored = M_HARD[t] > 1 || (flags[i] & F_PIN) !== 0;
    if (!anchored) {
      const x = i % W, y = (i / W) | 0, bx = x + gx, by = y + gy;
      if (bx < 0 || bx >= W || by < 0 || by >= H) anchored = true;
      else {
        const o = type[i + gOff];
        if (o !== 0 && !M_RIGID[o] && M_STATE[o] < S_LIQUID && !(flags[i + gOff] & F_BODY)) anchored = true;
      }
    }
    if (anchored) { mark[i] = 1; q[qt++] = i; }
  }
  // 2) 洪泛
  while (qh < qt) {
    const i = q[qh++], a = type[i], x = i % W, y = (i / W) | 0;
    const ai = aux[i], up = i - gOff;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const j = nx + ny * W;
      if (mark[j]) continue;
      const b = type[j];
      if (!M_RIGID[b] || (flags[j] & F_BODY)) continue;
      if (j === up) {
        if (a === ROPE || b === ROPE) continue;        // 绳子撑不住上面的东西
      } else {                                         // 侧向和向下靠连接强度
        const thr = a === b ? BOND_MIN : BOND_MIN * 1.3;
        if ((ai < thr && M_HARD[a] <= 1) || (aux[j] < thr && M_HARD[b] <= 1)) continue;
        if ((b === METAL || b === STEEL) && temp[j] > 900) continue;
        if ((a === METAL || a === STEEL) && temp[i] > 900) continue;
      }
      mark[j] = 1; q[qt++] = j;
    }
  }
  // 3) 没被搜到的刚性格：按连通块变成刚体
  for (let i = 0; i < N; i++) {
    if (mark[i] || !M_RIGID[type[i]] || (flags[i] & F_BODY)) continue;
    let h = 0, tl = 0;
    q[tl++] = i; mark[i] = 2;
    while (h < tl) {
      const c = q[h++], x = c % W, y = (c / W) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const j = nx + ny * W;
        if (mark[j] || !M_RIGID[type[j]] || (flags[j] & F_BODY)) continue;
        mark[j] = 2; q[tl++] = j;
      }
    }
    makeBodies(q.slice(0, tl));
  }
}

// 太大的块按随机偏移的方格切开（近似「沿薄弱处分裂」），每块各自成为刚体。
// 切几块要看刚体池还剩多少空位：空位不够就切得粗一些，保证整片失去支撑的结构都能动起来，
// 不会因为池子满了而留一部分悬在半空挡路。
function makeBodies(cells) {
  let free = 0;
  for (let k = 0; k < BODY_MAX; k++) if (!bodies[k]) free++;
  const n = cells.length;
  const pieces = Math.max(1, Math.min(free - 1, Math.ceil(n / 900)));
  if (pieces <= 1) { makeBody(cells); return; }
  let minx = W, miny = H, maxx = 0, maxy = 0;
  for (let k = 0; k < n; k++) { const c = cells[k], x = c % W, y = (c / W) | 0; if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
  const S = Math.max(20, Math.ceil(Math.sqrt((maxx - minx + 1) * (maxy - miny + 1) / pieces))) + rndi(6);
  const ox = rndi(S), oy = rndi(S), groups = new Map();
  for (let k = 0; k < n; k++) {
    const c = cells[k], x = c % W, y = (c / W) | 0;
    const key = (((x - minx + ox) / S) | 0) + (((y - miny + oy) / S) | 0) * 4096;
    let g = groups.get(key);
    if (!g) { g = []; groups.set(key, g); }
    g.push(c);
  }
  for (const g of groups.values()) makeBody(Int32Array.from(g));
}

function debrisCell(c, vx, vy) {
  const x = c % W, y = (c / W) | 0;
  if (fpCount < FP_MAX - 20) spawnFree(type[c], x + 0.5, y + 0.5, vx + (rnd() - 0.5) * 1.2, vy + (rnd() - 0.5) * 1.2, temp[c], seed[c]);
  type[c] = 0; flags[c] = parity; life[c] = 0; aux[c] = 0; wet[c] = 0; fuel[c] = 0;
  wake(x, y);
}

function makeBody(cells) {
  const n = cells.length;
  if (n <= 2) { for (let k = 0; k < n; k++) debrisCell(cells[k], 0, 0); return; }
  let id = -1;
  for (let k = 0; k < BODY_MAX; k++) if (!bodies[k]) { id = k; break; }
  if (id < 0) {                                        // 刚体满了：小块直接碎成渣，大块先原地不动，稍后再试
    if (n <= 40) for (let k = 0; k < n; k++) debrisCell(cells[k], 0, 0);
    else { structDirty = true; structCooldown = 20; }
    return;
  }
  let minx = W, miny = H, maxx = 0, maxy = 0, mass = 0, mx = 0, my = 0;
  const cnt = new Uint16Array(NT);
  for (let k = 0; k < n; k++) {
    const c = cells[k], x = c % W, y = (c / W) | 0, m = M_DENS[type[c]];
    if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
    mass += m; mx += m * (x + 0.5); my += m * (y + 0.5);
    cnt[type[c]]++;
  }
  const comX = mx / mass, comY = my / mass, lw = maxx - minx + 1, lh = maxy - miny + 1;
  const lt = new Uint8Array(lw * lh), ls = new Uint8Array(lw * lh), lf = new Uint8Array(lw * lh), lT = new Float32Array(lw * lh);
  const pts = new Float32Array(n * 2);
  let I = 0, r = 0, mat = 0;
  for (let t = 1; t < NT; t++) if (cnt[t] > cnt[mat]) mat = t;
  for (let k = 0; k < n; k++) {
    const c = cells[k], x = c % W, y = (c / W) | 0, li = (x - minx) + (y - miny) * lw;
    const px = x + 0.5 - comX, py = y + 0.5 - comY, d2 = px * px + py * py;
    lt[li] = type[c]; ls[li] = seed[c]; lf[li] = flags[c] & F_SCORCH; lT[li] = temp[c];
    pts[k * 2] = px; pts[k * 2 + 1] = py;
    I += M_DENS[type[c]] * (d2 + 0.17);
    if (d2 > r) r = d2;
    type[c] = 0; flags[c] = parity; life[c] = 0; aux[c] = 0; wet[c] = 0; fuel[c] = 0;
  }
  const b = { id, n, mass, I, x: comX, y: comY, vx: 0, vy: 0, ang: 0, om: (rnd() - 0.5) * 0.012,
              lw, lh, cx: comX - minx, cy: comY - miny, lt, ls, lf, lT, pts, r: Math.sqrt(r) + 1.5, mat,
              stamp: new Int32Array(n * 2 + 64), stampN: 0, rest: 0, age: 0, sub: 0, subDens: 0, stuck: 0, sx: comX, sy: comY };
  if (tick - fracTick <= 4) { b.vx = fracVX; b.vy = fracVY; }      // 碎裂出来的块继承原来的速度
  bodies[id] = b; bodyCount++;
  structStats.made++;
  stampBody(b);
}

function stampBody(b) {
  const c = Math.cos(b.ang), s = Math.sin(b.ang), R = b.r, lw = b.lw, lh = b.lh, tag = b.id + 1;
  const x0 = Math.max(0, Math.floor(b.x - R)), x1 = Math.min(W - 1, Math.ceil(b.x + R));
  const y0 = Math.max(0, Math.floor(b.y - R)), y1 = Math.min(H - 1, Math.ceil(b.y + R));
  let n = 0, sub = 0, subD = 0;
  const stamp = b.stamp, cap = stamp.length;
  for (let wy = y0; wy <= y1; wy++) {
    // 这一行两侧（刚体外面）有没有液体：有的话这一行的格子算浸没。用来算浮力
    let rowDens = 0;
    for (let k = 0; k < 2 && rowDens === 0; k++) {
      const sx = k === 0 ? x0 - 1 : x1 + 1;
      if (sx < 0 || sx >= W) continue;
      const o = type[sx + wy * W];
      if (M_STATE[o] === S_LIQUID) rowDens = M_DENS[o];
    }
    for (let wx = x0; wx <= x1; wx++) {
      const dx = wx + 0.5 - b.x, dy = wy + 0.5 - b.y;
      const li = Math.floor(c * dx + s * dy + b.cx), lj = Math.floor(-s * dx + c * dy + b.cy);   // 逆映射回刚体自己的坐标
      if (li < 0 || li >= lw || lj < 0 || lj >= lh) continue;
      const l = li + lj * lw, t = b.lt[l];
      if (t === 0) continue;
      const j = wx + wy * W, o = type[j];
      if (o !== 0) {
        const so = M_STATE[o];
        if ((flags[j] & F_BODY) || so === S_SOLID) continue;
        if (so === S_LIQUID || so === S_POWDER) {      // 把占着位置的液体 / 粉末挤出去（水花、扬尘）
          if (fpCount < FP_MAX - 50) spawnFree(o, wx + 0.5, wy + 0.5, b.vx * 0.6 + (rnd() - 0.5) * 1.6 + dx * 0.04, b.vy * 0.3 - gy * (0.5 + rnd()) - gx * (0.5 + rnd()), temp[j], seed[j]);
          if (so === S_LIQUID && rnd() < 0.1) addRipple(wx, wy);
        }
      }
      type[j] = t; seed[j] = b.ls[l]; temp[j] = b.lT[l]; flags[j] = parity | F_BODY | b.lf[l];
      life[j] = tag; aux[j] = 200; wet[j] = 0; fuel[j] = 0; charge[j] = 0;
      if (rowDens > 0) { sub++; subD += rowDens; }
      if (n < cap) stamp[n++] = j;
      wake(wx, wy);
    }
  }
  b.stampN = n; b.sub = sub / b.n; b.subDens = sub ? subD / sub : 0;
}

function unstampBody(b) {
  const stamp = b.stamp, tag = b.id + 1;
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if ((flags[j] & F_BODY) && life[j] === tag) { type[j] = 0; flags[j] = parity; life[j] = 0; aux[j] = 0; }
  }
  b.stampN = 0;
}

// 某个姿态下有多少格撞进了固体 / 粉末 / 画布之外；顺便算出接触点的重心。
// colStatic = 其中撞在静止物上的格数，colBody = 撞到的另一个刚体（没有则为 -1）
let colStatic = 0, colBody = -1;
function collide(b, X, Y, A) {
  const c = Math.cos(A), s = Math.sin(A), pts = b.pts;
  let n = 0, sx = 0, sy = 0, ns = 0, other = -1;
  for (let k = 0, m = b.n * 2; k < m; k += 2) {
    const px = pts[k], py = pts[k + 1];
    const wx = X + c * px - s * py, wy = Y + s * px + c * py;
    const ix = Math.floor(wx), iy = Math.floor(wy);
    let hit = false;
    if (ix < 0 || ix >= W || iy < 0 || iy >= H) { hit = true; ns++; }
    else {
      const j = ix + iy * W, o = type[j];
      if (o !== 0 && M_STATE[o] < S_LIQUID) { hit = true; if (flags[j] & F_BODY) other = life[j] - 1; else ns++; }
    }
    if (hit) { n++; sx += wx; sy += wy; }
  }
  if (n) { colX = sx / n; colY = sy / n; }
  colStatic = ns; colBody = other;
  return n;
}

// 卡死的碎块（被别的东西楔住、动不了，但按连接关系又算不上有支撑）冻结时打上「楔住」标记，当作锚。
// 下一次爆炸或用户动笔时统一清掉，重新评估。
let pinTick = -100;
function clearPins() {
  if (tick - pinTick < 30) return;
  pinTick = tick;
  for (let i = 0; i < N; i++) if (flags[i] & F_PIN) flags[i] &= ~F_PIN;
  structDirty = true;
}

function freezeBody(b, pin) {
  // 差不多摆正了的就对齐到 90° 的整数倍再盖章：这样是逐格精确的，不会因为旋转采样丢格子
  const q = Math.round(b.ang / 1.5708) * 1.5708;
  if (Math.abs(b.ang - q) < 0.3) {
    unstampBody(b);
    b.ang = q;
    for (let k = 0; k < 8 && collide(b, b.x, b.y, b.ang) > 0; k++) { b.x -= gx * 0.5; b.y -= gy * 0.5; }
    // 再顺着重力落回去，直到刚好贴住下面的东西（否则会悬着，被判成失去支撑，反复冻结 / 解冻）
    for (let k = 0; k < 16 && collide(b, b.x + gx * 0.5, b.y + gy * 0.5, b.ang) === 0; k++) { b.x += gx * 0.5; b.y += gy * 0.5; }
    stampBody(b);
  }
  const stamp = b.stamp, tag = b.id + 1;
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if ((flags[j] & F_BODY) && life[j] === tag) { flags[j] = (flags[j] & ~F_BODY) | (pin ? F_PIN : 0); life[j] = 0; aux[j] = 120; fuel[j] = initFuel(type[j]); }
  }
  bodies[b.id] = null; bodyCount--;
  structStats.frozen++;
  structDirty = true;
}

function fractureBody(b, impact) {
  structStats.fractured++;
  // 撞击的震动把落点附近静止的刚性固体也震松
  const R = 9, ix = Math.round(colX), iy = Math.round(colY), dmgK = Math.min(2, impact) * 45;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const x = ix + dx, y = iy + dy;
    if (x < 0 || x >= W || y < 0 || y >= H || dx * dx + dy * dy > R * R) continue;
    const j = x + y * W, o = type[j];
    if (!M_RIGID[o] || M_HARD[o] > 1 || (flags[j] & F_BODY)) continue;
    const d = dmgK * (1 - Math.sqrt(dx * dx + dy * dy) / R) / M_BOND[o], a = aux[j];
    aux[j] = a > d ? a - d : 0;
  }
  fracVX = b.vx * 0.5; fracVY = b.vy * 0.5; fracTick = tick;
  const c = Math.cos(b.ang), s = Math.sin(b.ang);
  if (b.mat === GLASS || b.n < 24) {                   // 玻璃和小块：直接碎成渣
    for (let lj = 0; lj < b.lh; lj++) for (let li = 0; li < b.lw; li++) {
      const l = li + lj * b.lw, t = b.lt[l];
      if (!t || fpCount >= FP_MAX - 20) continue;
      const px = li + 0.5 - b.cx, py = lj + 0.5 - b.cy;
      spawnFree(t, b.x + c * px - s * py, b.y + s * px + c * py, b.vx * 0.5 + (rnd() - 0.5) * 2.6, b.vy * 0.3 + (rnd() - 0.5) * 2.6, b.lT[l], b.ls[l]);
    }
    bodies[b.id] = null; bodyCount--;
    return;
  }
  // 大块：盖回网格，沿穿过撞击点的一两条随机直线抠出裂缝，剩下的部分由支撑检测重新分成几个刚体
  stampBody(b);
  const stamp = b.stamp, tag = b.id + 1, cuts = 1 + (rnd() < 0.5 ? 1 : 0) + (b.n > 400 ? 1 : 0);
  const ca = [], sa = [];
  for (let k = 0; k < cuts; k++) { const a = rnd() * 3.1416; ca.push(Math.cos(a)); sa.push(Math.sin(a)); }
  for (let k = 0; k < b.stampN; k++) {
    const j = stamp[k];
    if (!((flags[j] & F_BODY) && life[j] === tag)) continue;
    const x = j % W, y = (j / W) | 0;
    flags[j] &= ~F_BODY; life[j] = 0; aux[j] = 255;
    let onCut = false;
    for (let q = 0; q < cuts; q++) if (Math.abs((x + 0.5 - colX) * sa[q] - (y + 0.5 - colY) * ca[q]) < 0.8) { onCut = true; break; }
    if (!onCut) continue;
    if (rnd() < 0.5) debrisCell(j, fracVX, fracVY);
    else {                                             // 扬起尘土
      type[j] = 0; flags[j] = parity; aux[j] = 0;
      put(j, SMOKE, x, y); seed[j] = 100 + rndi(50); life[j] = 30 + rndi(50);
    }
  }
  bodies[b.id] = null; bodyCount--;
  structDirty = true; structCooldown = 0;
}

function bodyImpulse(id, ix, iy, px, py) {
  const b = bodies[id];
  if (!b) return;
  const k = 40 * M_DENS[b.mat] / 2600;
  ix *= k / 100; iy *= k / 100;
  b.vx += ix * 100 / b.mass; b.vy += iy * 100 / b.mass;
  b.om += ((px - b.x) * iy - (py - b.y) * ix) * 100 / b.I;
  b.rest = 0;
}

function stepBody(b) {
  b.age++;
  let g = 0.22;
  if (b.sub > 0) {                                     // 浮力：排开的液体密度 × 浸没比例，对比自身平均密度
    const ratio = b.subDens * b.sub / (b.mass / b.n);
    g *= 1 - (ratio > 1.8 ? 1.8 : ratio);
    b.vx *= 0.94; b.vy *= 0.94; b.om *= 0.92;
  }
  b.vx += gx * g; b.vy += gy * g;
  if (b.vx > 6) b.vx = 6; else if (b.vx < -6) b.vx = -6;
  if (b.vy > 6) b.vy = 6; else if (b.vy < -6) b.vy = -6;
  if (b.om > 0.18) b.om = 0.18; else if (b.om < -0.18) b.om = -0.18;
  const m = Math.max(Math.abs(b.vx), Math.abs(b.vy), Math.abs(b.om) * b.r);
  const n = m < 1 ? 1 : m > 8 ? 8 : Math.ceil(m);
  let resting = false, movedAny = false;
  for (let s = 0; s < n; s++) {
    const X = b.x + b.vx / n, Y = b.y + b.vy / n, A = b.ang + b.om / n;
    if (collide(b, X, Y, A) === 0) { b.x = X; b.y = Y; b.ang = A; movedAny = true; continue; }
    const other = colStatic === 0 && colBody >= 0 ? bodies[colBody] : null;
    if (other) {
      // 撞上的是另一个还在动的刚体：按质量把两者的速度拉平（一起往下掉），只有相对速度够大才算撞击
      const mt = b.mass + other.mass, rel = Math.hypot(b.vx - other.vx, b.vy - other.vy);
      const vx = (b.vx * b.mass + other.vx * other.mass) / mt, vy = (b.vy * b.mass + other.vy * other.mass) / mt;
      b.vx = other.vx = vx; b.vy = other.vy = vy; b.om *= 0.8;
      if (rel > 0.9) { st.crash += rel * Math.min(400, b.n); if (onCrash) onCrash(colX, colY, rel, b.n); }
      if (rel > M_FRAC[b.mat] * 1.3 && b.n > 10) { fractureBody(b, rel); return; }
      break;
    }
    // 撞上静止物：对接触点施加冲量（会带来转动），再加一点摩擦
    let rx = colX - b.x, ry = colY - b.y;
    const rl = Math.hypot(rx, ry);
    let nx, ny;
    if (rl < 0.6) { nx = -gx; ny = -gy; rx = 0; ry = 0; } else { nx = -rx / rl; ny = -ry / rl; }
    const vcx = b.vx - b.om * ry, vcy = b.vy + b.om * rx, vn = vcx * nx + vcy * ny;
    if (vn < 0) {
      const rn = rx * ny - ry * nx, j = -1.12 * vn / (1 / b.mass + rn * rn / b.I);
      b.vx += j * nx / b.mass; b.vy += j * ny / b.mass; b.om += rn * j / b.I;
    }
    b.vx *= 0.85; b.vy *= 0.85; b.om *= 0.6;
    const impact = -vn;
    // 接触点在侧面时上面的冲量抵不掉下落速度；只要正下方确实被静止物挡着，就把沿重力方向的速度清掉
    if (collide(b, b.x + gx * 0.5, b.y + gy * 0.5, b.ang) > 0 && colStatic > 0) {
      const along = b.vx * gx + b.vy * gy;
      if (along > 0) { b.vx -= gx * along; b.vy -= gy * along; }
      resting = true;
    }
    if (impact > 0.9) { st.crash += impact * Math.min(400, b.n); if (onCrash) onCrash(colX, colY, impact, b.n); }
    if (impact > M_FRAC[b.mat] && b.n > 10) { fractureBody(b, impact); return; }
    break;
  }
  stampBody(b);
  if (resting && Math.abs(b.vx) + Math.abs(b.vy) < 0.45 && Math.abs(b.om) < 0.05) b.rest++;
  else b.rest = 0;
  b.stuck = movedAny ? 0 : (b.stuck || 0) + 1;         // 卡在别的碎块里一动不动：一段时间后就地冻结
  let wedged = b.stuck > 24;
  if (b.age % 90 === 0) {                              // 每 1.5 秒看一次：几乎没挪窝也算卡住（浸在液体里漂着的不算）
    if (b.age > 90 && b.sub === 0 && Math.hypot(b.x - b.sx, b.y - b.sy) < 1.5) wedged = true;
    b.sx = b.x; b.sy = b.y;
  }
  if (b.rest > 10) freezeBody(b, false);
  else if (wedged || b.age > 2400) freezeBody(b, b.sub === 0);
}

const bodyOrder = [];
function stepStructure() {
  if (bodyCount > 0) {
    // 先算靠重力下游的（下面的先落，上面的才有地方落）
    bodyOrder.length = 0;
    for (let k = 0; k < BODY_MAX; k++) if (bodies[k]) bodyOrder.push(bodies[k]);
    bodyOrder.sort((p, q) => (q.x * gx + q.y * gy) - (p.x * gx + p.y * gy));
    // 先把所有刚体的章都擦掉，再按顺序逐个移动、盖章：后动的只会撞上已经就位的，互相咬合的碎块不会死锁
    for (let k = 0; k < bodyOrder.length; k++) unstampBody(bodyOrder[k]);
    for (let k = 0; k < bodyOrder.length; k++) { const b = bodyOrder[k]; if (bodies[b.id] === b) stepBody(b); }
  }
  if (!env.structure) {
    if (bodyCount > 0) for (let k = 0; k < BODY_MAX; k++) { const b = bodies[k]; if (b) freezeBody(b, false); }
    return;
  }
  if (hotRigid && (tick & 31) === 0) { hotRigid = false; structDirty = true; }
  if ((tick % 300) === 0) clearPins();                    // 「楔住」的标记每 5 秒失效一次，重新评估（真卡住的会再被标上）
  if (structDirty && !structHold && --structCooldown <= 0) {
    structDirty = false; structCooldown = bodyCount > 8 ? 6 : 3;      // 正在大规模坍塌时少查几次
    checkStructure();
  }
}

/* =====================================================================
 * 2w. 天气与环境（都算在 1/8 分辨率的粗网格上，每格 8x8 个粒子格）
 *   风场    = 全局风（越高越大，带阵风）+ 热对流（空气被吸向更热的一侧 → 大火自己招风）
 *   湿度场  = 水面蒸发、晾干、蒸腾、蒸汽冷却放出的水汽；会上升、被风吹、扩散
 *   云      = 水汽超过饱和量（越高、越冷饱和量越小）的部分；够厚就降水，每一滴都从云里扣掉
 *   闪电    = 雷暴时厚云积累电荷，到阈值后沿分形折线劈向「最高 + 最导电」的地方
 *   昼夜    = 太阳高度决定光照、气温（±4°C）、蒸发速度和植物能不能长
 * ===================================================================== */
const RAIN_THR = 2.0;
let GW = 1, GH = 1;
let windX = new Float32Array(1), heatC = new Float32Array(1);
let vapor = new Float32Array(1), vaporB = new Float32Array(1), cloud = new Float32Array(1), cloudB = new Float32Array(1);
let lastBolt = null;       // 最近一次闪电（渲染用来整屏闪一下）

function allocWeather() {
  GW = Math.ceil(W / 8); GH = Math.ceil(H / 8);
  const n = GW * GH;
  windX = new Float32Array(n); heatC = new Float32Array(n);
  vapor = new Float32Array(n); vaporB = new Float32Array(n); cloud = new Float32Array(n); cloudB = new Float32Array(n);
}

function clearWeather() { windX.fill(0); heatC.fill(0); vapor.fill(0); cloud.fill(0); }

function vaporAdd(x, y, amount) { vapor[(x >> 3) + (y >> 3) * GW] += amount; }

function weatherWater() {
  let s = 0;
  for (let c = 0, n = GW * GH; c < n; c++) s += vapor[c] + cloud[c];
  return s;
}

function updateSun() {
  if (!env.dayNight) { env.el = 1; env.sun = 1; env.ambient = env.temp; return; }
  const el = Math.sin((env.time - 0.25) * 6.2832);
  env.el = el;
  env.sun = el > 0 ? Math.min(1, el * 1.6) : 0;
  env.ambient = env.temp + el * 4 - 1;
}

function altitudeOf(cy) { return gy > 0 ? 1 - (cy + 0.5) / GH : gy < 0 ? (cy + 0.5) / GH : 0.5; }

function spawnPrecip(cx, cy, alt) {
  const x = Math.min(W - 1, (cx << 3) + rndi(8)), y = Math.min(H - 1, gy < 0 ? (cy << 3) : (cy << 3) + 7);
  const i = x + y * W;
  if (type[i] !== 0) return false;
  if (env.ambient - alt * 6 <= 0.5) { put(i, SNOW, x, y); env.snowCount++; }
  else { put(i, WATER, x, y); temp[i] = Math.max(1, Math.min(env.ambient, 15)); env.rainCount++; }
  st.rain++;
  return true;
}

function stepVapor() {
  const n = GW * GH, amb = env.ambient;
  let tf = 1 + (amb - 20) / 40;
  tf = tf < 0.3 ? 0.3 : tf > 2 ? 2 : tf;
  vaporB.fill(0); cloudB.fill(0);
  const upOff = gy > 0 ? -GW : gy < 0 ? GW : 0;
  for (let cy = 0; cy < GH; cy++) {
    const alt = altitudeOf(cy), sat = (0.35 + 5.6 * Math.pow(1 - alt, 1.5)) * tf;
    for (let cx = 0; cx < GW; cx++) {
      const c = cx + cy * GW;
      let v = vapor[c], cl = cloud[c];
      if (v > sat) { const d = (v - sat) * 0.25; v -= d; cl += d; }                      // 过饱和 → 凝成云
      else if (cl > 0 && v < sat * 0.6) { const d = Math.min(cl, (sat * 0.6 - v) * 0.03); cl -= d; v += d; }   // 太干 → 云散
      if (alt > 0.8) {                                                                 // 高空：天气预设的外部输入 / 输出
        if (env.moistIn > 0) { v += env.moistIn; env.waterIn += env.moistIn; }
        if (env.cloudFade > 0) { const d = cl * env.cloudFade + v * env.cloudFade; cl -= cl * env.cloudFade; v -= v * env.cloudFade; env.waterOut += d; }
      }
      // 云够厚就降水：超过一半阈值开始零星落雨，超过阈值越厚下得越急；每一滴都从云里扣掉
      if (cl > RAIN_THR * 0.5 && rnd() < Math.min(0.6, (cl - RAIN_THR * 0.5) * 0.06 + (cl > RAIN_THR ? (cl - RAIN_THR) * 0.2 : 0))) { if (spawnPrecip(cx, cy, alt)) cl -= 1; }
      if (env.storm > 0 && cl > RAIN_THR * 0.8) env.charge += env.storm * 0.0006 * cl;
      if (v < 1e-6) v = 0;
      if (cl < 1e-6) cl = 0;
      // 输运：水汽上升 + 随风 + 扩散；云只随风和少量扩散
      const w = windX[c], aw = w < 0 ? -w : w, fw = aw * 0.15 > 0.3 ? 0.3 : aw * 0.15;
      const side = w > 0 ? (cx < GW - 1 ? c + 1 : -1) : (cx > 0 ? c - 1 : -1);
      const up = upOff !== 0 && c + upOff >= 0 && c + upOff < n ? c + upOff : -1;
      let keep = v;
      if (up >= 0) { const d = v * 0.08; vaporB[up] += d; keep -= d; }
      if (side >= 0) { const d = v * fw; vaporB[side] += d; keep -= d; }
      const dv = v * 0.02;
      if (cx > 0) { vaporB[c - 1] += dv; keep -= dv; }
      if (cx < GW - 1) { vaporB[c + 1] += dv; keep -= dv; }
      if (cy > 0) { vaporB[c - GW] += dv; keep -= dv; }
      if (cy < GH - 1) { vaporB[c + GW] += dv; keep -= dv; }
      vaporB[c] += keep;
      let keepC = cl;
      if (side >= 0) { const d = cl * fw * 0.7; cloudB[side] += d; keepC -= d; }
      const dc = cl * 0.008;
      if (cx > 0) { cloudB[c - 1] += dc; keepC -= dc; }
      if (cx < GW - 1) { cloudB[c + 1] += dc; keepC -= dc; }
      cloudB[c] += keepC;
    }
  }
  let t = vapor; vapor = vaporB; vaporB = t;
  t = cloud; cloud = cloudB; cloudB = t;
  if (env.charge > 1) { env.charge = 0; lightning(); }
}

function stepWeather() {
  if (env.dayNight && env.timeScale > 0) { env.time += env.timeScale / DAY_STEPS; if (env.time >= 1) env.time -= 1; }
  updateSun();
  const ph = tick & 3, n = GW * GH;
  // 每步抽样 1/4 的粗格，估计它比环境热多少
  for (let c = ph; c < n; c += 4) {
    const x = ((c % GW) << 3) + rndi(8), y = (((c / GW) | 0) << 3) + rndi(8);
    if (x >= W || y >= H) continue;
    let ex = temp[x + y * W] - env.ambient;
    ex = ex < 0 ? 0 : ex > 900 ? 900 : ex;
    heatC[c] += (ex - heatC[c]) * 0.2;
  }
  if (ph === 0) {
    const gust = Math.sin(tick * 0.004), pw = env.windPower;
    for (let cy = 0; cy < GH; cy++) {
      const alt = altitudeOf(cy);
      const base = env.wind * pw * 1.4 * (0.5 + 0.7 * alt) + Math.sin(tick * 0.011 + cy * 0.7) * 0.1 * pw + gust * 0.08 * pw;
      for (let cx = 0; cx < GW; cx++) {
        const c = cx + cy * GW;
        let d = ((cx < GW - 1 ? heatC[c + 1] : 0) - (cx > 0 ? heatC[c - 1] : 0)) * 0.003;   // 往热的一侧吸
        d = d > 0.6 ? 0.6 : d < -0.6 ? -0.6 : d;
        windX[c] += (base + d - windX[c]) * 0.15;
      }
    }
  } else if (ph === 2) stepVapor();
}

/* ---- 闪电 ---- */
function boltPath(x0, y0, x1, y1, disp, out) {
  if (disp < 1.5) { out.push(x1, y1); return; }
  const mx = (x0 + x1) / 2 + (rnd() - 0.5) * disp, my = (y0 + y1) / 2 + (rnd() - 0.5) * disp * 0.35;
  boltPath(x0, y0, mx, my, disp / 2, out);
  boltPath(mx, my, x1, y1, disp / 2, out);
}

function drawBolt(pts) {
  for (let k = 0; k + 3 < pts.length; k += 2) {
    const x0 = pts[k], y0 = pts[k + 1], x1 = pts[k + 2], y1 = pts[k + 3];
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for (let s = 0; s <= n; s++) {
      const x = Math.round(x0 + (x1 - x0) * s / n), y = Math.round(y0 + (y1 - y0) * s / n);
      if (!inb(x, y)) continue;
      const j = x + y * W;
      if (type[j] !== 0 && M_STATE[type[j]] !== S_GAS) continue;
      put(j, SPARK, x, y);
      flags[j] &= ~F_TIP; life[j] = 5 + rndi(5);
    }
  }
}

// tx 给了就是「召唤闪电」：劈向这一列附近；不给就由云自己找目标
function lightning(tx) {
  const manual = tx !== undefined;
  let best = -1, bv = 0;
  for (let c = 0, n = GW * GH; c < n; c++) {
    if (cloud[c] < 0.3) continue;
    const v = cloud[c] + rnd() * 0.3 - (manual ? Math.abs(((c % GW) << 3) - tx) * 0.02 : 0);
    if (v > bv) { bv = v; best = c; }
  }
  let sx, sy;
  if (best >= 0) { sx = ((best % GW) << 3) + 4; sy = (((best / GW) | 0) << 3) + 6; }
  else { sx = manual ? tx + rndi(21) - 10 : rndi(W); sy = 1; }
  if (!manual) tx = sx + rndi(41) - 20;
  const span = manual ? 5 : 40;
  // 选落点：越高越好，导体加分（金属 > 水），离云太远扣分
  let bx = -1, by = H - 1, bs = -1e9;
  for (let x = Math.max(0, tx - span); x <= Math.min(W - 1, tx + span); x++) {
    let y = Math.min(H - 1, sy + 1), o = 0;
    for (; y < H; y++) { o = type[x + y * W]; if (o !== 0 && M_STATE[o] < S_GAS) break; }
    if (y >= H) { y = H - 1; o = 0; }
    const score = (H - y) + (M_ELEC[o] ? (o === WATER || o === SALTWATER ? 12 : 45) : 0) - Math.abs(x - sx) * 0.4 + rnd() * 6;
    if (score > bs) { bs = score; bx = x; by = y; }
  }
  if (bx < 0) return;
  const pts = [sx, sy];
  boltPath(sx, sy, bx, by - 1, Math.min(28, Math.abs(by - sy) * 0.35 + 4), pts);
  drawBolt(pts);
  for (let b = 0; b < 3; b++) {                        // 分叉
    const k = (2 + rndi(Math.max(1, (pts.length >> 1) - 4))) << 1;
    if (k + 1 >= pts.length) continue;
    const ex = pts[k] + (rnd() - 0.5) * 40, ey = pts[k + 1] + 8 + rnd() * 22, br = [pts[k], pts[k + 1]];
    boltPath(pts[k], pts[k + 1], ex, ey, 10, br);
    drawBolt(br);
  }
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {   // 落点：高温 + 给导体注入电荷
    const x = bx + dx, y = by + dy;
    if (!inb(x, y) || dx * dx + dy * dy > 5) continue;
    const j = x + y * W;
    temp[j] = Math.min(2500, temp[j] + 1500);
    if (M_ELEC[type[j]]) addCharge(j, 255);
    wake(x, y);
  }
  env.strikes++;
  lastBolt = { x: bx, y: by, tick };
  if (onThunder) onThunder(bx, by);
}

// 雷声延迟：按落点到「听者」（画面底边中点）的距离算，越远越晚
function thunderDelay(x, y) { return 0.15 + Math.hypot(x - W / 2, y - (H - 1)) / W * 2.2; }

const WEATHER_PRESETS = {
  clear:  { name: '晴',   moistIn: 0,     cloudFade: 0.004, storm: 0, windPower: 0.2 },
  cloudy: { name: '多云', moistIn: 0.0006, cloudFade: 0,     storm: 0, windPower: 0.3 },
  rain:   { name: '雨',   moistIn: 0.0015, cloudFade: 0,     storm: 0, windPower: 0.45 },
  storm:  { name: '雷暴', moistIn: 0.0025, cloudFade: 0,     storm: 1, windPower: 0.8 },
  snow:   { name: '雪',   moistIn: 0.0004, cloudFade: 0,     storm: 0, windPower: 0.35, temp: -6 },
};

function setWeather(key) {
  const p = WEATHER_PRESETS[key];
  if (!p) return;
  env.weather = key; env.moistIn = p.moistIn; env.cloudFade = p.cloudFade; env.storm = p.storm; env.windPower = p.windPower;
  if (p.temp !== undefined) env.temp = p.temp; else if (env.temp < 5) env.temp = AMBIENT;
}

/* =====================================================================
 * 2.14 场景编解码（撤销快照、存档、导入导出共用；RLE 压缩）
 * ===================================================================== */
function rleEncode(src) {
  const n = src.length, out = new Uint8Array(n * 2 + 2);
  let p = 0, i = 0;
  while (i < n) {
    const v = src[i];
    let run = 1;
    while (run < 255 && i + run < n && src[i + run] === v) run++;
    out[p++] = run; out[p++] = v;
    i += run;
  }
  return out.slice(0, p);
}

function rleDecode(buf, n) {
  const out = new Uint8Array(n);
  let p = 0;
  for (let q = 0; q + 1 < buf.length && p < n; q += 2) {
    const run = buf[q];
    out.fill(buf[q + 1], p, Math.min(n, p + run));
    p += run;
  }
  return out;
}

// 快照：类型整张 RLE；其余属性只存非空格子，按字节平面分别 RLE。
// 正在下落的刚体按当前位置存成普通固体；空气的温度、浑浊度和湿度场不存。
function captureScene() {
  let cnt = 0;
  for (let i = 0; i < N; i++) if (type[i] !== 0) cnt++;
  const sd = new Uint8Array(cnt), tl = new Uint8Array(cnt), th = new Uint8Array(cnt),
        ll = new Uint8Array(cnt), lh = new Uint8Array(cnt), fl = new Uint8Array(cnt),
        w = new Uint8Array(cnt), x = new Uint8Array(cnt), ul = new Uint8Array(cnt), uh = new Uint8Array(cnt);
  for (let i = 0, k = 0; i < N; i++) {
    if (type[i] === 0) continue;
    let T = Math.round(temp[i]);
    T = (T < -32768 ? -32768 : T > 32767 ? 32767 : T) & 0xffff;
    const L = (flags[i] & F_BODY) ? 0 : life[i];
    sd[k] = seed[i]; tl[k] = T & 255; th[k] = T >> 8;
    ll[k] = L & 255; lh[k] = L >> 8; fl[k] = flags[i] & F_SAVE;
    w[k] = wet[i]; x[k] = aux[i]; ul[k] = fuel[i] & 255; uh[k] = fuel[i] >> 8;
    k++;
  }
  return { w: W, h: H, g: gravity, n: cnt, t: rleEncode(type), s: sd,
           tl: rleEncode(tl), th: rleEncode(th), ll: rleEncode(ll), lh: rleEncode(lh), f: rleEncode(fl),
           wt: rleEncode(w), ax: rleEncode(x), ul: rleEncode(ul), uh: rleEncode(uh),
           env: { time: env.time, timeScale: env.timeScale, temp: env.temp, wind: env.wind, windPower: env.windPower, weather: env.weather } };
}

// 还原到当前网格；尺寸不同的话按「底边居中」对齐，超出部分裁掉。v3 的存档没有含水量等字段，按默认值补。
function restoreScene(s) {
  const src = rleDecode(s.t, s.w * s.h), n = s.n;
  const tl = rleDecode(s.tl, n), th = rleDecode(s.th, n), ll = rleDecode(s.ll, n), lh = rleDecode(s.lh, n), fl = rleDecode(s.f, n);
  const v4 = !!s.wt;
  const wt = v4 ? rleDecode(s.wt, n) : null, ax = v4 ? rleDecode(s.ax, n) : null,
        ul = v4 ? rleDecode(s.ul, n) : null, uh = v4 ? rleDecode(s.uh, n) : null;
  clearGrid();
  setGravity(s.g || 'down');
  if (s.env) {
    env.time = s.env.time; env.timeScale = s.env.timeScale; env.temp = s.env.temp; env.wind = s.env.wind;
    setWeather(s.env.weather || 'clear');
    env.temp = s.env.temp; env.windPower = s.env.windPower;
    updateSun();
  }
  const ox = ((W - s.w) / 2) | 0, oy = H - s.h;
  let k = 0;
  for (let y = 0; y < s.h; y++) {
    for (let x = 0; x < s.w; x++) {
      const t = src[x + y * s.w];
      if (t === 0) continue;
      const kk = k++;
      const X = x + ox, Y = y + oy;
      if (X < 0 || X >= W || Y < 0 || Y >= H || t >= NT) continue;
      const i = X + Y * W;
      let T = tl[kk] | (th[kk] << 8);
      if (T > 32767) T -= 65536;
      type[i] = t; seed[i] = s.s[kk]; temp[i] = T; life[i] = ll[kk] | (lh[kk] << 8); flags[i] = fl[kk] | (parity ^ 1);
      if (v4) { wet[i] = wt[kk]; aux[i] = ax[kk]; fuel[i] = ul[kk] | (uh[kk] << 8); }
      else { wet[i] = t === PLANT ? 60 : 0; aux[i] = M_RIGID[t] ? 255 : t === SOIL ? 200 : 0; fuel[i] = initFuel(t); }
    }
  }
  structDirty = true;
  wakeAll();
}

function bytesToB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function b64ToBytes(b) {
  const s = atob(b), u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

const SCENE_STREAMS = ['t', 's', 'tl', 'th', 'll', 'lh', 'f', 'wt', 'ax', 'ul', 'uh'];

function sceneToJSON(s) {
  const o = { app: 'particle-sandbox', v: 4, w: s.w, h: s.h, g: s.g, n: s.n, env: s.env };
  for (const k of SCENE_STREAMS) o[k] = bytesToB64(s[k]);
  return JSON.stringify(o);
}

function sceneFromJSON(str) {
  const o = JSON.parse(str);
  if (!o || o.app !== 'particle-sandbox' || !(o.w > 0) || !(o.h > 0)) throw new Error('不是粒子沙盘的存档文件');
  const s = { w: o.w | 0, h: o.h | 0, g: o.g, n: o.n | 0, env: o.env || null };
  for (const k of SCENE_STREAMS) if (typeof o[k] === 'string') s[k] = b64ToBytes(o[k]);
  if (!s.t || !s.s) throw new Error('存档文件不完整');
  return s;
}

/* =====================================================================
 * 2.15 预设场景（不依赖 DOM，自测和 soak 测试也用它）
 * ===================================================================== */
let sceneScript = null;    // 场景自带的小脚本，每个模拟步调用一次（比如「入夜才喷发」）

function setBurning(x, y) {
  if (!inb(x, y)) return;
  const i = x + y * W, t = type[i];
  if (M_FLAM[t] > 0) { temp[i] = M_IGN[t] + 150; wet[i] = 0; ignite(i, t, x, y); }
}

function soakSoil(amount) {
  for (let i = 0; i < N; i++) if (type[i] === SOIL || type[i] === SAND) wet[i] = Math.min(M_ABSORB[type[i]], amount);
}

function cloneSource(x, y, mat) {
  if (!inb(x, y)) return;
  const i = x + y * W;
  put(i, CLONE, x, y); life[i] = mat;
}

function drawTree(x, ground, h, r) {
  for (let y = ground - h; y < ground; y++) for (let dx = 0; dx < 2; dx++) if (inb(x + dx, y)) put(x + dx + y * W, WOOD, x + dx, y);
  const gene = rndi(256);
  for (let k = 0; k < 3; k++) {
    const ox = x + rndi(7) - 3, oy = ground - h - rndi(4);
    for (let y = Math.floor(oy - r); y <= oy + r; y++) for (let xx = Math.floor(ox - r); xx <= ox + r; xx++) {
      const dx = xx - ox, dy = (y - oy) * 1.25;
      if (!inb(xx, y) || dx * dx + dy * dy > r * r || type[xx + y * W] !== 0 || rnd() < 0.12) continue;
      put(xx + y * W, PLANT, xx, y); seed[xx + y * W] = gene;
    }
  }
}

function groundLine(amp, k1, k2, baseY) {
  const g = new Int32Array(W);
  for (let x = 0; x < W; x++) g[x] = Math.floor(baseY + Math.sin(x * k1) * amp + Math.sin(x * k2 + 1.7) * amp * 0.6);
  return g;
}

function buildVolcano(withSource) {
  const cx = W >> 1, base = H - 5, peak = Math.floor(H * 0.56), half = Math.floor(W * 0.3), sea = Math.floor(H * 0.74);
  fillRect(STONE, 0, base, W - 1, H - 1);
  const top = new Int32Array(W);
  for (let x = 0; x < W; x++) {
    const k = Math.max(0, 1 - Math.abs(x - cx) / half);
    const h = Math.floor(Math.pow(k, 1.25) * peak + (k > 0 ? Math.sin(x * 0.31) * 2 + Math.sin(x * 0.11) * 3 : 0));
    top[x] = base - Math.max(0, h);
    for (let y = top[x]; y < base; y++) put(x + y * W, STONE, x, y);
    if (top[x] > sea - 4 && top[x] < base) for (let y = top[x] - 2; y < top[x]; y++) if (inb(x, y)) put(x + y * W, SAND, x, y);   // 海滩
  }
  for (let y = sea; y < base; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === 0) put(x + y * W, WATER, x, y);
  const mouth = top[cx], depth = Math.floor(peak * 0.42);
  fillRect(LAVA, cx - 2, mouth + 4, cx + 2, mouth + depth);
  fillCircle(LAVA, cx, mouth + depth, 7);
  fillRect(EMPTY, cx - 2, mouth - 6, cx + 2, mouth + 3);
  // 岩浆供给：火山口底下每隔几步涌出新的熔岩，凝住的口子会被重新顶开。总量有限（budget 格），喷完就停。
  const eruption = budget => () => {
    if (budget <= 0) return;
    for (let x = cx - 2; x <= cx + 2; x++) {
      const y = mouth + 5, i = x + y * W, t = type[i];
      if (t === LAVA) { if (temp[i] < 1400) temp[i] = 1500; wake(x, y); }
      else if (t === 0 || t === STONE) { put(i, LAVA, x, y); budget--; }
    }
    for (let n = 0; n < 2; n++) {                                         // 把岩浆柱往上顶
    const tx = cx - 2 + rndi(5), ty = mouth + 4;
    for (let y = ty; y > 2; y--) { const j = tx + y * W; if (type[j] === 0) { put(j, LAVA, tx, y); budget--; break; } if (type[j] === STONE) { put(j, LAVA, tx, y); break; } if (type[j] !== LAVA) break; }
    }
  };
  const openVent = () => { sceneScript = eruption(withSource || 6000); };
  if (withSource) openVent();
  for (let k = 0; k < 26; k++) {                        // 山腰点几丛植物
    const x = cx + (rnd() < 0.5 ? -1 : 1) * Math.floor(half * (0.45 + rnd() * 0.4));
    if (x < 1 || x >= W - 1 || top[x] >= sea) continue;
    for (let h = 1; h <= 2 + rndi(4); h++) if (inb(x, top[x] - h)) put(x + (top[x] - h) * W, PLANT, x, top[x] - h);
  }
  return openVent;
}

function sceneVolcano() {
  env.time = 0.85; env.timeScale = 1; setWeather('clear'); env.wind = 0.3;
  buildVolcano(5000);       // 一次喷发的岩浆总量有限，喷完火山就安静下来
}

function sceneVolcanoDayNight() {
  // 从下午开始，时间流速 10x（一昼夜 1 分钟）；太阳落山的那一刻火山口才打开
  env.time = 0.6; env.timeScale = 10; setWeather('clear'); env.wind = -0.3;
  const openVent = buildVolcano(0);
  sceneScript = () => { if (env.el < -0.05) openVent(); };      // 太阳落山：换成喷发脚本
}

function buildForest(density) {
  const g = groundLine(3, 0.035, 0.09, H - 16);
  for (let x = 0; x < W; x++) {
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
    if (rnd() < 0.8) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);       // 草
  }
  for (let x = 14; x < W - 12; x += Math.floor((17 + rndi(10)) / density)) drawTree(x, g[x], 16 + rndi(Math.max(4, Math.floor(H * 0.16))), 6 + rndi(4));
  for (let k = 0; k < W / 9; k++) {                       // 零星的花
    const x = 2 + rndi(W - 4), y = g[x] - 2 - rndi(2), c = rndi(5) * 51 + 8;
    if (inb(x, y) && type[x + y * W] === PLANT) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); }
  }
  soakSoil(70);
  return g;
}

function sceneForest() {
  env.time = 0.86; env.timeScale = 1; setWeather('clear'); env.wind = 0.5; env.windPower = 0.4;
  const g = buildForest(1);
  for (let x = 12; x < 20; x++) for (let y = g[14] - 6; y < g[14]; y++) setBurning(x, y);   // 左边第一棵树的树根处点火
}

function sceneStormForest() {
  // 雷暴：闪电自己劈下来点着树，雨再把火浇灭；两侧各有一个排水口，积水不会无限涨
  env.time = 0.9; env.timeScale = 1; setWeather('storm'); env.wind = 0.6;
  const g = buildForest(1.3);
  for (const x of [0, W - 1]) for (let y = g[x] - 4; y < g[x] + 2; y++) if (inb(x, y)) { const i = x + y * W; put(i, VOID, x, y); }
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.6;      // 开场就有云
  env.waterIn += weatherWater();
}

function sceneHourglass() {
  env.time = 0.45; env.timeScale = 0; setWeather('clear'); env.wind = 0;
  const cx = W >> 1, cy = H >> 1, b = Math.floor(H * 0.42), a = Math.floor(Math.min(W * 0.2, b * 0.75));
  const inner = (x, y) => {
    const dy = Math.abs(y - cy);
    return dy <= b - 3 && Math.abs(x - cx) <= 1 + (a - 4) * dy / b;
  };
  for (let y = cy - b; y <= cy + b; y++) for (let x = cx - a - 3; x <= cx + a + 3; x++) {
    if (!inb(x, y)) continue;
    if (inner(x, y)) continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) if (inner(x + dx, y + dy)) { near = true; break; }
    if (near) put(x + y * W, GLASS, x, y);
  }
  for (let y = cy - b + 3 + Math.floor(b * 0.12); y < cy - 2; y++) for (let x = cx - a; x <= cx + a; x++) if (inner(x, y)) put(x + y * W, SAND, x, y);
  fillRect(WOOD, cx - a - 6, cy - b - 3, cx + a + 6, cy - b - 1);
  fillRect(WOOD, cx - a - 6, cy + b + 1, cx + a + 6, cy + b + 3);
  for (const sx of [cx - a - 6, cx + a + 5]) fillRect(WOOD, sx, cy - b - 1, sx + 1, cy + b + 1);
  // 四个角钉上锚点：整个架子悬在画面中间，翻转重力也不会掉
  for (const ax of [cx - a - 6, cx + a + 5]) for (const ay of [cy - b - 3, cy + b + 2]) fillRect(ANCHOR, ax, ay, ax + 1, ay + 1);
}

function drawBeaker(x0, y1, w, h, liquid, fill) {
  for (let y = y1 - h; y <= y1; y++) for (let x = x0; x <= x0 + w; x++) {
    if (x <= x0 + 1 || x >= x0 + w - 1 || y >= y1 - 1) put(x + y * W, GLASS, x, y);
    else if (liquid && y > y1 - 1 - h * fill) put(x + y * W, Array.isArray(liquid) ? liquid[rndi(liquid.length)] : liquid, x, y);
  }
}

function sceneLab() {
  env.time = 0.92; env.timeScale = 0; setWeather('clear'); env.wind = 0; env.windPower = 0;
  const floor = H - 4, table = Math.floor(H * 0.74);
  fillRect(STONE, 0, floor, W - 1, H - 1);
  fillRect(WOOD, 6, table, W - 7, table + 2);
  for (const lx0 of [10, W - 13]) fillRect(WOOD, lx0, table + 3, lx0 + 2, floor - 1);
  const n = 5, gap = Math.floor((W - 24) / n), bw = Math.min(gap - 8, Math.floor(W * 0.13)), bh = Math.floor(H * 0.3);
  const liquids = [OIL, WATER, ACID, SALTWATER, [OIL, WATER, SALTWATER]];
  for (let k = 0; k < n; k++) {
    const x0 = 14 + k * gap + ((gap - bw) >> 1);
    drawBeaker(x0, table - 1, bw, k === 4 ? Math.floor(bh * 1.5) : bh, liquids[k], k === 4 ? 0.8 : 0.62);
  }
  // 电路：左侧的电火花源（克隆体记住了电火花）→ 顶部金属导线 → 插进水槽的电极。导线两头用锚点固定
  const wy = Math.floor(table - bh * 1.5 - 12), waterX = 14 + gap + (gap >> 1), srcX = 8;
  fillRect(METAL, srcX + 2, wy, waterX, wy);
  fillRect(METAL, waterX, wy, waterX, table - 1 - Math.floor(bh * 0.35));
  cloneSource(srcX, wy, SPARK);
  fillRect(ANCHOR, srcX + 2, wy - 1, srcX + 3, wy - 1);
  fillRect(ANCHOR, waterX - 1, wy - 1, waterX + 1, wy - 1);
  // 右侧：一小堆火药，导线故意留了 3 格缺口，补上金属就会引爆
  const gpX = W - 26;
  fillRect(METAL, waterX + 4, wy, gpX - 4, wy);
  fillRect(EMPTY, waterX + 1, wy, waterX + 3, wy);
  fillRect(ANCHOR, waterX + 4, wy - 1, waterX + 5, wy - 1);
  fillRect(ANCHOR, gpX - 5, wy - 1, gpX - 3, wy - 1);
  fillRect(GLASS, gpX - 8, wy + 11, gpX + 8, wy + 12);
  fillRect(ANCHOR, gpX - 9, wy + 11, gpX - 9, wy + 12);
  fillRect(ANCHOR, gpX + 9, wy + 11, gpX + 9, wy + 12);
  fillCircle(GUNPOWDER, gpX - 1, wy + 8, 3.2);
  fillRect(METAL, gpX - 4, wy, gpX - 4, wy + 10);
}

// 爆破拆除：底层架空的混凝土柱 + 每层一道钢梁 + 砖墙玻璃窗。柱脚整段换成 TNT，用火药导爆索串起来。
// 返回建筑的范围，自测用它来判断塌没塌。
function buildDemolition(lit, floorY) {
  const floor = floorY === undefined ? H - 6 : floorY;
  fillRect(STONE, 0, floor, W - 1, Math.min(H - 1, floor + 5));
  const bw = Math.floor(W * 0.36), x0 = Math.floor(W * 0.46), sh = 20;
  const storeys = Math.max(3, Math.min(5, Math.floor((floor - 14) / sh)));
  const cols = 4, colW = 3;
  const colX = k => x0 + Math.round((bw - colW) * k / cols);
  for (let s = 0; s < storeys; s++) {
    const yb = floor - 1 - s * sh, yt = yb - sh + 1;
    for (let k = 0; k <= cols; k++) fillRect(CONCRETE, colX(k), yt + 2, colX(k) + colW - 1, yb);     // 柱
    fillRect(STEEL, x0, yt, x0 + bw - 1, yt + 1);                                                    // 钢梁
    if (s === 0) continue;                                                                           // 底层架空
    for (let k = 0; k < cols; k++) {                                                                 // 砖墙 + 窗
      const xa = colX(k) + colW, xb = colX(k + 1) - 1;
      fillRect(BRICK, xa, yt + 2, xb, yb);
      fillRect(GLASS, xa + 3, yt + 6, xb - 3, yb - 6);
    }
  }
  const roof = floor - storeys * sh;
  fillRect(CONCRETE, x0 - 1, roof - 2, x0 + bw, roof - 1);
  // 炸药：最下面两层的每根柱子各三包，上下间隔不超过 8 格，一包炸了会殉爆相邻的 → 自下而上连锁。地面一条火药导爆索
  for (let st2 = 0; st2 < Math.min(2, storeys - 1); st2++) {
    const f = floor - 1 - st2 * sh;
    for (let k = 0; k <= cols; k++) for (const dy of [3, 9, 15]) fillRect(TNT, colX(k), f - dy - 1, colX(k) + colW - 1, f - dy + 1);
  }
  fillRect(GUNPOWDER, 6, floor - 1, x0 + bw - 1, floor - 1);
  if (lit) { setBurning(6, floor - 1); setBurning(7, floor - 1); }
  return { x0, x1: x0 + bw - 1, floor, roof, sh, storeys };
}

function sceneDemolition() {
  env.time = 0.42; env.timeScale = 0; setWeather('clear'); env.wind = 0.3; env.windPower = 0.3;
  buildDemolition(true);
}

function buildGarden() {
  const g = groundLine(4, 0.03, 0.075, H - 20);
  const pondX = Math.floor(W * 0.68), pondR = Math.floor(W * 0.09);
  for (let x = 0; x < W; x++) {
    const d = Math.abs(x - pondX);
    if (d < pondR) g[x] += Math.floor(Math.cos(d / pondR * 1.5708) * 9);       // 挖一个池塘
    for (let y = g[x]; y < H; y++) put(x + y * W, y > H - 4 ? STONE : SOIL, x, y);
  }
  const level = Math.min(g[Math.max(0, pondX - pondR)], g[Math.min(W - 1, pondX + pondR)]) + 1;
  for (let x = pondX - pondR; x <= pondX + pondR; x++) for (let y = level; y < g[x]; y++) if (inb(x, y)) put(x + y * W, WATER, x, y);
  put(pondX + level * W, VOID, pondX, level);            // 水面高度处的溢流口：池塘满了才排水
  for (let x = 10; x < W - 8; x += 21 + rndi(12)) if (Math.abs(x - pondX) > pondR + 6) drawTree(x, g[x], 12 + rndi(12), 5 + rndi(3));
  for (let x = 2; x < W - 2; x++) {
    if (Math.abs(x - pondX) <= pondR) continue;
    const q = rnd();
    if (q < 0.5) for (let h = 1; h <= 1 + rndi(3); h++) put(x + (g[x] - h) * W, PLANT, x, g[x] - h);
    else if (q < 0.62) put(x + (g[x] - 1) * W, SEED, x, g[x] - 1);
    if (q < 0.07) { const y = g[x] - 3, c = rndi(5) * 51 + 8; if (type[x + y * W] === 0) { put(x + y * W, FLOWER, x, y); seed[x + y * W] = c + rndi(34); } }
  }
  for (const x of [0, W - 1]) for (let y = g[x] - 3; y < g[x] + 1; y++) if (inb(x, y)) put(x + y * W, VOID, x, y);   // 两侧排水口
  soakSoil(60);
}

function sceneRain() {
  env.time = 0.92; env.timeScale = 1; setWeather('rain'); env.wind = -0.4;
  buildGarden();
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.8;
  env.waterIn += weatherWater();
}

function sceneWaterfall() {
  env.time = 0.4; env.timeScale = 1; setWeather('clear'); env.wind = 0.15;
  const base = H - 5;
  fillRect(STONE, 0, base, W - 1, H - 1);
  // 左高右低的三级石阶
  const steps = [[0, 0.30, 0.34], [0.30, 0.52, 0.56], [0.52, 0.70, 0.76]];
  for (const [a, b, top] of steps) {
    const xa = Math.floor(W * a), xb = Math.floor(W * b), yt = Math.floor(H * top);
    for (let x = xa; x < xb; x++) for (let y = yt + Math.floor(Math.sin(x * 0.4) * 1.5); y < base; y++) if (inb(x, y)) put(x + y * W, STONE, x, y);
  }
  // 每级台阶上凿一个浅水槽，让水先蓄再溢
  for (const [a, b, top] of steps) {
    const xa = Math.floor(W * a) + 6, xb = Math.floor(W * b) - 3, yt = Math.floor(H * top);
    fillRect(EMPTY, xa, yt - 2, xb, yt + 3);
    fillRect(WATER, xa, yt + 1, xb, yt + 3);
    fillRect(EMPTY, xb + 1, yt - 3, Math.floor(W * b) - 1, yt + 1);          // 右侧的槽沿削低：水一满就从这里跌下去
  }
  // 最高处的水源（克隆体）和最右下角的排水口（黑洞）：流进来多少流出去多少
  const sy = Math.floor(H * 0.34) - 3;
  for (let k = 0; k < 8; k++) cloneSource(2 + k * 2, sy - (k & 1) * 2, WATER);
  // 谷底：水潭 + 右岸的土和植物
  const poolTop = Math.floor(H * 0.86), bankX = Math.floor(W * 0.84);
  fillRect(WATER, Math.floor(W * 0.70), poolTop, bankX - 1, base - 1);
  for (let x = bankX; x < W; x++) for (let y = poolTop - 3 - Math.floor((x - bankX) * 0.12); y < base; y++) if (inb(x, y)) put(x + y * W, SOIL, x, y);
  for (let y = poolTop - 1; y <= poolTop; y++) put(bankX - 1 + y * W, VOID, bankX - 1, y);      // 水面处的溢流口
  for (let x = bankX + 3; x < W - 3; x += 9 + rndi(6)) { let y = 0; while (y < H && type[x + y * W] === 0) y++; drawTree(x, y, 8 + rndi(8), 4 + rndi(3)); }
  for (let x = bankX + 1; x < W - 1; x++) { let y = 0; while (y < H && type[x + y * W] === 0) y++; if (type[x + y * W] === SOIL && rnd() < 0.6) put(x + (y - 1) * W, PLANT, x, y - 1); }
  soakSoil(90);
}

function sceneWinterLake() {
  env.time = 0.4; env.timeScale = 1; setWeather('snow'); env.wind = 0.4;
  temp.fill(env.temp);
  const g = groundLine(3, 0.028, 0.07, H - 30);
  const lakeX = W >> 1, lakeR = Math.floor(W * 0.3);
  for (let x = 0; x < W; x++) {
    const d = Math.abs(x - lakeX);
    if (d < lakeR) g[x] += Math.floor(Math.cos(d / lakeR * 1.5708) * 18);
    for (let y = g[x]; y < H; y++) { const i = x + y * W; put(i, y > H - 4 ? STONE : SOIL, x, y); temp[i] = -2; }
  }
  const level = Math.min(g[lakeX - lakeR], g[lakeX + lakeR]) + 2;
  for (let x = lakeX - lakeR; x <= lakeX + lakeR; x++) for (let y = level; y < g[x]; y++) {
    if (!inb(x, y)) continue;
    const i = x + y * W;
    if (y < level + 3) { put(i, ICE, x, y); temp[i] = -8; } else { put(i, WATER, x, y); temp[i] = 6; }     // 冰盖下面是 6°C 的水
  }
  for (let x = 0; x < W; x++) {                           // 岸上积雪 + 几棵落光叶子的树
    if (Math.abs(x - lakeX) < lakeR) continue;
    for (let h = 1; h <= 2 + rndi(2); h++) if (inb(x, g[x] - h)) put(x + (g[x] - h) * W, SNOW, x, g[x] - h);
  }
  for (let x = 12; x < W - 10; x += 26 + rndi(14)) {
    if (Math.abs(x - lakeX) < lakeR + 4) continue;
    const h = 14 + rndi(10);
    for (let y = g[x] - h; y < g[x]; y++) for (let dx = 0; dx < 2; dx++) put(x + dx + y * W, WOOD, x + dx, y);
    for (let k = 1; k <= 4; k++) for (const d of [-1, 1]) { const bx = x + d * k + (d > 0 ? 1 : 0), by = g[x] - h + 2 + k; if (inb(bx, by)) put(bx + by * W, WOOD, bx, by); }
  }
  for (let c = 0; c < GW * GH; c++) if (altitudeOf((c / GW) | 0) > 0.75) cloud[c] = 1.5;
  env.waterIn += weatherWater();
}

const SCENES = [
  { name: '火山岛', note: '熔岩流进海里，先结壳再凝固', fn: sceneVolcano },

  { name: '瀑布峡谷', note: '三级跌水，水花、泡沫和涟漪', fn: sceneWaterfall },
