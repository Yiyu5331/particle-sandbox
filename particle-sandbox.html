  { name: '火山爆发 + 昼夜', note: '时间 10 倍速，太阳一落山就喷发', fn: sceneVolcanoDayNight },
];

// 清空并搭建第 k 个预设；每个场景自己设定时间、天气和风
function buildScene(k) {
  env.temp = AMBIENT; env.dayNight = true; env.structure = true; env.wind = 0.2; env.windPower = 0.3;
  sceneScript = null;
  setWeather('clear');
  clearGrid();
  setGravity('down');
  updateSun();
  SCENES[k].fn();
  updateSun();
  temp.forEach((v, i) => { if (type[i] === 0) temp[i] = env.ambient; });
  structDirty = true;
  wakeAll();
}

/* =====================================================================
 * 3. 渲染
 *    WebGL2 管线：状态纹理 → 场景着色（双输出：底色 + 自发光）
 *                → 辉光时间累积（拖尾）→ 5 级降采样/升采样（bloom + 大范围光照）
 *                → 光照合成 → 后处理（震动/冲击波/色差/闪白/色调映射/暗角/颗粒）
 *    不支持 WebGL2（或加 ?nogl=1）时退回 Canvas2D：同一套调色板，逐格上色。
 * ===================================================================== */
const settings = { bloom: true, light: true, distort: true, shake: true, aberration: true,
                   vignette: true, grain: true, tonemap: true, gridLines: false, hd: true,
                   smooth: true, texture: true, shadows: true, clouds: true };
const VIEW_NAMES = ['正常', '温度', '密度', '活跃块 / 刚体', '湿度'];
let viewMode = 0;
let canvas = null, gl = null, ctx2d = null, renderMode = 'none';
let particleCount = 0;
let pixelRatio = 1;

const fx = { flash: 0, shake: 0, ca: 0, boomX: 0.5, boomY: 0.5,
             shocks: [0, 1, 2, 3].map(() => ({ x: 0, y: 0, age: 0, power: 0 })), next: 0 };

function fxThunder() { fx.flash = Math.max(fx.flash, 0.45); fx.shake = Math.min(14, fx.shake + 3); }

function fxBoom(x, y, R, P) {
  const s = P * R / 15;
  if (s > 0.3) {
    fx.flash = Math.max(fx.flash, Math.min(0.85, 0.25 + 0.55 * s));
    fx.ca = Math.max(fx.ca, 0.008 * s);
    const k = fx.shocks[fx.next]; fx.next = (fx.next + 1) & 3;
    k.x = x / W; k.y = y / H; k.age = 0; k.power = s;
  } else fx.flash = Math.max(fx.flash, 0.04);
  fx.shake = Math.min(14, fx.shake + 9 * s);
  fx.boomX = x / W; fx.boomY = y / H;
}

function encTemp(T) {
  if (T <= 0) { const v = (T + 60) * (16 / 60); return v < 0 ? 0 : v; }
  return 16 + Math.sqrt((T > 2500 ? 2500 : T) / 2500) * 239;
}

/* ---------------------------------------------------------------------
 * 3.1 着色器
 * ------------------------------------------------------------------- */
const VS_QUAD = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

function matDefines() {
  let s = '';
  for (const m of MATERIALS) s += '#define T_' + m.key + ' ' + m.id + '.0\n';
  return s;
}

const FS_SCENE = `#version 300 es
precision highp float; precision highp int;
${matDefines()}
uniform sampler2D uState, uState2, uPal, uHeat, uChunk, uCloud;
uniform vec2 uGrid, uGrav, uLightDir, uSunPos, uMoonPos;
uniform float uTime, uDistort, uGridLines, uDay, uEl, uShadowK, uBolt;
uniform vec4 uQual;                                        // 液面平滑、纹理与法线光照、阴影、云
uniform vec3 uRip[8];                                      // 涟漪：x, y（格），已过去的秒数
uniform int uView;
in vec2 vUv;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oEmis;

float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ return vnoise(p)*0.55 + vnoise(p*2.1+3.7)*0.3 + vnoise(p*4.3+9.1)*0.15; }
bool inGrid(ivec2 c){ return c.x>=0 && c.y>=0 && c.x<int(uGrid.x) && c.y<int(uGrid.y); }
vec4 cell(ivec2 c){
  if(!inGrid(c)) return vec4(0.0,0.0,37.0,0.0);
  return floor(texelFetch(uState,c,0)*255.0+0.5);
}
vec4 cell2(ivec2 c){
  if(!inGrid(c)) return vec4(0.0);
  return floor(texelFetch(uState2,c,0)*255.0+0.5);
}
vec4 pal(float t,int k){ return texelFetch(uPal, ivec2(k,int(t)), 0); }
float kindOf(float t){ return floor(pal(t,6).r*255.0+0.5); }
float occ(ivec2 c){ if(!inGrid(c)) return 1.0; float k = kindOf(cell(c).r); return (k==1.0||k==2.0) ? 1.0 : 0.0; }   // 固体 / 粉末
float decT(float v){ return v<16.0 ? v*3.75-60.0 : pow((v-16.0)/239.0,2.0)*2500.0; }
vec3 blackbody(float T){
  float x = clamp((T-450.0)/1350.0,0.0,1.0);
  return vec3(smoothstep(0.0,0.3,x), smoothstep(0.18,0.8,x)*0.8, smoothstep(0.55,1.0,x)*0.65)*(0.35+1.6*x);
}
// 火焰按温度走黑体曲线：深红 → 橙 → 黄 → 白 → 偏蓝
vec3 flameColor(float T){
  vec3 c = mix(vec3(0.75,0.10,0.02), vec3(1.0,0.36,0.04), smoothstep(650.0,850.0,T));
  c = mix(c, vec3(1.0,0.72,0.22), smoothstep(850.0,1050.0,T));
  c = mix(c, vec3(1.0,0.95,0.78), smoothstep(1050.0,1300.0,T));
  return mix(c, vec3(0.80,0.90,1.0), smoothstep(1300.0,1700.0,T));
}
vec3 heatRamp(float T){
  if(T<20.0) return mix(vec3(0.15,0.5,1.0), vec3(0.03,0.03,0.07), clamp((T+40.0)/60.0,0.0,1.0));
  float x = sqrt(clamp((T-20.0)/1700.0,0.0,1.0));
  vec3 c = mix(vec3(0.03,0.03,0.07), vec3(0.55,0.05,0.35), smoothstep(0.0,0.25,x));
  c = mix(c, vec3(1.0,0.25,0.05), smoothstep(0.2,0.5,x));
  c = mix(c, vec3(1.0,0.85,0.2), smoothstep(0.45,0.8,x));
  return mix(c, vec3(1.0), smoothstep(0.8,1.0,x));
}

// 天空：按时间从星空渐变到白天，晨昏时地平线发橙；太阳 / 月亮；由湿度场凝成的云
vec3 background(vec2 uv){
  float asp = uGrid.x/uGrid.y;
  vec3 night = mix(vec3(0.052,0.058,0.100), vec3(0.016,0.016,0.030), smoothstep(0.0,1.0,uv.y));
  night += vec3(0.030,0.020,0.055)*(1.0-smoothstep(0.0,0.9,length(uv-vec2(0.5,0.08))));
  vec3 day = mix(vec3(0.20,0.42,0.78), vec3(0.62,0.78,0.92), pow(uv.y,0.8));
  vec3 col = mix(night, day, uDay);
  float tw = smoothstep(0.42,0.0,abs(uEl));                           // 晨昏
  col += vec3(0.95,0.42,0.14)*tw*pow(uv.y,1.6)*0.55 + vec3(0.35,0.10,0.25)*tw*(1.0-uv.y)*0.12;
  for(int l=0;l<2;l++){                                               // 星星 / 微尘
    float fl = float(l);
    vec2 p = vec2(uv.x*asp,uv.y)*mix(13.0,25.0,fl) + vec2(uTime*(0.035+0.02*fl), -uTime*0.02*(fl+1.0)) + fl*17.3;
    vec2 id = floor(p), f = fract(p)-0.5;
    float r = h21(id);
    vec2 o = (vec2(h21(id+3.1),h21(id+7.7))-0.5)*0.7;
    float twk = 0.5+0.5*sin(uTime*(0.5+r)+r*40.0);
    col += vec3(0.55,0.62,0.85)*smoothstep(0.07,0.0,length(f-o))*step(0.6,r)*twk*0.24*(1.0-uDay*0.9);
  }
  vec2 sd = (uv-uSunPos)*vec2(asp,1.0);
  col += vec3(1.0,0.85,0.55)*(smoothstep(0.045,0.03,length(sd)) + 0.35*exp(-length(sd)*7.0))*step(-0.12,uEl);
  vec2 md = (uv-uMoonPos)*vec2(asp,1.0);
  col += vec3(0.75,0.80,0.92)*(smoothstep(0.032,0.024,length(md))*0.8 + 0.10*exp(-length(md)*9.0))*step(uEl,0.12);
  if(uQual.w>0.5){
    float cl = texture(uCloud, uv).r*2.0;                             // 1.0 = 快要下雨的厚度
    float n = fbm(vec2(uv.x*asp,uv.y)*7.0 + vec2(uTime*0.025,0.0));
    float a = smoothstep(0.10,0.75, cl*(0.55+0.9*n));
    vec3 cc = mix(vec3(0.92,0.94,0.97), vec3(0.34,0.36,0.42), smoothstep(0.5,1.6,cl));   // 越厚越黑
    cc *= mix(0.22,1.0,uDay) + vec3(0.9,0.5,0.3)*tw*0.25;
    cc += vec3(0.7,0.8,1.0)*uBolt;                                    // 闪电把云照亮
    col = mix(col, cc, a*0.9);
  }
  if(uGridLines>0.5){
    vec2 gg = uv*uGrid/8.0;
    vec2 dl = abs(fract(gg-0.5)-0.5);
    col += vec3(0.5,0.6,1.0)*step(min(dl.x,dl.y),1.0/48.0)*0.05;
  }
  return col;
}

void main(){
  vec2 uv = vec2(vUv.x, 1.0-vUv.y);
  vec2 g = uv*uGrid;
  if(uView==0 && uDistort>0.0){
    // 热扭曲：用上一帧模糊后的自发光当热量估计，往重力方向取样，热浪就出现在热源上方
    vec3 hs = texture(uHeat, vUv + vec2(uGrav.x,-uGrav.y)*5.0/uGrid).rgb;
    float heat = smoothstep(0.03,0.45,dot(hs,vec3(0.45,0.4,0.15)));
    vec2 np = g*0.33 + uGrav*uTime*4.0;
    g += (vec2(vnoise(np),vnoise(np+31.7))-0.5)*heat*2.4*uDistort;
    vec4 s0 = cell(ivec2(floor(uv*uGrid)));
    if(kindOf(s0.r)==3.0 && s0.r!=T_LAVA)
      g += vec2(sin(uv.y*uGrid.y*0.9+uTime*1.7), cos(uv.x*uGrid.x*0.8+uTime*1.3))*0.2*uDistort;
  }
  ivec2 c = ivec2(floor(g));
  vec2 f = fract(g);
  vec4 s = cell(c);
  float kind = kindOf(s.r);
  float bubble = 0.0;

  // 液面平滑：在四个相邻格心之间对「是不是液体 / 固体」做双线性插值，取 0.5 等值线当液面（相当于 marching squares）
  if(uQual.x>0.5 && uView==0 && (kind==3.0 || kind==0.0 || kind==4.0)){
    vec2 gp = g-0.5; ivec2 b = ivec2(floor(gp)); vec2 fr = fract(gp);
    vec4 q00 = cell(b), q10 = cell(b+ivec2(1,0)), q01 = cell(b+ivec2(0,1)), q11 = cell(b+ivec2(1,1));
    float k00 = kindOf(q00.r), k10 = kindOf(q10.r), k01 = kindOf(q01.r), k11 = kindOf(q11.r);
    float l00 = (k00>=1.0&&k00<=3.0)?1.0:0.0, l10 = (k10>=1.0&&k10<=3.0)?1.0:0.0, l01 = (k01>=1.0&&k01<=3.0)?1.0:0.0, l11 = (k11>=1.0&&k11<=3.0)?1.0:0.0;
    float field = mix(mix(l00,l10,fr.x), mix(l01,l11,fr.x), fr.y);
    float nliq = float(k00==3.0)+float(k10==3.0)+float(k01==3.0)+float(k11==3.0);
    if(kind==3.0){ if(field<0.5){ s = vec4(0.0,0.0,s.b,0.0); kind = 0.0; } }
    else if(nliq>0.0 && field>=0.5){
      // 空气 / 气体格里的这一小块属于液体：借用旁边那格液体来上色；被液体包住的气体画成气泡
      vec4 pick = k00==3.0 ? q00 : (k10==3.0 ? q10 : (k01==3.0 ? q01 : q11));
      if(kind==4.0 && nliq>=3.0) bubble = 1.0;
      if(kind==0.0 || bubble>0.5){ s = pick; kind = 3.0; }
    }
  }
  float t = s.r, sd = s.g, T = decT(s.b);
  int aux = int(s.a);
  vec4 s2 = cell2(c);
  float wetv = clamp(s2.r/110.0,0.0,1.0);
  vec3 back = background(uv);
  // 简单的方向光阴影：朝着太阳 / 月亮走几步，路上有固体就在影子里
  float shadow = 0.0;
  if(uQual.z>0.5 && uShadowK>0.01 && uView==0){
    for(int k=1;k<=6;k++){ if(occ(ivec2(floor(g+uLightDir*(float(k)*2.3+0.6))))>0.5){ shadow = 1.0; break; } }
  }
  float occL = occ(c-ivec2(1,0)), occR = occ(c+ivec2(1,0)), occU = occ(c-ivec2(0,1)), occD = occ(c+ivec2(0,1));
  if(kind==0.0 || kind==4.0) back *= 1.0 - 0.07*(occL+occR+occU+occD)*uQual.y;      // 角落里的环境光遮蔽（影子只落在固体表面上，空气里不画）
  vec3 col = back, em = vec3(0.0);
  float ncol = max(1.0, floor(pal(t,7).r*255.0+0.5));

  if(kind==1.0 || kind==2.0){                             // ---------- 固体 / 粉末 ----------
    float idx = mod(sd, ncol);
    if(t==T_FLOWER) idx = min(floor(sd/51.0), ncol-1.0);
    vec3 base = pal(t,int(idx)).rgb;
    float tex = uQual.y;
    if(kind==2.0 || t==T_PLANT || t==T_FLOWER) base *= 1.0 + (fract(sd*0.6180339)-0.5)*0.14;   // 松散粒子：颜色跟着粒子走
    else base = pal(t,0).rgb;                                                              // 静态固体：颜色只由世界坐标决定
    // 程序纹理（世界坐标）
    if(t==T_WOOD){
      float ring = sin((g.x*0.9 + vnoise(g*vec2(0.12,0.5))*7.0)*1.5);                       // 年轮 / 木纹
      base *= 0.80 + 0.16*ring*tex + 0.14*vnoise(vec2(g.x*2.2,g.y*0.25));
    }
    else if(t==T_STONE){
      float strata = vnoise(vec2(g.x*0.07, g.y*0.55));                                      // 层理
      base *= 0.78 + 0.26*strata + 0.14*vnoise(g*0.9)*tex;
      base = mix(base, base*vec3(1.06,1.0,0.92), step(0.8,vnoise(g*0.3+11.0))*tex);         // 斑点
    }
    else if(t==T_METAL){
      base *= 0.88 + 0.20*vnoise(vec2(g.x*0.12, g.y*2.4));                                  // 拉丝
      base += 0.10*smoothstep(0.6,1.0,sin((g.x+g.y)*0.35));
    }
    else if(t==T_STEEL){
      base *= 0.86 + 0.16*vnoise(vec2(g.x*0.1, g.y*2.0));
      base += 0.22*step(length(fract(g/6.0)-0.5),0.13)*tex;                                 // 铆钉
    }
    else if(t==T_BRICK){
      vec2 bb = vec2(g.x + mod(floor(g.y/3.0),2.0)*3.0, g.y);                               // 错缝砌法
      vec2 fb = fract(bb/vec2(6.0,3.0));
      float tone = h21(floor(bb/vec2(6.0,3.0)));
      base *= 0.82 + 0.34*tone;
      if(tex>0.5 && (fb.x<0.14 || fb.y<0.26)) base = vec3(0.62,0.60,0.56)*(0.9+0.2*vnoise(g));  // 砖缝
    }
    else if(t==T_CONCRETE){
      base *= 0.86 + 0.22*vnoise(g*1.3) ;
      base *= 1.0 - 0.14*step(fract(g.y/10.0),0.09)*tex;                                    // 模板缝
    }
    else if(t==T_SOIL){ base *= 0.82 + 0.34*vnoise(g*0.55); }
    else if(t==T_TNT){
      base = mix(vec3(0.88,0.19,0.19), vec3(0.95,0.91,0.9), step(0.66,fract(float(c.y)/3.0+0.01)));
      base *= 0.9+0.1*step(0.5,fract(float(c.x)/4.0));
    }
    else if(t==T_ICE){
      base += 0.16*smoothstep(0.7,1.0,vnoise(g*0.5));
      base += step(0.997,h21(vec2(c)+floor(uTime*4.0)))*0.6;
      base = mix(back, base, 0.88);
    }
    else if(t==T_SNOW) base += step(0.985,h21(vec2(c)+floor(uTime*3.0)))*0.25;
    else if(t==T_SALT) base += step(0.99,h21(vec2(c)+floor(uTime*3.0)))*0.3;
    else if(t==T_ROPE) base *= 0.78 + 0.3*step(0.5,fract((g.x+g.y)*0.5));                   // 绞股
    else if(t==T_ANCHOR){
      float p = 0.6+0.4*sin(uTime*2.0);
      base *= 0.8 + 0.4*step(abs(f.x-0.5),0.16) + 0.4*step(abs(f.y-0.5),0.16);
      em = base*0.12*p;
    }
    else if(t==T_CLONE){
      float p = 0.5+0.5*sin(uTime*4.0+float(c.x+c.y)*0.7);
      base *= 0.8+0.4*p; em = base*0.3*p;
    }
    else if(t==T_VOID){
      bool rim = cell(c+ivec2(1,0)).r!=t || cell(c-ivec2(1,0)).r!=t || cell(c+ivec2(0,1)).r!=t || cell(c-ivec2(0,1)).r!=t;
      float p = 0.6+0.4*sin(uTime*3.0+float(c.x-c.y)*0.9);
      base = rim ? vec3(0.22,0.04,0.42)*p : vec3(0.008,0.0,0.016);
      if(rim) em = vec3(0.4,0.1,0.85)*0.7*p;
    }
    col = base;
    if(t==T_GLASS){                                       // 玻璃：半透明 + 斜向高光 + 边缘亮线
      float streak = smoothstep(0.84,1.0,sin((g.x-g.y)*0.55));
      col = mix(back*1.15, base, 0.3) + vec3(0.9,0.97,1.0)*streak*0.24;
      float e = 0.0;
      if(cell(c+ivec2(1,0)).r!=t) e = max(e, smoothstep(0.62,1.0,f.x));
      if(cell(c-ivec2(1,0)).r!=t) e = max(e, smoothstep(0.38,0.0,f.x));
      if(cell(c+ivec2(0,1)).r!=t) e = max(e, smoothstep(0.62,1.0,f.y));
      if(cell(c-ivec2(0,1)).r!=t) e = max(e, smoothstep(0.38,0.0,f.y));
      col += vec3(0.75,0.9,1.0)*e*0.3;
    } else if(t!=T_VOID && t!=T_CLONE){
      // 假法线：邻格空着的那一侧算「斜面」，朝光的一侧提亮、背光的一侧压暗；四面都被包住的内部略暗（AO）
      if(tex>0.5){
        vec2 n = vec2((1.0-occR)*smoothstep(0.45,1.0,f.x) - (1.0-occL)*smoothstep(0.55,0.0,f.x),
                      (1.0-occD)*smoothstep(0.45,1.0,f.y) - (1.0-occU)*smoothstep(0.55,0.0,f.y));
        col *= 1.0 + dot(n,uLightDir)*0.42*max(uShadowK,0.25);
        col *= 0.90 + 0.10*(1.0-0.25*(occL+occR+occU+occD)) + 0.0;
      }
      col *= 1.0 - 0.38*shadow*uShadowK;
      if(t==T_PLANT) col *= 1.0 - 0.08*wetv; else col *= 1.0 - 0.45*wetv;                    // 打湿了颜色变深
    }
    if((aux&2)!=0) col *= 0.38;                           // 焦黑
    if((aux&1)!=0){                                       // 正在燃烧 / 引信已点
      if(t==T_TNT){
        float b = step(0.5,fract(uTime*6.0));
        col = mix(col, vec3(1.0,0.9,0.7), b*0.7); em += vec3(1.0,0.5,0.2)*b*0.7;
      } else {
        float fl = 0.5+0.5*vnoise(g*0.9+uTime*vec2(1.3,-2.1));
        col = mix(col, vec3(0.28,0.07,0.02), 0.5);
        em += vec3(1.0,0.36,0.07)*fl*(t==T_CHARCOAL ? 1.1 : 0.85);
      }
    }
    if(T>450.0) em += blackbody(T)*((t==T_METAL||t==T_STEEL) ? 1.3 : 0.8);   // 黑体辐射
  }
  else if(kind==3.0){                                     // ---------- 液体 ----------
    ivec2 up = -ivec2(uGrav);
    float depth = 0.0;
    for(int k=1;k<=6;k++){ if(kindOf(cell(c+up*k).r)==3.0) depth += 1.0; else break; }
    float dk = depth/6.0;
    float edge = dot(f-0.5,-uGrav)+0.5;
    vec3 base = pal(t,int(mod(sd,ncol))).rgb;
    float rip = 0.0;                                      // 涟漪：从砸进液面的地方向两边传开
    for(int k=0;k<8;k++){
      vec3 r = uRip[k];
      if(r.z>2.5) continue;
      float d = length((g-r.xy)*vec2(1.0,2.5));
      rip += sin(d*1.5 - r.z*9.0)*exp(-d*0.10)*exp(-r.z*1.6);
    }
    if(t==T_LAVA){
      float nz = vnoise(g*0.35+vec2(uTime*0.25,-uTime*0.15));
      float hot = clamp((T-800.0)/650.0,0.0,1.0);
      vec3 glow = mix(vec3(1.0,0.27,0.0), vec3(1.0,0.78,0.22), nz*nz);
      col = mix(vec3(0.20,0.035,0.01), glow, clamp(hot*0.75+nz*0.55,0.0,1.0));
      em = col*(0.55+0.95*hot);
    } else if(t==T_ACID){
      float p = 0.5+0.5*sin(uTime*2.5+g.x*0.3+g.y*0.3);
      col = mix(vec3(0.63,0.31,1.0), vec3(0.45,0.95,0.3), p*0.7)*(1.0-0.35*dk);
      em = vec3(0.3,0.9,0.25)*(0.07+0.11*p);
      if(depth==0.0) col += vec3(0.6,1.0,0.6)*smoothstep(0.55,1.0,edge)*0.3;
    } else {
      vec3 wc = mix(base*1.3+0.05, base*0.62, dk);
      wc += 0.07*(vnoise(g*0.22+vec2(uTime*0.35,uTime*0.2))-0.5);
      wc *= mix(0.55,1.0,max(uDay,0.25));
      col = mix(back, wc, pal(t,6).b);
      if(depth<=1.0){
        float wave = 0.5+0.5*sin(dot(g,abs(uGrav.yx))*0.7+uTime*2.2) + rip*0.9;
        float hl = smoothstep(0.5,1.0,edge + rip*0.25)*(0.3+0.45*wave)*(t==T_OIL ? 0.35 : 1.0)*(depth==0.0 ? 1.0 : 0.25);
        col += vec3(0.55,0.72,0.92)*hl*mix(0.45,1.0,uDay);
      }
      if(t==T_OIL && depth<2.0) col += 0.10*(0.5+0.5*cos(vec3(0.0,2.0,4.0)+g.x*0.25+uTime*0.5));
      if(T>80.0 && t!=T_OIL) col += 0.08*step(0.93,h21(vec2(c)+floor(uTime*8.0)));
    }
    if(bubble>0.5){                                       // 气泡：一圈亮边 + 高光
      float r = length(f-0.5);
      col = mix(col, col*1.35+0.10, smoothstep(0.46,0.30,r));
      col += vec3(0.9,0.95,1.0)*(smoothstep(0.08,0.0,abs(r-0.36))*0.5 + smoothstep(0.12,0.0,length(f-vec2(0.36,0.34)))*0.6);
    }
    if((aux&1)!=0){ float fl = 0.5+0.5*vnoise(g*0.9+uTime*vec2(1.3,-2.1)); em += vec3(1.0,0.4,0.08)*fl*0.9; }
    if(T>450.0 && t!=T_LAVA) em += blackbody(T)*0.6;
  }
  else if(kind==5.0){                                     // ---------- 电火花 / 闪电 ----------
    float fl = 0.6+0.4*h21(vec2(c)+floor(uTime*40.0));
    col = vec3(0.85,0.95,1.0);
    em = vec3(0.6,0.85,1.0)*2.6*fl;
  }

  if((aux&4)!=0 && kind!=4.0 && kind!=5.0 && kind!=0.0){  // 带电的导体
    float fl = 0.4+0.6*h21(vec2(c)+floor(uTime*30.0));
    col = mix(col, vec3(0.8,0.93,1.0), 0.45*fl);
    em += vec3(0.45,0.75,1.0)*(1.0+1.2*fl);
  }

  if(kind==0.0 || kind==4.0){                             // ---------- 气体：按密度累积的软边 ----------
    // 用一层随浮力方向流动的噪声去扰动取样位置（近似 curl noise 湍流），火苗和烟会卷、会舔
    vec2 flow = g*0.45 - uGrav*uTime*3.0;
    vec2 gw = g + (vec2(vnoise(flow), vnoise(flow+19.3))-0.5)*1.5;
    float smoke=0.0, smokeTone=0.0, steam=0.0, fire=0.0, fireT=0.0, ember=0.0, foam=0.0;
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
      ivec2 cc = c+ivec2(i,j);
      vec4 q = cell(cc);
      if(q.r==0.0) continue;
      float l = length((vec2(cc)+0.5)-gw);
      float w = smoothstep(1.4,0.15,l);
      if(q.r==T_SMOKE){
        float a = w*min(1.0,q.a/40.0);
        smoke += a;
        smokeTone += a*(q.g<50.0 ? 0.86 : (q.g<170.0 ? 0.36 : 0.09));   // 白烟（湿）/ 灰烟 / 黑烟（缺氧）
      }
      else if(q.r==T_STEAM) steam += w*(0.75+0.25*fract(q.g*0.53));
      else if(q.r==T_FIRE){ fire += w; fireT += w*max(decT(q.b), 620.0+q.a*16.0); }
      else if(q.r==T_EMBER) ember += smoothstep(0.8,0.1,length((vec2(cc)+0.5)-g));
      else if(q.r==T_FOAM) foam += smoothstep(1.0,0.25,length((vec2(cc)+0.5)-g));
    }
    if(smoke>0.0){
      float tone = smokeTone/smoke;
      col = mix(col, vec3(tone, tone, tone*1.04)*mix(0.6,1.0,max(uDay,0.3)), clamp(smoke*mix(0.42,0.62,1.0-tone),0.0,0.92));   // 黑烟更浓
    }
    col = mix(col, vec3(0.74,0.80,0.88)*mix(0.55,1.0,max(uDay,0.3)), clamp(steam*0.42,0.0,0.8));
    col = mix(col, vec3(0.93,0.96,1.0)*mix(0.5,1.0,max(uDay,0.3)), clamp(foam*0.8,0.0,0.92));
    if(fire>0.0){
      float fl = 0.75+0.5*vnoise(g*0.8-uGrav*uTime*7.0);
      vec3 fc = flameColor(fireT/fire + (fl-1.0)*120.0);
      float a = clamp(fire*0.72,0.0,1.0);
      col = mix(col, fc, a);
      em += fc*a*fl*1.35;
    }
    if(ember>0.0){
      vec3 ec = vec3(1.0,0.62,0.15);
      col = mix(col, ec, clamp(ember,0.0,1.0));
      em += ec*min(ember,1.0)*1.7;
    }
  }

  if(uView==1){ col = heatRamp(T); em = vec3(0.0); }
  else if(uView==2){
    col = t==0.0 ? vec3(0.015,0.015,0.03) : mix(vec3(0.08,0.2,0.55), vec3(1.0,0.9,0.3), pal(t,6).a);
    if(kind==4.0||kind==5.0) col = vec3(0.3,0.12,0.4);
    em = vec3(0.0);
  }
  else if(uView==3){
    vec2 cuv = uv*uGrid/32.0;
    float act = texelFetch(uChunk, ivec2(floor(cuv)), 0).r;
    vec2 dl = abs(fract(cuv)-0.5);
    col = col*0.6 + (act>0.5 ? vec3(0.08,0.42,0.16) : vec3(0.16,0.03,0.03))*0.6 + step(0.482,max(dl.x,dl.y))*0.12;
    if(s2.b>0.5) col = mix(col, vec3(1.0,0.8,0.2), 0.5);              // 刚体
    em = vec3(0.0);
  }
  else if(uView==4){                                                  // 湿度：含水量 + 云 / 水汽
    vec2 cv = texture(uCloud, uv).rg;
    col = vec3(0.02,0.03,0.06) + vec3(0.1,0.5,1.0)*clamp(s2.r/150.0,0.0,1.0)*step(0.5,t) + vec3(0.9)*cv.r*0.8 + vec3(0.2,0.7,0.6)*cv.g*0.6;
    if(kind==3.0) col = vec3(0.1,0.3,0.9);
    em = vec3(0.0);
  }
  oCol = vec4(col,1.0);
  oEmis = vec4(em,1.0);
}`;

const VS_POINT = `#version 300 es
in vec2 aPos; in vec4 aCol; in float aSize;
uniform vec2 uGrid; out vec4 vCol;
void main(){
  vec2 p = aPos/uGrid;
  gl_Position = vec4(p.x*2.0-1.0, 1.0-p.y*2.0, 0.0, 1.0);
  gl_PointSize = aSize; vCol = aCol;
}`;
const FS_POINT = `#version 300 es
precision highp float;
in vec4 vCol;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oEmis;
void main(){ oCol = vec4(vCol.rgb,1.0); oEmis = vec4(vCol.rgb*vCol.a,1.0); }`;

const FS_GLOW = `#version 300 es
precision highp float;
uniform sampler2D uEmis, uPrev; uniform float uDecay;
in vec2 vUv; out vec4 o;
void main(){ o = max(texture(uEmis,vUv), texture(uPrev,vUv)*uDecay); }`;

const FS_DOWN = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uTexel;
in vec2 vUv; out vec4 o;
void main(){
  vec2 h = uTexel;
  vec3 s = texture(uTex,vUv).rgb*4.0;
  s += texture(uTex,vUv-h).rgb + texture(uTex,vUv+h).rgb;
  s += texture(uTex,vUv+vec2(h.x,-h.y)).rgb + texture(uTex,vUv-vec2(h.x,-h.y)).rgb;
  o = vec4(s/8.0,1.0);
}`;

const FS_UP = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uW;
in vec2 vUv; out vec4 o;
void main(){
  vec2 h = uTexel*0.5;
  vec3 s = texture(uTex,vUv+vec2(-h.x*2.0,0.0)).rgb + texture(uTex,vUv+vec2(h.x*2.0,0.0)).rgb
         + texture(uTex,vUv+vec2(0.0,h.y*2.0)).rgb + texture(uTex,vUv+vec2(0.0,-h.y*2.0)).rgb;
  s += (texture(uTex,vUv+vec2(-h.x,h.y)).rgb + texture(uTex,vUv+vec2(h.x,h.y)).rgb
      + texture(uTex,vUv+vec2(h.x,-h.y)).rgb + texture(uTex,vUv+vec2(-h.x,-h.y)).rgb)*2.0;
  o = vec4(s/12.0*uW,1.0);
}`;

const FS_COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D uCol, uEmis, uBloom, uLight;
uniform vec4 uK;                                           // 环境光、光照强度、bloom 强度、是否调试视图
in vec2 vUv; out vec4 o;
void main(){
  vec3 c = texture(uCol,vUv).rgb;
  if(uK.w>0.5){ o = vec4(c,1.0); return; }
  vec3 e = texture(uEmis,vUv).rgb, l = texture(uLight,vUv).rgb, b = texture(uBloom,vUv).rgb;
  // 发光体照亮周围：物体表面按光色加亮（暖光下偏暖），空气里也留一点辉光
  o = vec4(c*(uK.x + l*uK.y) + l*uK.y*0.03 + e + b*uK.z, 1.0);
}`;

const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform float uTime, uFlash, uCA, uAspect;
uniform vec2 uShake, uBoom;
uniform vec4 uShock[4];
uniform vec4 uOpts;                                        // 暗角、颗粒、色调映射、是否调试视图
in vec2 vUv; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
void main(){
  vec2 uv = vUv;
  vec2 asp = vec2(uAspect,1.0);
  uv += uShake*(0.3+0.7*exp(-length((uv-uBoom)*asp)*2.5));          // 震动：离爆心越远越弱
  for(int i=0;i<4;i++){                                             // 冲击波圆环扭曲
    vec4 s = uShock[i];
    if(s.w<=0.0) continue;
    vec2 d = (uv-s.xy)*asp;
    float l = length(d);
    uv += normalize(d+1e-5)/asp*smoothstep(0.07,0.0,abs(l-s.z))*s.w*0.022;
  }
  vec3 c;
  if(uCA>0.0005){                                                   // 短暂色差
    vec2 dir = uv-0.5;
    c = vec3(texture(uTex,uv+dir*uCA).r, texture(uTex,uv).g, texture(uTex,uv-dir*uCA).b);
  } else c = texture(uTex,uv).rgb;
  c += uFlash;                                                      // 闪白
  if(uOpts.w<0.5){
    if(uOpts.z>0.5){ c = pow(max(c,0.0),vec3(2.2)); c = aces(c*1.25); c = pow(c,vec3(1.0/2.2)); }
    if(uOpts.x>0.5){ float v = smoothstep(1.05,0.35,length((vUv-0.5)*vec2(1.1,1.25))); c *= mix(0.6,1.0,v); }
    if(uOpts.y>0.5){
      float n = fract(sin(dot(gl_FragCoord.xy+fract(uTime)*91.7,vec2(12.9898,78.233)))*43758.5453);
      c += (n-0.5)*0.035;
    }
  }
  o = vec4(clamp(c,0.0,1.0),1.0);
}`;

/* ---------------------------------------------------------------------
 * 3.2 WebGL2 初始化
 * ------------------------------------------------------------------- */
const R = { rip: new Float32Array(24), dayK: 1, hdr: false, prog: {}, quad: null, stateTex: null, stateBuf: null, stateTex2: null, stateBuf2: null, cloudTex: null, cloudBuf: null, palTex: null, chunkTex: null,
            chunkBuf: null, scene: null, post: null, glow: [null, null], glowIdx: 0, levels: [],
            ptVao: null, ptBuf: null, ptData: null, cw: 0, ch: 0 };

function glProgram(vs, fs) {
  const mk = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('着色器编译失败：' + gl.getShaderInfoLog(sh));
    return sh;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.bindAttribLocation(p, 1, 'aCol'); gl.bindAttribLocation(p, 2, 'aSize');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('着色器链接失败：' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}

function glTexture(w, h, internal, format, typ, filter, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, typ, data || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function glTarget(w, h, count) {
  w = Math.max(2, w | 0); h = Math.max(2, h | 0);
  const fbo = gl.createFramebuffer(), tex = [];
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const bufs = [];
  for (let i = 0; i < count; i++) {
    const t = R.hdr ? glTexture(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR)
                    : glTexture(w, h, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0);
    tex.push(t); bufs.push(gl.COLOR_ATTACHMENT0 + i);
  }
  gl.drawBuffers(bufs);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('帧缓冲不完整');
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { fbo, tex, w, h };
}

function glFreeTarget(t) {
  if (!t) return;
  gl.deleteFramebuffer(t.fbo);
  for (const x of t.tex) gl.deleteTexture(x);
}

function glInit(cv) {
  gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false,
                                 powerPreference: 'high-performance', preserveDrawingBuffer: false });
  if (!gl) return false;
  R.hdr = !!gl.getExtension('EXT_color_buffer_float');
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  R.prog.scene = glProgram(VS_QUAD, FS_SCENE);
  R.prog.point = glProgram(VS_POINT, FS_POINT);
  R.prog.glow = glProgram(VS_QUAD, FS_GLOW);
  R.prog.down = glProgram(VS_QUAD, FS_DOWN);
  R.prog.up = glProgram(VS_QUAD, FS_UP);
  R.prog.comp = glProgram(VS_QUAD, FS_COMPOSITE);
  R.prog.post = glProgram(VS_QUAD, FS_POST);

  R.quad = gl.createVertexArray();
  gl.bindVertexArray(R.quad);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // 飞行粒子：每个粒子 3 个点（本体 + 两段拖尾），每点 7 个 float
  R.ptData = new Float32Array(FP_MAX * 3 * 7);
  R.ptVao = gl.createVertexArray();
  gl.bindVertexArray(R.ptVao);
  R.ptBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, R.ptBuf);
  gl.bufferData(gl.ARRAY_BUFFER, R.ptData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 28, 24);
  gl.bindVertexArray(null);

  // 调色板纹理：每种材料一行；0-4 列颜色，6 列 (状态, 发光, 透明度, 密度)，7 列 (颜色数)
  const pd = new Uint8Array(8 * NT * 4);
  for (let t = 0; t < NT; t++) {
    const m = MATERIALS[t];
    for (let k = 0; k < 5; k++) {
      const c = m.rgb[Math.min(k, m.rgb.length - 1)], o = (t * 8 + k) * 4;
      pd[o] = c[0]; pd[o + 1] = c[1]; pd[o + 2] = c[2]; pd[o + 3] = 255;
    }
    let o = (t * 8 + 6) * 4;
    pd[o] = m.state; pd[o + 1] = Math.round(m.emissive * 255); pd[o + 2] = Math.round(m.alpha * 255);
    pd[o + 3] = Math.round(Math.min(1, Math.log(Math.max(1, m.density)) / Math.log(8000)) * 255);
    o = (t * 8 + 7) * 4;
    pd[o] = m.rgb.length;
  }
  R.palTex = glTexture(8, NT, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST, pd);
  return true;
}

function glResize() {
  // 网格尺寸变了：重建状态纹理和所有渲染目标
  R.stateBuf = new Uint8Array(N * 4);
  if (R.stateTex) gl.deleteTexture(R.stateTex);
  R.stateTex = glTexture(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
  R.stateBuf2 = new Uint8Array(N * 4);
  if (R.stateTex2) gl.deleteTexture(R.stateTex2);
  R.stateTex2 = glTexture(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
  R.cloudBuf = new Uint8Array(GW * GH * 2);
  if (R.cloudTex) gl.deleteTexture(R.cloudTex);
  R.cloudTex = glTexture(GW, GH, gl.RG8, gl.RG, gl.UNSIGNED_BYTE, gl.LINEAR);
  R.chunkBuf = new Uint8Array(CW * CHN);
  if (R.chunkTex) gl.deleteTexture(R.chunkTex);
  R.chunkTex = glTexture(CW, CHN, gl.R8, gl.RED, gl.UNSIGNED_BYTE, gl.NEAREST);
  const cw = canvas.width, ch = canvas.height;
  R.cw = cw; R.ch = ch;
  glFreeTarget(R.scene); glFreeTarget(R.post); glFreeTarget(R.glow[0]); glFreeTarget(R.glow[1]);
  for (const l of R.levels) glFreeTarget(l);
  R.scene = glTarget(cw, ch, 2);
  R.post = glTarget(cw, ch, 1);
  R.glow = [glTarget(cw >> 1, ch >> 1, 1), glTarget(cw >> 1, ch >> 1, 1)];
  R.levels = [];
  for (let i = 2; i <= 6; i++) R.levels.push(glTarget(cw >> i, ch >> i, 1));
  sceneDirty = true;
}

/* ---------------------------------------------------------------------
 * 3.3 状态打包：只重写清醒的块（休眠的块内容没变），顺便统计粒子数
 * ------------------------------------------------------------------- */
function packState() {
  const buf = R.stateBuf, buf2 = R.stateBuf2, all = sceneDirty;
  let changed = all;
  for (let cy = 0; cy < CHN; cy++) for (let cx = 0; cx < CW; cx++) {
    const c = cx + cy * CW;
    if (!all && chunkTTL[c] === 0) continue;
    changed = true;
    const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
    let cnt = 0;
    for (let y = y0; y < y1; y++) {
      for (let x = x0, i = y * W + x0, o = i * 4; x < x1; x++, i++, o += 4) {
        const t = type[i];
        buf[o] = t; buf[o + 1] = seed[i]; buf[o + 2] = encTemp(temp[i]);
        buf2[o] = wet[i]; buf2[o + 1] = aux[i]; buf2[o + 2] = (flags[i] & F_BODY) ? 255 : 0;
        if (t === 0) { buf[o + 3] = 0; continue; }
        cnt++;
        if (M_LIFE0[t] > 0) { const L = life[i]; buf[o + 3] = L > 255 ? 255 : L; }
        else { const f = flags[i]; buf[o + 3] = ((f & F_BURN) ? 1 : 0) | ((f & F_SCORCH) ? 2 : 0) | (charge[i] ? 4 : 0) | ((f & F_TIP) ? 8 : 0); }
      }
    }
    chunkCount[c] = cnt;
  }
  if (changed) {
    let total = 0;
    for (let c = 0; c < chunkCount.length; c++) total += chunkCount[c];
    particleCount = total;
  }
  return changed;
}

function packPoints() {
  if (fpCount === 0) return 0;
  const d = R.ptData, size = CELL * pixelRatio;
  let n = 0;
  for (let pass = 0; pass < 3; pass++) {                 // 先画最淡的拖尾，本体最后画在上面
    for (let k = 0; k < FP_MAX; k++) {
      if (!fpAlive[k]) continue;
      const m = MATERIALS[fpType[k]], c = m.rgb[fpSeed[k] % m.rgb.length];
      const isEmber = fpType[k] === EMBER;
      let x, y, a, s;
      if (pass === 0) { x = fpQX[k]; y = fpQY[k]; a = 0.3; s = size * 0.5; }
      else if (pass === 1) { x = fpPX[k]; y = fpPY[k]; a = 0.55; s = size * 0.75; }
      else { x = fpX[k]; y = fpY[k]; a = 1; s = size; }
      const o = n * 7;
      d[o] = x; d[o + 1] = y; d[o + 2] = c[0] / 255 * a; d[o + 3] = c[1] / 255 * a; d[o + 4] = c[2] / 255 * a;
      d[o + 5] = isEmber ? 1.8 : (fpTemp[k] > 300 ? 0.5 : 0); d[o + 6] = s;
      n++;
    }
  }
  return n;
}

/* ---------------------------------------------------------------------
 * 3.4 WebGL2 一帧
 * ------------------------------------------------------------------- */
function glBind(unit, tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); }
function glPass(target, prog) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : R.cw, target ? target.h : R.ch);
  gl.useProgram(prog.p);
}
function glQuad() { gl.bindVertexArray(R.quad); gl.drawArrays(gl.TRIANGLES, 0, 3); }

function renderGL(timeMs, dt) {
  const t0 = performance.now();
  if (packState()) {
    glBind(0, R.stateTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, R.stateBuf);
    glBind(4, R.stateTex2);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, R.stateBuf2);
  }
  // 云和水汽（粗网格，线性过滤 → 软边）
  for (let c = 0, n = GW * GH; c < n; c++) {
    const cl = cloud[c] / RAIN_THR * 127, vp = vapor[c] * 40;
    R.cloudBuf[c * 2] = cl > 255 ? 255 : cl; R.cloudBuf[c * 2 + 1] = vp > 255 ? 255 : vp;
  }
  glBind(5, R.cloudTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GW, GH, gl.RG, gl.UNSIGNED_BYTE, R.cloudBuf);
  sceneDirty = false;
  if (viewMode === 3) {
    for (let c = 0; c < R.chunkBuf.length; c++) R.chunkBuf[c] = chunkTTL[c] > 0 ? 255 : 0;
    glBind(3, R.chunkTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CHN, gl.RED, gl.UNSIGNED_BYTE, R.chunkBuf);
  }
  const npts = packPoints();
  const t1 = performance.now();
  const time = (timeMs / 1000) % 3600;
  const debugView = viewMode !== 0;
  gl.disable(gl.BLEND);

  // 1) 场景
  let P = R.prog.scene;
  glPass(R.scene, P);
  glBind(0, R.stateTex); glBind(1, R.palTex); glBind(2, R.levels[1].tex[0]); glBind(3, R.chunkTex);
  glBind(4, R.stateTex2); glBind(5, R.cloudTex);
  gl.uniform1i(P.u.uState, 0); gl.uniform1i(P.u.uPal, 1); gl.uniform1i(P.u.uHeat, 2); gl.uniform1i(P.u.uChunk, 3);
  gl.uniform1i(P.u.uState2, 4); gl.uniform1i(P.u.uCloud, 5);
  gl.uniform2f(P.u.uGrid, W, H); gl.uniform2f(P.u.uGrav, gx, gy);
  // 昼夜：太阳 / 月亮的位置、朝向光源的方向、光照强度
  const th = (env.time - 0.25) * 6.2832, cs = Math.cos(th), sn = Math.sin(th), el = env.dayNight ? env.el : 1;
  const dayK = env.dayNight ? Math.min(1, Math.max(0, el * 2.2 + 0.25)) : 1;
  R.dayK = dayK;
  gl.uniform2f(P.u.uSunPos, 0.5 - cs * 0.45, 0.62 - sn * 0.5); gl.uniform2f(P.u.uMoonPos, 0.5 + cs * 0.45, 0.62 + sn * 0.5);
  if (!env.dayNight) gl.uniform2f(P.u.uLightDir, -0.5, -0.866);
  else if (el >= 0) gl.uniform2f(P.u.uLightDir, -cs, -sn); else gl.uniform2f(P.u.uLightDir, cs, sn);
  gl.uniform1f(P.u.uDay, dayK); gl.uniform1f(P.u.uEl, el);
  gl.uniform1f(P.u.uShadowK, el >= 0 ? Math.min(1, el * 3) : Math.min(1, -el * 3) * 0.3);
  const boltAge = lastBolt ? (tick - lastBolt.tick) : 999;
  gl.uniform1f(P.u.uBolt, boltAge < 12 ? 1 - boltAge / 12 : 0);
  gl.uniform4f(P.u.uQual, settings.smooth ? 1 : 0, settings.texture ? 1 : 0, settings.shadows ? 1 : 0, settings.clouds ? 1 : 0);
  for (let k = 0; k < 8; k++) R.rip[k * 3] = ripples[k * 3], R.rip[k * 3 + 1] = ripples[k * 3 + 1], R.rip[k * 3 + 2] = ripples[k * 3 + 2] > 0 ? (tick - ripples[k * 3 + 2]) / 60 : 99;
  gl.uniform3fv(P.u.uRip, R.rip);
  gl.uniform1f(P.u.uTime, time); gl.uniform1f(P.u.uDistort, settings.distort ? 1 : 0);
  gl.uniform1f(P.u.uGridLines, settings.gridLines ? 1 : 0); gl.uniform1i(P.u.uView, viewMode);
  glQuad();
  if (npts > 0 && !debugView) {
    P = R.prog.point;
    gl.useProgram(P.p);
    gl.uniform2f(P.u.uGrid, W, H);
    gl.bindVertexArray(R.ptVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.ptBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, R.ptData, 0, npts * 7);
    gl.drawArrays(gl.POINTS, 0, npts);
  }

  const useGlow = !debugView && (settings.bloom || settings.light || settings.distort);
  if (useGlow) {
    // 2) 辉光时间累积：上一帧的辉光乘衰减后和这一帧取最大值 → 余烬、火星、碎片自带拖尾

    gl.uniform1f(P.u.uDecay, Math.pow(0.80, dt / 16.7));
    glQuad();
    R.glowIdx ^= 1;
    // 3) 降采样
    P = R.prog.down;

      glPass(R.levels[i], P);
      glBind(0, prev.tex[0]);

      glBind(0, s.tex[0]);

  }
  const t2 = performance.now();

  // 5) 光照合成
  P = R.prog.comp;
  glPass(R.post, P);
  glBind(0, R.scene.tex[0]); glBind(1, R.scene.tex[1]); glBind(2, R.levels[0].tex[0]); glBind(3, R.levels[2].tex[0]);
  gl.uniform1i(P.u.uCol, 0); gl.uniform1i(P.u.uEmis, 1); gl.uniform1i(P.u.uBloom, 2); gl.uniform1i(P.u.uLight, 3);
  // 夜里环境光弱、火光显眼；白天环境光强、火光的照明作用不明显
  gl.uniform4f(P.u.uK, settings.light ? 0.5 + 0.5 * R.dayK : 1.0, settings.light ? 2.2 - 1.5 * R.dayK : 0, settings.bloom ? 0.55 : 0, debugView ? 1 : 0);
  glQuad();

  // 6) 后处理
  const k = Math.pow(0.5, dt / 16.7);
  fx.flash *= Math.pow(0.45, dt / 16.7); fx.shake *= Math.pow(0.86, dt / 16.7); fx.ca *= Math.pow(0.84, dt / 16.7);
  if (fx.flash < 0.002) fx.flash = 0;
  P = R.prog.post;
  glPass(null, P);
  glBind(0, R.post.tex[0]);
  gl.uniform1i(P.u.uTex, 0);
  gl.uniform1f(P.u.uTime, time); gl.uniform1f(P.u.uAspect, R.cw / R.ch);
  const on = settings.shake && !debugView, amp = on ? fx.shake * pixelRatio : 0, ang = Math.random() * 6.283;
  gl.uniform2f(P.u.uShake, Math.cos(ang) * amp / R.cw, Math.sin(ang) * amp / R.ch);
  gl.uniform2f(P.u.uBoom, fx.boomX, 1 - fx.boomY);
  gl.uniform1f(P.u.uFlash, settings.aberration && !debugView ? fx.flash : 0);
  gl.uniform1f(P.u.uCA, settings.aberration && !debugView ? fx.ca : 0);
  const sh = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    const s = fx.shocks[i];
    if (s.power > 0) {
      s.age += dt;
      const life = 520;
      if (s.age > life) s.power = 0;
      sh[i * 4] = s.x; sh[i * 4 + 1] = 1 - s.y; sh[i * 4 + 2] = s.age * 0.0011;
      sh[i * 4 + 3] = settings.distort && !debugView ? s.power * (1 - s.age / life) : 0;
    }
  }
  gl.uniform4fv(P.u.uShock, sh);
  gl.uniform4f(P.u.uOpts, settings.vignette ? 1 : 0, settings.grain ? 1 : 0, settings.tonemap ? 1 : 0, debugView ? 1 : 0);
  glQuad();
  const t3 = performance.now();
  perf.pack += t1 - t0; perf.draw += t2 - t1; perf.post += t3 - t2;
  void k;
}

/* ---------------------------------------------------------------------
 * 3.5 Canvas2D 退路：逐格上色，每格 1 像素，由 CSS 放大
 * ------------------------------------------------------------------- */
const R2 = { img: null, px: null, dayK: -1 };
const BG32 = 0xff000000 | (15 << 16) | (10 << 8) | 10;

function rgb32(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return 0xff000000 | (b << 16) | (g << 8) | r;

function render2D(timeMs) {
  const t0 = performance.now();
  // 退路里没有着色器：天空只按昼夜换一个底色，云、阴影、纹理、液面平滑都没有
  const dk = env.dayNight ? Math.min(1, Math.max(0, env.el * 2.2 + 0.25)) : 0;
  if (Math.abs(dk - R2.dayK) > 0.02) { R2.dayK = dk; sceneDirty = true; }
  const bg = rgb32(10 + 60 * R2.dayK, 10 + 100 * R2.dayK, 15 + 175 * R2.dayK);
  const px = R2.px, all = sceneDirty, fr = (timeMs / 60) | 0;
  let changed = all;
  for (let cy = 0; cy < CHN; cy++) for (let cx = 0; cx < CW; cx++) {
    const c = cx + cy * CW;
    if (!all && chunkTTL[c] === 0) continue;
    changed = true;
    const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
    let cnt = 0;
    const act = chunkTTL[c] > 0;
    for (let y = y0; y < y1; y++) for (let x = x0, i = y * W + x0; x < x1; x++, i++) {
      const t = type[i], T = temp[i];
      let r, g, b;
      if (viewMode === 1) {                                // 温度
        if (T < 20) { const k = Math.max(0, (T + 40) / 60); r = 38 - 30 * k; g = 128 - 120 * k; b = 255 - 237 * k; }
        else { const k = Math.sqrt(Math.min(1, (T - 20) / 1700)); r = 8 + 247 * Math.min(1, k * 2.2); g = 8 + 230 * Math.max(0, k * 1.6 - 0.5); b = 18 + 200 * Math.max(0, k * 3 - 2.2); }
        if (t !== 0) cnt++;
        px[i] = rgb32(r, g, b);
        continue;
      }
      if (t === 0) {
        if (viewMode === 3) px[i] = act ? rgb32(10, 46, 22) : rgb32(30, 10, 12);
        else px[i] = bg;
        continue;
      }
      cnt++;
      const m = MATERIALS[t];
      if (viewMode === 2) { const k = Math.min(1, Math.log(Math.max(1, m.density)) / Math.log(8000)); px[i] = rgb32(20 + 235 * k, 50 + 180 * k, 140 - 60 * k); continue; }
      const sd = seed[i], col = t === FLOWER ? m.rgb[Math.min(m.rgb.length - 1, (sd / 51) | 0)] : m.rgb[sd % m.rgb.length];
      const v = 1 + (((sd * 157) & 255) / 255 - 0.5) * 0.14;
      r = col[0] * v; g = col[1] * v; b = col[2] * v;
      const f = flags[i];
      if (m.life) {                                        // 气体 / 能量：按寿命淡出，火焰闪烁
        const a = t === SMOKE ? Math.min(1, life[i] / 40) * 0.8 : 1;
        if (t === SMOKE) { const tone = sd < 50 ? 215 : sd < 170 ? 92 : 28; r = g = b = tone; }
        if (t === FIRE) { const k = ((sd + fr * 37 + x * 13 + y * 7) & 63) / 63; r = 255; g = 70 + 150 * k; b = 20 + 40 * k; }
        r = 10 + (r - 10) * a; g = 10 + (g - 10) * a; b = 15 + (b - 15) * a;
      } else if (t === LAVA) { const k = Math.min(1, Math.max(0, (T - 800) / 650)); r = 90 + 165 * k; g = 20 + 110 * k * (0.6 + 0.4 * (sd / 255)); b = 5; }
      else if (t === TNT) { if (y % 3 === 0) { r = 240; g = 232; b = 230; } if ((f & F_BURN) && (fr & 4)) { r = 255; g = 220; b = 160; } }
      else if (t === GLASS) { r = 10 + (r - 10) * 0.45; g = 10 + (g - 10) * 0.45; b = 15 + (b - 15) * 0.45; if (((x - y) & 7) === 0) { r += 40; g += 45; b += 50; } }

      if ((f & F_BURN) && t !== TNT) { const k = ((sd + fr * 29) & 31) / 31; r = r * 0.4 + 200 + 55 * k; g = g * 0.4 + 60 + 60 * k; b = b * 0.4; }
      if (T > 450 && !m.life && t !== LAVA) { const k = Math.min(1, (T - 450) / 1350); r += 255 * Math.min(1, k * 3); g += 200 * Math.max(0, k * 1.6 - 0.3); b += 160 * Math.max(0, k * 2.5 - 1.4); }

      if (!fpAlive[k]) continue;

/* ---------------------------------------------------------------------
 * 3.6 对外接口
 * ------------------------------------------------------------------- */
function createRenderer(host) {
  canvas = document.createElement('canvas');
  let ok = false;
  if (!QS.has('nogl')) {
    try { ok = glInit(canvas); } catch (e) { console.warn('WebGL2 初始化失败，退回 Canvas2D：', e.message); ok = false; gl = null; }
  }
  if (ok) renderMode = 'webgl2';
  else {
    canvas = document.createElement('canvas');
    ctx2d = canvas.getContext('2d', { alpha: false });
    renderMode = 'canvas2d';
    canvas.style.imageRendering = 'pixelated';
  }
  canvas.id = 'canvas';
  host.insertBefore(canvas, host.firstChild);
  if (gl) {
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); toast && toast('WebGL 上下文丢失，请刷新页面'); });
  }
}

function resizeRenderer() {
  canvas.style.width = W * CELL + 'px';
  canvas.style.height = H * CELL + 'px';
  if (gl) {
    let pr = settings.hd ? Math.min(window.devicePixelRatio || 1, 2) : 1;
    if (W * CELL * pr * H * CELL * pr > 5.2e6) pr = 1;
    pixelRatio = pr;
    canvas.width = Math.round(W * CELL * pr); canvas.height = Math.round(H * CELL * pr);
    glResize();
  } else {
    pixelRatio = 1;
    canvas.width = W; canvas.height = H;
    R2.img = ctx2d.createImageData(W, H);
    R2.px = new Uint32Array(R2.img.data.buffer);
    sceneDirty = true;
  }
}

function renderFrame(timeMs, dt) {
  if (gl) renderGL(timeMs, dt); else render2D(timeMs);
}

/* =====================================================================
 * 4. 音效：全部用 WebAudio 程序合成，没有任何音频文件。
 *    持续类（沙、水、火、嘶嘶、电、雨、风）各用一条常驻的滤波噪声「声床」，只调增益 → 同类声音天然合并；
 *    瞬时类（爆炸、噼啪、雷、坍塌）限制并发数。所有增益变化都走斜坡，总线上有压限器，避免爆音。
 *    声音图的搭建和每种声音的触发都接受任意 AudioContext，自测用 OfflineAudioContext 渲染同一套代码。
 * ===================================================================== */
const audio = { ctx: null, g: null, volume: 0.6, muted: false, lastBoom: 0, hissEnv: 0, elecEnv: 0, rainEnv: 0 };
const BED_MAX = { sand: 0.2, water: 0.16, fire: 0.22, hiss: 0.2, elec: 0.3, rain: 0.2, wind: 0.14 };

function buildAudioGraph(ctx, volume) {
  const g = { ctx, beds: {}, booms: 0, crackles: 0 };
  const master = g.master = ctx.createGain();
  master.gain.value = volume;
  const comp = ctx.createDynamicsCompressor();          // 总线压限，叠加再多也不削波
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 8; comp.attack.value = 0.002; comp.release.value = 0.2;
  const limit = ctx.createGain();
  limit.gain.value = 0.8;
  master.connect(comp); comp.connect(limit); limit.connect(ctx.destination);

  const nb = g.noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  let s = 0x2545f491;                                   // 固定种子的噪声：离线测试结果可复现
  for (let i = 0; i < nd.length; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; nd[i] = ((s >>> 0) / 2147483648) - 1; }

  const len = Math.floor(ctx.sampleRate * 1.8);         // 混响：指数衰减的噪声当脉冲响应
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; d[i] = (((s >>> 0) / 2147483648) - 1) * Math.pow(1 - i / len, 2.6); }
  }

  conv.buffer = ir;
  const rg = ctx.createGain();
  rg.gain.value = 0.4;
  conv.connect(rg); rg.connect(master);

  const bed = (name, ftype, freq, q, rate) => {
    const src = ctx.createBufferSource();
    src.buffer = nb; src.loop = true; src.playbackRate.value = rate;
    const f = ctx.createBiquadFilter();
    f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    const gn = ctx.createGain();
    gn.gain.value = 0;
    src.connect(f); f.connect(gn); gn.connect(master);
    src.start();
    return (g.beds[name] = { gain: gn, filter: f });
  };
  bed('sand', 'bandpass', 5200, 0.7, 1.0);              // 沙沙声
  const water = bed('water', 'bandpass', 700, 1.1, 0.9);  // 流水：带通中心频率被慢速 LFO 晃动
  const lfo = ctx.createOscillator(), lg = ctx.createGain();
  lfo.frequency.value = 0.9; lg.gain.value = 260;
  lfo.connect(lg); lg.connect(water.filter.frequency); lfo.start();
  bed('fire', 'lowpass', 420, 0.5, 0.8);                // 火焰的低频呼呼声
  bed('hiss', 'highpass', 5500, 0.6, 1.1);              // 水浇在火或熔岩上的嘶嘶声
  bed('rain', 'bandpass', 2600, 0.5, 1.15);             // 雨
  const wind = bed('wind', 'bandpass', 380, 1.4, 0.7);  // 风：中心频率慢慢游走
  const wl = ctx.createOscillator(), wg = ctx.createGain();
  wl.frequency.value = 0.23; wg.gain.value = 160;
  wl.connect(wg); wg.connect(wind.filter.frequency); wl.start();
  const elec = bed('elec', 'bandpass', 3200, 6, 1.0);   // 电火花：窄带噪声被 55Hz 方波斩波 → 嗞嗞
  const chop = ctx.createOscillator(), cg = ctx.createGain(), am = ctx.createGain();
  chop.type = 'square'; chop.frequency.value = 55; cg.gain.value = 0.5; am.gain.value = 0.5;
  elec.gain.disconnect(); elec.gain.connect(am); am.connect(master);
  chop.connect(cg); cg.connect(am.gain); chop.start();

}

function sfxCrackle(g, when, level, freq) {
  const ctx = g.ctx;
  if (g.crackles >= 6) return;
  g.crackles++;
  const dur = 0.05;
  const src = ctx.createBufferSource();
  src.buffer = g.noise;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.5;
  const gn = ctx.createGain();
  gn.gain.setValueAtTime(0.0001, when);
  gn.gain.exponentialRampToValueAtTime(level, when + 0.002);
  gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(f); f.connect(gn); gn.connect(g.master);
  src.start(when, 0.3, dur + 0.02);
  src.onended = () => { g.crackles--; };
}

// 爆炸 / 坍塌：噪声过一个下扫的低通 + 一个下滑的正弦低频，带混响
function sfxBoom(g, when, scale) {
  const ctx = g.ctx;
  if (g.booms >= 4) return;
  g.booms++;
  const s = Math.min(1, Math.max(0.12, scale)), dur = 0.35 + 1.3 * s;
  const src = ctx.createBufferSource();
  src.buffer = g.noise;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.8;
  lp.frequency.setValueAtTime(300 + 1400 * s, when);
  lp.frequency.exponentialRampToValueAtTime(45, when + dur * 0.8);
  const gn = ctx.createGain();
  gn.gain.setValueAtTime(0.0001, when);
  gn.gain.exponentialRampToValueAtTime(0.9 * s, when + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(lp); lp.connect(gn); gn.connect(g.master); gn.connect(g.reverb);
  src.start(when, 0.1, dur + 0.05);
  src.onended = () => { g.booms--; };
  const osc = ctx.createOscillator(), og = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(90, when);
  osc.frequency.exponentialRampToValueAtTime(28, when + 0.5 * dur);
  og.gain.setValueAtTime(0.0001, when);
  og.gain.exponentialRampToValueAtTime(0.8 * s, when + 0.01);
  og.gain.exponentialRampToValueAtTime(0.0001, when + 0.7 * dur);
  osc.connect(og); og.connect(g.master);
  osc.start(when); osc.stop(when + dur);
}

// 雷：先一声脆裂，再拖一长串滚动的低频
function sfxThunder(g, when) {
  const ctx = g.ctx;
  sfxCrackle(g, when, 0.5, 2400);
  const dur = 2.6;
  const src = ctx.createBufferSource();
  src.buffer = g.noise; src.loop = true;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.6;
  lp.frequency.setValueAtTime(900, when);
  lp.frequency.exponentialRampToValueAtTime(70, when + dur);
  const gn = ctx.createGain();
  gn.gain.setValueAtTime(0.0001, when);
  gn.gain.exponentialRampToValueAtTime(0.8, when + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.25, when + 0.5);
  gn.gain.exponentialRampToValueAtTime(0.45, when + 0.9);      // 滚雷的第二下
  gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(lp); lp.connect(gn); gn.connect(g.master); gn.connect(g.reverb);
  src.start(when, 0.5); src.stop(when + dur + 0.05);
}

function audioStart() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.g = buildAudioGraph(audio.ctx, audio.muted ? 0 : audio.volume);
}

function audioReady() { return audio.ctx && audio.ctx.state === 'running'; }

function audioSetVolume() {
  if (!audio.ctx) return;
  audio.g.master.gain.setTargetAtTime(audio.muted ? 0 : audio.volume, audio.ctx.currentTime, 0.03);
}

function audioBoom(scale) {
  if (!audioReady()) return;
  const now = audio.ctx.currentTime;
  if (now - audio.lastBoom < 0.05) return;              // 同一瞬间的爆炸合并成一声
  audio.lastBoom = now;
  sfxBoom(audio.g, now, scale);
}

function audioThunder(delay) { if (audioReady()) sfxThunder(audio.g, audio.ctx.currentTime + delay); }

// 每个渲染帧调用一次：把模拟统计量映射成各声床的音量
function audioFrame() {
  if (audioReady()) {
    const now = audio.ctx.currentTime, b = audio.g.beds;
    b.sand.gain.gain.setTargetAtTime(Math.min(BED_MAX.sand, st.powder / 500 * BED_MAX.sand), now, 0.07);
    b.water.gain.gain.setTargetAtTime(Math.min(BED_MAX.water, st.liquid / 900 * BED_MAX.water), now, 0.1);
    b.fire.gain.gain.setTargetAtTime(Math.min(BED_MAX.fire, st.fire / 220 * BED_MAX.fire), now, 0.12);
    audio.hissEnv = Math.min(1, audio.hissEnv * 0.9 + st.hiss * 0.12);
    b.hiss.gain.gain.setTargetAtTime(audio.hissEnv * BED_MAX.hiss, now, 0.04);
    audio.elecEnv = Math.min(1, audio.elecEnv * 0.8 + st.elec * 0.08);
    b.elec.gain.gain.setTargetAtTime(audio.elecEnv * BED_MAX.elec, now, 0.02);
    audio.rainEnv = Math.min(1, audio.rainEnv * 0.97 + st.rain * 0.02);
    b.rain.gain.gain.setTargetAtTime(audio.rainEnv * BED_MAX.rain, now, 0.2);
    b.wind.gain.gain.setTargetAtTime(Math.min(1, env.windPower * Math.abs(env.wind) * 1.6) * BED_MAX.wind, now, 0.5);
    if (st.fire > 0 && Math.random() < Math.min(0.45, st.fire / 180)) sfxCrackle(audio.g, now, 0.06 + Math.random() * 0.14, 1200 + Math.random() * 4200);
    if (st.crash > 40) audioBoom(Math.min(0.6, st.crash / 900));       // 坍塌的撞击声
  }
  st.powder = 0; st.liquid = 0; st.fire = 0; st.hiss = 0; st.elec = 0; st.boil = 0; st.boom = 0; st.rain = 0; st.crash = 0;
}

/* ---- 离线渲染自测：每种声音单独渲染 1.5 秒，检查不削波（峰值 < 0dBFS）且不是静音 ---- */
const SFX_TESTS = ['sand', 'water', 'fire', 'hiss', 'elec', 'rain', 'wind', 'boom', 'crackle', 'thunder', 'all'];

async function renderSfx(name) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const sr = 44100, ctx = new OAC(1, sr * (name === 'thunder' || name === 'all' ? 3 : 1.5), sr);
  const g = buildAudioGraph(ctx, 1);                    // 主音量开到最大
  const on = n => g.beds[n].gain.gain.setTargetAtTime(BED_MAX[n], 0.05, 0.05);
  if (BED_MAX[name] !== undefined) on(name);
  else if (name === 'boom') sfxBoom(g, 0.1, 1);
  else if (name === 'crackle') { for (let k = 0; k < 6; k++) sfxCrackle(g, 0.1 + k * 0.2, 0.2, 1500 + k * 600); }
  else if (name === 'thunder') sfxThunder(g, 0.1);
  else {                                                // 最坏情况：所有声床开到最大 + 同时 4 声爆炸 + 雷
    for (const n in BED_MAX) on(n);
    for (let k = 0; k < 4; k++) sfxBoom(g, 0.3 + k * 0.01, 1);
    sfxThunder(g, 0.35);
  }
  const buf = await ctx.startRendering(), d = buf.getChannelData(0);
  let peak = 0, sum = 0;
  for (let i = 0; i < d.length; i++) { const v = d[i] < 0 ? -d[i] : d[i]; if (v > peak) peak = v; sum += v * v; }
  return { name, peak, rms: Math.sqrt(sum / d.length) };
}

function showTip(id, anchor) {
  const tip = $('tip');

  } else {

    rows.push(['密度', m.density >= 10 ? Math.round(m.density) + ' kg/m³' : m.density + ' kg/m³']);
    rows.push(['导热', m.conductivity.toFixed(2)]);
    rows.push(['比热', m.heatCapacity.toFixed(1)]);
    if (m.state !== S_GAS && m.state !== S_ENERGY) rows.push(['硬度', m.hardness > 1 ? '不可破坏' : m.hardness.toFixed(2)]);
    if (m.spawnTemp !== AMBIENT) rows.push(['初始温度', fmtT(m.spawnTemp)]);
    if (m.flammability > 0) rows.push(['燃点', fmtT(m.ignitionTemp) + '，烧成' + (m.blastRadius ? '爆炸' : MATERIALS[m.burnInto].name)]);
    if (isFinite(m.meltTemp)) rows.push(['熔点', fmtT(m.meltTemp) + ' → ' + MATERIALS[m.meltInto].name]);
    if (isFinite(m.boilTemp)) rows.push(['沸点', fmtT(m.boilTemp) + ' → ' + MATERIALS[m.boilInto].name]);
    if (isFinite(m.freezeTemp)) rows.push([m.state === S_GAS ? '凝结' : '凝固', '低于 ' + fmtT(m.freezeTemp) + ' → ' + MATERIALS[m.freezeInto].name]);
    if (m.blastRadius) rows.push(['爆炸', '半径 ' + m.blastRadius + ' 格，威力 ' + m.blastPower]);
    if (m.life) rows.push(['寿命', m.life[0] + '–' + m.life[1] + ' 帧']);
    if (m.electric) rows.push(['导电', '是']);
    // 反应列表直接从规则表生成
    const rx = [];
    const nm = t => t === EMPTY ? '消失' : MATERIALS[t].name;
    for (const r of RULES) {
      if (r.a !== id && r.b !== id) continue;
      const other = r.a === id ? r.b : r.a, self2 = r.a === id ? r.a2 : r.b2, other2 = r.a === id ? r.b2 : r.a2;
      let s;
      if (r.tag === 'grow') s = id === PLANT ? '吸水后生长' : '被植物吸收';
      else if (r.use) s = r.a === id ? '溶解它' : '被溶解';
      else {
        const parts = [];
        if (self2 !== id) parts.push('自己→' + nm(self2));
        if (other2 !== other) parts.push('对方→' + nm(other2));
        s = parts.join('，') || '无变化';
      }
      rx.push('<li>碰到<b>' + MATERIALS[other].name + '</b>：' + s + '</li>');
    }
    if (id === SPARK) rx.push('<li>碰到<b>金属 / 水</b>：注入电荷并传导</li><li>碰到<b>可燃物</b>：加热到燃点</li>');
    html = '<h4>' + m.name + '</h4><div class="sub">' + STATE_NAMES[m.state] + (m.note ? ' · ' + m.note : '') + '</div><dl>' +
      rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>' +
      (rx.length ? '<ul>' + rx.slice(0, 9).join('') + (rx.length > 9 ? '<li>……共 ' + rx.length + ' 条</li>' : '') + '</ul>' : '');
  }
  tip.innerHTML = html;
  tip.style.display = 'block';
  const r = anchor.getBoundingClientRect(), th = tip.offsetHeight;
  const side = $('palette').getBoundingClientRect().right + 8;
  tip.style.left = Math.min(window.innerWidth - 260, side) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - th - 8, r.top - 6)) + 'px';
}
function hideTip() { $('tip').style.display = 'none'; }

/* ---------------------------------------------------------------------
 * 5.2 笔刷
 * ------------------------------------------------------------------- */
function stamp(cx, cy, erase) {
  const t = erase ? TOOL_ERASE : tool;
  const r = brush.size - 1, r2 = r * r + r * 0.8;
  const round = brush.shape !== 'square', spray = brush.shape === 'spray' && r > 0;
  const replace = brush.replace;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (round && dx * dx + dy * dy > r2) continue;
    if (spray && rnd() > 0.1) continue;
    paintCell(cx + dx, cy + dy, t, replace);
  }
}

function stampLine(x0, y0, x1, y1, erase) {
  const dx = x1 - x0, dy = y1 - y0, dist = Math.max(Math.abs(dx), Math.abs(dy));
  const stepLen = Math.max(1, brush.size >> 1);
  for (let s = 0; s <= dist; s += stepLen) {
    const k = dist === 0 ? 0 : s / dist;
    stamp(Math.round(x0 + dx * k), Math.round(y0 + dy * k), erase);
  }
  stamp(x1, y1, erase);
}

function toCell(e) {
  const r = canvas.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) / r.width * W), y: Math.floor((e.clientY - r.top) / r.height * H) };
}

function updateCursor() {
  if (!pointer.inside || pointer.hx < 0) { cursorEl.style.display = 'none'; linePrev.style.display = 'none'; return; }
  const r = brush.size - 1, d = (2 * r + 1) * CELL;
  cursorEl.style.display = 'block';
  cursorEl.className = brush.shape === 'circle' ? 'round' : brush.shape === 'spray' ? 'spray' : '';
  cursorEl.style.width = cursorEl.style.height = d + 'px';
  cursorEl.style.left = (pointer.hx - r) * CELL + 'px';
  cursorEl.style.top = (pointer.hy - r) * CELL + 'px';
  if (pointer.down && pointer.line) {
    const ax = (pointer.lx0 + 0.5) * CELL, ay = (pointer.ly0 + 0.5) * CELL;
    const bx = (pointer.hx + 0.5) * CELL, by = (pointer.hy + 0.5) * CELL;
    linePrev.style.display = 'block';
    linePrev.style.left = ax + 'px'; linePrev.style.top = ay + 'px';
    linePrev.style.width = Math.hypot(bx - ax, by - ay) + 'px';
    linePrev.style.transform = 'rotate(' + Math.atan2(by - ay, bx - ax) + 'rad)';
  } else linePrev.style.display = 'none';
}

function bindPointer() {
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    audioStart();
    closePops();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有活动指针 */ }
    const p = toCell(e);
    if (tool === TOOL_LIGHTNING && e.button === 0) { lightning(p.x); return; }      // 召唤闪电：点一下劈一道
    pushUndo();
    structHold = true;                                   // 画的时候先不判定支撑，松手再算（否则画到一半就掉了）
    pointer.down = true; pointer.erase = e.button === 2; pointer.inside = true;
    pointer.x = pointer.hx = p.x; pointer.y = pointer.hy = p.y;
    pointer.line = e.shiftKey; pointer.lx0 = p.x; pointer.ly0 = p.y;
    if (!pointer.line) stamp(p.x, p.y, pointer.erase);
    updateCursor();
  });
  canvas.addEventListener('pointermove', e => {
    const p = toCell(e);
    pointer.inside = true; pointer.hx = p.x; pointer.hy = p.y;
    if (pointer.down && !pointer.line) {
      stampLine(pointer.x, pointer.y, p.x, p.y, pointer.erase);
      pointer.x = p.x; pointer.y = p.y;
    }
    updateCursor();
  });
  const end = e => {
    if (pointer.down && pointer.line) stampLine(pointer.lx0, pointer.ly0, pointer.hx, pointer.hy, pointer.erase);   // Shift 直线：松手时落笔
    pointer.down = false; pointer.line = false;
    if (structHold) { structHold = false; clearPins(); structDirty = true; }
    if (e.pointerType === 'touch') { pointer.inside = false; pointer.hx = -1; }
    updateCursor();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', () => { if (!pointer.down) { pointer.inside = false; pointer.hx = -1; updateCursor(); } });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => { pointer.down = false; pointer.line = false; structHold = false; });
}

/* ---------------------------------------------------------------------
 * 5.3 撤销：环形缓冲 20 个 RLE 快照，每次落笔（或清空/载入）前记一次
 * ------------------------------------------------------------------- */
const UNDO_MAX = 20;
const undoRing = new Array(UNDO_MAX).fill(null);
let undoHead = 0, undoLen = 0;

function pushUndo() {
  undoRing[undoHead] = captureScene();
  undoHead = (undoHead + 1) % UNDO_MAX;
  if (undoLen < UNDO_MAX) undoLen++;
}

function undo() {
  if (undoLen === 0) { toast('没有可撤销的操作'); return; }
  undoHead = (undoHead + UNDO_MAX - 1) % UNDO_MAX;
  undoLen--;
  const s = undoRing[undoHead];
  undoRing[undoHead] = null;
  restoreScene(s);
  syncGravityUI(); syncEnvUI();
  toast('已撤销（还可撤销 ' + undoLen + ' 步）');
}

/* ---------------------------------------------------------------------
 * 5.4 存档 / 导入导出 / 截图 / 录制
 * ------------------------------------------------------------------- */
const SLOT_KEY = 'particle-sandbox-v3-slots';

function readSlots() {
  try { return JSON.parse(localStorage.getItem(SLOT_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function renderSlots() {
  const host = $('slotList'), slots = readSlots(), names = Object.keys(slots);
  host.textContent = '';
  if (!names.length) { const d = document.createElement('div'); d.className = 'note'; d.style.marginTop = '0'; d.textContent = '还没有存档'; host.appendChild(d); return; }
  for (const name of names) {
    const row = document.createElement('div');
    row.className = 'slot';
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = name;
    const load = document.createElement('button');
    load.textContent = '读取';
    load.addEventListener('click', () => {
      try { pushUndo(); restoreScene(sceneFromJSON(slots[name])); syncGravityUI(); syncEnvUI(); toast('已读取「' + name + '」'); closePops(); }
      catch (e) { toast('读取失败：' + e.message); }
    });
    const del = document.createElement('button');
    del.textContent = '删除'; del.className = 'danger';
    del.addEventListener('click', () => {
      const s = readSlots();
      delete s[name];
      localStorage.setItem(SLOT_KEY, JSON.stringify(s));
      renderSlots();
    });
    row.appendChild(nm); row.appendChild(load); row.appendChild(del);
    host.appendChild(row);
  }
}

function saveSlot() {
  const name = $('slotName').value.trim() || '存档 ' + new Date().toLocaleTimeString();
  const slots = readSlots();
  slots[name] = sceneToJSON(captureScene());
  try { localStorage.setItem(SLOT_KEY, JSON.stringify(slots)); toast('已保存到「' + name + '」'); }
  catch (e) { toast('保存失败：浏览器本地存储空间不足，请改用导出 JSON'); }
  $('slotName').value = '';
  renderSlots();
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function stampName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'sandbox-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + ext;
}

function exportJSON() { downloadBlob(new Blob([sceneToJSON(captureScene())], { type: 'application/json' }), stampName('json')); }

function importJSON(file) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      try { const s = sceneFromJSON(String(fr.result)); pushUndo(); restoreScene(s); syncGravityUI(); syncEnvUI(); toast('已导入 ' + file.name); resolve(true); }
      catch (e) { toast('导入失败：' + e.message); resolve(false); }
    };
    fr.onerror = () => { toast('读取文件失败'); resolve(false); };
    fr.readAsText(file);
  });
}

function screenshot() {
  renderFrame(performance.now(), 16.7);                  // WebGL 画布必须在同一个任务里画完再读
  if (gl) canvas.toBlob(b => b && downloadBlob(b, stampName('png')), 'image/png');
  else {
    const out = document.createElement('canvas');
    out.width = W * CELL; out.height = H * CELL;
    const c = out.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(canvas, 0, 0, out.width, out.height);
    out.toBlob(b => b && downloadBlob(b, stampName('png')), 'image/png');
  }
}

const rec = { mr: null, chunks: [], timer: 0, endAt: 0 };

function toggleRecord() {
  if (rec.mr) { rec.mr.stop(); return; }
  if (!canvas.captureStream || !window.MediaRecorder) { toast('这个浏览器不支持录制'); return; }
  const secs = Math.min(30, Math.max(5, +$('selRec').value));
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  let mr;
  try { mr = new MediaRecorder(canvas.captureStream(60), mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined); }
  catch (e) { toast('无法开始录制：' + e.message); return; }
  rec.mr = mr; rec.chunks = []; rec.endAt = performance.now() + secs * 1000;
  mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = () => {
    clearInterval(rec.timer);
    rec.mr = null;
    $('btnRec').textContent = '录制'; $('btnRec').classList.remove('warn'); $('recdot').style.display = 'none';
    if (rec.chunks.length) { downloadBlob(new Blob(rec.chunks, { type: 'video/webm' }), stampName('webm')); toast('录制完成，已下载 WebM'); }
  };
  mr.start(250);
  $('btnRec').textContent = '停止'; $('btnRec').classList.add('warn'); $('recdot').style.display = 'block';
  rec.timer = setInterval(() => {
    const left = Math.max(0, rec.endAt - performance.now());
    $('recdot').textContent = '录制中 ' + (left / 1000).toFixed(1) + ' 秒';
    if (left <= 0 && rec.mr) rec.mr.stop();
  }, 100);
}

const GRAV_CYCLE = ['down', 'left', 'up', 'right'];
let debugOn = false;

function bindKeys() {
  window.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' && e.target.type === 'text') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); if (e.target.blur && tag === 'BUTTON') e.target.blur(); setPaused(!paused); }
    else if (k === '.') { setPaused(true); stepOnce = true; }
    else if (k === 'g' || k === 'G') { setGravity(GRAV_CYCLE[(GRAV_CYCLE.indexOf(gravity) + 1) % 4]); syncGravityUI(); }
    else if (k === 'v' || k === 'V') setView(viewMode + 1);
    else if (k === 'c' || k === 'C') requestClear();
    else if (k === '[') setBrushSize(brush.size - 1);
    else if (k === ']') setBrushSize(brush.size + 1);
    else if (k === '`' || k === '~') { debugOn = !debugOn; $('debug').style.display = debugOn ? 'block' : 'none'; }
    else if (k === 'Escape') closePops();
    else if (HOTKEYS[k] !== undefined) selectTool(HOTKEYS[k]);
  });
}

/* ---------------------------------------------------------------------
 * 5.7 自适应：窗口变化时重建网格，但保留场景内容（按底边居中对齐）
 * ------------------------------------------------------------------- */
function fitGrid(force) {
  const w = Math.max(48, Math.floor(stage.clientWidth / CELL)), h = Math.max(48, Math.floor(stage.clientHeight / CELL));
  if (!force && w === W && h === H) return;
  const snap = N > 0 ? captureScene() : null;
  allocGrid(w, h);
  if (snap && snap.n > 0) restoreScene(snap);
  resizeRenderer();
  undoLen = 0; undoHead = 0;
}

let resizeTimer = 0;
function bindResize() {
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (!testRunning) fitGrid(false); }, 160);
  }).observe(stage);
}

const hud = { frames: 0, last: 0, fps: 0, simRate: 0, lastSteps: 0, interval: 16.7, work: 0, throttled: false };

function updateHud(now) {
  const dt = now - hud.last;
  if (dt < 250) return;
  hud.fps = hud.frames * 1000 / dt;
  hud.simRate = (simStepsTotal - hud.lastSteps) * 1000 / dt;
  hud.frames = 0; hud.last = now; hud.lastSteps = simStepsTotal;
  $('stFps').textContent = Math.round(hud.fps);
  $('stSim').textContent = paused ? '暂停' : Math.round(hud.simRate);
  $('stCount').textContent = (particleCount + fpCount).toLocaleString();
  $('stMode').textContent = renderMode === 'webgl2' ? 'WebGL2' : 'Canvas2D';
  // rAF 间隔明显大于 16.7ms，而我们自己每帧的活儿（含 GPU）远小于间隔 → 是浏览器在降频，不是性能问题
  hud.throttled = document.hidden || (hud.fps < 50 && hud.work + perf.gpu < 8);
  $('stThrottle').classList.toggle('hide', !hud.throttled);
  $('stThrottle').textContent = 'rAF 被降频（实际 ' + (hud.fps < 10 ? hud.fps.toFixed(1) : Math.round(hud.fps)) + ' 帧/秒，每帧只需 ' + (hud.work + perf.gpu).toFixed(1) + 'ms）';

  // 检视器
  if (inb(pointer.hx, pointer.hy) && pointer.inside) {
    const i = pointer.hx + pointer.hy * W, t = type[i], f = flags[i], m = MATERIALS[t];
    let s = m.name + ' · ' + Math.round(temp[i]) + '°C · ' + STATE_NAMES[m.state];
    if ((t === METAL || t === STEEL) && temp[i] > 450) s = '热' + s;
    if (f & F_BODY) s += ' · 刚体（下落中）';
    else if (M_RIGID[t] && M_HARD[t] <= 1) s += ' · 完整度 ' + aux[i];
    if (wet[i] > 0 && t !== 0) s += ' · 含水 ' + wet[i];
    if (t === 0 && aux[i] > 20) s += ' · 空气浑浊 ' + aux[i];
    if (t === CLONE && life[i]) s += ' · 复制：' + MATERIALS[life[i]].name;
    else if (life[i] && t !== 0 && !(f & F_BODY)) s += ' · ' + (M_BLAST[t] && (f & F_BURN) ? '引信 ' : f & F_TIP ? '生长能量 ' : M_LATENT[t] ? '融化进度 ' : t === PLANT || t === FLOWER || t === SEED ? '年龄 ' : '寿命 ') + life[i];
    if (fuel[i] > 0 && (f & F_BURN)) s += ' · 剩余燃料 ' + fuel[i];
    if (f & F_BURN) s += ' · 燃烧中';
    if (f & F_SCORCH) s += ' · 焦黑';
    if (charge[i]) s += ' · 带电';
    $('stInspect').textContent = s + '  (' + pointer.hx + ', ' + pointer.hy + ')';
  } else $('stInspect').textContent = '—';

  if (debugOn) {
    const n = Math.max(1, perf.frames || 1), sN = Math.max(1, perf.steps);
    $('debug').textContent =
      '网格        ' + W + ' x ' + H + '  (' + CW * CHN + ' 块)\n' +
      '活跃块      ' + perf.activeChunks + ' / ' + CW * CHN + '\n' +
      '飞行粒子    ' + fpCount + ' / ' + FP_MAX + '\n' +
      '爆炸 / 带电 ' + exActive + ' / ' + elecCount + '\n' +
      '刚体        ' + bodyCount + ' / ' + BODY_MAX + '   (支撑检测 ' + structStats.checks + ' 次)\n' +
      '环境        ' + (env.time * 24).toFixed(1) + ' 时  ' + env.ambient.toFixed(0) + '°C  云 ' + sumCloudUI().toFixed(0) + '  雨 ' + env.rainCount + '  雪 ' + env.snowCount + '  闪电 ' + env.strikes + '\n' +
      '模拟步数    ' + (perf.steps / n).toFixed(2) + ' 步/帧  (' + Math.round(hud.simRate) + ' 步/秒)\n' +
      '── 每帧耗时 (ms) ──\n' +
      '模拟·粒子   ' + (perf.cells / n).toFixed(2) + '   (每步 ' + (perf.cells / sN).toFixed(2) + ')\n' +
      '模拟·温度   ' + (perf.thermal / n).toFixed(2) + '\n' +

}

/* =====================================================================
 * 6. 自测（?test=1）。模拟类用例不依赖 DOM，在 Node 里也能跑。
 * ===================================================================== */
const TESTS = [];
function defTest(name, fn) { TESTS.push({ name, fn }); }
function runSteps(n) { for (let k = 0; k < n; k++) simStep(); }

function tArena() {
  // 自测默认环境：恒为正午、20°C、无风、晴，结构力学关闭（很多用例把容器悬在半空）。需要的用例自己打开。
  env.dayNight = false; env.temp = AMBIENT; env.wind = 0; env.windPower = 0; env.structure = false; sceneScript = null;
  setWeather('clear'); env.windPower = 0; env.cloudFade = 0; updateSun();
  clearGrid(); setGravity('down'); seedRng(20240607);
  return { cx: W >> 1, cy: H >> 1 };
}

function tBox(x0, y0, x1, y1, m) {
  for (let x = x0; x <= x1; x++) { put(x + y0 * W, m, x, y0); put(x + y1 * W, m, x, y1); }
  for (let y = y0; y <= y1; y++) { put(x0 + y * W, m, x0, y); put(x1 + y * W, m, x1, y); }
}

function tFloor(y, m) { for (let x = 0; x < W; x++) put(x + y * W, m || GLASS, x, y); }

// 跑到条件成立为止；返回用了多少步，超时返回 -1
function tUntil(maxSteps, every, cond) {
  for (let s = 0; s < maxSteps; s++) {
    simStep();
    if (s % every === 0 && cond()) return s + 1;
  }
  return cond() ? maxSteps : -1;
}

/* ---- 6.1 反应矩阵里的每一条接触规则 ---- */
for (const r of RULES) {
  defTest('规则 ' + MATERIALS[r.a].name + ' × ' + MATERIALS[r.b].name, () => {
    const { cx, cy } = tArena();
    const x0 = cx - 4, x1 = cx + 3, y0 = cy - 3, y1 = cy + 2;
    tBox(x0, y0, x1, y1, GLASS);
    for (let y = y0 + 1; y < y1; y++) for (let x = x0 + 1; x < x1; x++) {
      const i = x + y * W, top = y < y0 + 3;
      put(i, top ? r.a : r.b, x, y);
      if (top && r.maxT !== undefined) temp[i] = r.maxT - 3;
    }
    const a0 = countType(r.a), b0 = countType(r.b);
    const a20 = countType(r.a2), b20 = countType(r.b2);
    const cond = () =>
      (r.a2 !== r.a && r.a2 !== EMPTY && countType(r.a2) > a20) ||
      (r.b2 !== r.b && r.b2 !== EMPTY && countType(r.b2) > b20) ||
      (r.b2 === EMPTY && countType(r.b) < b0) ||
      (r.a2 === EMPTY && countType(r.a) < a0);
    const n = tUntil(Math.min(8000, Math.ceil(60 / r.p)), 2, cond);
    return { ok: n > 0, info: n > 0 ? n + ' 步出现产物' : '超时未出现产物' };
  });
}

/* ---- 6.2 温度相变 ---- */
defTest('冰受热融化成水', () => {
  const { cx, cy } = tArena();
  tBox(cx - 4, cy - 3, cx + 4, cy + 3, GLASS);
  fillRect(ICE, cx - 2, cy, cx + 2, cy + 2);
  const n = tUntil(600, 1, () => {      // 持续供热（相当于按住加热工具）
    for (let x = cx - 2; x <= cx + 2; x++) for (let y = cy; y <= cy + 2; y++) if (type[x + y * W] === ICE) temp[x + y * W] = 60;
    return countType(WATER) >= 10;
  });
  return { ok: n > 0, info: n + ' 步' };

defTest('四个重力方向：粉末下沉、气体反向、休止角一致', () => {
  const ratios = [], notes = [];
  let ok = true;
  for (const dir of ['down', 'up', 'left', 'right']) {
    tArena(); setGravity(dir); seedRng(99);
    const cx = W >> 1, cy = H >> 1;
    // 在重力下游 20 格处放一块金属板，沙落在板上堆成堆
    const px = cx + gx * 20, py = cy + gy * 20;
    for (let k = -45; k <= 45; k++) { const x = px + lx * k, y = py + ly * k; if (inb(x, y)) put(x + y * W, METAL, x, y); }
    fillRect(SAND, cx - 10, cy - 10, cx + 10, cy + 10);
    const sx = cx - gx * 16, sy = cy - gy * 16;
    fillCircle(SMOKE, sx, sy, 3);
    let moved = 0;
    for (let s = 0; s < 40; s++) simStep();
    // 烟的质心应该逆着重力移动
    let gsx = 0, gsy = 0, gn = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === SMOKE) { gsx += x; gsy += y; gn++; }
    if (gn > 0) moved = -((gsx / gn - sx) * gx + (gsy / gn - sy) * gy);
    runSteps(500);
    // 沙堆：沿重力方向的高度 vs 侧向宽度
    let hMax = 0, lMin = 1e9, lMax = -1e9, n = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (type[x + y * W] !== SAND) continue;
      n++;
      const dh = (px - x) * gx + (py - y) * gy, dl = (x - px) * lx + (y - py) * ly;
      if (dh > hMax) hMax = dh;
      if (dl < lMin) lMin = dl;
      if (dl > lMax) lMax = dl;
    }
    const ratio = (lMax - lMin + 1) / hMax;
    ratios.push(ratio);
    notes.push(dir + ' 宽高比 ' + ratio.toFixed(2) + ' 气体逆行 ' + moved.toFixed(1));
    if (n < 430 || n > 441 || moved < 4 || hMax < 6) ok = false;
  }
  const mn = Math.min.apply(null, ratios), mx = Math.max.apply(null, ratios);
  if (mx / mn > 1.6 || mn < 1.2 || mx > 4.5) ok = false;      // v4 里沙粒落地会弹开，堆的宽度比 v3 更随机，容差放宽到 1.6 倍
  setGravity('down');
  return { ok, info: notes.join('；') };
});

// 同步跑完全部模拟用例（Node 用）
function runSimTestsSync(log) {
  let pass = 0;
  const results = [];
  for (const t of TESTS) {
    if (t.browser) continue;
    let r;
    try { r = t.fn(); } catch (e) { r = { ok: false, info: '异常：' + (e && e.stack || e) }; }
    results.push({ name: t.name, ok: r.ok, info: r.info });
    if (r.ok) pass++;
    if (log) log((r.ok ? '通过  ' : '失败  ') + t.name + ' — ' + r.info);
  }
  return { pass, total: results.length, results };
}

/* =====================================================================
 * 6b. v4 新增用例
 * ===================================================================== */
function countBurning() { let n = 0; for (let i = 0; i < N; i++) if (type[i] !== 0 && (flags[i] & F_BURN)) n++; return n; }
function sumCloud() { let s = 0; for (let c = 0; c < GW * GH; c++) s += cloud[c]; return s; }
function centroid(t) {
  let sx = 0, sy = 0, n = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (type[x + y * W] === t) { sx += x; sy += y; n++; }
  return n ? { x: sx / n, y: sy / n, n } : null;
}

defTest('植物：有株高上限、生物量有上限、走完整个生命周期', () => {

defTest('连续循环：冰 → 水 → 蒸汽 → 云 → 雨，水量守恒（误差 ≤ 5%）', () => {

  fillRect(ICE, cx - 6, by - 6, cx + 6, by - 1);
  const w0 = totalWater();
  const seen = { ice: true, water: false, steam: false, cloud: false, rain: false };
  for (let s = 0; s < 2400; s++) {                       // 阶段一：底下的金属板持续加热
    for (let x = cx - 10; x <= cx + 10; x++) temp[x + by * W] = 420;
    simStep();
    if (s % 10 === 0) { if (countType(WATER) > 0) seen.water = true; if (countType(STEAM) > 0) seen.steam = true; }
  }
  for (let x = cx - 10; x <= cx + 10; x++) for (let y = by; y <= by + 1; y++) temp[x + y * W] = 20;
  for (let s = 0; s < 12000 && !(seen.rain && seen.cloud && env.rainCount > 15); s++) {   // 阶段二：停火，等云和雨
    simStep();
    if (s % 20 === 0) { if (sumCloud() > 0.5) seen.cloud = true; if (env.rainCount > 0) seen.rain = true; }
  }
  const w1 = totalWater(), err = Math.abs(w1 - w0) / w0;
  const ok = seen.water && seen.steam && seen.cloud && seen.rain && err <= 0.05;
  return { ok, info: '出现过：水 ' + seen.water + '、蒸汽 ' + seen.steam + '、云 ' + seen.cloud + '、雨 ' + seen.rain + '（' + env.rainCount + ' 滴）；水量 ' +
                     w0.toFixed(1) + ' → ' + w1.toFixed(1) + '，误差 ' + (err * 100).toFixed(2) + '%' };
});
