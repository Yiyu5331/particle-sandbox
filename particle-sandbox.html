<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>粒子沙盘 v4</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-strong: rgba(22, 22, 32, 0.82);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --text: #d8d8e4;
    --text-strong: #ffffff;
    --muted: #8a8aa2;
    --accent: #8fa8ff;
    --warn: #ffc14a;
    --danger: #ff5a5a;
    --ok: #5fd08a;
    --radius: 12px;
    --radius-sm: 8px;
    --pill: 999px;
    --gap: 8px;
    --gap-sm: 4px;
    --blur: blur(16px) saturate(140%);
    --side: 172px;
    --ctl-h: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 12.5px/1.35 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(90, 60, 200, 0.22), transparent 70%),
      radial-gradient(800px 380px at 92% -6%, rgba(255, 90, 30, 0.13), transparent 70%),
      var(--bg);
    -webkit-user-select: none; user-select: none;
  }
  #app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .glass { background: var(--panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  button, select, input { font: inherit; color: inherit; }
  button, select {
    height: var(--ctl-h); padding: 0 10px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); border-radius: var(--pill); background: var(--panel);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s;
  }
  select { padding: 0 6px; -webkit-appearance: none; appearance: none; text-align: center; }
  select option { background: #1a1a24; color: var(--text); }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.11); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { color: var(--text-strong); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px -2px var(--accent); }
  button.sq { width: var(--ctl-h); padding: 0; }
  button.danger { border-color: rgba(255, 90, 90, 0.5); color: #ff9c9c; background: rgba(255, 60, 60, 0.1); }
  button.danger:hover, button.danger.armed { background: rgba(255, 60, 60, 0.3); color: #fff; box-shadow: 0 0 14px -2px var(--danger); }
  button.warn { border-color: var(--warn); color: #ffd98a; box-shadow: 0 0 12px -3px var(--warn); }
  input[type=range] { accent-color: var(--accent); cursor: pointer; height: var(--ctl-h); }
  input[type=text] { height: var(--ctl-h); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(0, 0, 0, 0.3); min-width: 0; }

  /* ---------- 顶部控制条 ---------- */
  #topbar {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap);
    padding: 6px 10px; border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); z-index: 5;
  }
  .grp { display: flex; align-items: center; gap: var(--gap-sm); padding: 3px 5px; border: 1px solid var(--line); border-radius: var(--pill); background: rgba(255, 255, 255, 0.03); }
  .grp > .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; padding: 0 3px 0 5px; white-space: nowrap; }
  .grp .val { min-width: 1.8em; text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; padding-right: 4px; }
  #brand { font-weight: 650; color: var(--text-strong); letter-spacing: 0.04em; padding: 0 6px 0 2px; white-space: nowrap; }
  #brand small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  #rngSize { width: 86px; }
  #rngVol { width: 62px; }

  /* ---------- 左侧元素面板 ---------- */
  #palette { grid-row: 2; overflow-y: auto; padding: 8px; border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .cat { margin-bottom: 10px; }
  .cat h3 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 0 2px 5px; }
  .cat .items { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); }
  .el {
    --c1: #888; --c2: #aaa; --c3: #666;
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 5px; border-radius: var(--radius-sm);
    position: relative; overflow: hidden; text-align: left;
  }
  .el .sw {
    width: 16px; height: 16px; border-radius: 5px; flex: none;
    background: linear-gradient(115deg, var(--c1), var(--c2), var(--c3), var(--c1), var(--c2));
    background-size: 400% 100%; animation: swatch 3.2s linear infinite;
    box-shadow: 0 0 7px -1px var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  }
  .el.glow .sw { animation-duration: 1.3s; box-shadow: 0 0 10px 0 var(--c1), inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
  .el .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .el kbd { font: 10px ui-monospace, monospace; color: var(--muted); }
  .el.on { color: var(--text-strong); border-color: var(--c1); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 1px var(--c1), 0 0 14px -2px var(--c1); }
  @keyframes swatch { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .el .sw { animation: none; } }

  /* ---------- 画布区 ---------- */
  #stage { grid-row: 2; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  #viewport { position: relative; line-height: 0; }
  #canvas { display: block; background: var(--bg); cursor: none; touch-action: none; }
  #cursor { position: absolute; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); display: none; }
  #cursor.round { border-radius: 50%; }
  #cursor.spray { border-radius: 50%; border-style: dashed; }
  #lineprev { position: absolute; pointer-events: none; height: 0; border-top: 1px dashed rgba(255, 255, 255, 0.8); transform-origin: 0 0; display: none; }
  .float { position: absolute; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  #debug { left: 10px; top: 10px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; display: none; pointer-events: none; color: #c8d4ff; }
  #testbox { right: 10px; top: 10px; width: min(460px, 70%); max-height: calc(100% - 20px); overflow: auto; display: none; font-size: 11.5px; line-height: 1.55; -webkit-user-select: text; user-select: text; }
  #testbox h4 { font-size: 13px; margin-bottom: 4px; color: var(--text-strong); }
  #testbox .ok { color: var(--ok); } #testbox .bad { color: var(--danger); } #testbox .dim { color: var(--muted); }
  #toast { left: 50%; bottom: 14px; transform: translateX(-50%); opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #recdot { right: 10px; bottom: 10px; display: none; color: #ff9c9c; font-variant-numeric: tabular-nums; }
  #recdot::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- 底部状态栏 ---------- */
  #status {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 4px 12px; font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--muted); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden;
  }
  #status b { color: var(--text-strong); font-weight: 600; }
  #stInspect { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .chip { padding: 1px 8px; border-radius: var(--pill); border: 1px solid var(--line); }
  .chip.warn { border-color: var(--warn); color: #ffd98a; }
  .chip.hide { display: none; }

  /* ---------- 弹层与提示 ---------- */
  .pop { position: fixed; z-index: 20; display: none; min-width: 220px; max-width: 320px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); }
  .pop.show { display: block; }
  .pop h4 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; margin: 2px 2px 8px; }
  .pop .col { display: flex; flex-direction: column; gap: var(--gap-sm); }
  .pop .row { display: flex; gap: var(--gap-sm); align-items: center; }
  .pop .row > * { flex: 1; }
  .pop button { border-radius: var(--radius-sm); text-align: left; }
  .pop button small { color: var(--muted); margin-left: 6px; }
  .pop label { display: flex; align-items: center; gap: 8px; height: 26px; cursor: pointer; }
  .pop label input { accent-color: var(--accent); }
  .pop .note { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; white-space: normal; }
  .slot { display: flex; gap: var(--gap-sm); align-items: center; }
  .slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .slot button { flex: none; text-align: center; }
  #tip { position: fixed; z-index: 30; display: none; width: 250px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--panel-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); pointer-events: none; line-height: 1.55; }
  #tip h4 { font-size: 13px; color: var(--text-strong); margin-bottom: 2px; }
  #tip .sub { color: var(--muted); margin-bottom: 6px; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
  #tip dt { color: var(--muted); } #tip dd { color: var(--text); font-variant-numeric: tabular-nums; }
  #tip ul { list-style: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  #tip li { color: var(--text); } #tip li::before { content: '· '; color: var(--muted); }

  @media (max-width: 760px) {
    :root { --side: 104px; --ctl-h: 26px; }
    .cat .items { grid-template-columns: 1fr; }
    #brand small, .grp > .lbl { display: none; }
    #topbar { gap: 5px; padding: 5px; }
    #rngSize { width: 60px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="glass">
    <span id="brand">粒子沙盘<small>v4</small></span>
    <div class="grp">
      <button id="btnPause" title="暂停 / 继续（空格）">❚❚ 暂停</button>
      <button id="btnStep" class="sq" title="单步（.）" aria-label="单步">▸|</button>
      <select id="selSpeed" title="模拟速度" aria-label="模拟速度">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option>
        <option value="2">2x</option><option value="4">4x</option>
      </select>
    </div>
    <div class="grp" id="gravGrp">
      <span class="lbl">重力</span>
      <button class="sq" data-g="up" title="重力向上" aria-label="重力向上">↑</button>
      <button class="sq on" data-g="down" title="重力向下" aria-label="重力向下">↓</button>
      <button class="sq" data-g="left" title="重力向左" aria-label="重力向左">←</button>
      <button class="sq" data-g="right" title="重力向右" aria-label="重力向右">→</button>
    </div>
    <div class="grp">
      <span class="lbl">笔刷</span>
      <button class="sq on" data-shape="circle" title="圆形" aria-label="圆形笔刷">●</button>
      <button class="sq" data-shape="square" title="方形" aria-label="方形笔刷">■</button>
      <button class="sq" data-shape="spray" title="喷雾（随机稀疏）" aria-label="喷雾笔刷">∴</button>
      <button id="btnMode" title="切换：只填空位 / 覆盖替换">填空</button>
      <input type="range" id="rngSize" min="1" max="30" value="4" aria-label="笔刷大小" title="笔刷大小（[ 和 ]）">
      <span class="val" id="lblSize">4</span>
    </div>
    <div class="grp">
      <button id="btnView" title="切换视图（V）">视图：正常</button>
      <button id="btnUndo" title="撤销（Ctrl/Cmd+Z）">撤销</button>
      <button id="btnClear" class="danger" title="清空（C，需再按一次确认）">清空</button>
    </div>
    <div class="grp">
      <button id="btnScenes" data-pop="popScenes">场景 ▾</button>
      <button id="btnSave" data-pop="popSave">存档 ▾</button>
      <button id="btnShot" title="保存 PNG 截图">截图</button>
      <select id="selRec" title="录制时长" aria-label="录制时长">
        <option value="5">5秒</option><option value="10" selected>10秒</option><option value="15">15秒</option><option value="30">30秒</option>
      </select>
      <button id="btnRec" title="录制 WebM 视频">录制</button>
    </div>
    <div class="grp">
      <button id="btnMute" title="静音">声音</button>
      <input type="range" id="rngVol" min="0" max="100" value="60" aria-label="总音量" title="总音量">
      <button id="btnEnv" data-pop="popEnv">环境 ▾</button>
      <button id="btnSettings" data-pop="popSettings">设置 ▾</button>
    </div>
  </header>

  <aside id="palette" class="glass" aria-label="元素面板"></aside>

  <main id="stage">
    <div id="viewport">
      <div id="cursor"></div>
      <div id="lineprev"></div>
    </div>
    <div id="debug" class="float"></div>
    <div id="testbox" class="float"></div>
    <div id="toast" class="float"></div>
    <div id="recdot" class="float">录制中</div>
  </main>

  <footer id="status" class="glass">
    <span>FPS <b id="stFps">--</b></span>
    <span>模拟 <b id="stSim">--</b> 步/秒</span>
    <span id="stThrottle" class="chip warn hide" title="页面在后台、被遮挡或浏览器省电时，requestAnimationFrame 会被降频。这不是性能问题。">rAF 被降频</span>
    <span id="stInspect">—</span>
    <span id="stMode" class="chip"></span>
    <span>粒子 <b id="stCount">0</b></span>
  </footer>
</div>

<div id="popScenes" class="pop"><h4>预设场景</h4><div class="col" id="sceneList"></div></div>
<div id="popSave" class="pop">
  <h4>存档槽位（浏览器本地）</h4>
  <div class="row"><input type="text" id="slotName" placeholder="存档名称" maxlength="24"><button id="btnSlotSave" style="flex:none;text-align:center">保存</button></div>
  <div class="col" id="slotList" style="margin-top:8px"></div>
  <h4 style="margin-top:12px">文件</h4>
  <div class="row"><button id="btnExport" style="text-align:center">导出 JSON</button><button id="btnImport" style="text-align:center">导入 JSON</button></div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>
<div id="popSettings" class="pop">
  <h4>画质</h4>
  <div class="row">
    <select id="selQuality" aria-label="画质档位"><option value="low">低</option><option value="mid">中</option><option value="high" selected>高</option><option value="ultra">极致</option></select>
    <select id="selScale" aria-label="网格精度"><option value="2">每格 2 像素</option><option value="3" selected>每格 3 像素</option><option value="4">每格 4 像素</option></select>
  </div>
  <h4 style="margin-top:10px">画面效果</h4><div class="col" id="settingList"></div><div class="note" id="renderInfo"></div>
</div>
<div id="popEnv" class="pop">
  <h4>天气</h4>
  <div class="row" id="envWeather"></div>
  <h4 style="margin-top:10px">风</h4>
  <label>风向 <input type="range" id="envWind" min="-100" max="100" value="20" style="flex:1" aria-label="风向"></label>
  <label>风力 <input type="range" id="envPower" min="0" max="100" value="30" style="flex:1" aria-label="风力"></label>
  <h4 style="margin-top:10px">空气</h4>
  <label>湿度 <input type="range" id="envHumid" min="0" max="100" value="0" style="flex:1" aria-label="外来水汽"></label>
  <label>气温 <input type="range" id="envTemp" min="-20" max="45" value="20" style="flex:1" aria-label="气温"><span id="envTempVal" style="min-width:3.2em;text-align:right">20°C</span></label>
  <h4 style="margin-top:10px">时间</h4>
  <label>时刻 <input type="range" id="envTime" min="0" max="100" value="80" style="flex:1" aria-label="一天中的时刻"></label>
  <div class="row"><select id="envSpeed" aria-label="时间流速"><option value="0">时间暂停</option><option value="1" selected>1x（一天 10 分钟）</option><option value="10">10x</option><option value="60">60x</option></select></div>
  <label><input type="checkbox" id="envDayNight" checked>昼夜循环</label>
  <label><input type="checkbox" id="envStruct" checked>结构力学（悬空的固体会塌）</label>
  <div class="row" style="margin-top:6px"><button id="envBolt" style="text-align:center">召唤闪电</button></div>
</div>
<div id="tip"></div>

<script>
'use strict';
/* =====================================================================
 * 粒子沙盘 v4
 * 模块顺序：1 核心（常量/随机数/材料表/规则表/网格/分块/环境）
 *           2 模拟（运动/燃烧/含水量/植物/爆炸/电/温度/飞行粒子/慢速过程/主步进）
 *             2s 结构力学（支撑检测 + 刚体）   2w 天气（风/湿度/云/降水/闪电/昼夜）
 *           3 渲染（WebGL2 管线 + Canvas2D 退路）
 *           4 音效（WebAudio 程序合成）
 *           5 UI     6 自测与 soak     7 主循环
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1.1 常量与随机数
 * ------------------------------------------------------------------- */
let CELL = 3;              // 每格的 CSS 像素边长，可在设置里切 2 / 3 / 4
const CHUNK = 32;          // 分块边长
const AMBIENT = 20;        // 默认气温 °C（实际环境温度见 env.ambient）
const WAKE_TTL = 3;        // 被唤醒后至少再模拟几帧
const SIM_HZ = 60;
const QS = new URLSearchParams(location.search);

// xorshift32：热循环里只用它，不用 Math.random
let _rs = ((Date.now() ^ 0x9e3779b9) | 0) || 1;
function rnd() {
  _rs ^= _rs << 13; _rs ^= _rs >>> 17; _rs ^= _rs << 5;
  return (_rs >>> 0) * 2.3283064365386963e-10;
}
function rndi(n) { return (rnd() * n) | 0; }
function seedRng(s) { _rs = (s | 0) || 1; }

/* ---------------------------------------------------------------------
 * 1.2 材料表（声明式；所有通用行为都从这张表读）
 * ------------------------------------------------------------------- */
const S_EMPTY = 0, S_SOLID = 1, S_POWDER = 2, S_LIQUID = 3, S_GAS = 4, S_ENERGY = 5;
const STATE_NAMES = ['空', '固体', '粉末', '液体', '气体', '能量'];

const EMPTY = 0, SAND = 1, WATER = 2, FIRE = 3, WOOD = 4, STONE = 5, LAVA = 6, PLANT = 7,
      ICE = 8, ACID = 9, SMOKE = 10, STEAM = 11, EMBER = 12, TNT = 13, METAL = 14, CLONE = 15,
      VOID = 16, OIL = 17, GUNPOWDER = 18, GLASS = 19, ASH = 20, CHARCOAL = 21, SALT = 22,
      SALTWATER = 23, SPARK = 24, SEED = 25, FLOWER = 26, SOIL = 27,
      BRICK = 28, CONCRETE = 29, STEEL = 30, ANCHOR = 31, ROPE = 32, DEADPLANT = 33, FOAM = 34, SNOW = 35;
const NT = 36;
// 工具（不是材料）
const TOOL_ERASE = 100, TOOL_HEAT = 101, TOOL_COOL = 102, TOOL_LIGHTNING = 103;

const MAT_DEFAULTS = {
  state: S_SOLID, cat: 'solid', density: 1000, viscosity: 0, dispersion: 0,
  flammability: 0, ignitionTemp: Infinity, burnInto: EMPTY, burnTime: 0, burnTemp: 0,
  flame: 0, residue: 1,
  meltTemp: Infinity, meltInto: EMPTY, latent: 0, latentRate: 4,
  boilTemp: Infinity, boilInto: EMPTY,
  freezeTemp: -Infinity, freezeInto: EMPTY,
  conductivity: 0.15, heatCapacity: 1.5, relax: 0.001,
  hardness: 0.2, emissive: 0, alpha: 1, palette: ['#ff00ff'],
  spawnTemp: AMBIENT, life: null, decayInto: EMPTY, decayChance: 0,
  blastRadius: 0, blastPower: 0, electric: false,
  absorb: 0,          // 最多能吸多少水（0-255；100 = 一格水）
  sap: 0,             // 自带的含水量在这个值以内不妨碍燃烧（活植物的汁液）；超出的部分才算「打湿了」
  slide: 1,           // 侧面要有多深的落差才会滑落：1 = 松散（约 45°），2 = 更陡
  wind: 0,            // 受风影响的程度

const M_STATE = new Uint8Array(NT), M_DENS = new Float32Array(NT), M_VISC = new Float32Array(NT),
      M_DISP = new Uint8Array(NT), M_FLAM = new Float32Array(NT), M_IGN = new Float32Array(NT),
      M_BURNINTO = new Uint8Array(NT), M_BURNTIME = new Uint16Array(NT), M_BURNTEMP = new Float32Array(NT),
      M_FLAME = new Float32Array(NT), M_RESIDUE = new Float32Array(NT),
      M_MELT = new Float32Array(NT), M_MELTINTO = new Uint8Array(NT), M_LATENT = new Uint16Array(NT), M_LATK = new Float32Array(NT),
      M_BOIL = new Float32Array(NT), M_BOILINTO = new Uint8Array(NT),
      M_FREEZE = new Float32Array(NT), M_FREEZEINTO = new Uint8Array(NT),
      M_IHC = new Float32Array(NT), M_RELAX = new Float32Array(NT), M_HARD = new Float32Array(NT),
      M_SPAWN = new Float32Array(NT), M_LIFE0 = new Uint16Array(NT), M_LIFE1 = new Uint16Array(NT),
      M_DECAY = new Uint8Array(NT), M_DECAYP = new Float32Array(NT),
      M_BLAST = new Uint8Array(NT), M_BPOW = new Float32Array(NT), M_ELEC = new Uint8Array(NT),
      M_ABSORB = new Uint8Array(NT), M_SAP = new Uint8Array(NT), M_SLIDE = new Uint8Array(NT), M_WIND = new Float32Array(NT),
      M_RIGID = new Uint8Array(NT), M_BOND = new Float32Array(NT), M_FRAC = new Float32Array(NT);
const AIRLIKE = new Uint8Array(NT);          // 空气，以及占着空气位置的火焰 / 烟 / 余烬：它们的 aux 都是「这格空气的浑浊度」
AIRLIKE[EMPTY] = AIRLIKE[FIRE] = AIRLIKE[SMOKE] = AIRLIKE[EMBER] = 1;
const KTAB = new Float32Array(NT * NT);     // 两种材料之间的导热系数
const SINKP = new Float32Array(NT * NT);    // [a*NT+b]：a 每帧沉进液体 b 的概率（看密度差和粘度）

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

(function buildMaterialArrays() {
  for (let t = 0; t < NT; t++) {
    const m = MATERIALS[t];
    M_STATE[t] = m.state; M_DENS[t] = m.density; M_VISC[t] = m.viscosity; M_DISP[t] = m.dispersion;
    M_FLAM[t] = m.flammability; M_IGN[t] = m.ignitionTemp; M_BURNINTO[t] = m.burnInto;
    M_BURNTIME[t] = m.burnTime; M_BURNTEMP[t] = m.burnTemp; M_FLAME[t] = m.flame; M_RESIDUE[t] = m.residue;
    M_MELT[t] = m.meltTemp; M_MELTINTO[t] = m.meltInto; M_LATENT[t] = m.latent; M_LATK[t] = m.latentRate;
    M_BOIL[t] = m.boilTemp; M_BOILINTO[t] = m.boilInto;
    M_FREEZE[t] = m.freezeTemp; M_FREEZEINTO[t] = m.freezeInto;
    M_IHC[t] = 1 / m.heatCapacity; M_RELAX[t] = m.relax; M_HARD[t] = m.hardness;
    M_SPAWN[t] = m.spawnTemp;
    if (m.life) { M_LIFE0[t] = m.life[0]; M_LIFE1[t] = m.life[1]; }
    M_DECAY[t] = m.decayInto; M_DECAYP[t] = m.decayChance;
    M_BLAST[t] = m.blastRadius; M_BPOW[t] = m.blastPower; M_ELEC[t] = m.electric ? 1 : 0;
    M_ABSORB[t] = m.absorb; M_SAP[t] = m.sap; M_SLIDE[t] = m.slide; M_WIND[t] = m.wind;
    M_RIGID[t] = m.rigid ? 1 : 0; M_BOND[t] = m.bond; M_FRAC[t] = m.fracture;
    m.rgb = m.palette.map(hexToRgb);
  }
  for (let a = 0; a < NT; a++) for (let b = 0; b < NT; b++) {
    KTAB[a * NT + b] = 0.2 * Math.min(MATERIALS[a].conductivity, MATERIALS[b].conductivity);
    const da = MATERIALS[a].density, db = MATERIALS[b].density;
    // 沉降：密度差越大越快，液体越粘越慢（沙在水里 ≈ 0.34，在油里更慢，在熔岩里浮着）
    SINKP[a * NT + b] = MATERIALS[b].state === S_LIQUID && da > db
      ? Math.min(0.9, (da - db) / da * 0.9 + 0.02) * (1 - MATERIALS[b].viscosity) * (1 - MATERIALS[b].viscosity) : 0;
  }
})();

/* ---------------------------------------------------------------------
 * 1.3 反应矩阵（规则的唯一来源）
 *
 * 【接触反应】行 = 主动方，列 = 被接触方；格式「主动方变成 + 对方变成 (每帧每邻格概率)」
 *
 *            │ 熔岩                         │ 火 / 余烬            │ 盐           │ 冰                    │ 石头/砖/混凝土
 *  ──────────┼──────────────────────────────┼──────────────────────┼──────────────┼───────────────────────┼───────────────
 *  水        │ 蒸汽 + 熔岩降温260°C (.3)    │ 水升温 + 火熄灭 (1)  │ 盐水+空(.04) │ 冰+冰(.002，水<4°C时) │ —
 *  盐水      │ 蒸汽 + 熔岩降温260°C (.3)    │ 盐水升温 + 火熄灭(1) │ —            │ 盐水+水 (.012)        │ —
 *  盐        │ —                            │ —                    │ —            │ 空+盐水 (.03)         │ —
 *  酸液      │ 火+熔岩 (1)                  │ —                    │ 溶解 (.02)   │ 溶解 (.02)            │ 溶解 (.0015~.004)
 *
 *  · 酸液 × 可溶物（沙、土、盐、火药、灰、种子、木头、植物、花、炭、冰、TNT、绳子、枯枝）：溶解 (.02)；
 *    每次溶解酸液自身有 50% 被消耗，所以一份酸能溶掉的东西是有限的。玻璃、金属、钢、锚点、克隆体、黑洞不溶。
 *  · 水 × 熔岩不再把整格熔岩瞬间变成石头：熔岩只是被吸走热量，降到 850°C 以下才凝固 → 先结表面硬壳。
 *  · 水 × 火：火焰不再 1:1 吃掉水，水只是升温（烧开了才变蒸汽）。
 *
 * 【含水量】（每格一个 wet 值，100 = 一格水）
 *    水碰到吸水材料（沙、土、木头、植物、灰、火药、种子、炭、绳子、枯枝）：对方变湿，水按量减少（守恒）。
 *    湿的东西超过 100°C 先烘干（吸热、放出水汽），烘干之前点不着 → 泼过水的地方是防火带。
 *    湿的东西暴露在空气里慢慢晾干，水分进入空气湿度场。
 *
 * 【燃烧】燃料 + 热量 + 氧气，缺一个就灭
 *    燃料：每个可燃格有 fuel，烧一帧减一，熄灭时不回补，烧完变成炭 / 灰。
 *    热量：贴着水的燃烧格每帧被吸走 150°C，降到燃点以下即熄灭，留下焦黑、潮湿的残骸并冒白烟。
 *    氧气：燃烧要消耗相邻空气格的氧（空气格的 aux = 浑浊度），浑浊度在空气里扩散；
 *          四周没有空气、或空气已经耗尽的火会闷熄。密闭空间里的火会自己把氧气烧光。
 *    木头(300°C) → 火 + 炭 → 炭(380°C)阴燃 → 灰        植物(230°C)/花/种子/枯枝(170°C)/绳子 → 火 + 灰
 *    油(220°C) → 大火 + 烟；油火遇水：水瞬间汽化，把燃烧的油崩成飞溅的火滴
 *    火药(170°C，受潮不燃) → 2 帧后小爆炸      TNT(240°C) → 60 帧引信后爆炸
 *
 * 【温度相变】
 *    冰 ──>0°C 且吸够潜热──> 水 ──>100°C──> 蒸汽 ──<85°C──> 水汽（湿度场）──高空饱和──> 云 ──> 雨 / 雪
 *    雪 ──>0.5°C 且吸够潜热──> 水      蒸汽碰到 <50°C 的固体表面 → 直接凝成水珠
 *    盐水 ──>104°C──> 蒸汽     盐水 ──<-18°C──> 冰
 *    沙 ──>1450°C──> 玻璃      石头 ──>1250°C──> 熔岩 ──<850°C──> 石头
 *
 * 【植物】种子(湿土+光+空间) → 幼苗 → 成株(受株高基因限制) → 开花 → 落种 → 老化 → 枯枝 → 腐烂成土
 *    生长每格消耗 0.14 格水（从茎里的水分或根部的湿土 / 水里取），没水、没光、太挤都不长。
 *
 * 【其他】
 *    电火花 / 带电导体 × 可燃物：给对方加热 250~300°C      电火花 × 金属 / 钢 / 水 / 盐水：注入电荷
 *    克隆体、黑洞：非物理元素，是场景的外部输入 / 输出
 * ------------------------------------------------------------------- */
const ACID_SOLUBLE = [SAND, SOIL, SALT, GUNPOWDER, ASH, SEED, WOOD, PLANT, FLOWER, CHARCOAL, ICE, TNT, ROPE, DEADPLANT];

// { a, b, p, a2, b2, use(主动方被消耗概率), maxT(主动方温度上限), aT/bT(产物温度), aDT/bDT(温度变化), tag }
const RULES = [
  { a: WATER, b: LAVA, p: 0.3, a2: STEAM, b2: LAVA, aT: 160, bDT: -260, tag: 'hiss' },
  { a: SALTWATER, b: LAVA, p: 0.3, a2: STEAM, b2: LAVA, aT: 160, bDT: -260, tag: 'hiss' },
  { a: WATER, b: FIRE, p: 1, a2: WATER, b2: EMPTY, aDT: 12, tag: 'hiss' },
  { a: SALTWATER, b: FIRE, p: 1, a2: SALTWATER, b2: EMPTY, aDT: 12, tag: 'hiss' },
  { a: WATER, b: EMBER, p: 1, a2: WATER, b2: EMPTY, aDT: 6 },
  { a: SALTWATER, b: EMBER, p: 1, a2: SALTWATER, b2: EMPTY, aDT: 6 },
  { a: WATER, b: SALT, p: 0.04, a2: SALTWATER, b2: EMPTY },
  { a: WATER, b: ICE, p: 0.002, a2: ICE, b2: ICE, maxT: 4, aT: -4 },
  { a: SALT, b: ICE, p: 0.03, a2: EMPTY, b2: SALTWATER, bT: 1 },
  { a: SALTWATER, b: ICE, p: 0.012, a2: SALTWATER, b2: WATER, bT: 1 },
  { a: ACID, b: LAVA, p: 1, a2: FIRE, b2: LAVA, aT: 900 },
  { a: ACID, b: STONE, p: 0.0015, a2: ACID, b2: EMPTY, use: 0.5 },
  { a: ACID, b: BRICK, p: 0.004, a2: ACID, b2: EMPTY, use: 0.5 },
  { a: ACID, b: CONCRETE, p: 0.003, a2: ACID, b2: EMPTY, use: 0.5 },
];
for (const s of ACID_SOLUBLE) RULES.push({ a: ACID, b: s, p: 0.02, a2: ACID, b2: EMPTY, use: 0.5 });

const RX = new Array(NT * NT).fill(null);
const HASRX = new Uint8Array(NT);
for (const r of RULES) { RX[r.a * NT + r.b] = r; HASRX[r.a] = 1; }

/* ---------------------------------------------------------------------
 * 1.4 环境（天气、昼夜）与全局统计
 * ------------------------------------------------------------------- */
const DAY_STEPS = 36000;   // 时间流速 1x 时，一昼夜 = 10 分钟模拟时间
const env = {
  structure: true,         // 结构力学开关
  dayNight: true,          // 关掉后恒为正午、气温恒为 env.temp（自测用）
  time: 0.8,               // 0 = 午夜，0.25 = 日出，0.5 = 正午，0.75 = 日落
  timeScale: 1,            // 0 / 1 / 10 / 60
  wind: 0.2,               // 风向与相对强度：-1（向左）.. 1（向右）
  windPower: 0.3,          // 风力 0..1
  moistIn: 0,              // 高空外来水汽（天气预设用；属于外部输入）
  cloudFade: 0,            // 晴天时云的消散速率（外部输出）
  temp: AMBIENT,           // 全局气温
  weather: 'clear', storm: 0,
  sun: 1, el: 1, ambient: AMBIENT,
  // 水量账本（单位：格水）
  waterIn: 0, waterOut: 0, waterSink: 0,
  rainCount: 0, snowCount: 0, strikes: 0, charge: 0,
};

/* ---------------------------------------------------------------------
 * 1.5 网格与分块
 * ------------------------------------------------------------------- */
const F_PAR = 1, F_BURN = 2, F_SCORCH = 4, F_TIP = 8, F_BODY = 16, F_PIN = 32, F_FALL = 0xC0;   // flags 位
const F_SAVE = F_BURN | F_SCORCH | F_TIP;
const STALE_MAX = 200;     // 空气浑浊度到这个值就不够支持燃烧了

let W = 0, H = 0, N = 0;
let type, seed, flags, charge, chargeE, life, temp;
let wet;                   // 含水量（非空格）
let aux;                   // 空气格：浑浊度（缺氧程度）；刚性固体：结构完整度；土：养分
let fuel;                  // 可燃格剩余燃料（帧）
let CW = 0, CHN = 0, chunkTTL, chunkCount;
let parity = 0, tick = 0;
let gravity = 'down', gx = 0, gy = 1, lx = 1, ly = 0;
let sceneDirty = true;     // 渲染端需要整张重传
let structDirty = true;    // 有刚性固体被增删或削弱，需要重新做支撑检测

function allocGrid(w, h) {
  W = w; H = h; N = w * h;
  type = new Uint8Array(N); seed = new Uint8Array(N); flags = new Uint8Array(N);
  charge = new Uint8Array(N); chargeE = new Uint8Array(N);
  wet = new Uint8Array(N); aux = new Uint8Array(N); fuel = new Uint16Array(N);
  life = new Uint16Array(N); temp = new Float32Array(N).fill(env.temp);
  CW = Math.ceil(w / CHUNK); CHN = Math.ceil(h / CHUNK);
  chunkTTL = new Uint8Array(CW * CHN); chunkCount = new Uint16Array(CW * CHN);
  elecCount = 0; fpClear(); exClear(); bodiesClear(); allocStruct(); allocWeather();
  wakeAll();
}

function clearGrid() {
  type.fill(0); seed.fill(0); flags.fill(0); charge.fill(0); chargeE.fill(0); life.fill(0); temp.fill(env.temp);
  wet.fill(0); aux.fill(0); fuel.fill(0);
  elecCount = 0; fpClear(); exClear(); bodiesClear(); clearWeather();
  env.waterIn = env.waterOut = env.waterSink = 0; env.rainCount = env.snowCount = env.strikes = 0; env.charge = 0;
  structDirty = true;
  wakeAll();
}

function wakeAll() { chunkTTL.fill(WAKE_TTL); sceneDirty = true; }

function inb(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }

function wake(x, y) {
  const cx = x >> 5, cy = y >> 5, c = cx + cy * CW, ax = x & 31, ay = y & 31;
  chunkTTL[c] = WAKE_TTL;
  if (ax === 0) { if (cx > 0) chunkTTL[c - 1] = WAKE_TTL; }
  else if (ax === 31) { if (cx < CW - 1) chunkTTL[c + 1] = WAKE_TTL; }
  if (ay === 0) { if (cy > 0) chunkTTL[c - CW] = WAKE_TTL; }
  else if (ay === 31) { if (cy < CHN - 1) chunkTTL[c + CW] = WAKE_TTL; }
}

function initLife(t) {
  const a = M_LIFE0[t];
  return a ? a + rndi(M_LIFE1[t] - a + 1) : 0;
}

// 燃料量：爆炸物的 burnTime 是引信（放在 life 里），其余可燃物是能烧多少帧
function initFuel(t) {
  const bt = M_BURNTIME[t];
  return bt && !M_BLAST[t] ? Math.max(1, (bt * (0.7 + rnd() * 0.6)) | 0) : 0;
}

// 新生成一个粒子（笔刷、克隆、喷发等）
function put(i, t, x, y) {
  const old = type[i];
  if (M_RIGID[t] | M_RIGID[old]) structDirty = true;
  type[i] = t; seed[i] = rndi(256); temp[i] = M_SPAWN[t];
  life[i] = t === PLANT ? rndi(150) : initLife(t);      // 植物的 life 是年龄：起始年龄随机，免得整片同时老死
  flags[i] = parity | (t === SPARK ? F_TIP : 0); charge[i] = 0;
  wet[i] = t === PLANT ? 60 : 0; fuel[i] = initFuel(t);
  aux[i] = M_RIGID[t] ? 255 : t === SOIL ? 200 : (AIRLIKE[t] && AIRLIKE[old]) ? aux[i] : 0;   // 火焰和烟继承所在空气格的浑浊度
  wake(x, y);
}

// 清成空气，保留该格温度
function clearCell(i, x, y) {
  const old = type[i];
  if (M_RIGID[old]) structDirty = true;
  type[i] = 0; life[i] = 0; flags[i] = parity; charge[i] = 0; wet[i] = 0; fuel[i] = 0;
  if (!AIRLIKE[old]) aux[i] = 0;                     // 火焰 / 烟消失后，这格空气的浑浊度留着
  wake(x, y);
}

// 原地变成另一种材料，保留 seed、温度和含水量
function morph(i, t, x, y) {
  if (t === EMPTY) { clearCell(i, x, y); return; }
  const o = type[i];
  if (M_RIGID[t] | M_RIGID[o]) structDirty = true;
  type[i] = t; life[i] = initLife(t); flags[i] = (flags[i] & F_SCORCH) | parity;
  fuel[i] = initFuel(t);
  aux[i] = M_RIGID[t] ? (M_RIGID[o] ? aux[i] >> 1 : 255) : t === SOIL ? 255 : (AIRLIKE[t] && AIRLIKE[o]) ? aux[i] : 0;
  if (wet[i] > M_ABSORB[t]) wet[i] = M_ABSORB[t];
  wake(x, y);
}

function swapCells(i, j, x, y, nx, ny) {
  let a = type[i]; type[i] = type[j]; type[j] = a;
  a = seed[i]; seed[i] = seed[j]; seed[j] = a;
  a = life[i]; life[i] = life[j]; life[j] = a;
  a = wet[i]; wet[i] = wet[j]; wet[j] = a;
  a = aux[i]; aux[i] = aux[j]; aux[j] = a;
  a = fuel[i]; fuel[i] = fuel[j]; fuel[j] = a;
  const fi = flags[i], fj = flags[j];
  flags[i] = (fj & ~F_PAR) | parity; flags[j] = (fi & ~F_PAR) | parity;
  const tf = temp[i]; temp[i] = temp[j]; temp[j] = tf;
  wake(x, y); wake(nx, ny);
}

function setGravity(dir) {
  gravity = dir;
  if (dir === 'down') { gx = 0; gy = 1; lx = 1; ly = 0; }
  else if (dir === 'up') { gx = 0; gy = -1; lx = 1; ly = 0; }
  else if (dir === 'left') { gx = -1; gy = 0; lx = 0; ly = 1; }
  else { gx = 1; gy = 0; lx = 0; ly = 1; }
  structDirty = true;
  if (chunkTTL) wakeAll();
}

// 每步统计，供音效和调试面板使用
const st = { powder: 0, liquid: 0, fire: 0, hiss: 0, elec: 0, boom: 0, boil: 0, rain: 0, crash: 0 };
// 模拟 → 表现层的回调（爆炸闪光、震动、音效）
let onBoom = null, onThunder = null, onCrash = null;

// 涟漪事件（只给渲染用）：最近 8 次有东西砸进液面的位置
const ripples = new Float32Array(8 * 3);
let rippleHead = 0;
function addRipple(x, y) {
  const o = rippleHead * 3;
  ripples[o] = x; ripples[o + 1] = y; ripples[o + 2] = tick;
  rippleHead = (rippleHead + 1) & 7;
}

/* =====================================================================
 * 2. 模拟
 * ===================================================================== */
const DX4 = [1, -1, 0, 0], DY4 = [0, 0, 1, -1];
const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];

/* ---------------------------------------------------------------------
 * 2.1 运动：粉末 / 液体 / 气体。方向全部用重力向量 g 和侧向向量 l 表达，
 *     四个重力方向共用同一份代码。
 *     惯性的做法：连续下落会加速（每步最多 4 格）；高速砸到东西时，
 *     粒子（或被它挤开的液体）转成带浮点位置和速度的飞行粒子弹出去 → 飞溅、反弹。
 * ------------------------------------------------------------------- */
function windPush(x, y, i, t, k) {
  const wv = windX[(x >> 3) + (y >> 3) * GW];
  if (wv !== 0 && rnd() < (wv < 0 ? -wv : wv) * k) {
    const nx = x + (wv > 0 ? 1 : -1);
    if (nx >= 0 && nx < W && type[nx + y * W] === 0) { swapCells(i, nx + y * W, x, y, nx, y); return true; }
  }
  return false;
}

function foamAt(x, y) {
  for (let k = -1; k <= 1; k++) {
    const nx = x - gx + lx * k, ny = y - gy + ly * k;
    if (inb(nx, ny) && type[nx + ny * W] === 0) { put(nx + ny * W, FOAM, nx, ny); return; }
  }
}

// 高速砸进液面：被挤上来的那格液体变成水花飞出去，液面起涟漪和泡沫
function splash(x, y, i, liquid) {
  addRipple(x, y);
  if (fpCount < FP_MAX - 200 && rnd() < 0.6) {
    spawnFree(liquid, x + 0.5, y + 0.5,
              lx * (rnd() - 0.5) * 2.6 - gx * (1 + rnd() * 1.6), ly * (rnd() - 0.5) * 2.6 - gy * (1 + rnd() * 1.6),
              temp[i], seed[i]);
    clearCell(i, x, y);
  }
  if (liquid !== LAVA && liquid !== OIL && rnd() < 0.3) foamAt(x, y);
}

function movePowder(x, y, i, t) {
  let sp = flags[i] >> 6;                    // 连续下落帧数 → 每步多走几格
  if (t === SNOW) { sp = 0; if (rnd() < 0.45) { wake(x, y); return; } }   // 雪飘得慢
  let cx = x, cy = y, ci = i, moved = 0;
  const base = t * NT;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (o !== 0) {
      const so = M_STATE[o];
      if (so < S_LIQUID) break;
      if (so === S_LIQUID) {                 // 沉降速度看密度差和粘度；比液体轻就浮着
        const p = SINKP[base + o];
        if (p > 0) {
          if (rnd() < p) {
            swapCells(ci, j, cx, cy, nx, ny);
            if (sp >= 2) splash(cx, cy, ci, o);
            ci = j; cx = nx; cy = ny; moved = 2;
          } else wake(cx, cy);
        }
        break;
      }
    }
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny; moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.powder++;
    const ux = x - gx, uy = y - gy;          // 原来压在它上面的如果是刚性固体，支撑关系可能变了
    if (ux >= 0 && ux < W && uy >= 0 && uy < H && M_RIGID[type[ux + uy * W]]) structDirty = true;
    if (moved === 1 && M_WIND[t] > 0) windPush(cx, cy, ci, t, M_WIND[t]);
    return;
  }
  if (sp) {
    flags[i] &= ~F_FALL;
    const ux = x - gx, uy = y - gy;
    if (sp === 3 && wet[i] <= 60 && fpCount < FP_MAX - 400 && rnd() < 0.12 &&
        ux >= 0 && ux < W && uy >= 0 && uy < H && type[ux + uy * W] === 0) {       // 高速落地、头顶是空的：弹起来
      const d = rnd() < 0.5 ? 1 : -1, v = 0.5 + rnd();
      spawnFree(t, x + 0.5, y + 0.5, lx * d * v - gx * (0.6 + rnd() * 0.8), ly * d * v - gy * (0.6 + rnd() * 0.8), temp[i], seed[i]);
      clearCell(i, x, y);
      return;
    }
  }
  // 滑落：侧下方要有 need 格深的落差才滑。松散粉末 1 格（约 45°），土 2 格（更陡），湿沙 4 格（近乎直立）
  const need = wet[i] > 60 ? 4 : M_SLIDE[t];
  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {
    const dd = s ? -d : d;
    let ok = true, j1 = -1, x1 = 0, y1 = 0;
    for (let k = 1; k <= need; k++) {
      const nx = x + gx * k + lx * dd, ny = y + gy * k + ly * dd;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) { ok = false; break; }
      const j = nx + ny * W, o = type[j];
      if (k === 1) {
        if (!(o === 0 || M_STATE[o] >= S_GAS || rnd() < SINKP[base + o] * 0.7)) { ok = false; break; }
        j1 = j; x1 = nx; y1 = ny;
      } else if (!(o === 0 || M_STATE[o] >= S_LIQUID)) { ok = false; break; }
    }
    if (ok) { swapCells(i, j1, x, y, x1, y1); st.powder++; return; }
  }
}

// 液体能否沿重力方向挤进 o：空气、气体、更轻的液体、更轻的粉末（让灰浮上来）
function liquidCanSink(t, o) {
  if (o === 0) return true;
  const so = M_STATE[o];
  if (so >= S_GAS) return true;
  if (so === S_LIQUID) return M_DENS[t] > M_DENS[o] && rnd() < 0.6;
  if (so === S_POWDER) return M_DENS[t] > M_DENS[o] && rnd() < 0.3;
  return false;
}

function moveLiquid(x, y, i, t) {
  const sp = flags[i] >> 6, visc = M_VISC[t];
  if (visc > 0.5 && rnd() < visc * 0.3) { wake(x, y); return; }       // 很粘：这一帧整个不动
  let cx = x, cy = y, ci = i, moved = 0;
  for (let s = 0; s <= sp; s++) {
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const j = nx + ny * W, o = type[j];
    if (!liquidCanSink(t, o)) break;
    const dense = o !== 0 && M_STATE[o] < S_GAS;
    swapCells(ci, j, cx, cy, nx, ny); ci = j; cx = nx; cy = ny;
    if (dense) { moved = 2; break; }
    moved = 1;
  }
  if (moved) {
    flags[ci] = (flags[ci] & ~F_FALL) | (moved === 1 ? (sp < 3 ? sp + 1 : 3) << 6 : 0);
    st.liquid++;
    if (moved === 1 && sp > 0 && visc < 0.3) windPush(cx, cy, ci, t, 0.5);   // 雨被风吹斜
    return;
  }
  if (sp) {
    flags[i] &= ~F_FALL;
    if (sp === 3 && visc < 0.5) {            // 高速落地
      const bx = x + gx, by = y + gy;
      const b = bx >= 0 && bx < W && by >= 0 && by < H ? type[bx + by * W] : STONE;
      if (M_STATE[b] === S_LIQUID) { addRipple(x, y); if (rnd() < 0.35) foamAt(x, y); }
      else if (fpCount < FP_MAX - 400 && rnd() < 0.25) {             // 砸在硬东西上：溅开
        const d = rnd() < 0.5 ? 1 : -1, v = 0.6 + rnd() * 1.2;
        spawnFree(t, x + 0.5, y + 0.5, lx * d * v - gx * (0.4 + rnd() * 0.9), ly * d * v - gy * (0.4 + rnd() * 0.9), temp[i], seed[i]);
        clearCell(i, x, y);
        return;
      }
    }
  }
  if (visc > 0 && rnd() < visc) return;      // 粘：这一帧不侧流

  const d = rnd() < 0.5 ? 1 : -1;
  for (let s = 0; s < 2; s++) {              // 斜下
    const dd = s ? -d : d;
    const nx = x + gx + lx * dd, ny = y + gy + ly * dd;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (liquidCanSink(t, type[j])) { swapCells(i, j, x, y, nx, ny); st.liquid++; return; }
  }
  const disp = M_DISP[t];
  for (let s = 0; s < 2; s++) {              // 侧向扩散：找得到落差才一定流，否则只是偶尔漂一下（水面能静下来）
    const dd = s ? -d : d;
    let best = -1, bx = 0, by = 0, drop = false;
    for (let k = 1; k <= disp; k++) {
      const nx = x + lx * dd * k, ny = y + ly * dd * k;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
      const j = nx + ny * W, o = type[j];
      if (o !== 0 && M_STATE[o] < S_GAS) break;
      best = j; bx = nx; by = ny;
      const ux = nx + gx, uy = ny + gy;
      if (ux >= 0 && ux < W && uy >= 0 && uy < H) {
        const u = type[ux + uy * W];
        if (u === 0 || M_STATE[u] >= S_GAS || (M_STATE[u] === S_LIQUID && M_DENS[u] < M_DENS[t])) { drop = true; break; }
      }
    }
    if (best >= 0 && (drop || rnd() < 0.2)) { swapCells(i, best, x, y, bx, by); st.liquid++; return; }
  }
}

// 气体永远逆着重力走；会被风吹斜；能从液体里冒泡上去
function moveGas(x, y, i, t) {
  if (t === SMOKE && rnd() < 0.3) return;
  if (windPush(x, y, i, t, M_WIND[t] * 0.9)) return;
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
    const j = nx + ny * W, o = type[j];
    if (o === 0 || (M_STATE[o] === S_LIQUID && rnd() < 0.3) ||
        (M_STATE[o] === S_GAS && M_DENS[o] > M_DENS[t] && rnd() < 0.3)) {
      swapCells(i, j, x, y, nx, ny);
      return;
    }
  }
  const d = rnd() < 0.5 ? 1 : -1;
  nx = x + lx * d; ny = y + ly * d;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === 0) swapCells(i, nx + ny * W, x, y, nx, ny);
}

/* ---------------------------------------------------------------------
 * 2.2 燃烧：燃料 + 热量 + 氧气
 * ------------------------------------------------------------------- */
// 旁边有没有还能支持燃烧的空气
function hasOxygen(x, y) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (AIRLIKE[type[j]] && aux[j] < STALE_MAX) return true;
  }
  return false;
}

function ignite(i, t, x, y) {
  flags[i] = (flags[i] | F_BURN) & ~F_TIP;
  if (M_BLAST[t]) life[i] = M_BURNTIME[t];           // 引信
  else if (fuel[i] === 0) fuel[i] = initFuel(t);     // 只有从没装过燃料的才装；熄灭后剩多少就是多少
  wake(x, y);
}

function emitFlame(x, y, t) {
  const r = rndi(3) - 1;
  let nx = x - gx + lx * r, ny = y - gy + ly * r;
  if (!(inb(nx, ny) && type[nx + ny * W] === 0)) {
    const k = rndi(4);
    nx = x + DX4[k]; ny = y + DY4[k];
    if (!(inb(nx, ny) && type[nx + ny * W] === 0)) return;
  }
  const j = nx + ny * W;
  put(j, FIRE, nx, ny);
  if (M_FLAME[t] > 0.3) life[j] += 18;       // 油：火焰更大
}

// kind：0 白烟（湿的东西 / 刚被浇灭），1 灰烟，2 黑烟（缺氧）
function emitSmoke(x, y, kind) {
  let nx = x - gx, ny = y - gy;
  if (!(inb(nx, ny) && type[nx + ny * W] === 0)) {
    const k = rndi(4);
    nx = x + DX4[k]; ny = y + DY4[k];
    if (!(inb(nx, ny) && type[nx + ny * W] === 0)) return;
  }
  const j = nx + ny * W;
  put(j, SMOKE, nx, ny);
  seed[j] = kind === 0 ? rndi(50) : kind === 1 ? 90 + rndi(60) : 200 + rndi(56);
}

// 返回 true 表示这一格已经变成别的东西
function burnStep(x, y, i, t, T) {
  wake(x, y);
  if (M_BLAST[t]) {                          // 爆炸物：F_BURN 表示引信在烧
    const L = life[i];
    if (L > 1) { life[i] = L - 1; return false; }
    clearCell(i, x, y); startExplosion(x, y, M_BLAST[t], M_BPOW[t]);
    return true;
  }
  let airJ = -1, airStale = 255, wetJ = -1, wx = 0, wy = 0;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (AIRLIKE[o]) { const s = aux[j]; if (s < airStale) { airStale = s; airJ = j; } }      // 空气，或者被火苗 / 烟占着的空气
    else if (o === WATER || o === SALTWATER) { wetJ = j; wx = nx; wy = ny; }
  }
  if (wetJ >= 0) {
    st.hiss++;
    if (t === OIL) {                         // 油火遇水：水瞬间汽化，把燃烧的油崩成飞溅的火滴
      if (rnd() < 0.25) {
        morph(wetJ, STEAM, wx, wy); temp[wetJ] = 160;
        if (fpCount < FP_MAX - 100) {
          spawnFree(OIL, x + 0.5, y + 0.5, lx * (rnd() - 0.5) * 3.2 - gx * (1.5 + rnd() * 2), ly * (rnd() - 0.5) * 3.2 - gy * (1.5 + rnd() * 2), 700, seed[i]);
          clearCell(i, x, y);
          return true;
        }
      }
    } else {                                 // 水吸热、汽化；降到燃点以下就熄灭
      T -= 150; temp[i] = T;
      if (rnd() < 0.5) { morph(wetJ, STEAM, wx, wy); temp[wetJ] = 160; }
      else temp[wetJ] += 25;
      if (T < M_IGN[t]) {
        flags[i] = (flags[i] & ~F_BURN) | F_SCORCH;
        emitSmoke(x, y, 0);
        return false;
      }
    }
  }
  if (airJ < 0 || airStale >= STALE_MAX) {          // 缺氧：不放热、不耗燃料，很快闷熄
    if (rnd() < 0.12) { flags[i] = (flags[i] & ~F_BURN) | F_SCORCH; if (rnd() < 0.5) emitSmoke(x, y, 2); }
    return false;
  }
  aux[airJ] = airStale + 3 > 255 ? 255 : airStale + 3;                    // 消耗氧气
  for (let k = 0; k < 4; k++) {                                           // 火焰直接烘烤贴着的可燃物
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (M_FLAM[type[j]] > 0 && !(flags[j] & F_BURN)) { temp[j] += 6; wake(nx, ny); }
  }
  const bt = M_BURNTEMP[t];
  if (T < bt) temp[i] = T + (bt - T) * 0.25;           // 燃烧放热
  if (rnd() < M_FLAME[t]) emitFlame(x, y, t);
  if (rnd() < 0.012) {                                 // 偶尔迸出一粒余烬，随风飘去点燃别处
    const ex = x - gx, ey = y - gy;
    if (ex >= 0 && ex < W && ey >= 0 && ey < H && type[ex + ey * W] === 0) put(ex + ey * W, EMBER, ex, ey);
  }
  if (rnd() < (airStale > 90 ? 0.06 : 0.012)) emitSmoke(x, y, airStale > 90 ? 2 : 1);   // 越缺氧烟越黑越浓
  const a = aux[i];
  if (M_RIGID[t] && a > 0) {                           // 烧焦的木头越来越不结实
    aux[i] = a > 2 ? a - 2 : 0;
    if (a >= 70 && a - 2 < 70) structDirty = true;
  }
  const F = fuel[i];
  if (F > 1) { fuel[i] = F - 1; return false; }
  // 燃料烧完
  if (rnd() < M_RESIDUE[t]) morph(i, M_BURNINTO[t], x, y);
  else put(i, FIRE, x, y);
  return true;
}

/* ---------------------------------------------------------------------
 * 2.3 植物：基因来自 seed 字节，整株共用
 *     低 4 位：株高上限 8~32 格；4-5 位：分叉概率；6-7 位：叶片密度
 * ------------------------------------------------------------------- */
function geneHeight(g) { return 8 + (((g & 15) * 1.6) | 0); }
function geneBranch(g) { return 0.05 + ((g >> 4) & 3) * 0.05; }
function geneLeaf(g) { return 0.3 + ((g >> 6) & 3) * 0.13; }

// 头顶 14 格内有没有被固体挡住，或者被别的枝叶遮得太厉害
function skyOpen(x, y) {
  let leaves = 0;
  for (let k = 1; k <= 14; k++) {
    const nx = x - gx * k, ny = y - gy * k;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) return true;
    const o = type[nx + ny * W];
    if (o === PLANT || o === FLOWER) { if (++leaves > 7) return false; }
    else if (o !== 0 && M_STATE[o] < S_LIQUID) return false;
  }
  return true;
}

function biomass(x, y, r) {
  let n = 0;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H && type[nx + ny * W] === PLANT) n++;
  }
  return n;
}

// 离地多高：顺着重力往下数，穿过空气和枝叶，直到碰到别的东西
function stemHeight(x, y) {
  let n = 0;
  for (let k = 1; k <= 48; k++) {
    const nx = x + gx * k, ny = y + gy * k;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) break;
    const o = type[nx + ny * W];
    if (o !== 0 && o !== PLANT && o !== FLOWER) break;
    n++;
  }
  return n;
}

// 生长要用水：先从茎里的水分取，取不到就顺着茎往下找到根，从脚下的湿土或旁边的水里取。取不到就不长。
function drawSap(x, y, need) {
  let cx = x, cy = y;
  for (let n = 0; n < 50; n++) {
    const c = cx + cy * W;
    if (wet[c] >= need) { wet[c] -= need; env.waterSink += need / 100; return true; }
    const nx = cx + gx, ny = cy + gy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) return false;
    if (type[nx + ny * W] === PLANT) { cx = nx; cy = ny; continue; }
    let found = false;
    for (let d = -1; d <= 1; d += 2) {
      const ax = nx + lx * d, ay = ny + ly * d;
      if (ax >= 0 && ax < W && ay >= 0 && ay < H && type[ax + ay * W] === PLANT) { cx = ax; cy = ay; found = true; break; }
    }
    if (found) continue;
    const b = nx + ny * W, o = type[b];
    if ((o === SOIL || o === SAND) && wet[b] >= need) { wet[b] -= need; env.waterSink += need / 100; return true; }
    for (let k = 0; k < 4; k++) {
      const wx = cx + DX4[k], wy = cy + DY4[k];
      if (wx < 0 || wx >= W || wy < 0 || wy >= H || type[wx + wy * W] !== WATER) continue;
      if (rnd() * 100 < need) clearCell(wx + wy * W, wx, wy);
      env.waterSink += need / 100;
      return true;
    }
    return false;
  }
  return false;
}

function bloom(x, y, i) {
  flags[i] &= ~F_TIP;
  const g = seed[i], dens = geneLeaf(g);
  for (let k = 0; k < 8; k++) {                      // 展叶：每片叶子也要水
    const nx = x + DX8[k], ny = y + DY8[k];
    if (!inb(nx, ny) || type[nx + ny * W] !== 0 || rnd() > dens) continue;
    if (!drawSap(x, y, 6)) break;
    const j = nx + ny * W;
    put(j, PLANT, nx, ny); seed[j] = g; wet[j] = 10;
  }
}

function growTip(x, y, i) {
  const e = life[i];
  if (e <= 0) { bloom(x, y, i); return; }
  if (env.sun < 0.12 || !skyOpen(x, y)) return;       // 没光不长
  const g = seed[i];
  if (stemHeight(x, y) >= geneHeight(g)) { life[i] = 0; return; }   // 到株高上限了：停止长高，展叶
  const side = rnd() < 0.3 ? (rnd() < 0.5 ? 1 : -1) : 0;
  const alt = rnd() < 0.5 ? 1 : -1;
  for (let a = 0; a < 3; a++) {
    const sd = a === 0 ? side : a === 1 ? (side === 0 ? alt : 0) : (side === 0 ? -alt : -side);
    const nx = x - gx + lx * sd, ny = y - gy + ly * sd;
    if (!inb(nx, ny)) continue;
    const j = nx + ny * W, o = type[j];
    if (!(o === 0 || M_STATE[o] === S_GAS)) continue;
    if (biomass(nx, ny, 3) > 26) { life[i] = 0; return; }   // 太挤：不再长高
    if (!drawSap(x, y, 14)) return;                         // 没水：等着
    put(j, PLANT, nx, ny); flags[j] |= F_TIP; life[j] = e - 1; seed[j] = g; wet[j] = 10;
    flags[i] &= ~F_TIP; life[i] = 0;
    if (e > 4 && rnd() < geneBranch(g)) {                   // 分叉
      const bs = rnd() < 0.5 ? 1 : -1;
      const bx = x + lx * bs - gx, by = y + ly * bs - gy;
      if (inb(bx, by) && type[bx + by * W] === 0 && drawSap(x, y, 14)) {
        const bj = bx + by * W;
        put(bj, PLANT, bx, by); flags[bj] |= F_TIP; life[bj] = (e >> 1) + 1; seed[bj] = g; wet[bj] = 10;
      }
    }
    return;
  }
  life[i] = 0;                                              // 被挡住：直接展叶
}

function sprout(i, x, y) {
  if (M_RIGID[type[i]]) structDirty = true;
  type[i] = PLANT; flags[i] = parity | F_TIP; life[i] = geneHeight(seed[i]); wet[i] = 30; fuel[i] = initFuel(PLANT); aux[i] = 0;
  wake(x, y);
}

/* ---------------------------------------------------------------------
 * 2.4 特殊材料钩子（返回 true 表示这一格已经处理完）
 * ------------------------------------------------------------------- */
// 火焰和余烬舔到可燃物会把它烤热：火苗被风吹到哪边，火就往哪边蔓延
function scorchNeighbors(x, y, heat) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (M_FLAM[type[j]] > 0 && !(flags[j] & (F_BURN | F_BODY))) { temp[j] += heat; wake(nx, ny); }
  }
}
function hookFire(x, y, i) { if (temp[i] < 700) temp[i] = 700; st.fire++; scorchNeighbors(x, y, 16); return false; }
function hookEmber(x, y, i) { if (temp[i] < 600) temp[i] = 600; scorchNeighbors(x, y, 22); return false; }

function hookLava(x, y, i) {
  if (rnd() < 0.002) {                               // 偶尔迸出余烬
    const nx = x - gx, ny = y - gy;
    if (inb(nx, ny) && type[nx + ny * W] === 0) put(nx + ny * W, EMBER, nx, ny);
  }
  return false;
}

// 水把贴着的吸水材料打湿，自己按量减少（100 单位含水量 = 一格水）
function hookWater(x, y, i) {
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) continue;
    if (temp[j] > 120 && M_STATE[o] < S_LIQUID) { temp[j] -= 30; temp[i] += 8; wake(x, y); wake(nx, ny); }   // 水贴着高温的东西：把热量带走（自己会被烧开）
    const cap = M_ABSORB[o];
    if (cap === 0) continue;
    const w = wet[j];
    if (w >= cap || (flags[j] & F_BODY)) continue;
    wake(x, y);
    if (rnd() < 0.2) {
      const add = cap - w < 34 ? cap - w : 34;
      wet[j] = w + add;
      if (w <= 60 && w + add > 60) wake(nx, ny);
      if (rnd() * 100 < add) { clearCell(i, x, y); return true; }
    }
  }
  return false;
}

// 蒸汽碰到冷的表面直接凝成水珠
function hookSteam(x, y, i) {
  if (rnd() > 0.25) return false;
  const k = rndi(4), nx = x + DX4[k], ny = y + DY4[k];
  if (nx < 0 || nx >= W || ny < 0 || ny >= H) return false;
  const j = nx + ny * W, o = type[j];
  if (o !== 0 && M_STATE[o] < S_LIQUID && temp[j] < 50 && rnd() < 0.3) {
    type[i] = WATER; life[i] = 0; flags[i] = parity; temp[i] = 60;
    wake(x, y);
    return true;
  }
  return false;
}

// 泡沫：浮在液面上不动，脚下空了才往下掉
function hookFoam(x, y, i) {
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H && type[bx + by * W] === 0) swapCells(i, bx + by * W, x, y, bx, by);
  return true;
}

function hookPlant(x, y, i) {
  if (flags[i] & F_TIP) { wake(x, y); if (rnd() < 0.06) growTip(x, y, i); return false; }
  const bx = x + gx, by = y + gy;
  if (bx >= 0 && bx < W && by >= 0 && by < H && type[bx + by * W] === 0) {
    for (let k = 0; k < 8; k++) {                    // 周围没有任何支撑才会落下
      const nx = x + DX8[k], ny = y + DY8[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && M_STATE[o] < S_LIQUID) return false;
    }
    swapCells(i, bx + by * W, x, y, bx, by);
    return true;
  }
  return false;
}

function hookClone(x, y, i) {
  let src = life[i];
  const k0 = rndi(4);
  if (!src) {                                          // 还没记住任何材料：锁定第一个碰到的
    for (let k = 0; k < 4; k++) {
      const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const o = type[nx + ny * W];
      if (o !== 0 && o !== CLONE && o !== VOID && o !== ANCHOR && !(flags[nx + ny * W] & F_BODY)) { src = o; break; }
    }
    if (!src) return false;
    life[i] = src;
  }
  wake(x, y);
  if (rnd() >= 0.1) return false;
  for (let k = 0; k < 4; k++) {
    const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    if (type[nx + ny * W] === 0) { put(nx + ny * W, src, nx, ny); return false; }
  }
  return false;
}

function hookVoid(x, y, i) {
  wake(x, y);
  for (let n = 0; n < 10; n++) {
    const dx = rndi(11) - 5, dy = rndi(11) - 5, d2 = dx * dx + dy * dy;
    if (d2 === 0 || d2 > 25) continue;
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    const j = px + py * W, o = type[j];
    if (o === 0 || o === VOID || o === ANCHOR || (flags[j] & F_BODY)) continue;
    if (d2 <= 2) { clearCell(j, px, py); continue; }
    if (rnd() < 0.6) {
      let sx = dx > 0 ? -1 : dx < 0 ? 1 : 0, sy = dy > 0 ? -1 : dy < 0 ? 1 : 0;
      const adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
      if (adx > 2 * ady) sy = 0; else if (ady > 2 * adx) sx = 0;
      const qx = px + sx, qy = py + sy, q = qx + qy * W, qt = type[q];
      if (qt === 0) { if (M_RIGID[o]) structDirty = true; swapCells(j, q, px, py, qx, qy); }
      else if (qt === VOID) clearCell(j, px, py);
    }
  }
  return false;
}

function hookSpark(x, y, i) {
  st.elec++;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) continue;
    if (M_ELEC[o]) addCharge(j, 255);
    else if (M_FLAM[o] > 0) { temp[j] += 260; wake(nx, ny); }
  }
  const f = flags[i];
  if (f & F_TIP) {                                   // 只有「头」会继续向前窜并分叉，后面的留下来当亮线
    flags[i] = f & ~F_TIP;
    const L = life[i];
    if (L > 3) {
      const n = rnd() < 0.3 ? 2 : 1;
      for (let b = 0; b < n; b++) {
        const k = rndi(8), nx = x + DX8[k], ny = y + DY8[k];
        if (inb(nx, ny) && type[nx + ny * W] === 0) {
          const j = nx + ny * W;
          put(j, SPARK, nx, ny);
          life[j] = L - 1 - rndi(2);
        }
      }
    }
  }
  return false;
}

const HOOK = new Array(NT).fill(null);
HOOK[FIRE] = hookFire; HOOK[EMBER] = hookEmber; HOOK[LAVA] = hookLava; HOOK[PLANT] = hookPlant;
HOOK[CLONE] = hookClone; HOOK[VOID] = hookVoid; HOOK[SPARK] = hookSpark;
HOOK[WATER] = hookWater; HOOK[SALTWATER] = hookWater; HOOK[STEAM] = hookSteam; HOOK[FOAM] = hookFoam;

/* ---------------------------------------------------------------------
 * 2.5 接触规则执行（规则本身在 1.3 的 RULES 表里）
 * ------------------------------------------------------------------- */
function applyRule(r, i, j, x, y, nx, ny) {
  if (r.tag === 'hiss') st.hiss++;
  if (r.b2 !== r.b) {
    morph(j, r.b2, nx, ny);
    if (r.bT !== undefined) temp[j] = r.bT;
  }
  if (r.bDT !== undefined) { temp[j] += r.bDT; wake(nx, ny); }
  if (r.use && rnd() < r.use) { clearCell(i, x, y); return true; }
  if (r.aDT !== undefined) temp[i] += r.aDT;
  if (r.a2 !== r.a) {
    morph(i, r.a2, x, y);
    if (r.aT !== undefined) temp[i] = r.aT;
    return true;
  }
  return false;
}

/* ---------------------------------------------------------------------
 * 2.6 单格更新：烘干 → 相变 → 燃烧 → 寿命 → 钩子 → 接触规则 → 运动
 * ------------------------------------------------------------------- */
function updateCell(x, y, i) {
  const t = type[i];
  let f = flags[i];
  if ((f & F_PAR) === parity) return;        // 本帧已经处理过（刚移动进来的）
  f ^= F_PAR; flags[i] = f;
  if (f & F_BODY) return;                    // 刚体盖的章，由刚体系统管
  let T = temp[i];

  // 湿的东西过了 100°C 先烘干：吸热、放出水汽，烘干之前点不着
  const w = wet[i];
  if (w > M_SAP[t] && T > 100) {
    wet[i] = w - 1; T -= 120; temp[i] = T;   // 汽化潜热很大：每烘掉 1 单位水分要吃掉 120°C，一个燃烧的邻格烤不干一块湿透的木头
    const d = 1;
    vaporAdd(x, y, d / 100);
    wake(x, y);
    if (rnd() < 0.04) emitSmoke(x, y, 0);
  }

  // 温度相变
  if (T > M_MELT[t]) {
    const lat = M_LATENT[t];
    if (lat > 0) {                           // 有潜热的（冰、雪）：多出来的热量先攒着，攒够才融化
      const add = ((T - M_MELT[t]) * M_LATK[t]) | 0;
      temp[i] = M_MELT[t];
      if (add > 0) {
        const L = life[i] + add;
        if (L >= lat) { morph(i, M_MELTINTO[t], x, y); return; }
        life[i] = L; wake(x, y);
      }
    } else { morph(i, M_MELTINTO[t], x, y); return; }
  } else if (T > M_BOIL[t]) {
    morph(i, M_BOILINTO[t], x, y); temp[i] = T < 135 ? 160 : T + 25; st.boil++;
    return;
  } else if (T < M_FREEZE[t]) {
    if (t === STEAM) { clearCell(i, x, y); vaporAdd(x, y, 1); return; }   // 蒸汽冷下来变成看不见的水汽
    morph(i, M_FREEZEINTO[t], x, y);
    return;
  }

  // 燃烧
  if (M_FLAM[t] > 0) {
    if (f & F_BURN) { if (burnStep(x, y, i, t, T)) return; }
    else if (T >= M_IGN[t] && wet[i] <= M_SAP[t] && (M_BLAST[t] || hasOxygen(x, y))) { if (rnd() < M_FLAM[t]) ignite(i, t, x, y); else wake(x, y); }
  }

  // 有寿命的（火、烟、余烬、电火花、泡沫）
  if (M_LIFE0[t] > 0) {
    const L = life[i];
    if (L <= 1) {
      if (rnd() < M_DECAYP[t]) { morph(i, M_DECAY[t], x, y); seed[i] = 90 + rndi(60); if (temp[i] > 200) temp[i] = 200; }
      else clearCell(i, x, y);
      return;
    }
    life[i] = L - 1;
    wake(x, y);
  }

  const hk = HOOK[t];
  if (hk !== null && hk(x, y, i)) return;

  if (HASRX[t]) {
    const base = t * NT;
    for (let k = 0; k < 4; k++) {
      const nx = x + DX4[k], ny = y + DY4[k];
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const j = nx + ny * W, o = type[j];
      if (o === 0) continue;
      const r = RX[base + o];
      if (r === null || (flags[j] & F_BODY)) continue;
      wake(x, y);                            // 只要身边有能反应的对象，这一块就保持清醒
      if ((r.maxT === undefined || temp[i] < r.maxT) && rnd() < r.p) {
        if (applyRule(r, i, j, x, y, nx, ny)) return;
      }
    }
  }

  switch (M_STATE[t]) {
    case S_POWDER: movePowder(x, y, i, t); break;
    case S_LIQUID: moveLiquid(x, y, i, t); break;
    case S_GAS: moveGas(x, y, i, t); break;
  }
}

/* ---------------------------------------------------------------------
 * 2.7 爆炸：从爆心放出一圈射线，分 3 帧由内向外推进。
 *     每条射线带能量，随距离衰减；碰到硬度低于能量的材料就炸碎并继续，
 *     碰到更硬的就被挡住 → 石头和金属后面是安全的，弹坑边缘天然不规则。
 *     冲击波还会震松范围内刚性固体的连接（完整度下降），给刚体一个冲量。
 * ------------------------------------------------------------------- */
const EX_MAX = 48, EX_RAYS = 200;
const exA = new Uint8Array(EX_MAX), exX = new Float32Array(EX_MAX), exY = new Float32Array(EX_MAX),
      exR = new Float32Array(EX_MAX), exP = new Float32Array(EX_MAX), exCur = new Float32Array(EX_MAX),
      exN = new Uint16Array(EX_MAX), exPhase = new Float32Array(EX_MAX),
      exRays = new Float32Array(EX_MAX * EX_RAYS);
let exActive = 0;

function exClear() { exA.fill(0); exActive = 0; }

function startExplosion(x, y, R, P) {
  let k = -1;
  for (let q = 0; q < EX_MAX; q++) if (!exA[q]) { k = q; break; }
  if (k < 0) {                               // 池满：把进度最靠前的那个立刻算完，腾出位置
    let bv = -1;
    for (let q = 0; q < EX_MAX; q++) { const v = exCur[q] / exR[q]; if (v > bv) { bv = v; k = q; } }
    while (exA[k]) stepExplosion(k);
  }
  exA[k] = 1; exActive++;
  exX[k] = x; exY[k] = y; exR[k] = R; exP[k] = P; exCur[k] = 0;
  const n = Math.min(EX_RAYS, Math.ceil(6.2832 * R * 1.5));
  exN[k] = n; exPhase[k] = rnd() * 6.2832;
  for (let r = 0; r < n; r++) exRays[k * EX_RAYS + r] = P * (0.65 + rnd() * 0.7);
  // 震松连接：范围内的刚性固体完整度下降，越近、连接系数越小降得越多
  const RR = Math.ceil(R * 1.15);
  for (let dy = -RR; dy <= RR; dy++) for (let dx = -RR; dx <= RR; dx++) {
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H) continue;
    const j = px + py * W, o = type[j];
    if (o === 0) continue;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > RR) continue;
    if (M_BLAST[o] > 0) {                              // 殉爆：范围内的炸药不管有没有被挡住都会被引爆，时间按距离错开
      if (!(flags[j] & (F_BURN | F_BODY))) { flags[j] |= F_BURN; life[j] = 3 + ((d * 0.5) | 0) + rndi(9); wake(px, py); }
      continue;
    }
    if (!M_RIGID[o] || M_HARD[o] > 1) continue;
    const dmg = (1 - d / RR) * 110 * P / M_BOND[o];
    const a = aux[j];
    aux[j] = a > dmg ? a - dmg : 0;
  }
  structDirty = true;
  clearPins();
  st.boom++;
  if (onBoom) onBoom(x, y, R, P);
}

function stepExplosion(k) {
  const cx = exX[k], cy = exY[k], R = exR[k], P = exP[k], n = exN[k], base = k * EX_RAYS, ph = exPhase[k];
  const r0 = exCur[k], r1 = Math.min(R, r0 + Math.max(1.5, R / 3));
  const fall = P / R * 0.6;
  for (let r = 0; r < n; r++) {
    let e = exRays[base + r];
    if (e <= 0) continue;
    const a = ph + r / n * 6.2832, dx = Math.cos(a), dy = Math.sin(a);
    let lastJ = -1;
    for (let d = r0 < 0.8 ? 0.8 : r0; d < r1; d += 0.6) {
      const px = Math.round(cx + dx * d), py = Math.round(cy + dy * d);
      if (px < 0 || px >= W || py < 0 || py >= H) { e = 0; break; }
      e -= fall;
      if (e <= 0) break;
      const j = px + py * W;
      if (j === lastJ) continue;
      lastJ = j;
      const o = type[j];
      const Tn = temp[j] + e * 140;                  // 瞬间升温，封顶 850°C：能点燃东西，但不至于熔穿石墙、烧软钢梁
      temp[j] = Tn > 850 ? (temp[j] > 850 ? temp[j] : 850) : Tn;
      if (o === 0) {
        const q = rnd();
        if (q < 0.05 * e) { put(j, SMOKE, px, py); seed[j] = 90 + rndi(60); }
        else if (q < 0.05 * e + 0.012) {
          const sp = 1 + e * 4;
          spawnFree(EMBER, px + 0.5, py + 0.5, dx * sp + rnd() - 0.5, dy * sp + rnd() - 0.5, 650, rndi(256));
        } else wake(px, py);
        continue;
      }
      if (flags[j] & F_BODY) {                       // 打在刚体上：推它一把
        bodyImpulse(life[j] - 1, dx * e * 2600, dy * e * 2600, px, py);
        e -= 0.3;
        continue;
      }
      if (M_BLAST[o] > 0) {                          // 连锁：错开引爆时间，不在同一帧全炸
        const fz = 3 + ((d * 0.4) | 0) + rndi(9);
        if (!(flags[j] & F_BURN)) { flags[j] |= F_BURN; life[j] = fz; }
        else if (life[j] > fz + 6) life[j] = fz;
        e -= 0.03; wake(px, py);
        continue;
      }
      const h = M_HARD[o];
      if (e > h) {                                   // 炸碎
        const so = M_STATE[o], q = rnd();
        if (so < S_GAS && q < 0.6) {                 // 变成飞行粒子抛出去
          const sp = (1.2 + e * 4.5) * (0.6 + rnd() * 0.8);
          spawnFree(o, px + 0.5, py + 0.5, dx * sp - gx * 1.2 * e + rnd() - 0.5, dy * sp - gy * 1.2 * e + rnd() - 0.5,
                    temp[j] > 400 ? 400 : temp[j], seed[j]);
          clearCell(j, px, py);
        } else if (so < S_GAS && q < 0.75) {
          put(j, q < 0.68 ? FIRE : SMOKE, px, py);
        } else clearCell(j, px, py);
        e -= h * 0.6 + 0.01;
      } else {                                       // 挡住了：熏黑
        if (h <= 1) flags[j] |= F_SCORCH;
        wake(px, py);
        e = 0;
        break;
      }
    }
    exRays[base + r] = e;
  }
  exCur[k] = r1;
  if (r1 >= R) { exA[k] = 0; exActive--; }
}

function stepExplosions() {
  if (exActive === 0) return;
  for (let k = 0; k < EX_MAX; k++) if (exA[k]) stepExplosion(k);
}

/* ---------------------------------------------------------------------
 * 2.8 飞行粒子：对象池（上限 4000，满了覆盖最旧的），不占网格，
 *     带浮点位置和速度，落地后写回网格。爆炸碎片、水花、反弹的沙粒都走这里。
 * ------------------------------------------------------------------- */
const FP_MAX = 4000;
const fpAlive = new Uint8Array(FP_MAX), fpType = new Uint8Array(FP_MAX), fpSeed = new Uint8Array(FP_MAX),
      fpAge = new Uint16Array(FP_MAX), fpTemp = new Float32Array(FP_MAX),
      fpX = new Float32Array(FP_MAX), fpY = new Float32Array(FP_MAX),
      fpVX = new Float32Array(FP_MAX), fpVY = new Float32Array(FP_MAX),
      fpPX = new Float32Array(FP_MAX), fpPY = new Float32Array(FP_MAX),     // 上一帧位置（拖尾）
      fpQX = new Float32Array(FP_MAX), fpQY = new Float32Array(FP_MAX);     // 上上帧位置
let fpHead = 0, fpCount = 0;

function fpClear() { fpAlive.fill(0); fpCount = 0; fpHead = 0; }

function spawnFree(t, x, y, vx, vy, T, sd) {
  const k = fpHead;
  fpHead = (k + 1) % FP_MAX;
  if (!fpAlive[k]) fpCount++;
  fpAlive[k] = 1; fpType[k] = t; fpSeed[k] = sd; fpAge[k] = 0; fpTemp[k] = T;
  fpX[k] = fpPX[k] = fpQX[k] = x; fpY[k] = fpPY[k] = fpQY[k] = y;
  fpVX[k] = vx; fpVY[k] = vy;
}

function fpSolidAt(cx, cy) {
  if (cx < 0 || cx >= W || cy < 0 || cy >= H) return true;
  const o = type[cx + cy * W];
  return o !== 0 && M_STATE[o] < S_GAS;
}

function landFree(k, x, y) {
  fpAlive[k] = 0; fpCount--;
  let cx = Math.floor(x), cy = Math.floor(y);
  cx = cx < 0 ? 0 : cx >= W ? W - 1 : cx; cy = cy < 0 ? 0 : cy >= H ? H - 1 : cy;
  if (fpSolidAt(cx, cy)) {
    let found = false;
    for (let q = 0; q < 8; q++) {
      const nx = cx + DX8[q], ny = cy + DY8[q];
      if (!fpSolidAt(nx, ny)) { cx = nx; cy = ny; found = true; break; }
    }
    if (!found) {                            // 周围全被占了：往上弹一下再找地方，实在落不了脚（很少见）才丢弃
      if (fpAge[k] > 1500) return;
      fpAlive[k] = 1; fpCount++;
      fpX[k] = cx + 0.5 - gx * 1.5; fpY[k] = cy + 0.5 - gy * 1.5; fpVX[k] = -gx * 1.2 + (rnd() - 0.5); fpVY[k] = -gy * 1.2 + (rnd() - 0.5);
      return;
    }
  }
  const j = cx + cy * W, t = fpType[k];
  put(j, t, cx, cy);
  seed[j] = fpSeed[k]; temp[j] = fpTemp[k];
  if (M_RIGID[t]) aux[j] = 150;
  if (t === SAND || t === SOIL || t === STONE || t === WOOD || t === BRICK || t === CONCRETE) {
    if (fpTemp[k] > 150) flags[j] |= F_SCORCH;
  }
}

function stepFree() {
  if (fpCount === 0) return;
  for (let k = 0; k < FP_MAX; k++) {
    if (!fpAlive[k]) continue;
    let x = fpX[k], y = fpY[k];
    let vx = (fpVX[k] + gx * 0.22) * 0.992, vy = (fpVY[k] + gy * 0.22) * 0.992;
    fpQX[k] = fpPX[k]; fpQY[k] = fpPY[k]; fpPX[k] = x; fpPY[k] = y;
    const age = ++fpAge[k];
    if (fpType[k] === EMBER && age > 60 + (fpSeed[k] & 63)) { fpAlive[k] = 0; fpCount--; continue; }
    const m = Math.max(vx < 0 ? -vx : vx, vy < 0 ? -vy : vy);
    const n = m < 1 ? 1 : Math.ceil(m), sx = vx / n, sy = vy / n;
    let hit = false;
    for (let s = 0; s < n; s++) {
      const nx = x + sx, ny = y + sy;
      if (fpSolidAt(Math.floor(nx), Math.floor(ny))) { hit = true; break; }
      x = nx; y = ny;
    }
    if (hit) {
      // 脚下有支撑才算落地；撞墙或撞天花板就弹回来接着飞，避免碎块挂在半空
      if (age > 600 || fpSolidAt(Math.floor(x) + gx, Math.floor(y) + gy)) { landFree(k, x, y); continue; }
      vx = -vx * 0.3; vy = -vy * 0.3;
    } else if (age > 900) { landFree(k, x, y); continue; }
    fpX[k] = x; fpY[k] = y; fpVX[k] = vx; fpVY[k] = vy;
  }
}

/* ---------------------------------------------------------------------
 * 2.9 电：带电格子列表逐帧向相邻导体传导（金属几乎无损，水每格衰减 6/255 ≈ 传 40 格）
 * ------------------------------------------------------------------- */
let elecCur = null, elecNext = null, elecCount = 0;

function addCharge(j, e) {
  if (charge[j] !== 0) return;
  if (elecCur === null || elecCur.length !== N) { elecCur = new Int32Array(N); elecNext = new Int32Array(N); elecCount = 0; }
  charge[j] = 6; chargeE[j] = e;
  elecCur[elecCount++] = j;
}

function stepElectric() {
  const cnt = elecCount;
  if (cnt === 0) return;
  let nn = 0;
  const cur = elecCur, next = elecNext;
  for (let q = 0; q < cnt; q++) {
    const i = cur[q];
    let c = charge[i];
    if (c === 0) continue;
    const t = type[i];
    if (!M_ELEC[t]) { charge[i] = 0; continue; }
    const x = i % W, y = (i / W) | 0;
    wake(x, y);
    if (c === 6) {                           // 刚带上电：这一帧向四周传
      st.elec++;
      const e = chargeE[i], loss = t === METAL || t === STEEL ? 1 : 6;
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const j = nx + ny * W, o = type[j];
        if (o === 0) continue;
        if (M_ELEC[o]) {
          if (e > loss && charge[j] === 0 && (o === METAL || o === STEEL || rnd() < 0.8)) {
            charge[j] = 6; chargeE[j] = e - loss; next[nn++] = j;
          }
        } else if (M_FLAM[o] > 0) { temp[j] += 300; wake(nx, ny); }
      }
    }
    c--;
    charge[i] = c;
    if (c > 0) next[nn++] = i;               // 余下几帧是不应期，防止电往回传
  }
  elecCur = next; elecNext = cur; elecCount = nn;
}

/* ---------------------------------------------------------------------
 * 2.10 温度场 + 空气含氧：只在清醒的块里做成对交换（守恒、原地），
 *      再向环境气温缓慢回落。空气格之间还交换「浑浊度」，网格边缘是开阔大气（恒为新鲜）。
 * ------------------------------------------------------------------- */
let hotRigid = false;      // 有刚性固体被烧到 900°C 以上：金属可能软化了，过一会儿要重算支撑
function stepThermal() {
  const NTn = NT, K = KTAB, IHC = M_IHC, RLX = M_RELAX, amb = env.ambient;
  for (let cy = 0; cy < CHN; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const c = cx + cy * CW;
      if (chunkTTL[c] === 0) continue;
      const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK), y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
      let active = false, right = false, down = false;
      for (let y = y0; y < y1; y++) {
        const hasDown = y + 1 < H, edgeY = y === 0 || y === H - 1;
        for (let x = x0, i = y * W + x0; x < x1; x++, i++) {
          const a = type[i];
          let Ti = temp[i];
          if (AIRLIKE[a]) {                  // 空气（含火焰 / 烟占着的）：浑浊度扩散
            if (edgeY || x === 0 || x === W - 1) aux[i] = 0;
            else {
              if (AIRLIKE[type[i + 1]]) { const d = aux[i + 1] - aux[i]; if (d > 3 || d < -3) { const q = d >> 2; aux[i] += q; aux[i + 1] -= q; } }
              if (AIRLIKE[type[i + W]]) { const d = aux[i + W] - aux[i]; if (d > 3 || d < -3) { const q = d >> 2; aux[i] += q; aux[i + W] -= q; } }
            }
          } else if (Ti > 900 && M_RIGID[a]) hotRigid = true;
          if (x + 1 < W) {
            const d = temp[i + 1] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[i + 1], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[i + 1] -= fl * IHC[b];
              if (fl > 0.3 || fl < -0.3) { active = true; if (x + 1 === x1) right = true; }
            }
          }
          if (hasDown) {
            const j = i + W, d = temp[j] - Ti;
            if (d > 0.5 || d < -0.5) {
              const b = type[j], fl = d * K[a * NTn + b];
              Ti += fl * IHC[a]; temp[j] -= fl * IHC[b];
              if (fl > 0.3 || fl < -0.3) { active = true; if (y + 1 === y1) down = true; }
            }
          }
          const r = RLX[a];
          if (r > 0) {
            const d = (amb - Ti) * r;
            Ti += d;
            if (d > 0.08 || d < -0.08) active = true;
          }
          temp[i] = Ti;
        }
      }
      if (active) chunkTTL[c] = WAKE_TTL;
      if (right && cx + 1 < CW) chunkTTL[c + 1] = WAKE_TTL;
      if (down && cy + 1 < CHN) chunkTTL[c + CW] = WAKE_TTL;
    }
  }
}

/* ---------------------------------------------------------------------
 * 2.11 慢速环境过程：每步只处理 1/61 的格子（每格约每秒轮到一次），与分块休眠无关。
 *      蒸发、晾干、渗水、植物的吸水 / 老化 / 开花 / 落种 / 枯萎、腐烂、融雪、演替都在这里。
 * ------------------------------------------------------------------- */
const SLOW_STRIDE = 61;
let slowPhase = 0;

function slowWet(x, y, i, t, w) {
  let exposed = false;
  const k0 = rndi(4);
  for (let k = 0; k < 4; k++) {
    const kk = (k0 + k) & 3, nx = x + DX4[kk], ny = y + DY4[kk];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if (o === 0) { exposed = true; continue; }
    if (k !== 0 || o === PLANT) continue;
    const cap = M_ABSORB[o], wj = wet[j];              // 渗水：往更干的吸水邻格匀一半
    if (cap > 0 && w - wj > 24 && wj < cap) {
      const q = Math.min((w - wj) >> 1, cap - wj);
      if ((wj <= 60 && wj + q > 60) || (w > 60 && w - q <= 60)) { wake(x, y); wake(nx, ny); }
      wet[j] = wj + q; w -= q;
    }
  }
  if (t === SOIL && w > 110 && !exposed && rnd() < 0.5) {              // 深层的土吸饱了：多余的水渗到地下（外部输出，记在账上）
    const ux = x - gx * 3, uy = y - gy * 3;
    if (ux >= 0 && ux < W && uy >= 0 && uy < H && type[ux + uy * W] === SOIL) { w -= 12; env.waterOut += 0.12; }
  }
  if (exposed && rnd() < 0.12) {                       // 晾干：水分进入空气
    const rate = 1 + ((env.sun * 3) | 0) + (temp[i] > 40 ? 3 : 0);
    const d = w < rate ? w : rate;
    if (w > 60 && w - d <= 60) wake(x, y);
    w -= d;
    vaporAdd(x, y, d / 100);
  }
  wet[i] = w;
}

function slowWater(x, y, i) {
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  let k = 1 + (env.ambient - 20) / 25;
  k = k < 0.2 ? 0.2 : k > 3 ? 3 : k;
  if (rnd() < 0.0012 * (0.4 + 1.6 * env.sun) * k) { clearCell(i, x, y); vaporAdd(x, y, 1); }   // 水面蒸发
}

function slowPlant(x, y, i) {
  const f = flags[i], g = seed[i];
  let w = wet[i];
  for (let k = 0; k < 4; k++) {                        // 根：从湿土或水里吸水
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W, o = type[j];
    if ((o === SOIL || o === SAND) && wet[j] > 20 && w < 60) {            // 根吸水只补到「汁液」的量，不会把自己泡湿
      const q = Math.min(wet[j] - 10, 60 - w, 50);
      wet[j] -= q; w += q;
    } else if (o === WATER && w < 60 && rnd() < 0.5) {
      const q = 60 - w;
      w += q;
      if (rnd() * 100 < q) clearCell(j, nx, ny);
    } else if (o === PLANT && w - wet[j] > 12) {       // 水分在植株里往别处匀
      const q = (w - wet[j]) >> 1;
      wet[j] += q; w -= q;
    }
  }
  if (w > 20 && rnd() < 0.12 * (0.3 + env.sun)) { w--; vaporAdd(x, y, 0.01); }  // 蒸腾
  wet[i] = w;
  if (f & (F_TIP | F_BURN | F_BODY)) return;
  let age = life[i] + (w === 0 ? 2 : 1);               // 缺水老得快
  if (age > 60000) age = 60000;
  life[i] = age;
  if (age > 520 + (g & 15) * 48 && rnd() < 0.15) {     // 寿终（约 9~21 分钟）：枯萎成枯枝
    type[i] = DEADPLANT; life[i] = 0; flags[i] = (f & F_SCORCH) | parity; fuel[i] = initFuel(DEADPLANT);
    wake(x, y);
    return;
  }
  if (env.sun < 0.12) return;
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  if (age < 160 && w >= 50 && rnd() < 0.02 && skyOpen(x, y) && stemHeight(x, y) < geneHeight(g) && biomass(x, y, 3) < 24) {
    flags[i] |= F_TIP; life[i] = Math.min(2 + rndi(4), geneHeight(g) - stemHeight(x, y));   // 水分充足的幼株顶端再抽一小段，不超过株高上限
    wake(x, y);
  } else if (age > 30 && w >= 30 && rnd() < 0.006 && skyOpen(x, y)) {
    const j = ux + uy * W;                             // 成株开花
    put(j, FLOWER, ux, uy); seed[j] = rndi(5) * 51 + 8 + rndi(34);
    wet[i] = w - 20; env.waterSink += 0.2;
  }
}

function slowFlower(x, y, i) {
  const age = life[i] + 1;
  life[i] = age;
  if (age > 35 && rnd() < 0.2) {                       // 谢了：六成落下一粒种子，基因来自母株并略有变异
    if (rnd() < 0.6) {
      let g = rndi(256);
      for (let k = 0; k < 4; k++) {
        const nx = x + DX4[k], ny = y + DY4[k];
        if (inb(nx, ny) && type[nx + ny * W] === PLANT) { g = seed[nx + ny * W]; break; }
      }
      if (rnd() < 0.3) g ^= 1 << rndi(8);
      type[i] = SEED; seed[i] = g; life[i] = 0; flags[i] = parity; fuel[i] = initFuel(SEED); wet[i] = 0;
      wake(x, y);
    } else clearCell(i, x, y);
  }
}

function slowSeed(x, y, i) {
  const age = life[i] + 1;
  life[i] = age;
  if (age > 240 && rnd() < 0.05) { clearCell(i, x, y); return; }      // 一直没发芽：烂掉
  const bx = x + gx, by = y + gy;
  if (bx < 0 || bx >= W || by < 0 || by >= H) return;
  const bj = bx + by * W, b = type[bj];
  if (b === SOIL) { if (wet[bj] < 30 || aux[bj] < 20) return; }
  else if (b === SAND) { if (wet[bj] < 60) return; }
  else return;
  if (env.sun < 0.12 || !skyOpen(x, y) || biomass(x, y, 4) > 10 || rnd() > 0.25) return;
  wet[bj] -= 30; env.waterSink += 0.3;
  if (b === SOIL) aux[bj] -= 20;                        // 消耗养分
  sprout(i, x, y);
}

function slowSoil(x, y, i) {
  // 植被演替：湿润、有养分、见得到光、周围还空着的土面，偶尔自己冒出新芽（土里的种子库）
  if (wet[i] < 80 || aux[i] < 40 || env.sun < 0.12 || rnd() > 0.0006) return;
  const ux = x - gx, uy = y - gy;
  if (ux < 0 || ux >= W || uy < 0 || uy >= H || type[ux + uy * W] !== 0) return;
  if (!skyOpen(x, y) || biomass(x, y, 4) > 0) return;
  const j = ux + uy * W;
  put(j, PLANT, ux, uy);
  flags[j] |= F_TIP; life[j] = geneHeight(seed[j]); wet[j] = 30;
  wet[i] -= 30; aux[i] -= 20; env.waterSink += 0.3;
}

function slowAsh(x, y, i) {
  if (wet[i] > 40 && rnd() < 0.03) { morph(i, SOIL, x, y); aux[i] = 255; }     // 灰受潮后变成肥土
}

function slowDead(x, y, i) {
  // 枯枝腐烂：潮湿时快，干燥时慢；大部分分解掉，只有一小部分变成肥土（否则土会越积越多）
  if (rnd() < (wet[i] > 30 ? 0.03 : 0.01)) {
    if (rnd() < 0.15) { morph(i, SOIL, x, y); aux[i] = 255; } else { env.waterOut += wet[i] / 100; clearCell(i, x, y); }
  }
}

function slowIce(x, y, i) {
  // 气温高于冰点时，露在空气里的冰雪慢慢融化；每融一格都从周围吸热
  const amb = env.ambient;
  if (amb <= 1) {                                      // 冰点以下：露天的雪慢慢升华回空气里（否则只进不出，越积越厚）
    if (type[i] === SNOW && rnd() < 0.005) {
      const ux = x - gx, uy = y - gy;
      if (ux >= 0 && ux < W && uy >= 0 && uy < H && type[ux + uy * W] === 0) { clearCell(i, x, y); vaporAdd(x, y, 1); }
    }
    return;
  }
  if (rnd() > amb * (type[i] === SNOW ? 0.006 : 0.0012)) return;
  let exposed = false;
  for (let k = 0; k < 4; k++) {
    const nx = x + DX4[k], ny = y + DY4[k];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = nx + ny * W;
    if (type[j] === 0) exposed = true;
    else temp[j] -= 3;
  }
  if (!exposed) return;
  type[i] = WATER; life[i] = 0; flags[i] = parity; temp[i] = 1; aux[i] = 0;
  structDirty = true;
  wake(x, y);
}

const SLOW = new Array(NT).fill(null);
SLOW[WATER] = slowWater; SLOW[SALTWATER] = slowWater; SLOW[PLANT] = slowPlant; SLOW[FLOWER] = slowFlower;
SLOW[SEED] = slowSeed; SLOW[SOIL] = slowSoil; SLOW[ASH] = slowAsh; SLOW[DEADPLANT] = slowDead;
SLOW[ICE] = slowIce; SLOW[SNOW] = slowIce;

function slowTick() {
  slowPhase = (slowPhase + 1) % SLOW_STRIDE;
  for (let i = slowPhase; i < N; i += SLOW_STRIDE) {
    const t = type[i];
    if (t === 0) { const a = aux[i]; if (a !== 0) aux[i] = a - 1; continue; }   // 空气慢慢换新
    const fn = SLOW[t], w = wet[i];
    if (fn === null && w === 0) continue;
    if (flags[i] & F_BODY) continue;
    const x = i % W, y = (i / W) | 0;
    if (w !== 0 && t !== PLANT) slowWet(x, y, i, t, w);
    if (fn !== null) fn(x, y, i);
  }
}

/* ---------------------------------------------------------------------
 * 2.12 主步进：60Hz 固定步长。扫描顺序从「重力下游」开始，逐行（或逐列）
 *      跳过休眠的块，每行随机左右方向。
 * ------------------------------------------------------------------- */
const perf = { cells: 0, thermal: 0, misc: 0, struct: 0, weather: 0, slow: 0, pack: 0, draw: 0, post: 0, gpu: 0,
               steps: 0, frames: 0, activeChunks: 0 };
let simStepsTotal = 0;

function sweepCells() {
  if (gy !== 0) {
    const start = gy > 0 ? H - 1 : 0, end = gy > 0 ? -1 : H, inc = gy > 0 ? -1 : 1;
    for (let y = start; y !== end; y += inc) {
      const crow = (y >> 5) * CW, row = y * W;
      if (rnd() < 0.5) {
        for (let cx = 0; cx < CW; cx++) {
          if (chunkTTL[crow + cx] === 0) continue;
          const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK);
          for (let x = x0; x < x1; x++) if (type[row + x] !== 0) updateCell(x, y, row + x);
        }
      } else {
        for (let cx = CW - 1; cx >= 0; cx--) {
          if (chunkTTL[crow + cx] === 0) continue;
          const x0 = cx << 5, x1 = Math.min(W, x0 + CHUNK);
          for (let x = x1 - 1; x >= x0; x--) if (type[row + x] !== 0) updateCell(x, y, row + x);
        }
      }
    }
  } else {
    const start = gx > 0 ? W - 1 : 0, end = gx > 0 ? -1 : W, inc = gx > 0 ? -1 : 1;
    for (let x = start; x !== end; x += inc) {
      const ccol = x >> 5;
      if (rnd() < 0.5) {
        for (let cy = 0; cy < CHN; cy++) {
          if (chunkTTL[ccol + cy * CW] === 0) continue;
          const y0 = cy << 5, y1 = Math.min(H, y0 + CHUNK);
